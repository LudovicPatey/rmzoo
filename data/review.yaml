- id: dauriacetal2024-f2ce6306
  ref: dauriacetal2024
  date: 2026-11-03
  status: pending
  kind: statement
  statement:
    notation: PMTT^n
    name: Product version of Milliken's tree theorem for height n
    loc: Theorem 2.29, Statement 2.30
    definition: For d infinite leafless trees and a k-coloring of S_n(T_0,…,T_{d-1}), there is a tuple in S_ω(T_0,…,T_{d-1}) on which the coloring is constant.
    facts: Every X-computable instance has a Δ^{0,X}_{2n-1} solution (Theorem 4.6). It is provable in ACA0, and (∀n)PMTT^n is provable in ACA'_0 (Corollary 4.7). PMTT^n is equivalent to ACA0 for n≥3 and (∀n)PMTT^n is equivalent to ACA'_0 (Corollary 4.9). PMTT^2 admits cone avoidance and does not imply ACA0 (Theorem 4.15, Corollary 4.16).
  reasons:
    - principle not in the catalogue
