    definition: Every k-coloring of n-subsets (or of copies of G) of the Rado graph has a Rado subgraph on which at most ℓ colors appear.
    facts: (∀k)RG^2_{k,4} admits cone avoidance and does not imply ACA0 (Theorem 6.32, Corollary 6.40). For F of size 3 with b the number of Joyce types of F, (∀k)RG^F_{k,b} implies ACA0 (Corollary 6.48, Theorem 6.45, PA over ∅'). (∀k)RG^{K_3}_{k,16} and (∀k)RG^3_{k,112} imply ACA0 (Corollaries 6.49, 6.51). RG^2_{8,4} implies SRT^2_2 over RCA0 (Theorem 6.55). RT^2_2 does not imply (∀k)RG^2_{k,ℓ} for any ℓ (Theorem 6.63, via an ω-model).
  reasons:
    - principle not in the catalogue
