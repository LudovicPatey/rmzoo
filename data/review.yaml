- id: dauriacetal2024-b250ab32
  ref: dauriacetal2024
  date: 2026-11-03
  status: pending
  kind: statement
  statement:
    notation: DT^n_{k,ℓ}
    name: Devlin's theorem
    loc: Statement 2.32
    definition: Every f:[Q]^n→k has a dense suborder S without endpoints with |f([S]^n)| ≤ ℓ.
    facts: There is a computable instance of DT^2_{4,3} all of whose solutions compute ∅' (Theorem 5.28), so DT^2_{4,3} implies ACA0 (Corollary 5.31). RT^2_{k,ℓ} ≤_c DT^2_{2k,2ℓ+1} (Theorem 5.32). (∀k)DT^2_{k,ℓ} has a computable instance whose solutions are all DNC relative to ∅'' and none of which is Σ^0_3 (Corollaries 5.39, 5.41). DT^2_{4,2} implies ER^2 (Theorem 5.48). DT^2_{<∞,4} (via JDT) admits cone avoidance and does not imply ACA0 (Corollaries 5.44, 5.45). Tight bounds are the odd tangent numbers (Corollary 5.26).
  reasons:
    - principle not in the catalogue
