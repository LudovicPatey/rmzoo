# Big Five, compactness, randomness, induction.
#
# type: implication | separation | equivalence | property
#   implication: `from` implies `to` over `over`
#   separation:  `from` does not imply `to` over `over`
#   property:    `statement` has (value: true) or fails (value: false) `property`
# refs:     [{ref: key, loc: "Theorem 1.2"}]
# folklore: true when no reference is needed
# status:   needs-check  -> displayed with a warning until confirmed

# ---- Big Five --------------------------------------------------------------

- { type: implication, from: pi11ca, to: atr, over: rca0, refs: [ { ref: simpson2009, loc: Remarks VII.5.2 }, { ref: dzhafarovmummert2022, loc: Theorem 5.8.22(1) } ] }
- { type: implication, from: atr, to: aca, over: rca0, refs: [ { ref: simpson2009, loc: Definition V.2.4 } ] }
- { type: implication, from: aca, to: wkl, over: rca0, refs: [ { ref: simpson2009, loc: Lemma IV.4.4 }, { ref: dzhafarovmummert2022, loc: Proposition 5.6.14(1) } ] }

- type: separation
  from: atr
  to: pi11ca
  over: rca0
  refs: [ { ref: simpson2009 } ]
  note: Π¹₁-CA₀ proves the existence of a countable coded ω-model of ATR₀.

- type: separation
  from: aca
  to: atr
  over: omega
  refs: [ { ref: simpson2009, loc: Section VIII.1 } ]
  note: The arithmetical sets form an ω-model of ACA₀ which is not a model of ATR₀.

- type: equivalence
  from: wkl
  to: sep
  over: rca0
  refs:
    - ref: simpson2009
      loc: Lemma IV.4.4
    - ref: dzhafarovmummert2022
      loc: Section 5.8.2 (after Theorem 5.8.20); Exercise 5.13.18

- { type: property, statement: wkl, property: low-basis, value: true, refs: [ { ref: jockuschsoare1972, loc: Theorem 2.1 }, { ref: dzhafarovmummert2022, loc: "Section 3.6, remark after Proposition 3.6.6" }, { ref: simpson2009, loc: Lemma VIII.2.16 } ] }
- { type: property, statement: wkl, property: cone-avoidance, value: true, refs: [ { ref: jockuschsoare1972, loc: Theorem 2.5 } ] }
- { type: property, statement: wkl, property: pa-avoidance, value: false, folklore: true, justification: { kind: reduction, text: "The tree of DNC₂ functions (equivalently, of complete consistent extensions of PA) is a computable instance of WKL all of whose paths have PA degree.", by: ai } }
- { type: property, statement: wkl, property: computably-true, value: false, refs: [ { ref: jockuschsoare1972 }, { ref: dzhafarovmummert2022, loc: "Proposition 4.3.8, proof" }, { ref: simpson2009, loc: Lemma VIII.2.15 } ], note: Kleene tree. }
- type: property
  statement: wkl
  property: pi11-conservative
  value: true
  refs: [ { ref: simpson2009, loc: Corollary IX.2.6 } ]
  note: Due to Harrington.

- { type: property, statement: tj, property: cone-avoidance, value: false, folklore: true, note: "∅' is a solution to a computable instance.", justification: { kind: reduction, text: The jump problem has the computable instance ∅ whose only solution ∅′ is not computable., by: ai } }
- { type: property, statement: tj, property: low-basis, value: false, folklore: true, justification: { kind: reduction, text: "The only solution to the instance ∅ is ∅′, which is not low.", by: ai } }
- { type: property, statement: tj, property: weakly-low2-basis, value: false, folklore: true, justification: { kind: reduction, text: "The only solution to the instance ∅ is ∅′. If ∅‴ = (∅′)″ were computable in a set P of PA degree over ∅″, then, choosing P with P′ ≤_T ∅‴ (low basis theorem relative to ∅″), ∅⁗ ≤_T P′ ≤_T ∅‴, a contradiction. The same argument shows that ACA₀ fails every level of the lowness hierarchy; this fact is recorded at the highest level present in data/properties.yaml.", by: ai } }

- { type: property, statement: rca0, property: pi11-conservative, value: true, folklore: true, justification: { kind: classical, text: "Trivial: RCA₀ is conservative over itself.", by: ai } }

# ---- Randomness ------------------------------------------------------------

- { type: implication, from: wkl, to: wwkl, over: [ sw, rca0star ], folklore: true, justification: { kind: restriction, text: WWKL is WKL restricted to trees of positive measure., by: ai } }

# ---- Induction and bounding ------------------------------------------------

- { type: implication, from: isig2, to: bsig2, over: rca0star, refs: [ { ref: pariskirby1978, loc: Proposition 4 } ] }
- { type: implication, from: bsig2, to: isig1, over: rca0star, refs: [ { ref: pariskirby1978, loc: Proposition 5 } ] }
- { type: implication, from: rca0, to: isig1, over: rca0, note: Σ⁰₁-induction is part of RCA₀., refs: [ { ref: simpson2009, loc: Definition II.1.5 } ], justification: { kind: classical, text: Σ⁰₁ induction is one of the axioms of RCA₀., by: ai } }
- { type: equivalence, from: bsig2, to: idelta2, over: rca0star, refs: [ { ref: slaman2004, loc: Theorem 2.1 (with Gandy's Theorem 1.2) } ] }
- { type: separation, from: rcastar, to: isig1, over: rca0star, refs: [ { ref: simpsonsmith1986 } ] }

- type: property
  statement: bsig2
  property: pi11-conservative
  value: false
  refs:
    - ref: pariskirby1978
      loc: Proposition 7
  note: RCA₀ does not prove BΣ⁰₂.

- type: separation
  from: wkl
  to: isig1
  over: rca0star
  refs: [ { ref: simpsonsmith1986 } ]
  note: WKL₀* is Π¹₁-conservative over RCA₀*, which does not prove IΣ⁰₁.

# ---- Iterated jumps ----------------------------------------------------

- { type: "implication", from: "atr", to: "aca-plus", over: "rca0", folklore: true, justification: { kind: reduction, text: Apply arithmetical transfinite recursion along the well-ordering ω to iterate the jump., by: ai } }
- { type: "implication", from: "aca-plus", to: "aca-prime", over: "rca0", justification: { kind: reduction, text: X⁽ⁿ⁾ is computable uniformly from X^(ω)., by: ai }, refs: [ { ref: dzhafarovmummert2022, loc: Proposition 5.6.9 } ] }
- { type: "implication", from: "aca-prime", to: "aca", over: "rca0", justification: { kind: restriction, text: Take n = 1., by: ai }, refs: [ { ref: dzhafarovmummert2022, loc: Proposition 5.6.6 } ] }
- { type: "separation", from: "aca-prime", to: "aca-plus", over: "omega", note: "The arithmetical sets form an ω-model of ACA′ in which ∅^(ω) does not exist.", justification: { kind: classical, text: The arithmetical sets form an ω-model of ACA′ which does not contain ∅^(ω)., by: ai }, refs: [ { ref: dzhafarovmummert2022, loc: Proposition 5.6.9 } ] }
- { type: "implication", from: "gowers", to: "ht", over: "sw", folklore: true, note: "FIN₁ is Hindman's theorem.", justification: { kind: restriction, text: FIN₁ is Hindman’s theorem., by: ai } }
- { type: "implication", from: "gowers", to: "ht", over: "rca0", folklore: true, justification: { kind: restriction, text: FIN₁ is Hindman’s theorem., by: ai } }

# ---- Weihrauch landmarks seen as statements over RCA0 -----------------------

- { type: equivalence, from: hb, to: wkl, over: rca0, refs: [ { ref: simpson2009, loc: Theorem IV.9.3 } ] }
- { type: equivalence, from: lim, to: tj, over: sw, refs: [ { ref: brattkagherardipauly2021, loc: Theorem 6.7 }, { ref: solda2021, loc: "Proposition 2.4.6, proof" } ], note: "lim is strongly Weihrauch equivalent to the Turing jump." }
- { type: equivalence, from: lim, to: aca, over: rca0star, folklore: true, justification: { kind: classical, text: "lim is the problem form of the Turing jump; over RCA₀*, ACA is equivalent to the statement that every set has a jump.", by: ai } }
- { type: equivalence, from: bwt, to: aca, over: rca0, refs: [ { ref: simpson2009, loc: Theorem III.2.7 }, { ref: dzhafarovmummert2022, loc: Theorem 10.2.3 (1)↔(4) } ] }
- { type: implication, from: rca0, to: ivt, over: rca0, refs: [ { ref: simpson2009, loc: Theorem II.6.6 } ] }
- { type: implication, from: rcastar, to: lpo, over: rca0star, folklore: true, note: "Classically provable: decide whether p is the zero sequence.", justification: { kind: classical, text: "Classically provable by the law of excluded middle: either p is the zero sequence or it is not.", by: ai } }
- { type: implication, from: rcastar, to: llpo, over: rca0star, folklore: true, justification: { kind: classical, text: "Classically provable: if p has a 1 at position n, the parity of n answers; otherwise any answer is correct.", by: ai } }
- { type: separation, from: aca, to: aca-prime, over: rca0, justification: { kind: classical, by: ai, text: "ACA₀′ proves the consistency of PA (it proves the existence of truth sets for each Σ⁰ₙ level), while ACA₀ is conservative over PA, which does not prove its own consistency." }, refs: [ { ref: dzhafarovmummert2022, loc: Proposition 5.6.6 } ] }

# ---- Base theories ----------------------------------------------------------

- { type: equivalence, from: rca0, to: isig1, over: rca0star, refs: [ { ref: simpsonsmith1986 }, { ref: simpson2009, loc: "Section X.4, after Definition X.4.1" } ], note: "RCA₀ is RCA₀* together with Σ⁰₁ induction, which proves the totality of exponentiation." }

# ---- Computably true problems -------------------------------------------------

- { type: property, statement: rt12, property: computably-true, value: true, justification: { kind: reduction, by: ai, text: "Non-uniformly, one of the two color classes is infinite and computable from the instance." }, refs: [ { ref: dzhafarovmummert2022, loc: Section 3.6 } ] }
- { type: property, statement: rt13, property: computably-true, value: true, folklore: true, justification: { kind: reduction, by: ai, text: "Non-uniformly, one of the color classes is infinite and computable from the instance." } }
- { type: property, statement: rt1inf, property: computably-true, value: true, justification: { kind: reduction, by: ai, text: "Non-uniformly, one of the color classes is infinite and computable from the instance." }, refs: [ { ref: hirschfeldt2015, loc: Section 6.2 }, { ref: dzhafarovmummert2022, loc: Chapter 6 introduction } ] }
- { type: property, statement: lpo, property: computably-true, value: true, justification: { kind: reduction, by: ai, text: "The solution is a single bit." }, refs: [ { ref: goh2019b, loc: "Section 1.3.3, after Definition 1.11" } ] }
- { type: property, statement: llpo, property: computably-true, value: true, folklore: true, justification: { kind: reduction, by: ai, text: "The solution is a single bit." } }
- { type: property, statement: cn, property: computably-true, value: true, justification: { kind: reduction, by: ai, text: "Solutions are natural numbers, hence computable." }, refs: [ { ref: goh2019b, loc: "Section 1.3.3, after Definition 1.11" } ] }
- { type: property, statement: kn, property: computably-true, value: true, folklore: true, justification: { kind: reduction, by: ai, text: "Solutions are natural numbers, hence computable." } }
- { type: property, statement: ivt, property: computably-true, value: true, justification: { kind: reduction, by: ai, text: "A computable function with a sign change has a computable zero: either some rational is a zero, or the bisection method converges computably." }, refs: [ { ref: dzhafarovmummert2022, loc: "Section 10.4, list of properties after Theorem 10.4.3 (item 1); Theorem 10.4.1" } ] }

