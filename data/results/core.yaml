- { type: implication, from: ladsset, to: ads, over: rca0star, folklore: true, justification: { kind: classical, text: "A set of cardinality N, the range of a strictly increasing map with domain N, is unbounded (provably in RCA₀*, by Δ⁰₀ induction the n-th element is at least n), so a solution of the long version is one of the normal version.", by: ai } }
- { type: implication, from: lcrt22, to: crt22, over: rca0star, folklore: true, justification: { kind: classical, text: "A set of cardinality N, the range of a strictly increasing map with domain N, is unbounded (provably in RCA₀*, by Δ⁰₀ induction the n-th element is at least n), so a solution of the long version is one of the normal version.", by: ai } }

# The Turing jump problem TJ (X ↦ X′) and arithmetical comprehension as a problem
# ((X, φ) ↦ {n : φ(n, X)}), separated on 2026-11-04.
- { type: equivalence, from: tj, to: aca, over: rca0, refs: [ { ref: dzhafarovmummert2022, loc: Corollary 5.6.3 } ] }
- { type: implication, from: aca, to: tj, over: sw, folklore: true, justification: { kind: restriction, text: "X′ is defined from X by the Σ⁰₁ formula ∃s Φ_{e,s}^X(e)↓, so TJ is ACA restricted to that formula.", by: ai } }
- { type: property, statement: tj, property: delta2-basis, value: true, folklore: true, justification: { kind: reduction, text: "The solution X′ of a computable instance X is computable in ∅′ (indeed Σ⁰₁).", by: ai } }
- { type: implication, from: aca, to: aca-prime, over: sw, folklore: true, justification: { kind: reduction, text: "Given (X, n), the arithmetical formula defining X^(n) from X is computable from n, and the solution of ACA on it is X^(n).", by: ai } }
- { type: implication, from: aca-prime, to: aca, over: w, folklore: true, justification: { kind: reduction, text: "Given (X, φ) with φ a Σ⁰ₙ formula, {k : φ(k, X)} is computable from X^(n) uniformly in φ (with X and φ available, as Weihrauch reducibility allows).", by: ai } }
- { type: property, statement: aca-prime, property: sigma4-basis, value: false, folklore: true, justification: { kind: reduction, text: "The computable instance (∅, 5) has the single solution ∅⁽⁵⁾, which is not Σ⁰₄; likewise (∅, n + 1) has no Σ⁰ₙ solution for any n.", by: ai } }

