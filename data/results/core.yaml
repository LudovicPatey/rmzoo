- { type: equivalence, from: ladsseq, to: ads, over: rca0, folklore: true, justification: { kind: classical, text: "Over RCA₀, every unbounded set is the range of a strictly increasing function with domain N (Simpson 2009, Lemma II.3.6), so a solution of the normal version is a solution of the long one.", by: ai } }
- { type: equivalence, from: lcrt22, to: crt22, over: rca0, folklore: true, justification: { kind: classical, text: "Over RCA₀, every unbounded set is the range of a strictly increasing function with domain N (Simpson 2009, Lemma II.3.6), so a solution of the normal version is a solution of the long one.", by: ai } }
