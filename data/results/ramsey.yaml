# Ramsey's theorem and principles below RT²₂.

# ---- Pigeonhole ------------------------------------------------------------

- { type: implication, from: rt12, to: rt13, over: rca0, folklore: true, justification: { kind: reduction, text: "Merge two colors and apply RT¹₂, then apply RT¹₂ again inside the resulting set if needed.", by: ai } }
- { type: implication, from: rt13, to: rt12, over: [ sw, rca0star ], folklore: true, justification: { kind: restriction, text: A 2-coloring is a 3-coloring with the same homogeneous sets., by: ai } }
- { type: implication, from: rt1inf, to: rt13, over: [ sw, rca0star ], folklore: true, justification: { kind: restriction, text: Take k = 3., by: ai } }

- type: separation
  from: rt12
  to: rt13
  over: w
  refs:
    - ref: brattkarakotoniaina2017
      loc: Theorem 4.22
    - ref: ddhms2016
  note: RT¹ₖ₊₁ is not Weihrauch reducible to RT¹ₖ.

- { type: equivalence, from: rt1inf, to: bsig2, over: rca0, refs: [ { ref: hirst1987 }, { ref: dzhafarovmummert2022, loc: Theorem 6.5.1 } ] }

- { type: implication, from: rt22, to: rt23, over: rca0, folklore: true, note: Merge two of the colors and apply RT²₂ twice., justification: { kind: reduction, text: "Merge two colors and apply RT²₂, then apply RT²₂ again inside the homogeneous set if needed.", by: ai } }
- { type: implication, from: rt23, to: rt22, over: [ sw, rca0star ], folklore: true, justification: { kind: restriction, text: A 2-coloring is a 3-coloring with the same homogeneous sets., by: ai } }
- { type: implication, from: rt32, to: rt22, over: [ sw, rca0star ], folklore: true, justification: { kind: reduction, text: "Color a triple {x < y < z} by f(x, y); an infinite homogeneous set for this coloring is homogeneous for f.", by: ai } }

- type: separation
  from: rt22
  to: rt23
  over: c
  refs: [ { ref: patey2018a } ]
  note: RT²ₖ₊₁ is not computably reducible to RT²ₖ.

- { type: property, statement: rt22, property: cone-avoidance, value: true, refs: [ { ref: seetapunslaman1995 }, { ref: cholakjockuschslaman2001, loc: Theorem 12.2 } ] }
- { type: property, statement: rt22, property: pa-avoidance, value: true, refs: [ { ref: liu2012 } ] }
- { type: property, statement: rt22, property: computably-true, value: false, refs: [ { ref: jockusch1972 } ] }
- { type: property, statement: rt32, property: cone-avoidance, value: false, refs: [ { ref: jockusch1972 } ] }

# ---- Stable / cohesive decomposition ---------------------------------------

- { type: implication, from: rt22, to: srt22, over: [ sw, rca0star ], folklore: true, justification: { kind: restriction, text: "Restriction to stable instances: every stable instance is an instance, with the same solutions.", by: ai } }

- { type: implication, from: srt22, to: d22, over: [ sw, rca0star ], folklore: true, justification: { kind: reduction, text: An infinite homogeneous set for a stable coloring is limit-homogeneous., by: ai } }
- { type: implication, from: d22, to: rt12, over: [ sw, rca0star ], folklore: true, note: "Color the pair {x < y} by the color of x.", justification: { kind: reduction, text: "Color the pair {x < y} by the color of x; this coloring is stable and its limit-homogeneous sets are homogeneous for the original coloring.", by: ai } }
- { type: implication, from: d22, to: srt22, over: rca0, refs: [ { ref: chonglemppyang2010 }, { ref: cholakjockuschslaman2001, loc: Lemma 7.10 } ], note: "D²₂ implies BΣ⁰₂ [CLY10], and D²₂ + BΣ⁰₂ implies SRT²₂ [CJS01]." }
- { type: implication, from: d22, to: srt22, over: omega, refs: [ { ref: cholakjockuschslaman2001, loc: Lemma 7.10 } ] }

- type: separation
  from: d22
  to: srt22
  over: w
  refs:
    - ref: dzhafarov2016
    - ref: dzhafarovmummert2022
      loc: Theorem 9.1.18(1)
  note: SRT²₂ is not Weihrauch reducible to D²_{<∞}, hence not to D²₂.

- { type: separation, from: srt22, to: rt22, over: omega, refs: [ { ref: moninpatey2021, loc: Theorem 1.4 } ] }
- { type: separation, from: srt22, to: rt22, over: rca0, refs: [ { ref: chongslamanyang2014, loc: Corollary 2.5 }, { ref: chongliyang2014, loc: Corollary 4.15 } ], note: "First separation, using non-standard models." }

- { type: property, statement: d22, property: low-basis, value: false, refs: [ { ref: downeyetal2001 } ] }
- { type: property, statement: coh, property: low-basis, value: false, refs: [ { ref: jockuschstephan1993 } ] }

# ---- Erdős–Moser -----------------------------------------------------------

- { type: implication, from: rt22, to: em, over: [ sw, rca0star ], folklore: true, justification: { kind: reduction, text: "Color {x < y} by whether x → y in the tournament; homogeneous sets are transitive subtournaments.", by: ai } }
- { type: implication, from: ads-em, to: rt22, over: rca0, refs: [ { ref: bovykinweiermann2017 } ] }
- { type: separation, from: em, to: ads, over: omega, refs: [ { ref: lermansolomontowsner2013, loc: Corollary 1.16 } ] }
