[ { type: implication, from: sigma11-c2, to: llpo.jump, over: w, provenance: contributed, justification: { kind: personal-communication, by: Manlio Valenti, text: "folklore. For every n, LLPO^{(n)} is Weihrauch reducible to \\Sigma^1_1-C_2. This is because LLPO^{(n)} = \\Pi^0_{n+1}-C_2, and a \\Pi^0_{n+1} code can uniformly be turned into a Sigma^1_1 code for the same set" } }, { type: implication, from: cnn, to: rspo, over: w, provenance: contributed, justification: { kind: personal-communication, by: Manlio Valenti, text: "Straightforward: the set of solutions of RSpo is Pi^0_2 relative to the input, hence C_Baire can be used to obtain a solution." } }, { type: implication, from: sigma11-c2, to: llpo.jump.jump, over: w, provenance: contributed, justification: { kind: personal-communication, by: Manlio Valenti, text: "Folklore: for every n, LLPO^{(n)} is Π⁰ₙ₊₁-C₂, and a Π⁰ₙ₊₁ code can uniformly be turned into a Σ¹₁ code of the same set (case n = 2)." } }, { type: implication, from: sigma11-c2, to: llpo.jump.jump.jump, over: w, provenance: contributed, justification: { kind: personal-communication, by: Manlio Valenti, text: "Folklore: for every n, LLPO^{(n)} is Π⁰ₙ₊₁-C₂, and a Π⁰ₙ₊₁ code can uniformly be turned into a Σ¹₁ code of the same set (case n = 3)." } }, { type: implication, from: sigma11-c2, to: llpo.jump.jump.jump.jump, over: w, provenance: contributed, justification: { kind: personal-communication, by: Manlio Valenti, text: "Folklore: for every n, LLPO^{(n)} is Π⁰ₙ₊₁-C₂, and a Π⁰ₙ₊₁ code can uniformly be turned into a Σ¹₁ code of the same set (case n = 4)." } }, { type: implication, from: gen1, to: fip, over: w, provenance: contributed, justification: { kind: personal-communication, by: Manlio Valenti, text: "The construction is uniform. The generic of the forcing in the proof of Proposition 5.4 of [@cholakdowneyigusa2017] (conditions: finite sets of indices with a common element) is obtained uniformly from a 1-generic relative to the family: Lemma 5 of [@cintioli2026] gives a total functional R ↦ J_R and a computable map ξ ↦ c_ξ such that J_R enumerates a centered set, maximal when R is 1-generic; the sequence (A_{J_R(n)})_n is a solution of FIP." } }, { type: implication, from: cnn, to: canht, over: w, provenance: contributed, justification: { kind: personal-communication, by: Manlio Valenti, text: "Straightforward: the set of solutions of canHT is Π⁰₁ relative to the input. A solution is coded by an increasing enumeration of H together with one of the five canonical forms of Taylor's theorem; for a given form, the condition that the colour of the finite sums is canonical of that form is Π⁰₁ in the colouring and the enumeration. The union over the five forms is a closed set, nonempty by Taylor's theorem, uniformly computable from the colouring; closed choice on Baire space gives a point, from which H is computed." } } ]
