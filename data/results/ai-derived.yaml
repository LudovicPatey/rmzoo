- { type: separation, from: kt, to: wkl, over: omega, provenance: ai, justification: { kind: reduction, by: ai, text: "REC, the ω-model of the computable sets, satisfies Kruskal's theorem, a true Π¹₁ statement (proof of Corollary 3.1 of [@buriolaweiermann2025]), but not weak König's lemma (Remark I.10.2 of [@simpson2009])." } }
