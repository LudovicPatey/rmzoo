- { type: implication, from: sts23, to: sts24, over: [ sw, rca0star ], provenance: ai, justification: { kind: reduction, by: ai, text: "Merge colors 2 and 3 of a stable f : [ℕ]² → 4; the resulting 3-coloring is stable and a set thin for it is thin for f." } }
