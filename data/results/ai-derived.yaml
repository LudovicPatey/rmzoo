- { type: separation, from: wwkl.jump, to: ivt, over: sw, provenance: ai, justification: { kind: reduction, by: ai, text: "Case n = 1 of Corollary 15.8 (cardinality argument). IVT ≡sW CC_[0,1] [10, Thm 6.2] and PC_[0,1] ≡sW WWKL (Prop 8.2), hence PC′_[0,1] ≡sW WWKL′ since jumps are monotone for ≤sW. (From Corollary 15.8 of [@brattkagherardiholzl2015].)" } }
- { type: separation, from: pcr, to: ivt, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "Theorem 15.6 gives CC[0,1] ≰W PC_R, and IVT ≡W CC[0,1] (Brattka and Gherardi 2011, Theorem 6.2). (From Theorem 15.6 of [@brattkagherardiholzl2015].)" } }
- { type: separation, from: pcr, to: wwkl.jump, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "PC_{N×2^N} ≤W lim, so PC_{N×2^N} is Σ⁰₂-measurable; WWKL′ is not Σ⁰₂-measurable (Prop 9.1). Measurability is preserved downward under ≤W [8, Prop 7.5], so WWKL′ ≰W PC_{N×2^N} ≡sW PC_R. (From Corollary 9.7 and the paragraph before it of [@brattkagherardiholzl2015].)" } }
- { type: implication, from: lim, to: pcr, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "The paper states PC_{N×2^N} ≤W lim (by Brattka, de Brecht and Pauly, Theorem 8.7), and PC_R ≡sW PC_{N×2^N} (Proposition 7.4). (From Paragraph before Corollary 9.7 of [@brattkagherardiholzl2015].)" } }
