- { type: implication, from: c3, to: llpo, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "C_2 is the restriction of C_3 to subsets of {0, 1}, and C_2 ≡sW LLPO (Proposition 7.17 of [@brattkagherardipauly2021])." } }
