- { type: implication, from: sads, to: sadc, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "An infinite ascending (descending) sequence of a stable linear order, as a set, is an ascending (descending) chain: the identity reduces SADC to SADS (Definition 2.2.3 of [@solda2021])." } }
- { type: implication, from: wkl, to: padeg, over: sw, provenance: ai, justification: { kind: reduction, by: ai, text: "PA ≤sW DNC₂, as noted in the proof of Proposition 22 of [@brattkachirache2026] (p ≪ q iff q computes a DNC₂ function relative to p), and DNC₂ ≡sW WKL (Corollary 5.3 of [@brattkahendtlasskreuzer2017])." } }
