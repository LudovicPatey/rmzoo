- {"type": "implication", "from": "sadc", "to": "tcn", "over": "w", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "Phases: $\\pi(n)$ counts the changes of the current guess up to $n$; ordering by $(\\pi(x), -x)$ puts each phase as a descending block above earlier phases. If $B \\neq \\mathbb{N}$ the order has type $k + \\omega^*$ and every chain lies in the last phase, where the guess is $\\min(\\mathbb{N} \\setminus B)$; if $B = \\mathbb{N}$ any answer is correct. (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
