- { type: separation, from: rt22, to: rca0, over: rca0star, provenance: ai, justification: { kind: reduction, by: ai, text: "RCA₀* + RT²₂ is ∀Π⁰₃-conservative over RCA₀* (Theorem 2.17 of [@kowalik2024]; [@koodziejczykkowalikyokoyama2020]). The instances of lightface IΣ₁ are Π⁰₃ sentences not provable in RCA₀*, so RCA₀* + RT²₂ does not prove IΣ⁰₁, that is RCA₀." } }
