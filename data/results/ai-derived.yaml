- { type: implication, from: sort, to: ci, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Theorem 18 is proved for all n; n = 1 gives XC_1 ≤W Sort_2, and Sort_2 is Sort (Sort := Sort_2, alphabet {0,1}). XC_1 is closed choice on convex (= interval) subsets of [0,1], which the paper identifies with interval choice C_I. (From Theorem 18 (n = 1; XC₁ is C_I, Section 3) of [@kiharapauly2019b].)" }, refs: [ { ref: brattkaholzlkuyper2017, loc: Proposition 16 } ] }
- { type: separation, from: ci, to: ci.star.auc, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Theorem 32 holds for all k; the extraction turns the compositional product symbol into '?' and ≰ into '6≤' (the proof shows Z1∘Z0 ≤W XC_k impossible via Kleene's recursion theorem). k = 1 gives XC_1 ⋆ AoUC ≰W XC_1. (From Theorem 32 (k = 1) of [@kiharapauly2019b].)" } }
- { type: property, statement: ci, property: compose-closed, value: false, provenance: ai, justification: { kind: reduction, by: ai, text: "AoUC (C_[0,1] restricted to {singletons} ∪ {[0,1]}) is a restriction of XC_1 (choice on convex subsets of [0,1]), so AoUC ≤W XC_1 and XC_1 ⋆ AoUC ≤W XC_1 ⋆ XC_1. If XC_1 ⋆ XC_1 ≤W XC_1, Theorem 32 with k = 1 would be contradicted. The abstract states it: sequential composition of one-dimensional convex choice is not reducible to convex choice in any dimension. (From Theorem 32 (k = 1), with AoUC ≤sW XC₁ of [@kiharapauly2019b].)" } }
- { type: conservation, statement: tt1, base: rca0, class: Pi03, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "RCA0 + TT1 is a subtheory of RCA0 + WKL0 + TT1, so any Π03 sentence provable from RCA0 + TT1 is provable from RCA0 + WKL0 + TT1, hence in RCA0. (From Theorem 3.1 (subtheory) of [@chongwangyang2021].)" } }
- { type: implication, from: odrt3, to: rt2, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Theorem 2.3 with k = 2 for every number l of colors gives ODRT^3 (all l) implies RT^2 with finitely many colors. (From Theorem 2.3 (k = 2) of [@millersolomon2004].)" } }
- { type: implication, from: srt23, to: rt13, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "Instance k=3 of the stated 'for all k'. (From Section 1.3 (RT¹ₖ ≤sW SRT²ₖ, k = 3) of [@dzhafarovetal2017b].)" } }
- { type: separation, from: srt23, to: rt15, over: soc, provenance: direct, justification: { kind: restriction, by: ai, text: "Theorem 1.3 with k=5, l=3: a coloring c : ω→k such that for every stable d : [ω]^2→l (computable from c or not) some infinite homogeneous set for d computes no infinite homogeneous set for c. This is a non-reduction RT^1_5 ≰soc SRT^2_3 (stronger than ≰sc, Corollary 1.4). (From Theorem 1.3 (k = 5, ℓ = 3) of [@dzhafarovetal2017b].)" } }
- { type: separation, from: srt23, to: rt14, over: soc, provenance: direct, justification: { kind: restriction, by: ai, text: "Theorem 1.3 with k=4, l=3: a coloring c : ω→k such that for every stable d : [ω]^2→l (computable from c or not) some infinite homogeneous set for d computes no infinite homogeneous set for c. This is a non-reduction RT^1_4 ≰soc SRT^2_3 (stronger than ≰sc, Corollary 1.4). (From Theorem 1.3 (k = 4, ℓ = 3) of [@dzhafarovetal2017b].)" } }
- { type: property, statement: ci, property: fractal, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "Observation 2 shows XC_n = C_{[0,1]^n} restricted to nonempty closed convex sets is a closed fractal for every n; for n = 1 the convex closed subsets of [0,1] are the closed intervals, so XC_1 is interval choice C_I (ci). A closed fractal is in particular a fractal (Definition 2.2, same as the catalogue's definition). (From Observation 2 (n = 1; XC₁ is C_I) of [@lerouxpauly2015].)" } }
- { type: property, statement: sts2, property: delta02-preservation, value: false, provenance: direct, justification: { kind: restriction, by: ai, text: "Theorem 4.3 with n = 2, i = 1. (From Theorem 4.3 (n = 2, i = 1) of [@wang2016].)" } }
- { type: property, statement: wkl.jump, property: compose-closed, value: false, provenance: ai, justification: { kind: reduction, by: ai, text: "C'_{2^N} * C'_{2^N} ≡W C''_{2^N}, and C''_{2^N} is not Weihrauch reducible to lim' (Theorem 7.55(3), n = 1: lim' <W C''_{2^N}), hence not to C'_{2^N} ≤W lim'. So C'_{2^N} * C'_{2^N} ≰W C'_{2^N}; WKL ≡sW C_{2^N} and the jump is monotone for sW. (From Theorem 7.53(2) with Theorem 7.55(3) of [@brattkagherardipauly2021].)" } }
