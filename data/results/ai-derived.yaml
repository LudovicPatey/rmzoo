- { type: equivalence, from: bwt-weak-l2, to: lim.jump, over: sw, provenance: ai, justification: { kind: reduction, by: ai, text: "Remark 7.14 (checked on the rendered page 114) states BWT_{weak-ℓ2} ≡sW lim^(2), where lim^(2) ≡W LPÔ∘LPÔ and the upper-bound chain ends ≡sW lim∘lim, so lim^(2) is lim∘lim; lim′ ≡sW lim∘lim is Example 5.3(6) of brattkagherardimarcone2012. Hence BWT_{weak-ℓ2} ≡sW lim′ (lim.jump). Doubtful point: the displayed lower bound is only ≥W; the sW equivalence relies on the thesis's remark that all these problems are cylinders." } }
- { type: equivalence, from: meet, to: hyp, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Theorem 38 states MEET and HI equivalent over RCA0. HI (Statement 13: g exceeds each f of the family infinitely often) is exactly 'g not dominated by any X-computable function' (zoo hyp); weakly represented families represented by A are families of total A-computable functions and the total A-computable functions form one, so the family and set formulations agree over RCA0. Zoo meet asks for one agreement per p-computable r, the paper's MEET for infinitely many; they are equivalent over RCA0 (if q meets every X-computable r once, it meets r beyond any k, by applying it to r modified below k to differ from q there, a finite modification). The zoo entry meet says it is the Hoelzl-Raghavan-Stephan-Zhang principle. (Entered as an AI derivation: the paper’s MEET asks for infinitely many agreements with each function of a weakly represented family, the zoo’s meet for one agreement with each X-computable function. They are equivalent over RCA₀ by a finite modification: if q meets every X-computable r once, apply this to r changed below k to differ from q there, giving agreements above every k.)" } }
- { type: conservation, statement: meet, base: rca0, class: rPi12, value: true, provenance: ai, justification: { kind: reduction, by: ai, text: "Corollary 54(b): MEET is restricted Pi^1_2-conservative over RCA0 (from Theorem 52 and DOM implies MEET). Zoo meet is equivalent over RCA0 to the paper's MEET (single vs infinitely many agreements equivalent by finite modification; families vs X-computable functions equivalent). (Entered as an AI derivation: the paper’s MEET asks for infinitely many agreements with each function of a weakly represented family, the zoo’s meet for one agreement with each X-computable function. They are equivalent over RCA₀ by a finite modification: if q meets every X-computable r once, apply this to r changed below k to differ from q there, giving agreements above every k.)" } }
- { type: implication, from: dom, to: meet, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Stated: 'as DOM implies AVOID, MEET and BI'. Also follows from DOM implies HI (noted after Statement 13) and Theorem 38 (HI <-> MEET over RCA0). (Entered as an AI derivation: the paper’s MEET asks for infinitely many agreements with each function of a weakly represented family, the zoo’s meet for one agreement with each X-computable function. They are equivalent over RCA₀ by a finite modification: if q meets every X-computable r once, apply this to r changed below k to differ from q there, giving agreements above every k.)" } }
- { type: property, statement: ran2, property: compose-closed, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "Proposition 2.7 for n = 2: 2-Ran sends X to the reals ML-random relative to X′, i.e. 2-random relative to X, as zoo ran2. 2-Ran ⋆ 2-Ran ≡W 2-Ran gives compose-closed (P ⋆ P ≤W P)." } }
- { type: implication, from: wkl, to: stietze-csc, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "The paper says WKL0 implies items (2)-(5) of Conjecture 6.15 are immediate; (5) is the csc version on [0,1]. Also follows from wkl -> stietze-closed (Theorem 1.3) by restriction to sets that are also separably closed. (From Section 6, remark after Conjecture 6.15 of [@giustosimpson2000].)" } }
- { type: implication, from: sigmasep3, to: deltaca3, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Theorem 3.29 (RCA0^ω) proves SEP^1 → Δ-CA. SEP^1 separates the ranges of two type-2 functionals Y, Z with Y(f)≠Z(g). Σ-SEP (sigmasep3) implies SEP^1 in one line: take φ_0(n) ≡ ∃f(Y(f)=n) and φ_1(n) ≡ ∃g(Z(g)=n), which are of the form ∃f Y_0(f,n)=0, then separate. So sigmasep3 → SEP^1 → deltaca3 over rca0. The paper's principle is SEP^1, not literally Σ-SEP, hence ai: true." } }
- { type: separation, from: bsig2, to: pi01ga, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "RCA₀ + BΣ⁰₂ + Π⁰₁GA proves IΣ⁰₂ (Theorem 3.3 of Hirschfeldt–Lange–Shore 2017, cited as Theorem 2.15 in Belanger 2015), and BΣ⁰₂ does not prove IΣ⁰₂; so BΣ⁰₂ does not prove Π⁰₁GA." } }
- { type: separation, from: sort, to: ci.x.llpo, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Corollary 16 (p. 7, rendered page checked): C2 × XC_1^n ≰W Sort_{n+1}, where XC_1^n is the n-fold product (notation f^k, Section 2). For n = 1: C2 × XC1 ≰W Sort_2, and Sort_2 is Sort (Definition 6: 0^{c0}1^ω if finitely many 0s, 0^ω otherwise), the zoo's sort; XC1 = ci, C2 = llpo. Special case n = 1 of the stated corollary. Product id reordered to the existing canonical ci.x.llpo." } }
- { type: implication, from: uivt, to: wkl, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Sanders' Principle 20 is Simpson's Exercise IV.2.12(1), which has endpoint hypotheses taken per n (φn(0) ≤ 0 ≤ φn(1) → φn(xn) = 0). The zoo's uivt (Veldman's formulation) instead requires every φn to have points γ⁰, γ¹ with φn(γ⁰) ≤ 0 ≤ φn(γ¹), so the two are different formulations. Only one direction is a one-line consequence: every instance of IV.2.12(2) (monotone, φn(0) ≤ 0 ≤ φn(1)) is a uivt instance with γ⁰=0, γ¹=1, so uivt implies IV.2.12(2), which implies WKL0 over RCA0. The converse (WKL → uivt) also holds, by choosing points from a sequence of nonempty closed zero sets. That is a separate argument, not literally stated, so it is left out." } }
- { type: implication, from: hbcs, to: wkl, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Derivation from two proved theorems: over RCA0^omega, HBC_s implies item (c) (take C=[0,1]), the proof of C.2.24 shows (c) -> (a) (usco f is bounded above) over RCA0^omega; continuous functions are usco, so continuous f:[0,1]->R are bounded above, which gives WKL by Theorem C.2.6(c) (RCA0^omega). QF-AC^{0,1} is only needed for WKL -> HBC_s (Pincherle phenomenon, Corollary I.3.33). Strengthens the database's hbcs-qfac01 -> wkl." } }
- { type: implication, from: boot-exists2-qfac01, to: lind, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Theorem G.4.8 (over ACA0^omega): BOOT + QF-AC^{0,1} implies that for any C subset of R and Psi: R -> R+ some sequence (x_n) in C has the balls B(x_n, Psi(x_n)) covering C; special case C = R is exactly lind (intervals I^Psi_x = B(x, Psi(x)))." } }
