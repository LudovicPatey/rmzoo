- {"type": "implication", "from": "wwkl-star", "to": "kn", "over": "sw", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "Given $(b, p)$, the tree of strings comparable with $1^j 0$ for some $j \\leq b$ not yet removed has measure at least $2^{-(b+1)}$; the number of leading 1s of any path is a solution. ([@brattkagherardiholzl2015], remark after Proposition 10.9, states the Weihrauch version.) (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
- {"type": "equivalence", "from": "lpo.star.lim", "to": "lpo.jump.x.lim", "over": "w", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "For every $P$: $P \\star \\lim \\equiv_W \\lim \\times P'$. $\\mathrm{id} \\times P$ is a cylinder Weihrauch equivalent to $P$, so $P \\star \\lim \\equiv_W (\\mathrm{id} \\times P) \\star \\lim \\equiv_W (\\mathrm{id} \\times P)' \\equiv_{sW} \\lim \\times P'$ ([@brattkagherardipauly2021], Propositions 6.12 and 6.14). (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
