- { type: implication, from: rt12.x.rt14, to: rt15, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Proposition 5.5 with n = 1, k0 = 2, k1 = 4. (From Proposition 5.5 of [@goh2019b].) In Chapter 5 of [@goh2019b] the solutions of RT^1_k are the colors that appear infinitely often (Weihrauch equivalent to the homogeneous-set formulation of the zoo, but not strongly), so the strong reduction holds only for that formulation; for homogeneous sets it gives ≤W. Corrected after a report by Lu Liu." } }
- { type: implication, from: wkl, to: padeg, over: sw, provenance: ai, justification: { kind: reduction, by: ai, text: "PA ≤sW DNC₂, as noted in the proof of Proposition 22 of [@brattkachirache2026] (p ≪ q iff q computes a DNC₂ function relative to p), and DNC₂ ≡sW WKL (Corollary 5.3 of [@brattkahendtlasskreuzer2017])." } }
- { type: implication, from: cac, to: cacord, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "CACᵒʳᵈ is CAC restricted to ω-ordered partial orders (Definition 9.2.30 of [@dzhafarovmummert2022])." }, refs: [ { ref: hughes2025, loc: Proof of Theorem 3.1 } ] }
- { type: implication, from: scac, to: scacord, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "An infinite chain or antichain of an ω-ordered partial order is ω-ordered, so SCACᵒʳᵈ is SCAC restricted to ω-ordered stable partial orders (Definition 9.2.30 of [@dzhafarovmummert2022])." } }
- { type: implication, from: coh, to: lcoh, over: rca0star, provenance: ai, justification: { kind: reduction, by: ai, text: "COH implies IΣ⁰₁ over RCA₀* (through fin-COH, Theorem 3 of [@sun2025]), and under IΣ⁰₁ an unbounded set is the range of a strictly increasing function with domain ℕ (Lemma II.3.6 of [@simpson2009]), so a cohesive set has cardinality ℕ. This answers Question 5.9 of [@fioricaroneskoodziejczykkowalik2021]." } }
- { type: implication, from: ivt, to: pcc, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "The paper states PCC[0,1] ≤W CC[0,1] (Section 17, before Corollary 17.7 of [@brattkagherardiholzl2015]), and IVT ≡W CC[0,1] (Brattka and Gherardi 2011)." } }
