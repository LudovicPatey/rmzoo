- {"type": "property", "statement": "lpo", "property": "countably-irreducible", "value": true, "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "If it reduces to $\\bigsqcup_i Q_i$, the summand is fixed on a cone $[0^n]$ of instances, and the problem restricted to that cone is strongly equivalent to itself ($p \\mapsto 0^n p$, $n$ even for $\\mathsf{LLPO}$). (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
- {"type": "property", "statement": "lpo", "property": "fractal", "value": false, "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "For any $F \\equiv_W$ it with $F \\leq_W$ it via $H, K$: either $H$ never commits (then $F$ is computable), or on some cone of $F$-instances $H$ has committed an output that makes one answer correct (for $\\mathsf{C}_3$: removes one element, giving a reduction to $\\mathsf{C}_2$), so $F$ restricted to that cone is strictly weaker ([@brattkagherardipauly2021], Definition 4.10). (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
