- { type: implication, from: rt42, to: brt42, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "BRT⁴₂ is RT⁴₂ restricted to colorings whose 1-homogeneous sets have bounded size; the identity reduces it (Definition 4.1.1 of [@solda2021])." } }
- { type: implication, from: brt42, to: rt32, over: sw, provenance: ai, justification: { kind: reduction, by: ai, text: "Lemma 4.1.29 of [@solda2021] with n = 3, k = 2 gives RT³₂ ≤sW bRT⁴_{R(3,4,2)}, and bRT⁴_{R(3,4,2)} ≤sW bRT⁴ by Lemma 4.1.27." } }
- { type: implication, from: wwkl, to: wwkl-half, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "½-WWKL is WWKL restricted to trees whose set of paths has measure above 1/2 (Definition 8.7 of [@brattkagherardiholzl2015])." } }
- { type: implication, from: sigma11-wkl, to: sigma11-wwkl, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "Σ¹₁-WWKL is Σ¹₁-WKL restricted to trees of positive measure (Section 4.2 of [@kiharamarconepauly2020])." } }
- { type: implication, from: rt1n, to: rt1inf, over: sw, provenance: ai, justification: { kind: reduction, by: ai, text: "An instance (k, c) of RT¹_{<∞} gives the instance c of RT¹_ℕ (Definition 4.23 of [@gohpaulyvalenti2021]), whose homogeneous sets are those of c." } }
- { type: implication, from: sigma11-ds, to: ds, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "A computable name of a linear order gives a Σ¹₁ code of it, so DS is Σ¹₁-DS restricted to such codes (Definition 5.1 of [@gohpaulyvalenti2021])." } }
- { type: implication, from: sigma11ac, to: finite-sigma11-ac, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Finite-Σ¹₁-AC₀ is the Σ¹₁ choice schema restricted to formulas with finitely many solutions (after Definition 6.6 of [@goh2019b])." } }
- { type: implication, from: kdt, to: ucnn, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "ATR ≤W KDT (Theorem 3.33 of [@goh2019b]) and ATR ≡W UC_ℕℕ (Kihara, Marcone and Pauly [@kiharamarconepauly2020], Section 3)." } }
- { type: implication, from: pmtt2, to: mtt2, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "MTT² is PMTT² for products of a single tree (d = 1), Statements 2.27 and 2.30 of [@dauriacetal2024]." } }
- { type: implication, from: dt2, to: aca, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "DT²_{4,2} trivially implies DT²_{4,3}, which implies ACA₀ over RCA₀ (Corollary 5.31 of [@dauriacetal2024])." } }
- { type: implication, from: rg2, to: srt22, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "RG² includes the instance RG²_{8,4}, which implies SRT²₂ over RCA₀ (Theorem 6.55 of [@dauriacetal2024])." } }
- { type: property, statement: ucnn, property: parallelizable, value: true, provenance: ai, justification: { kind: reduction, by: ai, text: "$\\mathsf{ATR}$ (as a problem: a well-order and a set, find the jump hierarchy) is parallelizable by Proposition 2.7 of [@goh2019b], and $\\mathsf{ATR} \\equiv_{\\mathrm{sW}} \\mathsf{UC}_{\\mathbb{N}^\\mathbb{N}}$ by Theorem 3.13 of [@kiharamarconepauly2020]; parallelizability is invariant under $\\equiv_{\\mathrm{W}}$. (Goh attributes it also to Pauly.)" } }
- { type: separation, from: tcn, to: tcn.x.tcn, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Take n = 1: TC_N × TC_N is not Weihrauch reducible to TC_N. (Special case of Lemma 7.11 (n = 1) of [@soldavalenti2022].)" } }
- { type: equivalence, from: lpo.star.wkl, to: wkl.x.lpo, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Take k = 1 in LPO^k * WKL ≡_W WKL × LPO^k. (Special case of Lemma 7.19 (k = 1) of [@soldavalenti2022].)" } }
- { type: implication, from: fs2, to: ts2, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "FS^k implies TS^k for all k ≥ 2, with a strong Weihrauch reduction. Take k = 2. (Special case of Section 3, before Theorem 3.7 of [@carluccietal2024].)" } }
- { type: implication, from: fs3, to: ts3, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "Take k = 3 in the stated result. (Special case of Section 3, before Theorem 3.7 of [@carluccietal2024].)" } }
- { type: separation, from: wwkl.jump, to: gen1, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "Instance n = 1 of the statement for all n, where WWKL^(1) = WWKL′. (Special case of Corollary 10.9 of [@brattkahendtlasskreuzer2018].)" } }
- { type: conservation, statement: rt2, base: isig3, class: Pi11, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "The theorem proves Π¹₁-conservation of RCA0 + IΣ3 + RT^2_{<∞} + WKL over RCA0 + IΣ3. Hence RCA0 + IΣ3 + RT^2_{<∞} alone is also Π¹₁-conservative over RCA0 + IΣ3. (From Theorem 11.1 of [@cholakjockuschslaman2001].)" } }
- { type: implication, from: irt, to: abw, over: omega, provenance: ai, justification: { kind: reduction, by: ai, text: "Standard models satisfy full induction including IΣ11. So every ω-model of IRT satisfies ABW0 by Theorem 7.7, applying Proposition 6.3 to pass between IRT and IRT*. (From Theorem 7.7 of [@barnesgohshore2023].)" }, refs: [ { ref: barnesgohshore2023, loc: "Theorem 7.7 (IRT_XYZ implies ABW₀ over RCA₀ + IΣ¹₁, which every ω-model satisfies)" } ] }
- { type: implication, from: irt, to: finite-sigma11-ac, over: omega, provenance: ai, justification: { kind: reduction, by: ai, text: "Standard models satisfy IΣ11. So every ω-model of IRT is a model of finite-Σ11-AC0 by Theorem 7.3. (From Theorem 7.3 of [@barnesgohshore2023].)" } }
- { type: conservation, statement: wkl, base: bsig2, class: Pi11, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "Take α=ω, WF(ω) is provable in RCA0; the paper notes this recovers Hájek's theorem. (From Theorem 2.20 of [@houeroupateyyokoyama2024].)" } }
- { type: implication, from: tcn, to: cn, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "Corollary 5.3 gives C_X ≤sW completion of C_X ≤sW TC_X for every computable metric space X. Take X = N and use transitivity to get C_N ≤sW TC_N. (From Corollary 5.3 (case X = N) of [@brattkagherardi2019].)" } }
- { type: implication, from: tcnn, to: cnn, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "Corollary 5.3 for X = N^N gives C_{N^N} ≤sW completion ≤sW TC_{N^N}, hence C_{N^N} ≤sW TC_{N^N} by transitivity. (From Corollary 5.3 (case X = N^N) of [@brattkagherardi2019].)" } }
- { type: separation, from: rt22, to: cn.jump, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Instance n = 1, k = 2 of the theorem for all n and k ≥ 2: C_N^(1) = C_N' is not Weihrauch reducible to RT^2_2. (From Theorem 7.20 (n = 1, k = 2) of [@soldavalenti2022].)" } }
- { type: separation, from: rt32, to: (cn.jump).jump, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Instance n = 2, k = 2 of the theorem: C_N^(2) is not Weihrauch reducible to RT^3_2. (From Theorem 7.20 (n = 2, k = 2) of [@soldavalenti2022].)" } }
- { type: equivalence, from: cn.diamond, to: cn, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "Take n = 0 in the chain of equivalences of Theorem 7.2. (From Theorem 7.2 (n = 0) of [@soldavalenti2022].)" } }
- { type: equivalence, from: (cn.jump).diamond, to: cn.jump, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "Take n = 1 in the equivalence (C_N^(n))^⋄ ≡_sW C_N^(n). (From Theorem 7.2 (n = 1) of [@soldavalenti2022].)" } }
- { type: equivalence, from: lpo.diamond, to: cn, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "Take n = 0 in the chain of equivalences of Theorem 7.2, which ends with (LPO^(n))^⋄. The equivalence is read off the garbled statement. (From Theorem 7.2 (n = 0) of [@soldavalenti2022].)" } }
- { type: equivalence, from: (lpo.jump).diamond, to: cn.jump, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "Take n = 1 in the chain of equivalences of Theorem 7.2, which ends with (LPO^(n))^⋄. (From Theorem 7.2 (n = 1) of [@soldavalenti2022].)" } }
- { type: separation, from: tcn.star.cn, to: tcn.x.tcn, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Instance n = 1 of the corollary TC_N^{n+1} ≰_W TC_N^n * C_N. (From Remark after Lemma 7.11 (n = 1) of [@soldavalenti2022].)" } }
- { type: implication, from: srt22, to: tcn, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "u-SRT^2_2 is SRT^2_2 restricted to unbalanced colourings, so u-SRT^2_2 ≤_W SRT^2_2. Compose with TC_N ≤_W u-SRT^2_2. (From Proposition 7.24 of [@soldavalenti2022].)" } }
- { type: implication, from: srt22, to: sort, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "u-SRT^2_2 is a restriction of SRT^2_2, hence u-SRT^2_2 ≤_W SRT^2_2. Compose with Sort ≤_W u-SRT^2_2. (From Proposition 7.25 of [@soldavalenti2022].)" } }
- { type: implication, from: srt22, to: lpo.jump, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "u-SRT^2_2 is a restriction of SRT^2_2, hence u-SRT^2_2 ≤_W SRT^2_2. Compose with LPO' ≤_W u-SRT^2_2. (From Proposition 7.26 of [@soldavalenti2022].)" } }
- { type: conservation, statement: gp22, base: rca0, class: uPi03, value: true, provenance: ai, justification: { kind: reduction, by: ai, text: "Theorem 6.5 gives conservation of WKL0 + GP22 + ADS. RCA0 + GP22 is a subtheory, so any Π̃03 sentence it proves is provable in IΣ01. (From Theorem 6.5 of [@pateyyokoyama2018].)" } }
- { type: equivalence, from: cr, to: wkl.x.cn, over: sw, provenance: ai, justification: { kind: reduction, by: ai, text: "The paper strengthens C_R ≡W C_{0,1}^N × C_N to ≡sW because C_R and C_{0,1}^N are cylinders. Fact 3.4 gives C_{0,1}^N ≡sW WKL. (From Proof of Proposition 9.15 of [@brattkagherardimarcone2012].)" } }
- { type: equivalence, from: bwt, to: wkl.star.lim, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "MCT ≡sW lim (Fact 11.26) and the compositional product depends only on the Weihrauch degrees, so WKL ∗ MCT ≡ WKL ∗ lim. (From Corollary 11.27 of [@brattkagherardimarcone2012].)" } }
- { type: implication, from: rrt32, to: rrt22, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "RRT^n_k follows from RRT^{n+1}_k (the proof yields a strong Weihrauch reduction), taken at n = 2, k = 2. (From Section 3, before Theorem 3.10 of [@carluccietal2024].)" } }
- { type: implication, from: rrt42, to: rrt32, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "RRT^n_k follows from RRT^{n+1}_k via a strong Weihrauch reduction, taken at n = 3, k = 2. (From Section 3, before Theorem 3.10 of [@carluccietal2024].)" } }
- { type: implication, from: rrt42, to: ts3, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "RCA0 ⊢ (∀n)[RRT^{n+1}_2 → TS^n], taken at n = 3. (From Section 4, before Proposition 4.11 of [@carluccietal2024].)" } }
- { type: conservation, statement: ast, base: rca0, class: Pi11, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "AST(0) is equivalent to AST over RCA0, so the case m = 0 of the stated conservation result gives it. (From Section 4, paragraph after Proposition 4.3 of [@dooley2025].)" } }
- { type: conservation, statement: em, base: isig2, class: Pi11, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "EM<∞ implies the two-color Erdős–Moser principle (EM in the catalogue), so any Π^1_1 consequence of RCA0+IΣ2+EM is a consequence of RCA0+IΣ2+EM<∞, hence already provable in RCA0+IΣ2. (From Section 1, remark after Theorem 1.7 of [@towsneryokoyama2018].)" } }
- { type: property, statement: pos, property: computably-true, value: false, provenance: ai, justification: { kind: reduction, by: ai, text: "Property P1 gives a computable instance that is solved by only a small class of oracles. A computable solution would be computed by every oracle, and that class is 2^ω, which is not small. So some computable instance has no computable solution. (From Theorem 4.20 of [@astoretal2026].)" } }
- { type: property, statement: pi01g, property: strongly-parallelizable, value: true, provenance: ai, justification: { kind: reduction, by: ai, text: "Proposition 5.5 shows BCT2 is strongly parallelizable. Corollary 8.3 gives Π01G ≡sW BCT2 on Cantor space, and this property is invariant under ≡sW. (From Proposition 5.5 and Corollary 8.3 of [@brattkahendtlasskreuzer2018].)" } }
- { type: property, statement: pi01g, property: idempotent, value: true, provenance: ai, justification: { kind: reduction, by: ai, text: "Proposition 5.5 shows BCT2 is strongly idempotent, hence idempotent. Corollary 8.3 gives Π01G ≡sW BCT2, and idempotency is preserved under equivalence. (From Proposition 5.5 and Corollary 8.3 of [@brattkahendtlasskreuzer2018].)" } }
- { type: property, statement: pi01g, property: cylinder, value: false, provenance: ai, justification: { kind: reduction, by: ai, text: "The paper states that BCT2 and its jumps are not cylinders. Corollary 8.3 gives Π01G ≡sW BCT2, so Π01G is not a cylinder either. (From Section 5 after Lemma 5.4, and Corollary 8.3 of [@brattkahendtlasskreuzer2018].)" } }
- { type: separation, from: padeg, to: llpo, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "The paper states ACC_n ≰W PA for n ≥ 2, by Corollary 4.7. Take n = 2 with LLPO ≡sW ACC_2. (From Section 5, after Fact 5.7 of [@brattka2021].)" } }
- { type: conservation, statement: rt22, base: rca0, class: Pi03, value: true, provenance: ai, justification: { kind: reduction, by: ai, text: "Theorem 9.8 is stated for WKL0 + RT22. A Π^0_3 sentence provable from RT22 over the base is provable in WKL0 + RT22, hence in IΣ^0_1. (From Theorem 9.8 of [@steilayokoyama2015].)" } }
- { type: equivalence, from: rt1n, to: kn.jump, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "RT¹_ℕ ≡W BWT_ℕ (Proposition 3.4 of [@brattkarakotoniaina2017], for k = ℕ, colors not given) and BWT_ℕ ≡sW K′_ℕ (Theorem 11.2 of [@brattkagherardimarcone2012], for the computable metric space ℕ). Hence RT¹_ℕ is strictly below C′_ℕ, contrary to Proposition 7.17 of [@soldavalenti2022] for k = ℕ, which extends BWT_k ≡ C′_k (true for finite k) to k = ℕ." } }
- { type: conservation, statement: rt22, base: bsig2, class: uPi04, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "WKL₀ + RT²₂ is ∀Π⁰₄-conservative over RCA₀ + BΣ⁰₂ (Theorem 1.4 of [@lehoueroupateyyokoyama2024]), and the theory without WKL₀ is weaker." } }
- { type: conservation, statement: em, base: bsig2, class: uPi04, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "WKL₀ + EM is ∀Π⁰₄-conservative over RCA₀ + BΣ⁰₂ (Theorem 5.3 of [@lehoueroupateyyokoyama2024]), and the theory without WKL₀ is weaker." } }
- { type: conservation, statement: gp22, base: bsig2, class: Pi11, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "WKL₀ + GP²₂ is Π¹₁-conservative over RCA₀ + BΣ⁰₂ (Theorem 4.2 of [@lehoueroupateyyokoyama2024]), and the theory without WKL₀ is weaker." } }
- { type: conservation, statement: rt22, base: rca0, class: uPi03, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "WKL₀ + RT²₂ is ∀Π⁰₃-conservative over IΣ⁰₁ (Theorem 7.4 of [@pateyyokoyama2018]), and the theory without WKL₀ is weaker." } }
- { type: conservation, statement: em, base: rca0, class: uPi03, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "WKL₀ + EM is ∀Π⁰₃-conservative over IΣ⁰₁ (Theorem 7.3 of [@pateyyokoyama2018]), and the theory without WKL₀ is weaker." } }
- { type: conservation, statement: ads, base: rca0, class: uPi03, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "WKL₀ + ADS is ∀Π⁰₃-conservative over IΣ⁰₁ (Corollary 4.5 of [@pateyyokoyama2018]), and the theory without WKL₀ is weaker." } }
- { type: conservation, statement: psrt22, base: rca0, class: uPi03, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "WKL₀ + psRT²₂ is ∀Π⁰₃-conservative over IΣ⁰₁ (Corollary 4.5 of [@pateyyokoyama2018]), and the theory without WKL₀ is weaker." } }
- { type: property, statement: ts23, property: hyperimmunities-2-preservation, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "k = 2 in Corollary 8.3.6 of [@patey2016c]: TS²_{k+1} admits preservation of k hyperimmunities for every k ≥ 2." } }
- { type: property, statement: ts24, property: hyperimmunities-3-preservation, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "k = 3 in Corollary 8.3.6 of [@patey2016c]: TS²_{k+1} admits preservation of k hyperimmunities for every k ≥ 2." } }
- { type: property, statement: srt22, property: hyperimmunities-2-preservation, value: false, provenance: direct, justification: { kind: restriction, by: ai, text: "k = 2 in Corollary 8.2.4(ii) of [@patey2016c]: STS²_k does not admit preservation of k hyperimmunities; STS²₂ is SRT²₂." } }
- { type: property, statement: sts23, property: hyperimmunities-3-preservation, value: false, provenance: direct, justification: { kind: restriction, by: ai, text: "k = 3 in Corollary 8.2.4(ii) of [@patey2016c]: STS²_k does not admit preservation of k hyperimmunities." } }
- { type: conservation, statement: isig2, base: bsig2, class: arith, value: false, provenance: ai, justification: { kind: reduction, by: ai, text: "BΣ₂ does not prove IΣ₂ (Theorem A of [@pariskirby1978], n = 1: the converse of IΣ₂ ⇒ BΣ₂ fails). RCA₀ + BΣ⁰₂ is conservative over BΣ₂ for arithmetical sentences, so some instance of IΣ⁰₂, an arithmetical sentence, is not provable in RCA₀ + BΣ⁰₂." } }
- { type: implication, from: emfin, to: em, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "EM is the case of two colors of EM_{<∞} (Definition 1.1 of [@towsneryokoyama2018]); a 2-coloring is an instance with the same solutions." } }
- { type: implication, from: eminf, to: emfin, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "A coloring with finitely many colors is a coloring into ℕ with the same solutions (Definitions 1.1 and 5.3 of [@towsneryokoyama2018])." } }
- { type: implication, from: trrtfin, to: trt22, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "TRT²₂ is the case of two colors of trRT_{<∞} (Definition 1.1 of [@towsneryokoyama2018])." } }
- { type: implication, from: wkl, to: udnrb, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "WKL₀ is equivalent to ∀f DNR(2, f) (Definition 2.6 and the remark after it in [@doraishirstshafer2014]), which gives ∃k∀f DNR(k, f) with k = 2." } }
- { type: implication, from: udnrb, to: dnrb, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "∃k∀f DNR(k, f) implies ∀f∃k DNR(k, f) by logic (Definition 2.6 of [@doraishirstshafer2014])." } }
- { type: implication, from: dnrb, to: dnr, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "A k-bounded function DNR relative to f is DNR relative to f (Definition 2.5 of [@doraishirstshafer2014])." } }
- { type: implication, from: wrt, to: psrt22, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "psRT²₂ is WRT²₂, the case k = 2 of WRT² (Definition 2.2 and Proposition 2.1(1) of [@steilayokoyama2015])." } }
- { type: implication, from: dnc3, to: dnr, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "A DNC₃ solution for an instance p (a function q ∈ 3^ℕ with q(n) ≠ φ^p_n(n)) is a DNC_ℕ solution for p, so the identity maps witness DNC_ℕ ≤sW DNC₃ (Brattka 2021, Fact 5.5(1), states it, crediting Jockusch 1989)." } }
- { type: implication, from: ucol, to: col, over: rca0, folklore: true, provenance: direct, justification: { kind: restriction, by: ai, text: "A bound k chosen for all graphs is in particular a bound for each graph (Dorais, Hirst and Shafer call the second statement formally weaker, Section 5)." } }
- { type: implication, from: wkl, to: ucol, over: rca0, provenance: ai, justification: { kind: classical, by: ai, text: "In WKL₀, for each ℓ and each locally ℓ-colorable graph G, the tree of ℓ-colorings of the finite initial segments of G is ℓ-bounded, G-computable and infinite (every finite induced subgraph is ℓ-colorable); a path is an ℓ-coloring of G. So k = ℓ works uniformly." } }
- { type: separation, from: coh-em-pi01g-rrt22-ts23-wkl, to: sads, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Take k=2, so Φ includes TS^2_3. The theorem says Φ does not imply SADS. (Special case of Theorem 4.14 of [@patey2016].)" } }
- { type: separation, from: coh-em-pi01g-rrt22-ts24-wkl, to: sts23, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Take k=3, so Φ includes TS^2_4. The theorem says Φ does not imply STS^2_3. (Special case of Theorem 4.14 of [@patey2016].)" } }
- { type: separation, from: coh-em-pi01g-rrt22-ts-ts23-wkl, to: sads, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Take k=2. (Special case of Corollary 4.23 of [@patey2016].)" } }
- { type: separation, from: coh-em-pi01g-rrt22-ts-ts24-wkl, to: sts23, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Take k=3. (Special case of Corollary 4.23 of [@patey2016].)" } }
- { type: separation, from: coh-em-fs-pi01g-rrt22-ts23-wkl, to: sads, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Take k=2. (Special case of Corollary 4.29 of [@patey2016].)" } }
- { type: separation, from: coh-em-fs-pi01g-rrt22-ts24-wkl, to: sts23, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Take k=3. (Special case of Corollary 4.29 of [@patey2016].)" } }
- { type: implication, from: rt12.par, to: tj, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "Lemma 3.2 relativizes to TJ^n ≤sW SeqRT^n_2. For n=1, TJ^1 is the Turing jump tj and SeqRT^1_2 is the parallelization of rt12. (From Section 3, after the proof of Lemma 3.2 (TJⁿ ≤sW SeqRTⁿ₂, n = 1) of [@ddhms2016].)" } }
- { type: separation, from: tj, to: ts13.par, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Corollary 5.21 gives SeqTS^n_k ≰W TJ^n for all n ≥ 1 and k ≥ 2. Take n=1, k=3, where TJ^1 is tj and TS^1_3 is ts13. (From Corollary 5.21 (n = 1, k = 3) of [@ddhms2016].)" } }
- { type: implication, from: wwkl2, to: rrt22.par, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Corollary 6.8 for all k ≥ 1; take k=2. The paper's 2-WWKL (Statement 6.7) is the catalogue's wwkl2, and SeqRRT^2_2 is the parallelization of rrt22. (From Corollary 6.8 (k = 2) of [@ddhms2016].)" } }
- { type: separation, from: ts13, to: rt12, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Theorem 5.27: TS^1_j ≰W TS^1_k for j<k. Take j=2, k=3 and identify TS^1_2 with RT^1_2. (From Theorem 5.27 (j = 2, k = 3; TS¹₂ is RT¹₂) of [@ddhms2016].)" } }
- { type: separation, from: llpo, to: llpo.star.llpo, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Continuous Weihrauch reducibility is coarser than Weihrauch reducibility, so non-reducibility under ≤*W gives non-reducibility under ≤W. (From Lemma 3.10(ii) (not even continuously Weihrauch reducible) of [@uftring2023].)" } }
- { type: separation, from: lpo, to: llpo.x.llpo, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Continuous Weihrauch reducibility is coarser than Weihrauch reducibility, so LLPO × LLPO ≰*W LPO gives LLPO × LLPO ≰W LPO. (From Lemma 3.11 (not even continuously Weihrauch reducible) of [@uftring2023].)" } }
- { type: separation, from: fs2, to: ts24, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Instance k=4 of the stated remark. (From Section 5, before Question 5.2 (Corollary 4.29: FS² does not imply TS²ₖ for any k; k = 4) of [@patey2016].)" } }
- { type: property, statement: sigma11-wkl, property: parallelizable, value: true, provenance: ai, justification: { kind: reduction, by: ai, text: "The proof of Proposition 2.5 shows Σ11-WKL ≡W Σ11-KC_NN, and the paper says Σ11-KC_NN is parallelizable. Parallelizability is invariant under Weihrauch equivalence, so Σ11-WKL is parallelizable. This also follows because Σ11-WKL ≡W the parallelization of Σ11-C_2 (Fact 2.4). (From Corollary 3.20, proof (Σ¹₁-KC is parallelizable by Proposition 2.5), with Fact 2.4 (Σ¹₁-C₂ℕ ≡W Σ¹₁-WKL) of [@dauriackihara2021].)" } }
- { type: implication, from: er22, to: ser22, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "SER²₂ is ER²₂ restricted to stable colorings (Statements 5.2 and 5.4 of [@dzhafarovpatey2017])." } }
- { type: implication, from: aca, to: wop-omega, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Theorem 2.6(ii) of [@hirst1994] (ACA₀ proves that WO(α) and WO(β) imply WO(α^β)) with α = ω." } }
- { type: implication, from: wop-omega, to: aca, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "RCA₀ proves that 2^X embeds into ω^X (send a term 2^{x_1}+…+2^{x_k}, x_1 > … > x_k, to ω^{x_1}+…+ω^{x_k}), so WO(ω^X) gives WO(2^X); and the statement “WO(α) implies WO(2^α)” implies ACA₀ by Theorem 2.6(iii) of [@hirst1994]. Carlucci and Mainardi recall the equivalence with ACA₀ (Girard, Hirst) in Section 4.2 of [@carluccimainardi2022]." } }
- { type: implication, from: brt32, to: brt324, over: [ rca0, sw ], provenance: direct, justification: { kind: restriction, by: ai, text: "BRT³₂ is ∀ℓ BRT³_{2,ℓ}; take ℓ = 4 (Statement in Section 1 of [@pateyshafer2026])." } }
- { type: implication, from: coh, to: rcoh, over: [ rca0, sw ], provenance: direct, justification: { kind: restriction, by: ai, text: "A cohesive set (C ⊆* Rₙ or C ⊆* the complement of Rₙ for every n) is Ramsey-cohesive (the same for infinitely many n), Definition 2.4 of [@cholaketal2020]." } }
- { type: implication, from: wkl, to: wkl-wbd, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "WKL(w-bd) is WKL restricted to trees of bounded width (Definition 1.1(2) of [@simpsonyokoyama2021])." } }
- { type: implication, from: gmt, to: gmtb, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "The bounded graph minor theorem is the graph minor theorem restricted to graphs of bounded tree-width (Theorem 4.2 of [@friedmanrobertsonseymour1987])." } }
- { type: implication, from: lav, to: lo-bqo, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Laver's theorem for the bqo with a single element (Statement 2.29 of [@marcone2005], which notes this case)." } }
- { type: implication, from: lo-bqo, to: fra, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Every bqo is wqo: a bad sequence is a bad array on the barrier [N]^1." } }
- { type: implication, from: pi11ca, to: lo-bqo, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Claimed as Theorem 6.28 of [@marcone2017], attributed to Montalbán, whose paper states only Fraïssé's conjecture. The statement is Π¹₂, so by Theorem IX.4.9 of [@simpson2009] (Σ¹₂-AC₀ is Π¹₃-conservative over Π¹₁-CA₀) it suffices to argue in Σ¹₂-AC₀. Only the unlabelled statement is proved: the labelled LAV would need a labelled version of Proposition 2.13 of [@montalban2006b].", steps: [ "3 is bqo in ATR₀ (Section 3 of [@marcone2005]), hence 3 is Δ⁰₂-bqo by Lemma 2.4 of [@montalban2017] (Π¹₁-CA₀).", "By Theorem 4.8 of [@montalban2017] (ATR₀), (Tr(3), ≤w) is bqo. By its Lemma 4.3 (RCA₀), (Tr(2), ≤) embeds in (Tr(2 ⊔ {∗}), ≤w) = (Tr(3), ≤w); composing a bad array with the embedding gives a bad array, so the signed trees are bqo.", "By Proposition 2.13 of [@montalban2006b] (ACA₀), T ≤ T′ if and only if lin(T) ≼ lin(T′), and every h-indecomposable order is some lin(T). Given a bad array of h-indecomposable orders, choose the trees by Σ¹₂ choice (well-foundedness is Π¹₁): they form a bad array of signed trees. So the h-indecomposable orders are bqo.", "By the generalized Higman theorem (Π¹₁-CA₀, Lemma 4.1 of [@marcone1994]), the finite sequences of h-indecomposable orders are bqo under the Higman order.", "The signed trees are wqo by step 2, so FINDEC holds (Lemma 3.4 of [@montalban2006b]). Given a bad array f of scattered orders, choose by Σ¹₂ choice finite decompositions S(s), with f(s) bi-embeddable with the sum of S(s). If S(s) ≤ S(t) in the Higman order then f(s) ≼ ΣS(s) ≼ ΣS(t) ≼ f(t); so S is a bad array of finite sequences, contradicting step 4.", "A non-scattered order contains η, into which every countable order embeds, so it is above every countable order. The set of indices with a scattered value exists by Π¹₁-comprehension, and the barrier theorem (ATR₀, Theorem 4.9 of [@marcone2005]) gives a subbarrier on which all values are scattered (excluded by step 5) or all non-scattered (every pair is then good). Hence every array is good." ] } }
- { type: property, statement: fs2, property: sigma2-basis, value: false, provenance: direct, justification: { kind: restriction, by: ai, text: "If A is an infinite free set for f and a ∈ A, then A ∖ {a} is thin for f: a tuple s ⊆ A ∖ {a} with f(s) = a would have f(s) ∈ A ∖ s. Removing one element keeps the arithmetical complexity, so a Σ⁰₂ free set would give a Σ⁰₂ thin set, which some computable f: [ℕ]² → ℕ lacks (Theorem 4.1 of [@cholaketal2005])." } }
- { type: property, statement: fs3, property: sigma3-basis, value: false, provenance: direct, justification: { kind: restriction, by: ai, text: "If A is an infinite free set for f and a ∈ A, then A ∖ {a} is thin for f: a tuple s ⊆ A ∖ {a} with f(s) = a would have f(s) ∈ A ∖ s. Removing one element keeps the arithmetical complexity, so a Σ⁰₃ free set would give a Σ⁰₃ thin set, which some computable f: [ℕ]³ → ℕ lacks (Theorem 4.1 of [@cholaketal2005])." } }
- { type: property, statement: ts2, property: pi2-basis, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "If A is an infinite free set for f and a ∈ A, then A ∖ {a} is thin for f: a tuple s ⊆ A ∖ {a} with f(s) = a would have f(s) ∈ A ∖ s. Removing one element keeps the arithmetical complexity. Every computable f: [ℕ]² → ℕ has an infinite Π⁰₂ free set (Theorem 5.2 of [@cholaketal2005]), hence an infinite Π⁰₂ thin set." } }
- { type: property, statement: ts3, property: pi3-basis, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "If A is an infinite free set for f and a ∈ A, then A ∖ {a} is thin for f: a tuple s ⊆ A ∖ {a} with f(s) = a would have f(s) ∈ A ∖ s. Removing one element keeps the arithmetical complexity. Every computable f: [ℕ]³ → ℕ has an infinite Π⁰₃ free set (Theorem 5.2 of [@cholaketal2005]), hence an infinite Π⁰₃ thin set." } }
- { type: separation, from: rt1n, to: er1, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: 'RT1N is stated to be pointwise c.e. traceable ("Examples of pointwise c.e. traceable problems include RT1N"), so Ind Q2 ≰W RT1N; since Ind Q2 ≤sW Ind Q, Ind Q ≰W RT1N ("none of Ind Qk, Ind Q, Ind QN are reducible to P either"). (From Theorem 4.5 (RT¹_ℕ is pointwise c.e. traceable, after Definition 4.4; Ind Q₂ ≤W Ind Q) of [@gill2023].)' } }
- { type: implication, from: higman, to: dickson, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Corollary 4.1 gives over RCA0 the chain HL → HL(ω) → ... → HL(2) ↔ DL (HL(2) ↔ DL is Proposition 4.1); composing gives HL → DL over RCA0. (From Corollary 4.1 of [@buriolaweiermann2025].)" } }
- { type: separation, from: kt, to: higman, over: omega, provenance: ai, justification: { kind: reduction, by: ai, text: "The proof of Corollary 3.1 observes that REC, the minimal omega-model of RCA0, satisfies KT(ω) (a true Π11 statement) but not Higman’s lemma (equivalent to ACA0 over RCA0). So there is an omega-model of KT(ω) that is not a model of HL. (From Corollary 3.1 (proof: REC satisfies KT(ω), a true Π¹₁ statement, but not Higman’s lemma) of [@buriolaweiermann2025].)" } }
- { type: conservation, statement: sem, base: bsig2, class: Pi11, value: true, provenance: ai, justification: { kind: reduction, by: ai, text: "RT^2_2 implies SEM over RCA0 (cited from Le Houerou, Levy Patey, Yokoyama), so any Pi11 sentence provable from RCA0 + BSigma2 + SEM is provable from RCA0 + RT22 (which includes BSigma2), hence from RCA0 + BSigma2 by Theorem 1.1. (From Section 1.3 (after the stable Erdős–Moser theorem paragraph) of [@hwang2026].)" } }
- { type: separation, from: d2, to: srt22, over: soc, provenance: ai, justification: { kind: reduction, by: ai, text: 'Corollary 3.5 gives a (low) stable coloring c of 2 colours such that every stable coloring d of k colours (k>=2, any complexity, not necessarily computable from c) has an infinite limit-homogeneous set computing no infinite homogeneous set for c; this is exactly the failure of the soc reduction (Section 3 intro: "computable from c or not"). (From Corollary 3.5 (for every k, hence for D²<∞) of [@dzhafarov2015b].)' } }
- { type: property, statement: rt23, property: pi2-basis, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "Instance k = 3: every computable coloring of pairs in finitely many colors has an infinite Π⁰₂ homogeneous set (Theorem 4.2 of [@jockusch1972])." } }
- { type: separation, from: rt22.fin, to: srt23, over: c, provenance: ai, justification: { kind: reduction, by: ai, text: "(From Theorem 5.21 ((RT²₂)* is the finite parallelization, Section 1.1) of [@cervellegaudelierpatey2024].)" } }
- { type: conservation, statement: srt22, base: isig2, class: Pi11, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "SRT^2_2 is provable from RT^2_2, so Π¹₁-conservativity of RT^2_2 over RCA0 + IΣ⁰₂ passes to SRT^2_2. (From Section 1 (SRT²₂ is a subsystem of RT²₂; Cholak, Jockusch and Slaman) of [@chongslamanyang2014].)" } }
