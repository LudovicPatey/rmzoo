- { type: separation, from: rt22, to: rca0, over: rca0star, provenance: ai, justification: { kind: reduction, by: ai, text: "RCA₀* + RT²₂ is ∀Π⁰₃-conservative over RCA₀* (Theorem 2.17 of [@kowalik2024]; [@koodziejczykkowalikyokoyama2020]). The instances of lightface IΣ₁ are Π⁰₃ sentences not provable in RCA₀*, so RCA₀* + RT²₂ does not prove IΣ⁰₁, that is RCA₀." } }
- { type: separation, from: rt32, to: rca0, over: rca0star, provenance: ai, justification: { kind: reduction, by: ai, text: "RCA₀* + RTⁿ₂ (n ≥ 2) is ∀Π⁰₃-conservative over RCA₀* (Theorem 2.17 of [@kowalik2024]), so it does not prove IΣ₁, whose instances are Π⁰₃ sentences not provable in RCA₀*." } }
- { type: separation, from: cac, to: rca0, over: rca0star, provenance: ai, justification: { kind: reduction, by: ai, text: "RCA₀* + CAC is ∀Π⁰₃-conservative over RCA₀* (Theorem 2.17 of [@kowalik2024]), so it does not prove IΣ₁, whose instances are Π⁰₃ sentences not provable in RCA₀*." } }
- { type: equivalence, from: nd2ip, to: gen1, over: c, provenance: direct, justification: { kind: restriction, by: ai, text: "Case n = 2. (From Theorem 9.10.23(1) of [@dzhafarovmummert2022].)" } }
- { type: implication, from: brt32, to: rt22, over: sw, provenance: ai, justification: { kind: reduction, by: ai, text: "Lemma 4.1.29 with n = k = 2 gives RT^2_2 ≤sW bRT^3_6 (R(2,3,2) = 6); Lemma 4.1.27 gives bRT^3_6 ≤sW bRT^3 via identity functionals. (From Lemma 4.1.29 and Lemma 4.1.27 of [@solda2021].)" } }
- { type: implication, from: brt22, to: rt12, over: sw, provenance: ai, justification: { kind: reduction, by: ai, text: "Lemma 4.1.29 with n = 1, k = 2 gives RT^1_2 ≤sW bRT^2_3; Lemma 4.1.27 gives bRT^2_3 ≤sW bRT^2. (From Lemma 4.1.29 and Lemma 4.1.27 of [@solda2021].)" } }
- { type: separation, from: ucnn, to: cnn, over: c, provenance: ai, justification: { kind: reduction, by: ai, text: "By Corollary 3.4, every X-computable instance of UC_NN has only solutions hyperarithmetical in X, so X ⊕ solution is hyperarithmetical. Kleene's computable instance of C_NN has no hyperarithmetical solution, so no computable reduction of C_NN to UC_NN exists. (From Section 3, after Theorem 3.5, with Corollary 3.4 of [@kiharamarconepauly2020].)" } }
- { type: separation, from: ts24, to: ts23, over: omega, provenance: ai, justification: { kind: reduction, by: ai, text: "Instance k=3 gives TS^2_4 does not imply STS^2_3 over ω-models; TS^2_3 trivially implies its stable restriction STS^2_3. (From Theorem 8.3.1 of [@patey2016c].)" } }
- { type: separation, from: ts24, to: ts23, over: c, provenance: ai, justification: { kind: reduction, by: ai, text: "Instance k=3, n=2 gives STS^2_3 ≰_c TS^2_4; STS^2_3 ≤_c TS^2_3 trivially. (From Corollary 8.3.4 of [@patey2016c].)" } }
- { type: separation, from: fs, to: srt22, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Instance k=2; STS^2_2 = SRT^2_2. (From Corollary 8.5.2 of [@patey2016c].)" } }
- { type: separation, from: ran2, to: amt, over: omega, provenance: ai, justification: { kind: reduction, by: ai, text: "Theorem 9.1.2 shows AMT does not admit probabilistic solutions; Lemma 9.1.1 with n=2 gives an ω-model of 2-RAN not satisfying AMT. (From Lemma 9.1.1 and Theorem 9.1.2 of [@patey2016c].)" } }
- { type: separation, from: wwkl.jump, to: ivt, over: sw, provenance: ai, justification: { kind: reduction, by: ai, text: "Case n = 1 of Corollary 15.8 (cardinality argument). IVT ≡sW CC_[0,1] [10, Thm 6.2] and PC_[0,1] ≡sW WWKL (Prop 8.2), hence PC′_[0,1] ≡sW WWKL′ since jumps are monotone for ≤sW. (From Corollary 15.8 of [@brattkagherardiholzl2015].)" } }
- { type: separation, from: pcr, to: ivt, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "Theorem 15.6 gives CC[0,1] ≰W PC_R, and IVT ≡W CC[0,1] (Brattka and Gherardi 2011, Theorem 6.2). (From Theorem 15.6 of [@brattkagherardiholzl2015].)" } }
- { type: separation, from: pcr, to: wwkl.jump, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "PC_{N×2^N} ≤W lim, so PC_{N×2^N} is Σ⁰₂-measurable; WWKL′ is not Σ⁰₂-measurable (Prop 9.1). Measurability is preserved downward under ≤W [8, Prop 7.5], so WWKL′ ≰W PC_{N×2^N} ≡sW PC_R. (From Corollary 9.7 and the paragraph before it of [@brattkagherardiholzl2015].)" } }
- { type: implication, from: lim, to: pcr, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "The paper states PC_{N×2^N} ≤W lim (by Brattka, de Brecht and Pauly, Theorem 8.7), and PC_R ≡sW PC_{N×2^N} (Proposition 7.4). (From Paragraph before Corollary 9.7 of [@brattkagherardiholzl2015].)" } }
- { type: implication, from: cr, to: pcr, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "$\\mathsf{PC}_\\mathbb{R}$ is the restriction of $\\mathsf{C}_\\mathbb{R}$ to the closed sets of positive measure (remark of Manlio Valenti). It is also the case I = (0,∞], J = [0,∞] of Proposition 4.1 of [@brattkagherardiholzl2015]." } }
- { type: property, statement: ds, property: sigma4-basis, value: false, provenance: ai, justification: { kind: reduction, by: ai, text: "A computable instance with no hyperarithmetic solution has in particular no Σ^0_4 solution. (From Section 1.1 of [@gohpaulyvalenti2021].)" } }
- { type: implication, from: gen1, to: hyp, over: sw, provenance: ai, justification: { kind: reduction, by: ai, text: "Proposition 9.3 gives HYP ≤sW 1-WGEN; every point 1-generic in q is weakly 1-generic in q, so 1-WGEN ≤sW 1-GEN via the identity. The paper itself states 'HYP ≤W 1-GEN by Proposition 9.3'. (From Proposition 9.3 of [@brattkahendtlasskreuzer2017].)" } }
- { type: implication, from: lim, to: gen1, over: w, provenance: direct, justification: { kind: reduction, by: ai, text: "$\\mathsf{1}\\text{-}\\mathsf{GEN} \\leq_{\\mathrm{sW}} \\lim_J$ (Corollary 9.7 of [@brattkahendtlasskreuzer2018]) and $\\lim_J <_{\\mathrm{W}} \\lim$ (Corollary 9.9 of [@brattkadebrechtpauly2012]), where $\\lim_J$ is the limit on Baire space with the jump topology." } }
- { type: separation, from: coh, to: gen1, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "COH ≤sW COH+ (Proposition 12.3), so 1-GEN ≤W COH would give 1-GEN ≤W COH+. The paper says this result 'cannot be strengthened to 1-GEN ≤W COH'. (From Proposition 12.7 of [@brattkahendtlasskreuzer2017].)" } }
- { type: separation, from: coh, to: accn, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "COH ≤sW COH+ (Proposition 12.3) and ACC_N ≰W COH+. (From Section 12, before Corollary 12.8 of [@brattkahendtlasskreuzer2017].)" }, refs: [ { ref: brattkagherardipauly2021, loc: Proposition 8.16 } ] }
