- { type: implication, from: scac, to: scacord, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "An infinite chain or antichain of an ω-ordered partial order is ω-ordered, so SCACᵒʳᵈ is SCAC restricted to ω-ordered stable partial orders (Definition 9.2.30 of [@dzhafarovmummert2022])." } }
- { type: implication, from: coh, to: lcoh, over: rca0star, provenance: ai, justification: { kind: reduction, by: ai, text: "COH implies IΣ⁰₁ over RCA₀* (through fin-COH, Theorem 3 of [@sun2025]), and under IΣ⁰₁ an unbounded set is the range of a strictly increasing function with domain ℕ (Lemma II.3.6 of [@simpson2009]), so a cohesive set has cardinality ℕ. This answers Question 5.9 of [@fioricaroneskoodziejczykkowalik2021]." } }
