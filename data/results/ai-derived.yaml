- { type: implication, from: brt32, to: rt22, over: sw, provenance: ai, justification: { kind: reduction, by: ai, text: "Lemma 4.1.29 with n = k = 2 gives RT^2_2 ≤sW bRT^3_6 (R(2,3,2) = 6); Lemma 4.1.27 gives bRT^3_6 ≤sW bRT^3 via identity functionals. (From Lemma 4.1.29 and Lemma 4.1.27 of [@solda2021].)" } }
