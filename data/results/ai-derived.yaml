- { type: implication, from: gen1, to: hyp, over: sw, provenance: ai, justification: { kind: reduction, by: ai, text: "Proposition 9.3 gives HYP ≤sW 1-WGEN; every point 1-generic in q is weakly 1-generic in q, so 1-WGEN ≤sW 1-GEN via the identity. The paper itself states 'HYP ≤W 1-GEN by Proposition 9.3'. (From Proposition 9.3 of [@brattkahendtlasskreuzer2017].)" } }
