- { type: implication, from: rt13.x.rt13, to: rt15, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Proposition 5.5 with n = 1, k0 = k1 = 3. (From Proposition 5.5 of [@goh2019b].) In Chapter 5 of [@goh2019b] the solutions of RT^1_k are the colors that appear infinitely often (Weihrauch equivalent to the homogeneous-set formulation of the zoo, but not strongly), so the strong reduction holds only for that formulation; for homogeneous sets it gives ≤W. Corrected after a report by Lu Liu." } }
- { type: implication, from: rt12.x.rt13, to: rt14, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Proposition 5.5 with n = 1, k0 = 2, k1 = 3 gives RT^1_4 ≤ RT^1_2 × RT^1_3. (From Proposition 5.5 of [@goh2019b].) In Chapter 5 of [@goh2019b] the solutions of RT^1_k are the colors that appear infinitely often (Weihrauch equivalent to the homogeneous-set formulation of the zoo, but not strongly), so the strong reduction holds only for that formulation; for homogeneous sets it gives ≤W. Corrected after a report by Lu Liu." } }
- { type: implication, from: rt12.x.rt12, to: rt13, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "Proposition 5.5 with n = 1, k0 = k1 = 2 gives RT^1_3 ≤ RT^1_2 × RT^1_2. (From Proposition 5.5 of [@goh2019b].) In Chapter 5 of [@goh2019b] the solutions of RT^1_k are the colors that appear infinitely often (Weihrauch equivalent to the homogeneous-set formulation of the zoo, but not strongly), so the strong reduction holds only for that formulation; for homogeneous sets it gives ≤W. Corrected after a report by Lu Liu." } }
- { type: separation, from: tcnn, to: non.x.tcnn, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "Take f = TC_NN in 8.2(3). If NON × TC_NN ≤_W TC_NN then TC_NN ≤_W C_NN, contradicting 8.2(1). (From Proposition 8.2(3) with 8.2(1) of [@kiharamarconepauly2020].)" } }
- { type: equivalence, from: pcr, to: cn.star.wwkl, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "Corollary 6.4 gives CN ∗ PC2N ≡W PCN×2N; Prop 7.4 gives PC_R ≡sW PC_{N×2^N}; Prop 8.2 gives PC_{2^N} ≡sW WWKL. (From Corollary 6.4 with Proposition 7.4 of [@brattkagherardiholzl2015].)" } }
- { type: equivalence, from: pcr, to: cn.x.wwkl, over: sw, provenance: ai, justification: { kind: reduction, by: ai, text: "The proof of Theorem 9.3 establishes the cycle PC_{N×2^N} ≤sW PC_{2^N} ∗s lim^Δ ≤sW C_N × PC_{2^N} ≤sW PC_{N×2^N}. Together with PC_R ≡sW PC_{N×2^N} (Prop 7.4) and PC_{2^N} ≡sW WWKL (Prop 8.2) this gives the result. (From Proof of Theorem 9.3 (and Corollary 6.4) of [@brattkagherardiholzl2015].)" } }
- { type: equivalence, from: pcr.star.pcr, to: pcr, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "Corollary 9.4 with WWKL^Δ ≡sW PC_R (Theorem 9.3). (From Corollary 9.4 of [@brattkagherardiholzl2015].)" } }
- { type: implication, from: rt12.star.rt12, to: rt14, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "n=1, i=j=2, k=4. (From Section 4.5, after Definition 4.5.11 (from Proposition 4.5.9) of [@dzhafarovmummert2022].)" } }
