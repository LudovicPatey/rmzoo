- { type: property, statement: ds, property: sigma4-basis, value: false, provenance: ai, justification: { kind: reduction, by: ai, text: "A computable instance with no hyperarithmetic solution has in particular no Σ^0_4 solution. (From Section 1.1 of [@gohpaulyvalenti2021].)" } }
- { type: implication, from: gen1, to: hyp, over: sw, provenance: ai, justification: { kind: reduction, by: ai, text: "Proposition 9.3 gives HYP ≤sW 1-WGEN; every point 1-generic in q is weakly 1-generic in q, so 1-WGEN ≤sW 1-GEN via the identity. The paper itself states 'HYP ≤W 1-GEN by Proposition 9.3'. (From Proposition 9.3 of [@brattkahendtlasskreuzer2017].)" } }
- { type: implication, from: lim, to: gen1, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "The paper states 1-GEN ≤W lim_J (by a corollary of Brattka, Hendtlass and Kreuzer on the Baire category theorem), and lim_J is a restriction of lim, so lim_J ≤sW lim. (From Section 9, before Corollary 9.9 of [@brattkahendtlasskreuzer2017].)" } }
- { type: separation, from: coh, to: gen1, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "COH ≤sW COH+ (Proposition 12.3), so 1-GEN ≤W COH would give 1-GEN ≤W COH+. The paper says this result 'cannot be strengthened to 1-GEN ≤W COH'. (From Proposition 12.7 of [@brattkahendtlasskreuzer2017].)" } }
