- {"type": "property", "statement": "kn", "property": "finite-codomain", "value": false, "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "$\\mathsf{C}_{k+1} \\not\\leq_{cW} f$ for $f$ with a $k$-element codomain: each committed answer $c_j$ maps into a removed element, so it is not a solution of later instances, and the $k+1$ answers are distinct. $\\mathsf{C}_{k+1} \\leq_{sW} \\mathsf{K}_\\mathbb{N}$ for every $k$. (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
