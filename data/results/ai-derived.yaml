- { type: implication, from: rt13.star.(tj.star.tj), to: rt23, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "n=2, k=3. (From Proposition 4.5.12 of [@dzhafarovmummert2022].)" } }
