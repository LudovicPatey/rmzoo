- { type: implication, from: rt12, to: ts13, over: [ sw, rca0star ], provenance: ai, justification: { kind: reduction, by: ai, text: "Given f : ℕ → 3, color x by 0 if f(x) < 2 and by 1 otherwise. A homogeneous set of color 0 avoids color 2 of f, one of color 1 avoids colors 0 and 1." } }
