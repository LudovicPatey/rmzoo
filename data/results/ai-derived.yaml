- { type: equivalence, from: tcnn.fin.det, to: ucnn, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "In the database $\\mathsf{WKL} \\star {\\mathsf{wFindHS}_{\\Pi^0_1}}$ ≤W ${\\mathsf{TC}_{\\mathbb{N}^\\mathbb{N}}}^{*}$ ≤W $\\widehat{\\mathsf{TC}_{\\mathbb{N}^\\mathbb{N}}}$ (and $\\mathsf{UC}_{\\mathbb{N}^{\\mathbb{N}}} \\le_\\mathrm{W} \\mathsf{C}_{\\mathbb{N}^{\\mathbb{N}}} \\equiv_\\mathrm{W} \\mathsf{WKL} \\star {\\mathsf{wFindHS}_{\\Pi^0_1}}$). $\\mathsf{UC}_{\\mathbb{N}^{\\mathbb{N}}}$ is a single-valued function into $\\mathbb{N}^\\mathbb{N}$, so $\\mathsf{UC}_{\\mathbb{N}^{\\mathbb{N}}}$ ≤W $\\mathsf{Det}({\\mathsf{TC}_{\\mathbb{N}^\\mathbb{N}}}^{*})$ (Theorem 3.2 of [@gohpaulyvalenti2021]); and $\\mathsf{Det}({\\mathsf{TC}_{\\mathbb{N}^\\mathbb{N}}}^{*}) \\le_\\mathrm{W} \\mathsf{Det}(\\widehat{\\mathsf{TC}_{\\mathbb{N}^\\mathbb{N}}})$ (Corollary 3.3), which is ≡W $\\mathsf{UC}_{\\mathbb{N}^{\\mathbb{N}}}$ (by Theorem 8.5 of [@kiharamarconepauly2020], see the result on $\\mathsf{Det}(\\widehat{\\mathsf{TC}_{\\mathbb{N}^\\mathbb{N}}})$)." } }
- { type: equivalence, from: (lpo.star.rt1n).det, to: cn, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "In the database ${\\mathsf{C}_{\\mathbb{N}}}^{*}$ ≤W $\\mathsf{LPO} \\star {\\mathsf{RT}^1_{\\mathbb{N}}}$ ≤W $\\Pi^1_1\\text{-}\\mathsf{Bound}$ (and ${\\mathsf{C}_{\\mathbb{N}}}^{*} \\equiv_\\mathrm{W} \\mathsf{C}_{\\mathbb{N}}$). $\\mathsf{C}_{\\mathbb{N}}$ is a single-valued function into $\\mathbb{N}^\\mathbb{N}$ (as $\\lim_\\mathbb{N}$), so $\\mathsf{C}_{\\mathbb{N}}$ ≤W $\\mathsf{Det}(\\mathsf{LPO} \\star {\\mathsf{RT}^1_{\\mathbb{N}}})$ (Theorem 3.2 of [@gohpaulyvalenti2021]); and $\\mathsf{Det}(\\mathsf{LPO} \\star {\\mathsf{RT}^1_{\\mathbb{N}}}) \\le_\\mathrm{W} \\mathsf{Det}(\\Pi^1_1\\text{-}\\mathsf{Bound})$ (Corollary 3.3), which is ≡W $\\mathsf{C}_{\\mathbb{N}}$ (Proposition 5.8 of [@gohpaulyvalenti2024])." } }
- { type: equivalence, from: rt1inf.fop, to: rt1inf, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "$\\mathsf{RT}^1_{<\\infty}$ is Weihrauch equivalent to a first-order problem, hence to its first-order part (Corollary 2.4 of [@dzhafarovsolomonyokoyama2023]). Let $Q$ have the same instances $(k, f)$, with solutions the colors $i < k$ such that $f(x) = i$ for infinitely many $x$. From a solution $i$ of $Q$ and the instance, the infinite homogeneous set $\\{x : f(x) = i\\}$ is computable; from an infinite homogeneous set $H$, $f(\\min H)$ is a solution of $Q$. (As for $\\mathsf{RT}^1_k \\equiv_\\mathrm{W} \\mathsf{BWT}_k$ in Section 2 of [@dzhafarovsolomonyokoyama2023], with $k$ now part of the instance.)" } }
- { type: property, statement: padeg, property: computable-fop, value: true, provenance: direct, justification: { kind: restriction, by: ai, text: "The problem PA (given $p$, find $q$ of PA degree relative to $p$) is densely realized (Proposition 8.16 of [@brattkagherardipauly2021]: changing finitely many bits of $q$ keeps its Turing degree), and every problem with codomain $\\mathbb{N}$ Weihrauch reducible to a densely realized problem with totally represented output is computable (Proposition 4.13)." } }
- { type: equivalence, from: dnr.fop, to: accn.ufin, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "$\\mathsf{DNR} \\equiv_\\mathrm{sW} \\widehat{\\mathsf{ACC}_\\mathbb{N}}$ (Theorem 5.2 of [@brattkahendtlasskreuzer2017], with $X = \\mathbb{N}$), so the first-order part of $\\mathsf{DNR}$ is that of $\\widehat{\\mathsf{ACC}_\\mathbb{N}}$ (Corollary 2.3 of [@dzhafarovsolomonyokoyama2023]), which is $\\equiv_\\mathrm{W} \\mathsf{ACC}_\\mathbb{N}^{u*}$ by Theorem 5.7 of [@soldavalenti2022], $\\mathsf{ACC}_\\mathbb{N}$ being first-order." } }
- { type: implication, from: sigma12ac, to: sigma11ac, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Every $\\Sigma^1_1$ formula is $\\Sigma^1_2$, so the scheme of $\\Sigma^1_2$ choice contains that of $\\Sigma^1_1$ choice (Definition VII.6.1 of [@simpson2009])." } }
- { type: implication, from: sigma12ac, to: pi11ca, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "$\\Sigma^1_2\\text{-}\\mathsf{AC}_0$ is equivalent to $\\Delta^1_2\\text{-}\\mathsf{CA}_0$ (Theorem VII.6.9(1) of [@simpson2009]), and a $\\Pi^1_1$ formula is $\\Delta^1_2$, so $\\Delta^1_2$ comprehension contains $\\Pi^1_1$ comprehension." } }
- { type: implication, from: pi12ca, to: sigma12dc, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "$\\Pi^1_2\\text{-}\\mathsf{CA}_0$ is equivalent to strong $\\Sigma^1_2\\text{-}\\mathsf{DC}_0$ (Theorem VII.6.9(3) of [@simpson2009]), which implies $\\Sigma^1_2\\text{-}\\mathsf{DC}_0$: if $\\forall n \\forall X \\exists Y \\eta(n, X, Y)$, the set $Z$ given by strong dependent choice satisfies $\\eta(n, (Z)^n, (Z)_n)$ for every $n$ (Definition VII.6.1(3)–(4))." } }
- { type: equivalence, from: dnc3.fop, to: acc3.ufin, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "$\\mathsf{DNC}_3 \\equiv_\\mathrm{sW} \\widehat{\\mathsf{ACC}_3}$ (Theorem 5.2 of [@brattkahendtlasskreuzer2017]), so the first-order part of $\\mathsf{DNC}_3$ is that of $\\widehat{\\mathsf{ACC}_3}$ (Corollary 2.3 of [@dzhafarovsolomonyokoyama2023]), which is $\\equiv_\\mathrm{W} \\mathsf{ACC}_3^{u*}$ by Theorem 5.7 of [@soldavalenti2022], $\\mathsf{ACC}_3$ being first-order." } }
- { type: implication, from: lpo, to: wlpo, over: bish, provenance: direct, justification: { kind: restriction, by: ai, text: "LPO decides, for a binary sequence $(a_n)_n$, whether $\\forall n\\, a_n = 0$ or $\\exists n\\, a_n = 1$, and the second case gives $\\neg \\forall n\\, a_n = 0$: an instance of WLPO (Sections 1.2 and 1.3 of [@diener2018])." }, refs: [ { ref: diener2018, loc: Section 1.3 } ] }
- { type: equivalence, from: wlpo, to: discontr, over: bish, provenance: direct, justification: { kind: restriction, by: ai, text: "WLPO holds if there is a discontinuous function $f : X \\to Y$ with $X$ complete, and conversely WLPO gives a discontinuous function when $X$ has an accumulation point and $Y$ two distinct points (Lemma after Proposition 1.3.1 of [@diener2018], with $X = Y = \\mathbb{R}$); Diener's \"discontinuous\" ($x_n \\to x$ with $\\rho(f(x_n), f(x)) > \\varepsilon$ for all $n$) is the failure of sequential continuity." } }
- { type: implication, from: mp, to: mpor, over: bish, provenance: ai, justification: { kind: reduction, by: ai, text: "The equivalence MP <-> MP∨ + WMP gives MP -> MP∨. (From Section 2.3, before Proposition 2.3.1 of [@diener2018].)" }, refs: [ { ref: bergerishiharaschuster2012, loc: Corollary 23 } ] }
- { type: implication, from: mp, to: wmp, over: bish, provenance: ai, justification: { kind: reduction, by: ai, text: "The equivalence MP <-> MP∨ + WMP gives MP -> WMP. (From Section 2.3, before Proposition 2.3.1 of [@diener2018].)" } }
- { type: implication, from: ucont, to: fanc, over: bish, provenance: ai, justification: { kind: reduction, by: ai, text: "Proposition 6.3.3 states UCT <-> FANc + MC (MC majorised choice); the direction UCT implies FANc + MC gives UCT implies FANc. (From Proposition 6.3.3 of [@diener2018].)" } }
- { type: separation, from: wmp, to: llpo, over: bish, provenance: ai, justification: { kind: reduction, by: ai, text: "The topological model over R is first countable and functionally Hausdorff with an accumulation point: it validates WMP_R (7.2.11) and not LLPO_R (7.2.10). (From Section 7.1 (diagram); Section 7.2.6, overview table (INT and RUSS rows) of [@diener2018].)" } }
- { type: separation, from: bish, to: acc3, over: bish, provenance: direct, justification: { kind: restriction, by: ai, text: "LLPO_n fails in the sheaf model of R on N^N (which validates dependent choice) for the n of the proposition; n = 3 gives LLPO_3. (From Corollary 8.1.6 (Proposition 8.1.5, n = 3; Proposition 8.1.1) of [@diener2018].)" } }
- { type: implication, from: wkl, to: pi01acw2, over: bish, provenance: direct, justification: { kind: restriction, by: ai, text: "Part (ii) of the proof of Theorem 4.3 shows Σ01-Sep → Π01-ACω,2 and then WKL → Π01-ACω,2 using Theorem 3.1. (From Theorem 4.3 (proof of (ii)) of [@veldman2025].)" } }
- { type: implication, from: boot, to: sigmasep3, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Given the BOOT set X = {n : (exists f)(Y_0(f,n)=0)} (a Sigma-formula with parameter Y_0), take Z = X: phi_0(n) gives n in Z, and phi_1(n) gives not phi_0(n), hence n not in Z. (From Section 3.1.1, (3.2) of [@normannsanders2021].)" } }
- { type: separation, from: cbn-ind03, to: nbi, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "The theorem is stated over Z_2^omega, which extends RCA0^omega (it has the functionals S_k^2 in addition). Non-provability of NBI from Z_2^omega + CBN + IND0 gives non-provability from RCA0^omega + CBN + IND0. (From Theorem 2.16 of [@normannsanders2021].)" } }
- { type: separation, from: lind, to: wkl, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "WKL is an L_2-sentence not provable in RCA_0; by Corollary 3.15 RCA_0^ω + LIND proves the same L_2-sentences as RCA_0, hence does not prove WKL. (From Corollary 3.15 and the sentence before it of [@normannsanders2017b].)" } }
- { type: separation, from: suslin, to: lind, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "For k = 1, Π^1_1-CA_0^ω is RCA_0^ω + (S^2), so it does not prove LIND. (From Theorem 3.14 of [@normannsanders2017b].)" } }
- { type: separation, from: suslin, to: hbu, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Theorem 3.1 states that no system Π^1_k-CA_0^ω proves HBU; for k = 1, Π^1_1-CA_0^ω is RCA_0^ω + (S^2) (Definition 1.3), so RCA_0^ω + (S^2) does not prove HBU. (From Theorem 3.1 (model of Theorem 3.4) of [@normannsanders2017b].)" } }
- { type: implication, from: llpo-pi01acw2, to: ivt, over: bish, provenance: direct, justification: { kind: restriction, by: ai, text: "LLPO + Π⁰₁-AC_{ω,2} proves Veldman's IVT (Theorem 10.2 of [@veldman2011], in BIM): every continuous φ on [0, 1] with φ(γ₀) ≤ 0 ≤ φ(γ₁) for some γ₀, γ₁ has a zero. The zoo's IVT (f(0) · f(1) < 0) is the special case γ₀, γ₁ ∈ {0, 1}." } }
- { type: implication, from: pitu, to: pito, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: 'PITu gives, for G, a bound N valid for every F with LOC(F,G); in particular for the given F, which is PITo for (F,G). Purely logical. (From Section 1.3.1, (PIT_o) and (PIT_u); proof of Corollary 4.8 ("we obtain PITu, and hence PITo") of [@normannsanders2018b].)' } }
- { type: separation, from: qfac01-suslin, to: pitu, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Theorem 4.3: no system Pi^1_k-CA0^omega + QF-AC^{0,1} (k >= 1) proves PITu. The case k = 1 gives Pi^1_1-CA0^omega = RCA0^omega + (S^2) (conjunct suslin) with QF-AC^{0,1}. (From Theorem 4.3 of [@normannsanders2018b].)" } }
- { type: implication, from: pito, to: wkl, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "In the proof of Corollary 4.6, from a tree T with no path one builds, with QF-AC^{1,0} (part of RCA0^omega) and quantifier-free induction, H^2 continuous on Cantor space with itself as modulus, hence locally bounded; PITo makes H bounded, so T is finite. No QF-AC^{0,1} is used, so PITo -> WKL over RCA0^omega itself. (From Corollary 4.13 (reverse direction); proof of Corollary 4.6, first part of [@normannsanders2018b].)" }, refs: [ { ref: normannsanders2018b, loc: "Corollary 4.13 (reverse direction); proof of Corollary 4.6, first part" } ] }
- { type: separation, from: suslin, to: pito, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Theorem 4.9: there is a model of Z_2^omega = union of the Pi^1_k-CA0^omega in which PITo fails. Such a model satisfies Pi^1_1-CA0^omega = RCA0^omega + (S^2), so (S^2) does not imply PITo. The model does not satisfy QF-AC^{0,1}. (From Theorem 4.9 of [@normannsanders2018b].)" } }
- { type: implication, from: whbu, to: nin, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "The proof of Theorem 3.4 of [@normannsanders2020b] (an injection Y gives the cover with radius 2^{-(Y(x)+3)}, of total measure at most 1/2) works verbatim for the zoo's WHBU (measure of the union), although the paper words WHBU differently (Principle 2.8)." } }
- { type: implication, from: cocode0, to: nin, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Corollary 3.20: the restriction of cocode0 to RM-closed sets already implies NIN (proof: [0,1] is RM-closed and countable when Y is an injection, so cocode0 lists [0,1], contradicting [109, II.4.9]). cocode0 implies its restriction. (From Corollary 3.20 of [@normannsanders2020b].)" } }
- { type: implication, from: cocode1, to: nbi, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Corollary 3.38: the restriction of cocode1 to RM-closed sets implies NBI; cocode1 implies its restriction. (From Corollary 3.38 of [@normannsanders2020b].)" } }
- { type: implication, from: exists2, to: wwkl, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Reverse direction of the equivalence: if (∃^2) holds then WWKL. (From Theorem 3.20 of [@sanders2018b].)" } }
- { type: implication, from: hbu-qfac01, to: lind, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Reverse direction of the equivalence: HBU gives LIN. (From Theorem 3.18(a) of [@sanders2018b].)" } }
- { type: implication, from: scf, to: wff, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "The paper only says a trivial term of Gödel's T computes a weak fan functional from a special one; provability over RCA_0^ω: Λ(G,k) := Θ(G) works, since Θ(G) covers every f ≤ 1, hence every binary string of any length extends into the finite union, whose measure is therefore 1 ≥ 1 - 2^{-k}, a finite combinatorial verification in RCA_0^ω." } }
- { type: implication, from: boot, to: bootminus, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Theorem 4.5 gives BOOT → [open + ACA0] → BOOT^-, hence BOOT → BOOT^-; this is also immediate since BOOT^- is a special case of BOOT (Section 4.1). (From Section 4.1, before Definition 4.2; Theorem 4.5 of [@normannsanders2019b].)" } }
- { type: implication, from: a0-hbu, to: hbc0, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Theorem 2.9 proves over RCA0^omega + A0 the equivalence HBU <-> [WHBU+ + HBC0 + WKL]; its proof shows HBU -> HBC0 using A0 (and the case split on exists2). The extra axiom A0 is kept as a conjunct. (From Theorem 2.9 of [@sanders2021].)" } }
- { type: implication, from: exists2-qfac01, to: finite-sigma11-ac, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Theorem 3.7 is stated over ACA₀^ω + IND₀ but its proof of (ii)→(iii) uses IND₂ and the paper's IND₀ (restriction of its Principle 2.3) is not clearly the zoo's ind03; the IND-free fact holds directly: with (∃²) an arithmetical φ(n,X) has a characteristic term, so the finite-choice hypothesis (at least one X for each n) becomes ∀n∃X t(n,X)=0, QF-AC^{0,1} gives Y with φ(n,Y(n)), and (Y(n))_n is the required sequence." } }
- { type: implication, from: cocode1-exists2, to: wsigma11ac, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "The step cocode₁ → weak-Σ¹₁-AC₀ uses only (∃²), but the paper's Y(x) := μn(x ∈ E_n) is not surjective when two n have the same unique solution; the fix is to code n into the solution (φ'(n,Z) :≡ Z is the interleaving of the characteristic sequence of {n} with the unique X, avoiding dyadic ambiguity), after which the E_n are disjoint singletons, A = ∪E_n is strongly countable, and the enumeration given by cocode₁ yields (X_n)_n via (∃²)." }, refs: [ { ref: sanders2026c, loc: "Theorem D.3.8, second implication" } ] }
- { type: implication, from: exists2-hbu-ind03, to: nin, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Theorem 2.34 (over ACA_0^omega + IND_0, ACA_0^omega = RCA_0^omega + (exists^2)) shows that Cousin's lemma for usco Psi : [0,1] -> R+ implies NIN[0,1]. The full Cousin's lemma HBU for arbitrary Psi has this as a special case (restriction to usco gauges). (From Theorem 2.34 (iii) of [@normannsanders2022].)" } }
- { type: implication, from: exists2-ind03-whbu, to: nin, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Corollary 2.35 (over ACA₀^ω + IND₀) derives NIN[0,1] from Vitali's principle for usco Ψ, which the paper words with the union 'having measure 1−ε' (Section 2.3.3) while the zoo's whbu says 'at least 1−ε'; the proof (union of measure at most 1/2 for an injection, against a cover of measure ≥ 1−ε for small ε) works verbatim for the zoo's version, which restricts to usco Ψ." } }
- { type: implication, from: fandelta, to: posinf, over: bish, provenance: ai, justification: { kind: reduction, by: ai, text: "Theorem 5.1 states FAN <-> POS for all compact metric spaces, which gives FAN -> POS on [0,1] as a special case; the converse cannot be kept because POS => WKL! uses POS on a compact subspace of Cantor space x Cantor space, not [0,1]." } }
- { type: separation, from: muc, to: exists2, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "The paper states (p. 13) that MUC is inconsistent with (exists2) but consistent relative to RCA0^omega, so RCA0^omega + MUC is consistent and proves not-(exists2), hence MUC does not imply (exists2)." } }
- { type: separation, from: exists2, to: muc, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "The paper states that MUC is inconsistent with (exists2) (p. 13) and that RCA0^omega + (exists2) is conservative over PA (Theorem 3.2, hence consistent), so (exists2) does not imply MUC over RCA0^omega." } }
- { type: separation, from: qfac01-qfac11-qfac21-suslin, to: nin, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Theorem 2.12 (read): Z2^omega + union_sigma QF-AC^{sigma,1} does not prove NIN[0,1]. Z2^omega = union_k Pi^1_k-CA0^omega contains (S^2) (Section 1.2), and QF-AC^{0,1}, QF-AC^{1,1}, QF-AC^{2,1} are instances of the scheme, so the conjunct premise is a subsystem: the separation holds for it." } }
- { type: implication, from: ads, to: wlpo, over: bish, provenance: ai, justification: { kind: reduction, by: ai, text: "The paper states ADS -> Pi^0_1-LEM over Ishihara's constructive base [26] (BISH): for h, the order of (4.2) gives, from an ascending sequence, (forall n) h(n)=0, from a descending one, not (forall n) h(n)=0. Pi^0_1-LEM is (forall n) h(n)=0 or not (forall n) h(n)=0, i.e. WLPO (zoo wlpo), not LPO (= Sigma^0_1-LEM, which would need a witness). A finite search along a descending sequence would also give the witness (hence LPO), but the paper does not state it; entered only WLPO. Sketch only in the paper, hence ai." } }
- { type: implication, from: brouwer, to: wkl, over: bish, provenance: ai, justification: { kind: reduction, by: ai, text: "Theorem 4.3 (in EL0, contained in BISH) proves WKL <-> Brouwer for uniformly continuous f on the standard simplices Delta_n. The zoo's brouwer is for the convex hull of any finite set of points (continuous = uniformly continuous on compacts in BISH). Theorem 4.2's proof uses only the unit square instance, a convex hull of 4 points, so brouwer -> wkl holds over bish. The converse for arbitrary convex hulls is not stated (the paper proves it only for simplices), so only the implication is entered." } }
- { type: implication, from: fandelta, to: wwklbar, over: bish, provenance: ai, justification: { kind: reduction, by: ai, text: "The thesis calls WWKL a weakening of FAN∆ and explains why (WWKL only gives that the proportion of unbarred nodes tends to 0, not uniformity). One-line argument: if the decidable bar B, closed under extensions, is uniform with bound N, every node of length ≥ N is in B, so the proportion is 0 from N on." } }
- { type: equivalence, from: wkl, to: minprinciple, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Cited fact: kawai2026 refers to [10], which is kawai2026b, for WKL ⇔ MIN in EL₀. kawai2026b Theorem 3.1 proves it in EL₀, and Section 2 states that RCA₀ is EL₀ + LEM, so the equivalence holds over RCA₀. Entered as a one-line derivation (ai) citing the original." } }
- { type: implication, from: enum-exists2, to: cocode0, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "The paper only remarks informally that CUCfin + cocode0 could be reformulated as enum. Derivation: for A ⊂ [0,1] with Y injective on A, H := Y is a height for A ({x ∈ A : Y(x) < n} has at most n elements, finite in the sense of Definition 3.30); enum gives a sequence containing A, and (∃²) removes the terms not in A (A is non-empty), giving cocode0. Same finiteness notion as the enum entry." } }
