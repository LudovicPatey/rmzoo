- { type: implication, from: ran2, to: gen1, over: c, provenance: ai, justification: { kind: reduction, by: ai, text: 2-RAN proves 1-GEN on ω-models (Kurtz's theorem), proof: { blocks: [ { env: notation, label: Conventions, proof: [ 'Snapshot queried with cache/proofs/q.mjs. Convention of the database: an implication from A to B means B ≤ A; a separation from A to B means B ≰ A. All ideals below are Turing ideals (ω-models of RCA₀). "Classical" marks a textbook theorem named, not read in cache/fulltext. Nothing here depends on [@cintioli2026] or [@cintioli2026b].', "Notation used throughout. A set G is *n-generic relative to Z* if for every Σ⁰ₙ(Z) set S of binary strings, G *meets* S (some initial segment of G is in S) or *avoids* S (some initial segment of G has no extension in S). An avoiding initial segment may always be taken as long as we wish. Σ⁰ₙ(W) ⊆ Σ⁰ₙ(Z) when W ≤_T Z, so n-generic relative to Z implies n-generic relative to W; Σ⁰₁(Z′) ⊆ Σ⁰₂(Z), so 2-generic relative to Z implies 1-generic relative to Z′ (and (n+1)-generic relative to Z implies n-generic relative to Z′).", Two lemmas are used by several sections., { env: lemma, label: Lemma G (2-generics add no member to a Π⁰₁(Z′) class), text: "Let G be 2-generic relative to Z, and let Q = [T] ⊆ ω^ω where T ⊆ ω^{<ω} is a Z′-computable tree. If some member of Q is computable in G ⊕ Z, then Q has a Z-computable member.", proof: [ "1. Let Φ^{G⊕Z} = a ∈ Q, with Φ a functional with the usual monotone use convention. Write Φ^{σ⊕Z} for the finite sequence ⟨Φ^{σ⊕Z}(0), …, Φ^{σ⊕Z}(m−1)⟩ where m is least with Φ^{σ⊕Z}(m) undefined in |σ| steps.", { steps: [ "Let A = {σ : ∃x ∀τ ⊇ σ Φ^{τ⊕Z}(x)↑} and B = {σ : Φ^{σ⊕Z} ∉ T}. A is Σ⁰₂(Z); B is Σ⁰₁(Z′), hence Σ⁰₂(Z). So A ∪ B is Σ⁰₂(Z).", "G does not meet A (Φ^{G⊕Z} is total) and does not meet B (every initial segment of a is in T). So G avoids A ∪ B: there is σ₀ ≺ G no extension of which is in A ∪ B.", "Define Z-computably τ₀ = σ₀ and τ_{i+1} = the first τ ⊇ τ_i found with Φ^{τ⊕Z}(i)↓. It exists because τ_i ⊇ σ₀ is not in A. Let ψ(i) = Φ^{τ_{i+1}⊕Z}(i).", "ψ is total and Z-computable, and ψ↾n is an initial segment of Φ^{τ_n⊕Z}, which is in T because τ_n ∉ B and T is a tree. So ψ ∈ [T] = Q." ] } ] }, { env: lemma, label: Lemma D (2-generics add no dominating function), text: Let G be 2-generic relative to Z. Suppose that no Z-computable function eventually dominates every computable function. Then no function computable in G ⊕ Z eventually dominates every computable function., proof: [ "1. Let f = Φ^{G⊕Z} be total. As in Lemma G (steps 2–3 with A alone), fix σ₀ ≺ G such that every ρ ⊇ σ₀ and every x have some τ ⊇ ρ with Φ^{τ⊕Z}(x)↓.", { steps: [ "For ρ ⊇ σ₀ and x let τ(ρ, x) be the first such τ found. Define the total Z-computable function g₁(x) = 1 + max{Φ^{τ(ρ,x)⊕Z}(x) : ρ ⊇ σ₀, |ρ| = |σ₀| + x}.", By hypothesis there is a computable g₀ with g₁(x) < g₀(x) for infinitely many x., "For each k let E_k = {τ ⊇ σ₀ : ∃x > k (g₁(x) < g₀(x) ∧ Φ^{τ⊕Z}(x)↓ < g₁(x))}. It is Σ⁰₁(Z). It is dense below σ₀: given ρ′ ⊇ σ₀, choose x > k with g₁(x) < g₀(x) and |σ₀| + x ≥ |ρ′|, extend ρ′ to ρ of length |σ₀| + x; then τ(ρ, x) ⊇ ρ′ and Φ^{τ(ρ,x)⊕Z}(x) ≤ g₁(x) − 1.", "G is 1-generic relative to Z, and cannot avoid E_k (an avoiding initial segment can be taken ⊇ σ₀, contradicting density below σ₀). So G meets every E_k: for every k there is x > k with f(x) < g₁(x) < g₀(x). Hence f does not eventually dominate g₀." ] } ] }, { env: part, label: The generic ideal 𝓘_gen, proof: [ "Let Z₀ = ∅ and Z_{i+1} = Z_i ⊕ G_i, where G_i is n-generic", "relative to Z_i for every n (such G_i exists: meet or avoid the countably many arithmetical-in-Z_i sets of strings one after the other). Let 𝓘_gen = {X : ∃i X ≤_T Z_i}. It is a Turing ideal since Z_i ≤_T Z_{i+1}. By induction on i, using Lemma G (a Π⁰₁(∅′) class is a Π⁰₁(Z_i′) class) and Lemma D:", • (P1) every Π⁰₁(∅′) class Q ⊆ ω^ω with a member in 𝓘_gen has a computable member;, • (P2) no function in 𝓘_gen eventually dominates every computable function;, "• (P3) Z_i′ ≡_T Z_i ⊕ ∅′ for every i, and every Π⁰₁(∅′) class with a member computable in", Z_i ⊕ ∅′ has a ∅′-computable member. ] }, { env: part, label: Proof of (P3), proof: [ 'If G is 1-generic relative to Z then (G ⊕ Z)′ ≤_T G ⊕ Z′: e ∈ (G ⊕ Z)′ iff G meets the Σ⁰₁(Z) set S_e = {σ : Φ_e^{σ⊕Z}(e)↓}, and e ∉ (G ⊕ Z)′ iff G avoids S_e; "G meets S_e" and "G avoids S_e" are both Σ⁰₁(G ⊕ Z′) and exactly one holds. So Z_{i+1}′ ≡_T G_i ⊕ Z_i′ ≡_T G_i ⊕ Z_i ⊕ ∅′ = Z_{i+1} ⊕ ∅′ by induction. For the second part, G_i is 3-generic relative to Z_i, hence 2-generic relative to Z_i′ ≡_T Z_i ⊕ ∅′; apply Lemma G with oracle Z_i ⊕ ∅′ in place of Z (a Π⁰₁(∅′) class is Π⁰₁((Z_i ⊕ ∅′)′)), and the induction hypothesis.' ] } ] }, { env: part, label: Proof, proof: [ "The theorem is literally 1-GEN ≤_c 2-RAN: the instance Z is sent to itself, and every solution R computes with Z a solution G. On ω-models: let 𝓘 ⊨ 2-RAN and Z ∈ 𝓘; take R ∈ 𝓘 2-random relative to Z; some G ≤_T R ⊕ Z is 1-generic relative to Z, and G ∈ 𝓘." ] } ] } } }
- { type: separation, from: id, to: rd, over: w, provenance: direct, justification: { kind: restriction, by: ai, text: "A problem is Weihrauch reducible to $\\mathrm{id}$ exactly when it is computable. If a Turing functional $\\Phi$ computed $\\mathrm{rd}_U(X)$ from every $X \\in \\mathsf{MLR}$, then $\\langle X, i\\rangle \\mapsto \\Phi(X)$ would witness that $\\mathrm{rd}_U$ is $U$-layerwise computable (Definition 2.5 of [@holzlshafer2015]), against Theorem 4.5 of [@holzlshafer2015]." } }
