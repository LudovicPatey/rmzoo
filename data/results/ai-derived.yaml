- { type: equivalence, from: wkl-j.det, to: lim, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "From Corollary 3.11 of [@gohpaulyvalenti2021] (Det(f)′ ≡W Det(f′) for a cylinder f), with Det(WKL) computable.", steps: [ "WKL is a cylinder (Proposition 7.6(1) of [@brattkagherardipauly2021], for $\\mathsf{C}_{2^\\mathbb{N}} \\equiv_{\\mathrm{sW}} \\mathsf{WKL}$), so $\\mathsf{Det}(\\mathsf{WKL})' \\equiv_\\mathrm{W} \\mathsf{Det}(\\mathsf{WKL}')$ by Corollary 3.11 of [@gohpaulyvalenti2021].", "$\\mathsf{Det}(\\mathsf{WKL})$ is computable (Corollary 5.2 of [@brattkadebrechtpauly2012]: every single-valued function Weihrauch reducible to $\\mathsf{C}_{2^\\mathbb{N}}$ is computable), so $\\mathsf{Det}(\\mathsf{WKL}) \\le_\\mathrm{sW} \\mathrm{id}$; it is a cylinder (Section 3 of [@gohpaulyvalenti2021], after Definition 3.1), so $\\mathrm{id} \\le_\\mathrm{sW} \\mathsf{Det}(\\mathsf{WKL})$.", "The jump is monotone for $\\le_\\mathrm{sW}$, so $\\mathsf{Det}(\\mathsf{WKL})' \\equiv_\\mathrm{sW} \\mathrm{id}' = \\lim$ (Section 6 of [@brattkagherardipauly2021]). Hence $\\mathsf{Det}(\\mathsf{WKL}') \\equiv_\\mathrm{W} \\lim$." ] } }
- { type: equivalence, from: wkl-jj.det, to: lim.jump, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "From Corollary 3.11 of [@gohpaulyvalenti2021] with k = 2, as for $\\mathsf{Det}(\\mathsf{WKL}') \\equiv_\\mathrm{W} \\lim$.", steps: [ "WKL is a cylinder (Proposition 7.6(1) of [@brattkagherardipauly2021]), so $\\mathsf{Det}(\\mathsf{WKL})'' \\equiv_\\mathrm{W} \\mathsf{Det}(\\mathsf{WKL}'')$ by Corollary 3.11 of [@gohpaulyvalenti2021].", "$\\mathsf{Det}(\\mathsf{WKL})$ is a computable cylinder (Corollary 5.2 of [@brattkadebrechtpauly2012]; Section 3 of [@gohpaulyvalenti2021]), hence $\\equiv_\\mathrm{sW} \\mathrm{id}$, and the jump is monotone for $\\le_\\mathrm{sW}$: $\\mathsf{Det}(\\mathsf{WKL})'' \\equiv_\\mathrm{sW} \\mathrm{id}'' = \\lim'$. Hence $\\mathsf{Det}(\\mathsf{WKL}'') \\equiv_\\mathrm{W} \\lim'$." ] } }
- { type: equivalence, from: sort.fop, to: cn, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "In the database ${\\mathsf{C}_{\\mathbb{N}}}^{*}$ ≤W $\\mathsf{SORT}$ ≤W $\\mathsf{TJ}$ (and ${\\mathsf{C}_{\\mathbb{N}}}^{*} \\equiv_\\mathrm{W} \\mathsf{C}_{\\mathbb{N}}$). $\\mathsf{C}_{\\mathbb{N}}$ is first-order, so $\\mathsf{C}_{\\mathbb{N}}$ ≤sW the first-order part of $\\mathsf{SORT}$ (Theorem 2.2 of [@dzhafarovsolomonyokoyama2023]); and the first-order part of $\\mathsf{SORT}$ is ≤sW that of $\\mathsf{TJ}$ (Corollary 2.3), which is ≡ $\\mathsf{C}_{\\mathbb{N}}$ (Theorem 4.2 of [@dzhafarovsolomonyokoyama2023])." } }
