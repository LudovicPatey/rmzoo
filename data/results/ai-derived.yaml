- { type: separation, from: qfac01-qfac11-qfac21-z2omega, to: ninc, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Z2^omega contains (exists^2), and NIN_{2^N} -> NIN[0,1] over ACA0^omega (sanders2022 Theorem 6; also stated here after Theorem 2.9), so Theorem 2.12 gives the same separation for NIN_{2^N}." } }
- { type: implication, from: ff, to: wkl, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "The paper's FF quantifies over Y continuous on 2^N; the catalogue ff (Y continuous on Baire space) gives it by applying Phi to Y(lambda n.min(f(n),1)), so the paper's argument (FF gives uniform continuity on Cantor space, hence WKL by [42, Section 2]) applies. Also stated as FF -> WKL over RCA0^omega in sanders2018b, Section 3.1." }, refs: [ { ref: sanders2018b, loc: "Theorem 3.8, (3.3)" }, { ref: sanders2026c, loc: "Theorem F.4.10, proof" } ] }
