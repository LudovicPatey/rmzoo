- { type: implication, from: weakcwo, to: wcwo-indec, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Specialization: weak comparability of all countable well-orderings, restricted to indecomposable ones ([@hirst1994], Theorem 4.4)." } }
- { type: implication, from: pi11tr, to: atr, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Specialization: every arithmetical formula is $\\Pi^1_1$, so arithmetical transfinite recursion is the restriction of the $\\Pi^1_1$ transfinite recursion scheme (Definitions V.2.4 and VI.7.1 of [@simpson2009]) to arithmetical operators." } }
- { type: implication, from: pi11tr, to: pi11ca, over: rca0, provenance: ai, justification: { kind: classical, by: ai, text: "Given a $\\Pi^1_1$ formula $\\theta(n)$ (with parameters), apply $\\Pi^1_1$ transfinite recursion to the operator $\\theta(n, Y) :\\equiv \\theta(n)$ along the one-element well-ordering $X = \\{(0,0)\\}$: the hierarchy $Y$ with $H_\\theta(X, Y)$ has $(Y)_0 = \\{n : \\theta(n)\\}$ (Definition V.2.2 of [@simpson2009]), so this set exists by $\\Delta^0_1$ comprehension." } }
- { type: implication, from: pi1inftyti, to: pi11-ti, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Specialization: transfinite induction along countable well-orderings for all formulas of $\\mathrm{L}_2$, restricted to $\\Pi^1_1$ formulas." } }
- { type: implication, from: sigma11rt, to: delta11rt, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Specialization: an instance of the $\\Delta^1_1$ Ramsey theorem with $\\Sigma^1_1$ formula $\\varphi$ is concluded by the instance of the $\\Sigma^1_1$ Ramsey theorem for $\\varphi$ (Definition V.9.1 of [@simpson2009])." } }
- { type: implication, from: delta11rt, to: delta02-rt-inf, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Specialization: $\\Sigma^0_2$ formulas are $\\Sigma^1_1$ and $\\Pi^0_2$ formulas are $\\Pi^1_1$, so every instance of the $\\Delta^0_2$ Ramsey theorem is an instance of the $\\Delta^1_1$ Ramsey theorem (Definition V.9.1 of [@simpson2009])." } }
- { type: implication, from: delta11ca, to: aca-plus, over: omega, provenance: ai, justification: { kind: classical, by: ai, text: "Let M be an ω-model of Δ¹₁-CA₀ and X ∈ M. For each (standard) i, ACA₀ gives in M the unique Z with Z^[0] = X and Z^[j+1] = (Z^[j])′ for j < i, and it is the true i-th iterate. So in M the Σ¹₁ formula 'some such Z has n ∈ Z^[i]' and the Π¹₁ formula 'every such Z has n ∈ Z^[i]' both define {⟨i, n⟩ : n ∈ X^(i)}, and Δ¹₁ comprehension puts X^(ω) in M. This is the proof of Proposition 5.8.15(1) of Dzhafarov and Mummert, which is correct over ω-models (where every instance of induction holds) but not over RCA₀ (errata)." } }
- { type: separation, from: kpt, to: non, over: w, provenance: ai, justification: { kind: reduction, by: ai, text: "NON ≰W KPT for KPT as in Definition 10.2 of Brattka, Hendtlass and Kreuzer (only the pair ⟨p, q⟩ is required to compute r). Suppose H, K witness NON ≤W KPT and take r = ∅′. By the Sacks splitting theorem there are c.e. sets A |T B with A ⊕ B ≡T ∅′. Since K(∅′) ≤T ∅′ ≡T ⟨A, B⟩, the pair ⟨A, B⟩ is a solution of KPT(K(∅′)), but H(∅′, ⟨A, B⟩) ≤T ∅′ is not a solution of NON(∅′). (If p and q are each required to compute r, as Figure 2 of the paper suggests, then NON ≤sW KPT instead.)" } }
- { type: implication, from: em, to: non, over: sw, provenance: ai, justification: { kind: reduction, by: ai, text: "Uniform relativization of Theorem 9 of [@bovykinweiermann2017] (a computable tournament with no infinite computable transitive subtournament), suggested by Manlio Valenti. Given X, a tournament T_X computable from X, uniformly, all of whose solutions are not computable from X; the identity maps solutions back, so the reduction is strong.", steps: [ "Jockusch's construction of a computable partition of pairs with no infinite homogeneous set computable from ∅′ (Theorem 3.1 of [@jockusch1972]) is explicit and relativizes uniformly: from X one computes a 2-coloring P_X of pairs with no infinite homogeneous set computable from X′, hence (as in Corollary 3.2 of [@jockusch1972]) none that is Σ⁰₂ in X.", "From P_X define the tournament T_X as in the proof of Theorem 9 of [@bovykinweiermann2017]: x → y iff x < y and P_X(x, y) = 0, or y < x and P_X(x, y) = 1. It is computable from X, uniformly.", "Let S be an infinite transitive subtournament of T_X. The proof of Theorem 9 (Herrmann's theorem, relativized to S ⊕ X) gives an infinite set H that is Σ⁰₂ in S ⊕ X and homogeneous for P_X. If S were computable from X, H would be Σ⁰₂ in X, which is impossible. So S is not computable from X: S is a solution of NON for the instance X." ] } }
- { type: separation, from: jinv-lim, to: lim, over: c, provenance: ai, justification: { kind: reduction, by: ai, text: "Observed by Manlio Valenti. Take a computable sequence $X$ converging to $\\emptyset'$. A computable reduction gives a computable instance of $\\mathfrak{L}$, whose solution $q$ has $q' \\leq_T \\emptyset'$, as $J(q)$ is the limit of a computable sequence. A solution of $\\lim$ on $X$ computes $\\emptyset'$, so $\\emptyset' \\leq_T q$ and $\\emptyset'' \\leq_T q' \\leq_T \\emptyset'$, a contradiction." } }
- { type: separation, from: chipi11, to: c3, over: cw, provenance: contributed, justification: { kind: personal-communication, by: Manlio Valenti, text: "A diagonalization against the two possible answers of $\\chi_{\\Pi^1_1}$. Suppose $\\Phi, \\Psi$ are continuous and witness $\\mathsf{C}_3 \\leq_{\\mathrm{W}} \\chi_{\\Pi^1_1}$; we build a name of a nonempty $A \\subseteq \\{0, 1, 2\\}$ by enumerating its complement.", steps: [ "On the name enumerating nothing ($A = \\{0, 1, 2\\}$), the correct answer $i$ makes $\\Psi$ output some $n$, after reading a finite prefix $\\sigma$ of the name.", "Extend $\\sigma$ by enumerating $n$ out of $A$. On every name extending it, $\\Psi$ with answer $i$ outputs $n \\notin A$, so the correct answer must be $1 - i$.", "On such a name with $A = \\{0, 1, 2\\} \\setminus \\{n\\}$, $\\Psi$ with answer $1 - i$ outputs some $m \\in A$ after a finite prefix $\\tau$. Extend $\\tau$ by enumerating $m$ out of $A$: $A$ keeps one element.", "On this name both answers of $\\chi_{\\Pi^1_1}$ give an element outside $A$, a contradiction." ] } }
- {"type": "implication", "from": "gsads", "to": "cn", "over": "w", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "$\\mathsf{C}_\\mathbb{N} \\leq_W \\mathsf{General}\\text{-}\\mathsf{SADS}$. The order flips direction at each mind change of the least candidate and puts the older elements where they cannot belong to an infinite monotone sequence.", "steps": ["Let $p$ enumerate the complement of a nonempty $A \\subseteq \\mathbb{N}$. Let $c_n$ be the least number not among the first $n$ values enumerated, and $\\pi(n)$ the number of changes of $c$ up to $n$. Since $c$ is nondecreasing and converges to $\\min A$, $\\pi$ reaches a final value $f$, and every $n$ of phase $f$ has $c_n = \\min A$.", "Define $\\leq_L$ on $\\mathbb{N}$, uniformly in $p$, by inserting $n$ at stage $n$. If $\\pi(n)$ is even, $n$ goes above the earlier elements of its phase and below all elements of earlier phases. If $\\pi(n)$ is odd, $n$ goes below the earlier elements of its phase and above all elements of earlier phases. Each insertion is at a cut of a finite linear order, so $\\leq_L$ is a linear order.", "If $f$ is even, the finitely many older elements lie above all of phase $f$, and the order has type $\\omega + k$. If $f$ is odd, they lie below all of phase $f$, and the type is $k + \\omega^*$. So $\\leq_L$ is stable in the sense of [@astoretal2017], Definition 2.3.", "An older element has only finitely many elements above it if $f$ is even, and finitely many below it if $f$ is odd. The only infinite monotone sequences are ascending if $f$ is even and descending if $f$ is odd, so no solution $S$ contains an older element.", "The backward functional reads $x = \\min S$ and returns $c_x = \\min A \\in A$."]}}
- {"type": "implication", "from": "scac", "to": "cn", "over": "w", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "$\\mathsf{C}_\\mathbb{N} \\leq_W \\mathsf{SCAC}$. Phases alternate between chains and antichains, so that no solution contains an element of an earlier phase.", "steps": ["Let $p$ enumerate the complement of a nonempty $A \\subseteq \\mathbb{N}$. Let $c_n$ be the least number not among the first $n$ values enumerated, and $\\pi(n)$ the number of changes of $c$ up to $n$. Since $c$ is nondecreasing and converges to $\\min A$, $\\pi$ reaches a final value $f$, and every $n$ of phase $f$ has $c_n = \\min A$.", "For $i < j$, put $i <_P j$ if either $\\pi(i) = \\pi(j)$ is even, or $\\pi(j)$ is odd and $\\pi(i) < \\pi(j)$; no other strict relations hold. Transitivity: let $i <_P j <_P k$. If $\\pi(j) = \\pi(k)$ is even, then $\\pi(j)$ is even forces $\\pi(i) = \\pi(j)$, so $i <_P k$. Otherwise $\\pi(k)$ is odd and $\\pi(i) \\leq \\pi(j) < \\pi(k)$, so $i <_P k$.", "The order is stable (Definition 2.8 of [@astoretal2017]): every element is below almost all elements or incomparable with almost all. If $f$ is even, elements of phase $f$ are below almost all and older ones are incomparable with all of phase $f$. If $f$ is odd, elements of phase $f$ are isolated and older ones are below all of phase $f$.", "Let $S$ be an infinite chain or antichain; it contains at least two elements of phase $f$. If $f$ is even these are comparable, so $S$ is a chain, and an older element, incomparable with phase $f$, cannot belong to it. If $f$ is odd these are incomparable, so $S$ is an antichain, and an older element, below all of phase $f$, cannot belong to it.", "The backward functional reads $x = \\min S$ and returns $c_x = \\min A \\in A$."]}}
- {"type": "implication", "from": "sads", "to": "llpo", "over": "w", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "$\\mathsf{LLPO} \\leq_W \\mathsf{SADS}$. Before the unique $1$ of $p$ appears, the direction of the solution is the default answer; when it appears, the old elements are moved to the side that excludes the wrong direction.", "steps": ["Let $p$ have at most one $1$. Stage $t$ adds $\\ell_t = 2t$ and $r_t = 2t+1$, with $\\ell_0 < \\ell_1 < \\dots < r_1 < r_0$ while no $1$ has appeared. If $p(s) = 1$, the correct answer is $j = 1 - (s \\bmod 2)$, and the elements of stages $< s$ are called old.", "If $j = 1$, all later elements are placed below the old ones: new $\\ell$'s ascending, below new $r$'s descending, below the old block. If $j = 0$, all later elements are placed above the old block, in the same pattern. In both cases, and if $p = 0^\\omega$, the order has type $\\omega + \\omega^*$, uniformly computably in $p$.", "Given a solution $S$ with two least elements $x_0 < x_1$, let $t = \\lfloor x_0 / 2 \\rfloor$. If $p$ has a $1$ at a position $\\leq t$, output the corresponding $j$. Otherwise output $0$ if $x_0 <_L x_1$ (ascending) and $1$ if not (descending).", "Correctness when $p(s) = 1$ and $x_0$ is old. If $j = 1$, only old elements are above $x_0$, finitely many, so $S$ is not ascending: the output is $1$. If $j = 0$, only old elements are below $x_0$, so $S$ is not descending: the output is $0$. If $p = 0^\\omega$, both answers are correct."]}}
- {"type": "separation", "from": "sads", "to": "lpo", "over": "w", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "$\\mathsf{LPO} \\not\\leq_W \\mathsf{SADS}$. An instance of type $\\omega + \\omega^*$ has solutions in both directions, and a finite part of each cannot both be killed by a later change of the order.", "steps": ["Suppose $\\Phi, \\Psi$ witness the reduction, and let $L = \\Phi(0^\\omega)$, of type $\\omega + \\omega^*$. Take an infinite ascending sequence $A$ of small elements and an infinite descending sequence $D$ of large elements. Both are solutions, so $\\Psi(0^\\omega, A) = \\Psi(0^\\omega, D) = 1$.", "By continuity there is $m$ such that these computations use only $0^m$ and the sets $A \\cap m$, $D \\cap m$, both nonempty. Let $a = \\max (A \\cap m)$ and $b = \\max (D \\cap m)$; then $a <_L b$, as $a$ is small and $b$ is large.", "Choose $s \\geq m$ such that $L' = \\Phi(0^s 1 0^\\omega)$ agrees with $L$ on all elements below $m$. $L'$ has type $\\omega + \\omega^*$, and the correct answer on $0^s 1 0^\\omega$ is $0$.", "If $a$ is small in $L'$, extend $A \\cap m$ by small elements of $L'$, greater than $m$ and increasing in both orders: this is a solution for $L'$ on which $\\Psi$ outputs $1$, a contradiction.", "Otherwise $a$ is large in $L'$. Then $b >_{L'} a$ is large too, and $D \\cap m$ extends by large elements of $L'$, greater than $m$ and decreasing in $L'$, to a solution on which $\\Psi$ outputs $1$, again a contradiction."]}}
- {"type": "implication", "from": "nd2ip", "to": "non", "over": "sw", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "$\\mathsf{NON} \\leq_{sW} \\overline{\\mathsf{D}}_2\\mathsf{IP}$, from the construction of [@cintioli2026b]. Its case distinction is nonuniform when producing a 1-generic, but both cases show that the solution itself is not computable from the input.", "steps": ["For an input $X$, take the family $(D_n)_n$ of Section 4 of [@cintioli2026b], uniformly computable in $X$, with nonempty pairwise distinct members.", "Let $s$ be a solution and $f$ the function with $s = (D_{f(r)})_r$, computable from $s$ through the private markers $2n \\in D_n$ (Section 4). By Lemma 3.3 and (9) of [@cintioli2026b], finite subfamilies of $(D_n)_n$ that intersect pairwise have a common element.", "Suppose $s \\leq_T X$, so $f \\leq_T X$. The path $Y \\leq_T X \\oplus f$ of Lemma 5.1 is computable from $X$, so it is not 1-generic relative to $X$. Section 7 of [@cintioli2026b] then gives $X' \\leq_T X \\oplus f \\leq_T X$, a contradiction. So $s \\not\\leq_T X$, and the backward functional is the identity on (a code of) $s$."]}}
- {"type": "implication", "from": "fip", "to": "non", "over": "sw", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "$\\mathsf{NON} \\leq_{sW} \\mathsf{FIP}$, with the family of [@cintioli2026b], on which maximal FIP subfamilies are maximal pairwise-intersecting subfamilies.", "steps": ["For an input $X$, take the family $(D_n)_n$ of Section 4 of [@cintioli2026b], uniformly computable in $X$, with nonempty pairwise distinct members.", "Let $s$ be a maximal subfamily with the finite intersection property. It intersects pairwise. If $D_n$ meets every member of $s$, then by the finite Helly property (Lemma 3.3 and (9) of [@cintioli2026b]) $s \\cup \\{D_n\\}$ has the finite intersection property, so $D_n \\in s$ by maximality. Thus $s$ is a solution of $\\overline{\\mathsf{D}}_2\\mathsf{IP}$ for this family.", "Let $s$ be a solution and $f$ the function with $s = (D_{f(r)})_r$, computable from $s$ through the private markers $2n \\in D_n$ (Section 4). By Lemma 3.3 and (9) of [@cintioli2026b], finite subfamilies of $(D_n)_n$ that intersect pairwise have a common element.", "Suppose $s \\leq_T X$, so $f \\leq_T X$. The path $Y \\leq_T X \\oplus f$ of Lemma 5.1 is computable from $X$, so it is not 1-generic relative to $X$. Section 7 of [@cintioli2026b] then gives $X' \\leq_T X \\oplus f \\leq_T X$, a contradiction. So $s \\not\\leq_T X$, and the backward functional is the identity on (a code of) $s$."]}}
- {"type": "separation", "from": "kpt", "to": "non", "over": "omega", "provenance": "ai", "justification": {"kind": "classical", "by": "ai", "text": "The Turing ideal $\\mathcal{I} = \\{Y : Y \\leq_T \\emptyset'\\}$ is an $\\omega$-model of $\\mathsf{KPT}$ and not of $\\mathsf{NON}$.", "steps": ["By Sacks' splitting theorem, $\\emptyset'$ is the disjoint union of two low c.e. sets $A, B$. They are Turing incomparable: if $A \\leq_T B$, then $\\emptyset' \\equiv_T A \\oplus B \\equiv_T B$, contradicting that $B$ is low; symmetrically for $B \\leq_T A$.", "For every $r \\in \\mathcal{I}$, $\\langle A, B \\rangle \\in \\mathcal{I}$ computes $\\emptyset' \\geq_T r$ and $A \\mid_T B$, so it is a solution of $\\mathsf{KPT}$ on $r$ in $\\mathcal{I}$.", "The instance $\\emptyset' \\in \\mathcal{I}$ of $\\mathsf{NON}$ has no solution in $\\mathcal{I}$, since every member of $\\mathcal{I}$ is computable from $\\emptyset'$."]}}
- {"type": "equivalence", "from": "lpo.star.lpo", "to": "(lpo.x.lpo).x.lpo", "over": "w", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "$\\mathsf{LPO} \\star \\mathsf{LPO} \\equiv_W \\mathsf{LPO}^3$, against the strict reduction printed in [@brattkapauly2018], Proposition 3.11. Upper bound: one $\\mathsf{LPO}$ question, then the second chosen from its answer, is answered by $\\mathsf{LPO}^3$ asking the first question and both candidate second questions. Lower bound: for three sequences, the first $\\mathsf{LPO}$ asks whether at least 2 are nonzero, the second whether at least 1 (or at least 3) is; once the number $c$ of nonzero sequences is known, wait until $c$ of them have shown a nonzero entry. (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
- {"type": "separation", "from": "lpo.star.wkl", "to": "lpo.x.lpo", "over": "cw", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "$\\mathsf{LPO}^2 \\not\\leq_{cW} \\mathsf{LPO} \\star \\mathsf{WKL}$ ($\\mathsf{WKL}$ applied first). By compactness and König's lemma, the paths of the trees produced near the instance $(0^\\omega, 0^\\omega)$ run through nodes extendible in the tree of that instance; this forces the $\\mathsf{LPO}$ answer to be 0 on a neighbourhood, and two successive perturbations of the two coordinates then yield the same output for instances with different answers. (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
- {"type": "separation", "from": "wkl.star.lpo", "to": "lpo.x.lpo", "over": "w", "provenance": "direct", "justification": {"kind": "reduction", "by": "ai", "text": "If $\\mathsf{LPO}^2 \\leq_W \\mathsf{WKL} \\star \\mathsf{LPO}$, then $\\mathsf{LPO}^2 \\leq_W \\mathsf{LPO}$ by Theorem 7.25 of [@brattkagherardipauly2021] (single-valued problems into computable metric spaces below $\\mathsf{C}_{2^\\mathbb{N}} \\star g$ are below $g$; $\\mathsf{WKL} \\equiv_{sW} \\mathsf{C}_{2^\\mathbb{N}}$, Theorem 7.23), which is false. (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
- {"type": "separation", "from": "wkl.star.lpo", "to": "cn", "over": "w", "provenance": "direct", "justification": {"kind": "reduction", "by": "ai", "text": "$\\lim_\\mathbb{N} \\equiv_W \\mathsf{C}_\\mathbb{N}$ is single-valued; Theorem 7.25 of [@brattkagherardipauly2021] would give $\\mathsf{C}_\\mathbb{N} \\leq_W \\mathsf{LPO}$, contradicting Proposition 7.17. (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
- {"type": "separation", "from": "lpo.fin", "to": "lim2", "over": "cw", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "Mind-change argument: the number $n$ of $\\mathsf{LPO}$ instances is frozen on a prefix of $0^\\omega$; flipping the limit after each committed answer strictly decreases the set of indices $i$ with $p_i = 0^\\omega$, which can happen at most $n$ times. (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
- {"type": "separation", "from": "lpo.x.lpo", "to": "c4", "over": "cw", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "$\\mathsf{C}_{n+2} \\not\\leq_{cW} \\mathsf{LPO}^n$: removing the committed answer $n+1$ times from $\\{0,\\dots,n+1\\}$ must each time strictly shrink the set of zero sequences among the $n$ $\\mathsf{LPO}$ instances. Case $n = 2$. (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
- {"type": "separation", "from": "lpo.star.lpo", "to": "kn", "over": "w", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "$\\mathsf{C}_5 \\not\\leq_{cW} \\mathsf{LPO}^3$ (mind-change argument for $\\mathsf{C}_{n+2}$ against $\\mathsf{LPO}^n$), $\\mathsf{LPO}^3 \\equiv_W \\mathsf{LPO} \\star \\mathsf{LPO}$, and $\\mathsf{C}_5 \\leq_{sW} \\mathsf{K}_\\mathbb{N}$. (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
- {"type": "equivalence", "from": "llpo.star.llpo", "to": "c4", "over": "w", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "$\\mathsf{C}_4 \\leq_W \\mathsf{C}_2 \\star \\mathsf{C}_2$: first choose a half $h$ of $\\{0,1,2,3\\}$ meeting $A$, then an element of $A \\cap \\{2h, 2h+1\\}$. Conversely, the pairs $(a,b)$ with $a$ a solution of the first instance and $b$ not removed by the second instance computed from $a$ form a nonempty co-c.e. subset of $\\{0,1\\}^2$, so one $\\mathsf{C}_4$ question answers $\\mathsf{C}_2 \\star \\mathsf{C}_2$ (also a case of [@brattkapauly2018], Theorem 3.12). (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
- {"type": "separation", "from": "c3", "to": "llpo.x.llpo", "over": "cw", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "$\\mathsf{C}_2^m \\not\\leq_{cW} \\mathsf{C}_k$ for $2^m > k$: after a prefix of the full instance fixing all removals and the outputs of the backward functional on each remaining answer, the $2^m$ instances with a unique solution need pairwise distinct answers among at most $k$. (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
- {"type": "property", "statement": "c3", "property": "idempotent", "value": false, "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "$\\mathsf{LLPO}^2 \\not\\leq_{cW} \\mathsf{C}_3$ and $\\mathsf{LLPO}^3 \\not\\leq_{cW} \\mathsf{C}_4$ ($\\mathsf{C}_2^m \\not\\leq_{cW} \\mathsf{C}_k$ for $2^m > k$), while $\\mathsf{LLPO}^2 \\leq_W \\mathsf{C}_3 \\times \\mathsf{C}_3$ and $\\mathsf{LLPO}^3 \\leq_W \\mathsf{C}_4 \\times \\mathsf{C}_4$. (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
- {"type": "property", "statement": "c4", "property": "idempotent", "value": false, "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "$\\mathsf{LLPO}^2 \\not\\leq_{cW} \\mathsf{C}_3$ and $\\mathsf{LLPO}^3 \\not\\leq_{cW} \\mathsf{C}_4$ ($\\mathsf{C}_2^m \\not\\leq_{cW} \\mathsf{C}_k$ for $2^m > k$), while $\\mathsf{LLPO}^2 \\leq_W \\mathsf{C}_3 \\times \\mathsf{C}_3$ and $\\mathsf{LLPO}^3 \\leq_W \\mathsf{C}_4 \\times \\mathsf{C}_4$. (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
- {"type": "separation", "from": "tcn", "to": "ivt", "over": "cw", "provenance": "ai", "justification": {"kind": "reduction", "by": "ai", "text": "$\\mathsf{CC}_{[0,1]} \\not\\leq_{cW} \\mathsf{TC}_\\mathbb{N}$ ($\\mathsf{CC}_{[0,1]} \\equiv_{sW} \\mathsf{IVT}$, [@brattkagherardipauly2021] Theorem 7.34), by a limit construction of nested intervals that defeats each totalized answer $k$ in turn. The Weihrauch version is [@brattkagherardi2019], Corollary 8.15. (Proof by an AI agent, refereed by an AI assistant; full version in the maintainer's proof notes.)"}}
