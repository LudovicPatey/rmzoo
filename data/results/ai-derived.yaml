- { type: implication, from: fs2, to: rrt22, over: sw, provenance: direct, justification: { kind: restriction, by: ai, text: "Case n = 2. Uniform identity reducibility gives a strong Weihrauch reduction. (From Theorem 9.8.7 of [@dzhafarovmummert2022].)" } }
