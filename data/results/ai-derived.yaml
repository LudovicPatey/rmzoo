- { type: implication, from: hbt, to: hbu, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "HBT -> HBU holds over RCA0^omega with no extra axiom: for Psi : I -> R+, the cover condition of HBT holds with y = x since x is in I^Psi_x, so a finite sub-cover follows (sanders2018d, proofs of Theorems 3.15 and 3.16: 'The reverse direction is immediate'). Restriction to canonical covers, entered as AI derivation; the A0 + IND premise is unnecessary." } }
- { type: implication, from: indomega, to: ind23, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "The proof of Theorem 3.10 states that IND proves finite choice for Z : (N^N x N) -> N: (forall m<=n)(exists f)(Z(f,m)=0) -> (exists w)(|w|=n+1 and (forall m<=n) Z(w(m),m)=0). Special case: for Y and k as in IND_2, put Z(f,m)=Y(f,m) for binary f and 1 otherwise; the w obtained gives IND_2. AI derivation (special case of an unnumbered claim)." } }
- { type: implication, from: indomega, to: ind13, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Same finite-choice consequence of IND (proof of Theorem 3.10): for Y with (forall n)(exists! f in 2^N)Y(n,f)=0 and each n, apply it with Z(f,m)=Y(m,f) on binary f (1 otherwise) up to n-1, giving w of length n with Y(i,w(i))=0: IND_1. AI derivation (special case)." } }
- { type: implication, from: exists2-open, to: atr, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: Special case k = 0 of Corollary 4.6 (Pi^1_k-CA0^omega + open implies Pi^1_k-TR0). Its proof says that case follows from Thm 4.5 and Thm 4.3. ACA0^omega is written with base id exists2 (equivalent to mu2) for consistency. } }
- { type: implication, from: bootminus-exists2, to: bootminusc, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "The paper only says BOOT^-_C is 'essentially the restriction to C' of BOOT^-. The proposed argument restricts Y to f in 2^N, which needs deciding 'f in 2^N' (Pi^0_1). That is possible with (E^2) but not by a functional of RCA0^omega. So it is entered as an AI restriction with (E^2) as a conjunct." } }
- { type: implication, from: muc, to: ff, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "Corollary 3.4, proved over RCA0^ω + QF-AC^{2,0} (the paper says it also goes through over RCA0^ω): the left-to-right implication of MUC <-> [FF + ¬(∃2)] gives MUC -> FF by dropping the conjunct ¬(∃2). (From Theorem 3.6 of [@sanders2018b].)" } }
- { type: separation, from: qfac01-z2omega, to: pitu, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Theorem 4.3: no Π¹k-CA0^ω + QF-AC^{0,1} proves PITu. The proof builds a single model (via Sω²) for all k at once, and any proof in Z2^ω + QF-AC^{0,1} uses only finitely many axioms, so the separation holds for the union." } }
- { type: separation, from: z2omega, to: lind, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Theorem 3.14 states that no system Π¹k-CA0^ω proves LIND. Z2^ω is their union, and a proof uses only finitely many axioms (compactness), so Z2^ω does not prove LIND either." } }
- { type: separation, from: z2omega, to: hbu, over: rca0, provenance: direct, justification: { kind: restriction, by: ai, text: "The type structure of Theorem 3.4 validates every Π^1_k-CA_0^ω (all k), hence their union Z_2^ω (Definition 1.3), and falsifies HBU; by soundness Z_2^ω does not prove HBU. Equivalently, a proof in Z_2^ω uses finitely many axioms, so it would be a proof in some Π^1_k-CA_0^ω, which Theorem 3.1 excludes. (From Theorem 3.4 (with Theorem 3.1) of [@normannsanders2017b].)" } }
- { type: implication, from: exists3-qfac11, to: mu1, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "The paper says (E²) (called (∃³) in [28]) clearly implies (µ¹) inside the proof of Corollary 4.10. (∃³) gives (S²) by applying E to a type-2 functional built from f, and (S²) gives (µ¹) over RCA₀^ω + QF-AC^{1,1} by the equivalence stated before Corollary 4.2; the QF-AC^{1,1} conjunct is added for this reason. (From Corollary 4.10, proof; Section 4.1.2 of [@bergsanders2014].)" } }
- { type: separation, from: qfac01-z2omega, to: bct01, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Cited in a footnote to [72]=normannsanders2019b Thm 6.16 (BCT over R, arbitrary sequences; the proof notes the same idea works for other spaces) or [76]=normannsanders2020b Thm 3.4. Neither original states the [0,1] decreasing version literally, so entered as a derivation: normannsanders2020b Theorem 3.4 proves BCT -> NIN over RCA0^omega with the decreasing sets O_n={x in [0,1]: Y(x)>n}, i.e. bct01 -> nin; and Z2^omega + QF-AC^{0,1} does not prove NIN (normannsanders2020b Theorem 3.2)." }, refs: [ { ref: normannsanders2019b, loc: Theorem 6.16 }, { ref: sanders2026c, loc: "Section D.4.1, after Exercise D.4.2; Section H.4.6" } ] }
- { type: implication, from: exists3, to: bct01, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "normannsanders2019b states '(exists^3) implies BCT' as a corollary of Theorem 6.14 (RCA0^omega + BOOT proves BCT), for arbitrary sequences of dense open sets of reals; BCT_[0,1] with decreasing sequences is a special case (restriction)." }, refs: [ { ref: normannsanders2019b, loc: "Section 6.2.2, after Corollary 6.15" } ] }
- { type: implication, from: exists2-open, to: nin, over: rca0, provenance: ai, justification: { kind: reduction, by: ai, text: "Theorem 2.8 (over ACA0^omega) lists '(open) An open set O in [0,1] can be represented by an RM-code' as implying NIN[0,1]. The catalogue open (sets of R) implies the [0,1] version over ACA0^omega (extend O by the complement of [0,1], take the code, intersect), so the implication holds a fortiori: special case argument." } }
