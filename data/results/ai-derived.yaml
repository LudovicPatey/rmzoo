- { type: separation, from: ucnn, to: cnn, over: c, provenance: ai, justification: { kind: reduction, by: ai, text: "By Corollary 3.4, every X-computable instance of UC_NN has only solutions hyperarithmetical in X, so X ⊕ solution is hyperarithmetical. Kleene's computable instance of C_NN has no hyperarithmetical solution, so no computable reduction of C_NN to UC_NN exists. (From Section 3, after Theorem 3.5, with Corollary 3.4 of [@kiharamarconepauly2020].)" } }
- { type: separation, from: ucnn, to: cnn, over: omega, provenance: ai, justification: { kind: reduction, by: ai, text: "The ω-model HYP satisfies UC_NN, since solutions of X-computable instances are hyperarithmetical in X by Corollary 3.4. It fails C_NN by Kleene's computable nonempty Π⁰₁ class without hyperarithmetical members. (From Section 3, after Theorem 3.5, with Corollary 3.4 of [@kiharamarconepauly2020].)" } }
- { type: separation, from: ts24, to: ts23, over: omega, provenance: ai, justification: { kind: reduction, by: ai, text: "Instance k=3 gives TS^2_4 does not imply STS^2_3 over ω-models; TS^2_3 trivially implies its stable restriction STS^2_3. (From Theorem 8.3.1 of [@patey2016c].)" } }
- { type: separation, from: ts24, to: ts23, over: c, provenance: ai, justification: { kind: reduction, by: ai, text: "Instance k=3, n=2 gives STS^2_3 ≰_c TS^2_4; STS^2_3 ≤_c TS^2_3 trivially. (From Corollary 8.3.4 of [@patey2016c].)" } }
- { type: separation, from: fs, to: srt22, over: rca0, provenance: ai, justification: { kind: restriction, by: ai, text: "Instance k=2; STS^2_2 = SRT^2_2. (From Corollary 8.5.2 of [@patey2016c].)" } }
