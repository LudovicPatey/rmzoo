# Landmark problems of the Weihrauch lattice.

- id: llpo
  label: '\mathsf{LLPO}'
  name: Lesser limited principle of omniscience
  kind: problem
  tags: [ weihrauch ]
  aliases: [ C_2, binary choice, LLPO ]
  definition: >
    Given $p \in 2^{\mathbb{N}}$ with at most one $1$, find $i \in \{0, 1\}$ such that $p(2n + i) = 0$ for all $n$. Equivalently (Weihrauch), choice from a nonempty co-c.e. subset of $\{0, 1\}$ ($\mathsf{C}_2$).
  instance: A sequence $p \in 2^{\mathbb{N}}$ with at most one $1$.
  solution: A parity $i$ such that $p$ is zero on all positions of parity $i$.
  refs:
    - { ref: brattkagherardi2011, role: rm }
    - ref: pauly2020
      role: survey

- id: lpo
  label: '\mathsf{LPO}'
  name: Limited principle of omniscience
  kind: problem
  tags: [ weihrauch ]
  aliases: [ LPO ]
  definition: Given $p \in 2^{\mathbb{N}}$, decide whether $p$ is the constant zero sequence.
  instance: A sequence $p \in 2^{\mathbb{N}}$.
  solution: $1$ if $p = 0^\omega$, and $0$ otherwise.
  refs:
    - { ref: brattkagherardi2011, role: rm }
    - ref: pauly2020
      role: survey

- id: cn
  label: '\mathsf{C}_{\mathbb{N}}'
  name: Closed choice on the natural numbers
  kind: problem
  tags: [ weihrauch ]
  aliases: [ C_N, choice on natural numbers, finite mind change ]
  definition: >
    Given an enumeration of the complement of a nonempty set $A \subseteq \mathbb{N}$, find an element of $A$. The problems Weihrauch below it are those computable with finitely many mind changes.
  instance: An enumeration of $\mathbb{N} \setminus A$ for some nonempty $A$.
  solution: An element of $A$.
  refs:
    - { ref: brattkagherardi2011b, role: rm }
    - { ref: brattkadebrechtpauly2012, role: rm }
    - ref: pauly2020
      role: survey

- id: lim
  label: '\lim'
  name: Limit operation
  kind: problem
  formulationOf: aca
  tags: [ weihrauch ]
  aliases: [ limit, lim, Turing jump problem ]
  definition: Given a convergent sequence $(p_n)$ in $\mathbb{N}^{\mathbb{N}}$, find its limit.
  instance: A convergent sequence $(p_n)_n$ in Baire space.
  solution: $\lim_n p_n$.
  refs:
    - { ref: brattkagherardipauly2021, role: survey }

- id: ivt
  label: '\mathsf{IVT}'
  name: Intermediate value theorem
  kind: problem
  tags: [ weihrauch, compactness ]
  aliases: [ intermediate value theorem, connected choice, 'CC_[0,1]' ]
  definition: >
    Every continuous $f : [0, 1] \to \mathbb{R}$ with $f(0) \cdot f(1) < 0$ has a zero. Weihrauch equivalent to connected choice on $[0, 1]$.
  instance: >
    A continuous $f : [0,1] \to \mathbb{R}$ with $f(0) \cdot f(1) < 0$.
  solution: A real $x \in [0,1]$ with $f(x) = 0$.
  refs:
    - { ref: brattkagherardi2011b, role: rm }

- id: bwt
  label: '\mathsf{BWT}_{\mathbb{R}}'
  name: Bolzano–Weierstrass theorem
  kind: problem
  tags: [ weihrauch, compactness ]
  aliases: [ Bolzano-Weierstrass, BWT ]
  definition: Every bounded sequence of real numbers has a cluster point.
  instance: A bounded sequence of reals.
  solution: A cluster point of the sequence.
  refs:
    - { ref: brattkagherardimarcone2012, role: rm }

- id: wkl-j
  op: jump
  args: [ wkl ]
  label: "\\mathsf{WKL}'"
  name: Jump of weak König's lemma
  kind: problem
  tags: [ weihrauch, compactness ]
  aliases: [ WKL jump ]
  definition: >
    The jump of $\mathsf{WKL}$: given a sequence converging to (a code of) an infinite binary tree, find a path through the limit tree.
  instance: A convergent sequence of codes for an infinite binary tree $T$.
  solution: An infinite path through $T$.
  refs:
    - { ref: brattkagherardimarcone2012, role: origin }

- id: wkl-jj
  op: jump
  args: [ wkl-j ]
  label: "\\mathsf{WKL}''"
  name: Double jump of weak König's lemma
  kind: problem
  tags: [ weihrauch, compactness ]
  definition: The jump of $\mathsf{WKL}'$.
  instance: A double limit of codes for an infinite binary tree $T$.
  solution: An infinite path through $T$.
  refs:
    - { ref: brattkarakotoniaina2017, role: rm }

- id: ds
  label: '\mathsf{DS}'
  name: Descending sequences in ill-founded orders
  kind: problem
  tags: [ weihrauch, orders ]
  definition: Every ill-founded linear order has an infinite descending sequence.
  instance: An ill-founded linear order.
  solution: An infinite descending sequence.
  refs:
    - { ref: gohpaulyvalenti2021, role: origin }

- id: bs
  label: '\mathsf{BS}'
  name: Bad sequences in non-wqos
  kind: problem
  tags: [ weihrauch, orders ]
  definition: Every quasi-order which is not a well-quasi-order has an infinite bad sequence.
  instance: A quasi-order which is not a wqo.
  solution: An infinite bad sequence.
  refs:
    - { ref: gohpaulyvalenti2021, role: origin }

- id: kn
  label: '\mathsf{K}_{\mathbb{N}}'
  name: Compact choice on the natural numbers
  kind: problem
  tags: [weihrauch]
  aliases: [K_N, 'C_2^*', finite parallelization of LLPO]
  definition: >
    Given a bound $b$ and an enumeration of the complement of a nonempty set
    $A \subseteq \{0, \dots, b\}$, find an element of $A$. Strongly Weihrauch
    equivalent to the finite parallelization $\mathsf{C}_2^*$ of LLPO.
  instance: A bound $b$ and an enumeration of the complement of a nonempty $A \subseteq \{0, \dots, b\}$.
  solution: An element of $A$.
  refs:
    - {ref: brattkagherardipauly2021, role: survey, loc: Proposition 7.20}

- id: cr
  caution: 'C_ℝ, sometimes written CR, is closed choice on the reals. In randomness papers CR abbreviates computable randomness ([[cran]]).'
  label: '\mathsf{C}_{\mathbb{R}}'
  name: Closed choice on the reals
  kind: problem
  tags: [weihrauch]
  aliases: [C_R, locally compact choice]
  definition: >
    Given (negative information about) a nonempty closed set $A \subseteq \mathbb{R}$,
    find a point of $A$. Equivalent to $\mathsf{C}_{2^{\mathbb{N}}} \times \mathsf{C}_{\mathbb{N}}$.
  instance: An enumeration of rational open intervals whose union is the complement of a nonempty closed $A \subseteq \mathbb{R}$.
  solution: A point of $A$.
  refs:
    - {ref: brattkadebrechtpauly2012, role: rm}

- id: ucnn
  label: '\mathsf{UC}_{\mathbb{N}^{\mathbb{N}}}'
  name: Unique closed choice on Baire space
  kind: problem
  tags: [weihrauch]
  aliases: [UC, UCNN, UC_Baire, unique choice]
  definition: Given a closed subset of $\mathbb{N}^{\mathbb{N}}$ with exactly one element, find that element.
  instance: A tree $T \subseteq \mathbb{N}^{<\mathbb{N}}$ with exactly one infinite path.
  solution: The infinite path of $T$.
  refs:
    - {ref: brattkadebrechtpauly2012, role: rm}

- id: cnn
  label: '\mathsf{C}_{\mathbb{N}^{\mathbb{N}}}'
  name: Closed choice on Baire space
  kind: problem
  tags: [weihrauch]
  aliases: [C_Baire, choice on Baire space]
  definition: >
    Given a nonempty closed subset of $\mathbb{N}^{\mathbb{N}}$, find an element.
    The single-valued problems below it are exactly the effectively Borel
    measurable functions; a candidate analogue of ATR in the Weihrauch lattice.
  instance: An ill-founded tree $T \subseteq \mathbb{N}^{<\mathbb{N}}$.
  solution: An infinite path through $T$.
  refs:
    - {ref: brattkadebrechtpauly2012, role: rm}
    - {ref: kiharamarconepauly2020, role: rm}

- id: ucn
  caution: '“Unique choice” without qualification usually means unique choice on Baire space ([[ucnn]]) in the Weihrauch literature.'
  label: '\mathsf{UC}_{\mathbb{N}}'
  name: Unique choice on the natural numbers
  kind: problem
  formulationOf: cn
  tags: [ weihrauch ]
  aliases: [ UCN ]
  definition: >
    Given an enumeration of the complement of a singleton $\{n\} \subseteq \mathbb{N}$,
    find $n$.
  instance: An enumeration of $\mathbb{N} \setminus \{n\}$.
  solution: The number $n$.
  refs: [ { ref: brattkadebrechtpauly2012, role: rm, loc: Proposition 6.2 } ]

- id: tcn
  label: '\mathsf{TC}_{\mathbb{N}}'
  name: Total continuation of choice on the natural numbers
  kind: problem
  tags: [ weihrauch ]
  aliases: [ TCN, totalization of closed choice ]
  definition: >
    Given an enumeration of a set $B \subseteq \mathbb{N}$, find an element of
    $\mathbb{N} \setminus B$ if this set is nonempty, and any natural number
    otherwise.
  instance: An enumeration of a set $B \subseteq \mathbb{N}$.
  solution: An element of $\mathbb{N} \setminus B$ if there is one, any number otherwise.
  refs: [ { ref: brattkagherardi2019, role: rm, loc: Corollary 8.3 } ]

- id: accn
  label: '\mathsf{ACC}_{\mathbb{N}}'
  name: All-or-co-unique choice on the natural numbers
  kind: problem
  tags: [ weihrauch ]
  aliases: [ ACCN ]
  definition: >
    Choice on $\mathbb{N}$ restricted to sets $A$ which are either $\mathbb{N}$ or
    $\mathbb{N} \setminus \{i\}$ for some $i$: given an enumeration of the
    complement of such an $A$, find an element of $A$.
  instance: >
    An enumeration of the complement of a set
    $A \in \{\mathbb{N}\} \cup \{\mathbb{N} \setminus \{i\} : i \in \mathbb{N}\}$.
  solution: An element of $A$.
  refs: [ { ref: brattka2021, role: rm, loc: Fact 5.8 } ]

- id: non
  label: '\mathsf{NON}'
  name: Non-computability problem
  kind: problem
  tags: [ weihrauch, computability ]
  aliases: [ NON, non-computability ]
  definition: >
    Given $p \in \mathbb{N}^\mathbb{N}$, find $q \in \mathbb{N}^\mathbb{N}$ which is not
    computable from $p$.
  instance: A sequence $p \in \mathbb{N}^\mathbb{N}$.
  solution: A sequence $q$ with $q \not\le_T p$.
  refs: [ { ref: brattka2021, role: rm, loc: "Section 1, (12)" } ]

- id: llpo.jump
  op: jump
  args: [ llpo ]
  tags: [ weihrauch ]
  aliases: [ BWT_2, BWT2, 'Bolzano-Weierstrass on {0,1}' ]
  refs: [ { ref: brattkagherardimarcone2012, role: rm, loc: Corollary 11.11 } ]

- id: dis
  label: '\mathsf{DIS}'
  name: Discontinuity problem
  kind: problem
  tags: [ weihrauch, computability ]
  aliases: [ DIS, discontinuity problem ]
  definition: >
    Given $p \in \mathbb{N}^\mathbb{N}$, find $q \in \mathbb{N}^\mathbb{N}$ different from
    $U(p)$, where $U$ is a fixed universal computable function.
  instance: A sequence $p \in \mathbb{N}^\mathbb{N}$.
  solution: A sequence $q \neq U(p)$.
  refs: [ { ref: brattka2021, role: rm, loc: "Section 1, (13)" } ]

- id: nrng
  label: '\mathsf{NRNG}'
  name: Range non-equality problem
  kind: problem
  minor: true
  tags: [ weihrauch, computability ]
  aliases: [ NRNG ]
  definition: >
    Given $p \in \mathbb{N}^\mathbb{N}$, find a set $A \in 2^\mathbb{N}$ with $A \neq \mathrm{range}(p - 1)$, the set of the
    numbers $n$ with $n + 1$ in the range of $p$.
  instance: 'A sequence $p \in \mathbb{N}^\mathbb{N}$.'
  solution: 'A set $A \neq \mathrm{range}(p - 1)$.'
  refs: [ { ref: brattka2021, role: origin, loc: Definition 5.11 } ]

- id: nmaj
  label: '\mathsf{NMAJ}'
  name: Non-majorization problem
  kind: problem
  minor: true
  tags: [ weihrauch, computability ]
  aliases: [ NMAJ ]
  definition: >
    Given $\langle i, p\rangle$, find $q \in \mathbb{N}^\mathbb{N}$ not majorized by $\varphi^p_i$: for some $n$, either
    $\varphi^p_i(n)$ is undefined or $\varphi^p_i(n) < q(n)$.
  instance: 'A pair $\langle i, p\rangle$ with $i \in \mathbb{N}$ and $p \in \mathbb{N}^\mathbb{N}$.'
  solution: 'A function $q$ with $\varphi^p_i(n) \not\geq q(n)$ for some $n$.'
  refs: [ { ref: brattka2021, role: origin, loc: "Definition 6.1(2)" } ]

- id: meet
  label: '\mathsf{MEET}'
  name: Meeting principle
  kind: problem
  minor: true
  tags: [ weihrauch, computability ]
  aliases: [ MEET ]
  definition: >
    Given $p \in \mathbb{N}^\mathbb{N}$, find $q \in \mathbb{N}^\mathbb{N}$ that meets every $p$-computable function: for every
    $r \leq_T p$ there is $n$ with $r(n) = q(n)$. Introduced by Hölzl, Raghavan, Stephan and Zhang in reverse mathematics.
  instance: 'A sequence $p \in \mathbb{N}^\mathbb{N}$.'
  solution: 'A function $q$ with $(\forall r \leq_T p)(\exists n)\, r(n) = q(n)$.'
  refs: [ { ref: brattka2021, role: rm, loc: "Definition 6.1(4)" } ]

- id: sort
  label: '\mathsf{SORT}'
  name: Binary sorting problem
  kind: problem
  tags: [ weihrauch ]
  aliases: [ SORT, sorting ]
  definition: >
    Given $p \in 2^\mathbb{N}$, output $0^k1^\omega$ if $p$ contains exactly $k$ zeros,
    and $0^\omega$ if $p$ contains infinitely many zeros.
  instance: A sequence $p \in 2^\mathbb{N}$.
  solution: The sorted sequence ($0^k1^\omega$ or $0^\omega$).
  refs: [ { ref: neumannpauly2018, role: rm }, { ref: brattkagherardi2018, role: rm, loc: Proposition 5.8 (5) } ]

- id: ec
  label: '\mathsf{EC}'
  name: Enumeration to characteristic function
  kind: problem
  tags: [ weihrauch ]
  aliases: [ EC ]
  definition: >
    Given an enumeration of a set $A \subseteq \mathbb{N}$, compute its characteristic
    function.
  instance: An enumeration $p$ of a set $A \subseteq \mathbb{N}$ ($A = \mathrm{range}(p-1)$).
  solution: The characteristic function of $A$.
  refs: [ { ref: brattka2021, role: rm, loc: "Section 1, (5)" }, { ref: brattkapauly2018, role: rm, loc: Section 6 } ]

- id: pcr
  label: '\mathsf{PC}_{\mathbb{R}}'
  name: Probabilistic choice on the reals
  kind: problem
  tags: [ weihrauch, randomness ]
  aliases: [ PCR, PC_R, probabilistic choice ]
  definition: >
    Given a closed set $A \subseteq \mathbb{R}$ of positive Lebesgue measure (by negative
    information), find a point of $A$.
  instance: A closed set $A \subseteq \mathbb{R}$ with $\mu(A) > 0$.
  solution: An element of $A$.
  refs: [ { ref: brattkagherardiholzl2015, role: rm, loc: Section 2 } ]

- id: tcnn
  label: '\mathsf{TC}_{\mathbb{N}^\mathbb{N}}'
  name: Total continuation of choice on Baire space
  kind: problem
  tags: [ weihrauch ]
  aliases: [ TCNN, TC_Baire ]
  definition: >
    Given a closed set $A \subseteq \mathbb{N}^\mathbb{N}$ (by negative information), find a
    point of $A$ if $A$ is nonempty, and any point otherwise.
  instance: A closed set $A \subseteq \mathbb{N}^\mathbb{N}$.
  solution: An element of $A$ if $A \neq \emptyset$, any point of $\mathbb{N}^\mathbb{N}$ otherwise.
  refs: [ { ref: brattkagherardi2019, role: rm } ]

# Probabilistic choice and related problems (Brattka, Gherardi and Hölzl 2015), 2026-11-04.
- id: auc
  label: '\mathsf{AUC}_{[0,1]}'
  name: All-or-unique choice on [0,1]
  kind: problem
  tags: [ weihrauch, analysis ]
  aliases: [ RDIV, robust division ]
  definition: >
    Closed choice on $[0,1]$ restricted to the whole interval and singletons. Strongly Weihrauch
    equivalent to robust division $\mathsf{RDIV}$, $(x, y) \mapsto x / \max(x, y)$ if $y \neq 0$, any point of $[0,1]$ otherwise (Pauly).
  instance: A closed set $A \subseteq [0,1]$ (by negative information) which is $[0,1]$ or a singleton.
  solution: A point of $A$.
  refs:
    - { ref: brattkagherardiholzl2015, role: rm, loc: "Definition 16.1, Proposition 16.2" }

- id: pcc
  label: '\mathsf{PCC}_{[0,1]}'
  name: Positive connected choice on [0,1]
  kind: problem
  tags: [ weihrauch, analysis, randomness ]
  definition: >
    Closed choice on $[0,1]$ restricted to connected sets of positive measure, that is, to proper closed intervals.
  instance: A proper closed interval $I \subseteq [0,1]$ (by negative information).
  solution: A point of $I$.
  refs:
    - { ref: brattkagherardiholzl2015, role: rm, loc: "Section 10, before Lemma 10.7" }

- id: nash
  label: '\mathsf{NASH}'
  name: Nash equilibria of bimatrix games
  kind: problem
  tags: [ weihrauch, analysis ]
  definition: Given a finite bimatrix game with real payoffs, find a Nash equilibrium.
  instance: Two real $m \times n$ payoff matrices $A, B$.
  solution: A Nash equilibrium $(x, y)$ of the game $(A, B)$.
  refs:
    - { ref: brattkagherardiholzl2015, role: rm, loc: Section 17 }

- id: ldl
  label: '\textsf{Lebesgue density lemma}'
  name: Lebesgue density lemma
  kind: problem
  minor: true
  tags: [ weihrauch, randomness ]
  definition: >
    Given a closed $A \subseteq 2^\mathbb{N}$ of positive measure and $k$, find a word $w$ with
    $\mu(A \cap w2^\mathbb{N}) / 2^{-|w|} \geq 1 - 2^{-k}$.
  instance: A closed set $A \subseteq 2^\mathbb{N}$ of positive measure and a number $k$.
  solution: A word $w$ with $\mu(A \cap w2^\mathbb{N}) \geq (1 - 2^{-k}) 2^{-|w|}$.
  refs:
    - { ref: brattkagherardiholzl2015, role: rm, loc: "Lemma 11.1, Theorem 11.2" }

# Quantitative versions of WWKL (Brattka, Gherardi, Hölzl 2015, Sections 8 and 10).
# ε-WWKL is a family indexed by ε ∈ [0,1], strictly decreasing in ε (Corollary 10.2);
# only ε = 1/2 is entered.
- id: wwkl-half
  label: '\tfrac{1}{2}\text{-}\mathsf{WWKL}'
  name: Weak weak König's lemma with measure above 1/2
  kind: problem
  minor: true
  tags: [ weihrauch, randomness ]
  aliases: [ 1/2-WWKL ]
  definition: >
    $\mathsf{WWKL}$ restricted to binary trees $T$ with $\mu([T]) > 1/2$ (an instance of $\varepsilon$-$\mathsf{WWKL}$;
    these problems get strictly weaker as $\varepsilon$ grows).
  instance: 'A binary tree $T$ with $\mu([T]) > 1/2$.'
  solution: An infinite path through $T$.
  refs: [ { ref: brattkagherardiholzl2015, role: origin, loc: Definition 8.7 } ]

- id: wwkl-star
  label: '{*}\text{-}\mathsf{WWKL}'
  name: Star weak weak König's lemma
  kind: problem
  tags: [ weihrauch, randomness ]
  aliases: [ "*-WWKL" ]
  definition: >
    Given $n$ and a binary tree $T$ with $\mu([T]) > 2^{-n}$, find an infinite path through $T$ (the uniform version
    of “$2^{-n}$-$\mathsf{WWKL}$ for every $n$”).
  instance: 'A number $n$ and a binary tree $T$ with $\mu([T]) > 2^{-n}$.'
  solution: An infinite path through $T$.
  refs: [ { ref: brattkagherardiholzl2015, role: origin, loc: Definition 10.4 } ]

- id: wwkl-lstar
  label: '(1-{*})\text{-}\mathsf{WWKL}'
  name: Lower star weak weak König's lemma
  kind: problem
  minor: true
  tags: [ weihrauch, randomness ]
  aliases: [ "(1-*)-WWKL" ]
  definition: >
    Given a sequence of binary trees $(T_n)_n$ with $\mu([T_n]) > 1 - 2^{-n}$ for every $n$, find some $n$ and an
    infinite path through $T_n$.
  instance: 'A sequence $(T_n)_n$ of binary trees with $\mu([T_n]) > 1 - 2^{-n}$.'
  solution: 'A pair $(n, p)$ with $p \in [T_n]$.'
  refs: [ { ref: brattkagherardiholzl2015, role: origin, loc: Definition 10.5 } ]

# Hyperarithmetic-level problems (Kihara, Marcone, Pauly 2020; Marcone, Valenti 2021).
- id: chipi11
  label: '\chi_{\Pi^1_1}'
  name: Characteristic function of a Π¹₁-complete set
  kind: problem
  tags: [ weihrauch ]
  aliases: [ χΠ11, chi_Pi11, WF ]
  definition: >
    Given a tree $T \subseteq \mathbb{N}^{<\mathbb{N}}$, decide whether $T$ is well-founded. A single-valued
    function which is not effectively Borel measurable, hence not Weihrauch reducible to $\mathsf{C}_{\mathbb{N}^{\mathbb{N}}}$.
  instance: A tree $T \subseteq \mathbb{N}^{<\mathbb{N}}$.
  solution: 1 if $T$ is well-founded, 0 otherwise.
  refs:
    - { ref: kiharamarconepauly2020, role: rm, loc: "Section 7, before Observation 7.4" }
    - { ref: marconevalenti2020, role: rm, loc: Section 2.2 }

- id: nha
  label: '\mathsf{NHA}'
  name: Non-hyperarithmeticity problem
  kind: problem
  minor: true
  tags: [ weihrauch ]
  definition: Given $p \in \mathbb{N}^{\mathbb{N}}$, find some $q$ that is not hyperarithmetical relative to $p$.
  instance: 'A point $p \in \mathbb{N}^{\mathbb{N}}$.'
  solution: 'A point $q$ not hyperarithmetical in $p$.'
  refs: [ { ref: kiharamarconepauly2020, role: origin, loc: "Section 3, before Corollary 3.6" } ]

- id: stcnn
  label: '\mathsf{sTC}_{\mathbb{N}^\mathbb{N}}'
  name: Strong total continuation of choice on Baire space
  kind: problem
  minor: true
  tags: [ weihrauch ]
  aliases: [ sTCNN ]
  definition: >
    Given a tree $T \subseteq \mathbb{N}^{<\mathbb{N}}$, output a bit $b$ telling whether $T$ is ill-founded and, if it is,
    an infinite path through $T$.
  instance: A tree $T \subseteq \mathbb{N}^{<\mathbb{N}}$.
  solution: '$(0, x)$ for any $x$ if $[T] = \emptyset$; $(1, x)$ with $x \in [T]$ otherwise.'
  refs: [ { ref: marconevalenti2020, role: origin, loc: Definition 4.17 } ]

- id: sigma01-rt
  label: '\Sigma^0_1\text{-}\mathsf{RT}'
  name: Open Ramsey theorem
  kind: problem
  tags: [ weihrauch, ramsey ]
  aliases: [ Σ01-RT, open Ramsey theorem ]
  definition: >
    Given an open set $P \subseteq [\mathbb{N}]^{\mathbb{N}}$, find a homogeneous solution: an infinite set $H$ whose
    infinite subsets are all in $P$ or all outside $P$. The problem form of the open Ramsey theorem (equivalent to $\mathsf{ATR}_0$).
  instance: 'An open set $P \subseteq [\mathbb{N}]^{\mathbb{N}}$.'
  solution: 'An infinite $H$ with $[H]^{\mathbb{N}} \subseteq P$ or $[H]^{\mathbb{N}} \cap P = \emptyset$.'
  refs: [ { ref: marconevalenti2020, role: origin, loc: Definition 4.1 }, { ref: simpson2009, role: rm, loc: "Theorem V.9.7" } ]

- id: findhs-sigma01
  label: '\mathsf{FindHS}_{\Sigma^0_1}'
  name: Strong open Ramsey theorem (open side)
  kind: problem
  tags: [ weihrauch, ramsey ]
  aliases: [ FindHSΣ01 ]
  definition: >
    Given an open set $P \subseteq [\mathbb{N}]^{\mathbb{N}}$ with a homogeneous solution landing in $P$, find such a solution.
  instance: 'An open set $P$ having some $H$ with $[H]^{\mathbb{N}} \subseteq P$.'
  solution: 'An infinite $H$ with $[H]^{\mathbb{N}} \subseteq P$.'
  refs: [ { ref: marconevalenti2020, role: origin, loc: Definition 4.1 } ]

- id: findhs-pi01
  label: '\mathsf{FindHS}_{\Pi^0_1}'
  name: Strong open Ramsey theorem (closed side)
  kind: problem
  minor: true
  tags: [ weihrauch, ramsey ]
  aliases: [ FindHSΠ01 ]
  definition: >
    Given an open set $P \subseteq [\mathbb{N}]^{\mathbb{N}}$ with a homogeneous solution avoiding $P$, find such a solution.
  instance: 'An open set $P$ having some $H$ with $[H]^{\mathbb{N}} \cap P = \emptyset$.'
  solution: 'An infinite $H$ with $[H]^{\mathbb{N}} \cap P = \emptyset$.'
  refs: [ { ref: marconevalenti2020, role: origin, loc: Definition 4.1 } ]

- id: wfindhs-sigma01
  label: '\mathsf{wFindHS}_{\Sigma^0_1}'
  name: Weak open Ramsey theorem (open side)
  kind: problem
  minor: true
  tags: [ weihrauch, ramsey ]
  aliases: [ wFindHSΣ01 ]
  definition: >
    $\mathsf{FindHS}_{\Sigma^0_1}$ restricted to open sets $P$ all of whose homogeneous solutions land in $P$.
  instance: 'An open set $P$ such that every homogeneous solution $H$ has $[H]^{\mathbb{N}} \subseteq P$.'
  solution: 'A homogeneous solution of $P$.'
  refs: [ { ref: marconevalenti2020, role: origin, loc: Definition 4.1 } ]

- id: wfindhs-pi01
  label: '\mathsf{wFindHS}_{\Pi^0_1}'
  name: Weak open Ramsey theorem (closed side)
  kind: problem
  tags: [ weihrauch, ramsey ]
  aliases: [ wFindHSΠ01 ]
  definition: >
    $\mathsf{FindHS}_{\Pi^0_1}$ restricted to open sets $P$ with no homogeneous solution landing in $P$. It lies strictly
    above $\mathsf{UC}_{\mathbb{N}^{\mathbb{N}}}$, below $\mathsf{C}_{\mathbb{N}^{\mathbb{N}}}$, and not below $\mathsf{ATR}_2$.
  instance: 'An open set $P$ such that every homogeneous solution $H$ has $[H]^{\mathbb{N}} \cap P = \emptyset$.'
  solution: 'A homogeneous solution of $P$.'
  refs: [ { ref: marconevalenti2020, role: origin, loc: Definition 4.1 } ]

- id: delta01-rt
  label: '\Delta^0_1\text{-}\mathsf{RT}'
  name: Clopen Ramsey theorem
  kind: problem
  minor: true
  tags: [ weihrauch, ramsey ]
  aliases: [ Δ01-RT, clopen Ramsey theorem ]
  definition: >
    Given a clopen set $D \subseteq [\mathbb{N}]^{\mathbb{N}}$ (by names of it and its complement), find a homogeneous solution.
  instance: 'A clopen set $D \subseteq [\mathbb{N}]^{\mathbb{N}}$.'
  solution: 'An infinite $H$ with $[H]^{\mathbb{N}} \subseteq D$ or $[H]^{\mathbb{N}} \cap D = \emptyset$.'
  refs: [ { ref: marconevalenti2020, role: origin, loc: Definition 4.2 }, { ref: simpson2009, role: rm, loc: "Theorem V.9.7" } ]

- id: findhs-delta01
  label: '\mathsf{FindHS}_{\Delta^0_1}'
  name: Strong clopen Ramsey theorem
  kind: problem
  minor: true
  tags: [ weihrauch, ramsey ]
  aliases: [ FindHSΔ01 ]
  definition: Given a clopen set $D$ with a homogeneous solution landing in $D$, find such a solution.
  instance: 'A clopen set $D$ having some $H$ with $[H]^{\mathbb{N}} \subseteq D$.'
  solution: 'An infinite $H$ with $[H]^{\mathbb{N}} \subseteq D$.'
  refs: [ { ref: marconevalenti2020, role: origin, loc: Definition 4.2 } ]

- id: wfindhs-delta01
  label: '\mathsf{wFindHS}_{\Delta^0_1}'
  name: Weak clopen Ramsey theorem
  kind: problem
  minor: true
  tags: [ weihrauch, ramsey ]
  aliases: [ wFindHSΔ01 ]
  definition: $\mathsf{FindHS}_{\Delta^0_1}$ restricted to clopen sets $D$ all of whose homogeneous solutions land in $D$.
  instance: 'A clopen set $D$ such that every homogeneous solution $H$ has $[H]^{\mathbb{N}} \subseteq D$.'
  solution: 'A homogeneous solution of $D$.'
  refs: [ { ref: marconevalenti2020, role: origin, loc: Definition 4.2 } ]

- id: sigma11-wkl
  label: '\Sigma^1_1\text{-}\mathsf{WKL}'
  name: Σ¹₁ weak König's lemma
  kind: problem
  tags: [ weihrauch, compactness ]
  aliases: [ Σ11-WKL ]
  definition: >
    Given a $\Sigma^1_1$ code of an infinite binary tree $T \subseteq 2^{<\omega}$, find an infinite path through $T$.
    Weihrauch equivalent to $\Pi^1_1$ separation, to $\Pi^1_1\text{-}\mathsf{DNC}_2$ and to the parallelization of
    $\Sigma^1_1$ choice on $\{0,1\}$; strictly between $\mathsf{UC}_{\mathbb{N}^\mathbb{N}}$ and $\mathsf{C}_{\mathbb{N}^\mathbb{N}}$.
  instance: A $\Sigma^1_1$ code of an infinite binary tree $T$.
  solution: An infinite path through $T$.
  refs: [ { ref: kiharamarconepauly2020, role: origin, loc: "Definition 4.2, Theorem 4.3" } ]

- id: pi11-sep-w
  caution: 'As Weihrauch problems, Σ¹₁-Sep (≡ UC_ℕℕ, Theorem 3.11 of [@kiharamarconepauly2020]) lies strictly below Π¹₁-Sep, while as sentences Σ¹₁ separation ([[sigma11-sep]]) is equivalent to ATR₀ and Π¹₁ separation is strictly weaker than ATR₀.'
  label: '\Pi^1_1\text{-}\mathsf{Sep}'
  name: Π¹₁ separation (Weihrauch problem)
  kind: problem
  minor: true
  tags: [ weihrauch ]
  aliases: [ Π11-Sep ]
  definition: Given $\Pi^1_1$ codes of disjoint sets $A, B \subseteq \mathbb{N}$, find a set $C$ with $A \subseteq C$ and $B \cap C = \emptyset$.
  instance: 'Two disjoint $\Pi^1_1$ sets $A, B \subseteq \mathbb{N}$, given by codes.'
  solution: A set separating $A$ from $B$.
  refs: [ { ref: kiharamarconepauly2020, role: origin, loc: Definition 4.1 } ]

- id: sigma11-cn
  label: '\Sigma^1_1\text{-}\mathsf{C}_{\mathbb{N}}'
  name: Σ¹₁ choice on the natural numbers
  kind: problem
  tags: [ weihrauch ]
  aliases: [ Σ11-CN ]
  definition: >
    Given a $\Sigma^1_1$ code of a nonempty set $A \subseteq \mathbb{N}$, find an element of $A$. Weihrauch equivalent to the
    first-order part of $\mathsf{C}_{\mathbb{N}^\mathbb{N}}$.
  instance: A $\Sigma^1_1$ code of a nonempty $A \subseteq \mathbb{N}$.
  solution: An element of $A$.
  refs:
    - { ref: kiharamarconepauly2020, role: origin, loc: "Section 3, after Definition 3.1" }
    - { ref: gohpaulyvalenti2021, role: rm, loc: Proposition 2.4 }

- id: sigma11-wwkl
  label: '\Sigma^1_1\text{-}\mathsf{WWKL}'
  name: Σ¹₁ weak weak König's lemma
  kind: problem
  minor: true
  tags: [ weihrauch, randomness ]
  aliases: [ Σ11-WWKL ]
  definition: Given a $\Sigma^1_1$ code of a binary tree $T$ with $\mu([T]) > 0$, find an infinite path through $T$.
  instance: A $\Sigma^1_1$ code of a binary tree $T$ with $\mu([T]) > 0$.
  solution: An infinite path through $T$.
  refs: [ { ref: kiharamarconepauly2020, role: origin, loc: "Section 4.2, before Theorem 4.9" } ]

- id: perfect1
  caution: 'PTT₁ is a perfect tree theorem; PTT with a superscript, as in PTT², is the polarized tree theorem ([[ptt2]]).'
  label: '\mathsf{PTT}_1'
  name: One-sided perfect tree theorem
  kind: problem
  minor: true
  tags: [ weihrauch ]
  aliases: [ PTT1 ]
  definition: Given a tree $T \subseteq \mathbb{N}^{<\mathbb{N}}$ with uncountably many paths, find a perfect subtree of $T$.
  instance: A tree $T \subseteq \mathbb{N}^{<\mathbb{N}}$ with $[T]$ uncountable.
  solution: A perfect subtree of $T$.
  refs: [ { ref: kiharamarconepauly2020, role: origin, loc: Definition 6.2 } ]

- id: list-baire
  label: '\mathsf{List}'
  name: Listing countable closed subsets of Baire space
  kind: problem
  minor: true
  tags: [ weihrauch ]
  aliases: [ wList ]
  definition: >
    Given a countable closed set $A \subseteq \mathbb{N}^\mathbb{N}$, enumerate its elements, together with its cardinality
    (the weak version $\mathsf{wList}$, without the cardinality, is equivalent).
  instance: A countable closed set $A \subseteq \mathbb{N}^\mathbb{N}$.
  solution: 'A pair $n\langle p_0, p_1, \dots \rangle$: if $n = 0$ the $p_i$ are distinct and $A = \{p_i : i \in \mathbb{N}\}$, otherwise $|A| = n - 1$ and $A = \{p_i : i < n - 1\}$.'
  refs: [ { ref: kiharamarconepauly2020, role: origin, loc: Definition 6.1 } ]

- id: findws-sigma
  label: '\mathsf{FindWS}_\Sigma'
  name: Winning strategies for the open player
  kind: problem
  minor: true
  tags: [ weihrauch, determinacy ]
  aliases: [ FindWSΣ ]
  definition: Given an open game on $\mathbb{N}^\mathbb{N}$ in which Player 2 has no winning strategy, find a winning strategy for Player 1 (the open player).
  instance: 'An open set $W \subseteq \mathbb{N}^\mathbb{N}$ (the winning condition of Player 1) such that Player 2 has no winning strategy.'
  solution: A winning strategy for Player 1.
  refs: [ { ref: kiharamarconepauly2020, role: origin, loc: Definition 6.18 } ]

- id: findws-pi
  label: '\mathsf{FindWS}_\Pi'
  name: Winning strategies for the closed player
  kind: problem
  minor: true
  tags: [ weihrauch, determinacy ]
  aliases: [ FindWSΠ ]
  definition: Given an open game on $\mathbb{N}^\mathbb{N}$ in which Player 1 has no winning strategy, find a winning strategy for Player 2 (the closed player).
  instance: 'An open set $W \subseteq \mathbb{N}^\mathbb{N}$ such that Player 1 has no winning strategy.'
  solution: A winning strategy for Player 2.
  refs: [ { ref: kiharamarconepauly2020, role: origin, loc: Definition 6.18 } ]

- id: det-sigma
  label: '\mathsf{Det}_\Sigma'
  name: Open determinacy (Nash equilibria of open games)
  kind: problem
  tags: [ weihrauch, determinacy ]
  aliases: [ DetΣ ]
  definition: >
    Given an open game on $\mathbb{N}^\mathbb{N}$, find a pair of strategies $(\sigma, \tau)$ such that either $\sigma$ is winning
    for Player 1 or $\tau$ is winning for Player 2, without being told which player wins.
  instance: 'An open set $W \subseteq \mathbb{N}^\mathbb{N}$, the winning condition of Player 1.'
  solution: 'A pair of strategies $(\sigma, \tau)$, one of which is winning.'
  refs: [ { ref: kiharamarconepauly2020, role: origin, loc: Definition 7.3 } ]

- id: perfect2
  caution: 'PTT₂ is a perfect tree theorem; PTT²₂ (superscript 2) is the polarized tree theorem for pairs and two colors ([[ptt22]]).'
  label: '\mathsf{PTT}_2'
  name: Two-sided perfect tree theorem
  kind: problem
  tags: [ weihrauch ]
  definition: >
    Given a tree $T \subseteq \mathbb{N}^{<\mathbb{N}}$, find either a perfect subtree of $T$ or a listing of $[T]$ together
    with its cardinality.
  instance: A tree $T \subseteq \mathbb{N}^{<\mathbb{N}}$.
  solution: 'A pair $(T'', n\langle p_0, p_1, \dots \rangle)$ such that $T''$ is a perfect subtree of $T$, or the second component lists $[T]$ as in $\mathsf{List}$.'
  refs: [ { ref: kiharamarconepauly2020, role: origin, loc: Definition 7.2 } ]

- id: wperfect2
  label: '\mathsf{wPTT}_2'
  name: Weak two-sided perfect tree theorem
  kind: problem
  minor: true
  tags: [ weihrauch ]
  definition: Like $\mathsf{PTT}_2$, with a listing of $[T]$ that carries no information on its cardinality.
  instance: A tree $T \subseteq \mathbb{N}^{<\mathbb{N}}$.
  solution: 'A pair $(T'', \langle b_0 p_0, b_1 p_1, \dots \rangle)$ such that $T''$ is a perfect subtree of $T$ or $[T] = \{p_i : b_i \neq 0\}$.'
  refs: [ { ref: kiharamarconepauly2020, role: origin, loc: Definition 7.1 } ]

# Descending sequences, Π¹₁ bounds and two-sided ATR (Goh, Pauly, Valenti 2021; Goh 2019).
- id: rt1n
  caution: 'For Weihrauch reducibility it matters whether the number of colors is part of the instance. Here RT¹_ℕ receives only the coloring, as in Goh, Pauly and Valenti [@gohpaulyvalenti2021], while RT¹_{<∞} ([[rt1inf]]) also receives the bound k. Check which convention a paper uses.'
  label: '\mathsf{RT}^1_{\mathbb{N}}'
  name: Pigeonhole principle without a bound on the colors
  kind: problem
  tags: [ weihrauch, ramsey ]
  aliases: [ RT1N ]
  definition: >
    Given a coloring $c : \mathbb{N} \to k$ for some $k$ which is not given, find an infinite homogeneous set.
  instance: 'A coloring $c : \mathbb{N} \to k$ for some $k$ (without $k$).'
  solution: An infinite set on which $c$ is constant.
  refs: [ { ref: gohpaulyvalenti2021, role: rm, loc: Definition 4.23 } ]

- id: pi11bound
  label: '\Pi^1_1\text{-}\mathsf{Bound}'
  name: Bound for finite Π¹₁ sets
  kind: problem
  tags: [ weihrauch ]
  aliases: [ Π11-Bound, Σ11-Ccof_N ]
  definition: >
    Given a finite $\Pi^1_1$ subset of $\mathbb{N}$, find an upper bound for it. Strongly Weihrauch equivalent to
    $\Sigma^1_1$ choice on $\mathbb{N}$ for cofinite sets, and Weihrauch equivalent to the first-order part of $\mathsf{DS}$.
  instance: 'A finite $\Pi^1_1$ set $A \subseteq \mathbb{N}$.'
  solution: 'A number $n$ with $m \notin A$ for every $m \geq n$.'
  refs: [ { ref: gohpaulyvalenti2021, role: origin, loc: "Definition 4.7, Theorem 4.10" } ]

- id: sigma11-ds
  label: '\Sigma^1_1\text{-}\mathsf{DS}'
  name: Descending sequences in Σ¹₁ linear orders
  kind: problem
  tags: [ weihrauch, orders ]
  aliases: [ Σ11-DS ]
  definition: '$\mathsf{DS}$ for ill-founded linear orders given by a $\Sigma^1_1$ code.'
  instance: An ill-founded linear order given by a $\Sigma^1_1$ code.
  solution: An infinite descending sequence.
  refs: [ { ref: gohpaulyvalenti2021, role: origin, loc: Definition 5.1 } ]

- id: sigma11-bs
  label: '\Sigma^1_1\text{-}\mathsf{BS}'
  name: Bad sequences in Σ¹₁ quasi-orders
  kind: problem
  minor: true
  tags: [ weihrauch, orders ]
  aliases: [ Σ11-BS ]
  definition: '$\mathsf{BS}$ for non-well quasi-orders given by a $\Sigma^1_1$ code.'
  instance: A quasi-order which is not a well quasi-order, given by a $\Sigma^1_1$ code.
  solution: An infinite bad sequence.
  refs: [ { ref: gohpaulyvalenti2021, role: origin, loc: Definition 5.1 } ]

- id: atr2
  label: '\mathsf{ATR}_2'
  name: Two-sided arithmetical transfinite recursion
  kind: problem
  tags: [ weihrauch ]
  definition: >
    Given a linear order $L$ and a set $A$, produce either an infinite $<_L$-descending sequence or a jump hierarchy
    on $L$ starting with $A$, indicating which. Strictly between $\mathsf{UC}_{\mathbb{N}^\mathbb{N}}$ and $\mathsf{C}_{\mathbb{N}^\mathbb{N}}$.
  instance: A linear order $L$ and a set $A \subseteq \mathbb{N}$.
  solution: 'An infinite descending sequence in $L$, or a jump hierarchy $\langle X_a \rangle_{a \in L}$ with $X_0 = A$.'
  refs: [ { ref: goh2019b, role: origin, loc: Definition 3.2 } ]

- id: cwo2
  label: '\mathsf{CWO}_2'
  name: Two-sided comparability of well-orderings
  kind: problem
  minor: true
  tags: [ weihrauch, well-orders ]
  definition: >
    Given linear orders $L$ and $M$, produce an embedding of one onto an initial segment of the other, or an infinite
    descending sequence in one of them, indicating which.
  instance: Two linear orders $L$ and $M$.
  solution: An embedding of one onto an initial segment of the other, or a descending sequence in one of them.
  refs: [ { ref: goh2019b, role: origin, loc: Definition 3.1 } ]

- id: wcwo2
  label: '\mathsf{WCWO}_2'
  name: Two-sided weak comparability of well-orderings
  kind: problem
  minor: true
  tags: [ weihrauch, well-orders ]
  definition: >
    Given linear orders $L$ and $M$, produce an embedding of one into the other, or an infinite descending sequence in
    one of them, indicating which.
  instance: Two linear orders $L$ and $M$.
  solution: An embedding of one into the other, or a descending sequence in one of them.
  refs: [ { ref: goh2019b, role: origin, loc: Definition 3.1 } ]

- id: kdt
  label: '\mathsf{KDT}'
  name: König's duality theorem (Weihrauch problem)
  kind: problem
  tags: [ weihrauch, graphs ]
  definition: >
    Given a countable bipartite graph, produce a König cover $(C, M)$: a vertex cover $C$ and a matching $M$ such that
    $C$ consists of exactly one vertex from each edge of $M$. The problem form of the Podewski–Steffens theorem.
  instance: A countable bipartite graph $G$.
  solution: A König cover of $G$.
  refs: [ { ref: goh2019b, role: origin, loc: Definition 3.16 } ]

# Uniform content of computability theory (Brattka, Hendtlass, Kreuzer 2017).
- id: lbt
  label: '\mathsf{LBT}'
  name: Low basis theorem (Weihrauch problem)
  kind: problem
  tags: [ weihrauch, compactness ]
  definition: >
    Given an infinite binary tree $T$, find a path $p \in [T]$ with $p' \leq_T T'$. Strictly above $\mathsf{WKL}$ and
    Weihrauch incomparable with $\mathsf{C}_\mathbb{R}$.
  instance: An infinite binary tree $T$.
  solution: 'A path $p \in [T]$ with $p'' \leq_T T''$.'
  refs: [ { ref: brattkahendtlasskreuzer2017, role: origin, loc: Definition 8.1 } ]

- id: wgen1
  label: '1\text{-}\mathsf{WGEN}'
  name: Weak 1-genericity problem
  kind: problem
  minor: true
  tags: [ weihrauch, computability ]
  aliases: [ 1-WGEN ]
  definition: Given $q \in 2^\mathbb{N}$, find some $p$ weakly 1-generic relative to $q$.
  instance: 'A point $q \in 2^\mathbb{N}$.'
  solution: 'A point $p$ weakly 1-generic in $q$.'
  refs: [ { ref: brattkahendtlasskreuzer2017, role: origin, loc: Definition 9.2 } ]

- id: kpt
  label: '\mathsf{KPT}'
  name: Kleene–Post theorem (Weihrauch problem)
  kind: problem
  tags: [ weihrauch, computability ]
  definition: Given $r$, find a pair $\langle p, q \rangle \geq_T r$ with $p$ and $q$ Turing incomparable.
  instance: 'A point $r \in \mathbb{N}^\mathbb{N}$.'
  solution: 'A pair $\langle p, q \rangle$ with $r \leq_T \langle p, q \rangle$ and $p \mid_T q$.'
  refs: [ { ref: brattkahendtlasskreuzer2017, role: origin, loc: Definition 10.2 } ]

- id: dnc3
  label: '\mathsf{DNC}_3'
  name: Diagonally non-computable functions with 3 values
  kind: problem
  minor: true
  tags: [ weihrauch, computability ]
  aliases: [ DNC3 ]
  definition: >
    Given $p$, find $q \in 3^\mathbb{N}$ with $q(n) \neq \varphi^p_n(n)$ for every $n$. Strongly Weihrauch equivalent to the
    parallelization of $\mathsf{ACC}_3$; strictly between $\mathsf{DNC}_\mathbb{N}$ and $\mathsf{DNC}_2 \equiv_{\mathrm{sW}} \mathsf{WKL}$.
  instance: 'A point $p \in \mathbb{N}^\mathbb{N}$.'
  solution: 'A function $q \in 3^\mathbb{N}$ with $q(n) \neq \varphi^p_n(n)$ for all $n$.'
  refs: [ { ref: brattkahendtlasskreuzer2017, role: origin, loc: "Definition 5.1, Theorem 5.2" } ]

- id: coh-plus
  label: '\mathsf{COH}^+'
  name: Cohesiveness for enumerated sequences
  kind: problem
  minor: true
  tags: [ weihrauch, cohesive ]
  aliases: [ COH+ ]
  definition: $\mathsf{COH}$ with the sets $R_i$ given by enumerations (positive information) instead of characteristic functions.
  instance: A sequence of enumerations of sets $R_0, R_1, \dots \subseteq \mathbb{N}$.
  solution: A set cohesive for $(R_i)_i$.
  refs: [ { ref: brattkahendtlasskreuzer2017, role: origin, loc: Definition 12.2 } ]

- id: wbwt
  label: '\mathsf{WBWT}_\mathbb{R}'
  name: Weak Bolzano–Weierstrass theorem
  kind: problem
  minor: true
  tags: [ weihrauch, analysis ]
  aliases: [ WBWT ]
  definition: >
    Given a bounded sequence of reals, find a sequence converging to a Cauchy name of one of its cluster points
    ($\mathsf{BWT}_\mathbb{R}$ with the jump of the Cauchy representation on the output).
  instance: A bounded sequence $(x_n)_n$ of reals.
  solution: A sequence converging to a name of a cluster point of $(x_n)_n$.
  refs: [ { ref: brattkahendtlasskreuzer2017, role: origin, loc: Definition 14.3 } ]

- id: sbwt
  label: '\mathsf{SBWT}_\mathbb{R}'
  name: Subsequential Bolzano–Weierstrass theorem
  kind: problem
  minor: true
  tags: [ weihrauch, analysis ]
  aliases: [ SBWT ]
  definition: Given a bounded sequence $(x_i)_i$ of reals, find a strictly increasing $s$ such that $(x_{s(n)})_n$ converges.
  instance: A bounded sequence $(x_i)_i$ of reals.
  solution: 'A strictly increasing $s \in \mathbb{N}^\mathbb{N}$ with $(x_{s(n)})_n$ convergent.'
  refs: [ { ref: brattkahendtlasskreuzer2017, role: origin, loc: Definition 14.5 } ]

# PAC learning (Brattka, Chirache 2026).
- id: dnc-star
  label: '\mathsf{DNC}^*'
  name: Finitary DNC problem
  kind: problem
  tags: [ weihrauch, computability ]
  aliases: [ DNC* ]
  definition: >
    Given, for every $k \geq 2$, an instance of $\widehat{\mathsf{ACC}_k}$ (that is, of $\mathsf{DNC}_k$), find some $k$ and a solution of
    the $k$-th instance. Strictly above both $\mathsf{PA}$ and $\mathsf{DNC}_\mathbb{N}$.
  instance: 'Sequences $(A_{n,k})_{n}$ for $k \geq 2$, with $A_{n,k} \subseteq k$ and $|k \setminus A_{n,k}| \leq 1$, given by negative information.'
  solution: 'A pair $\langle k, p \rangle$ with $p(n) \in A_{n,k}$ for every $n$.'
  refs: [ { ref: brattkachirache2026, role: origin, loc: Definition 21 } ]

- id: ipac-plus
  label: '\mathsf{IPAC}^+'
  name: Improper PAC learning from positive information
  kind: problem
  tags: [ weihrauch ]
  definition: >
    Given a nonempty closed concept class $C \subseteq 2^\mathbb{N}$ by positive information and a bound $d$ on its VC dimension,
    find a learner (with arbitrary hypotheses) and a sample complexity with which it PAC learns $C$. Strongly Weihrauch
    equivalent to finding a witness function for $C$.
  instance: 'A closed class $C \subseteq 2^\mathbb{N}$, $C \neq \emptyset$, given by positive information, and $d \geq \mathrm{VCdim}(C)$.'
  solution: A learner $A$ and a sample complexity $m$ with which $A$ improperly PAC learns $C$.
  refs: [ { ref: brattkachirache2026, role: origin, loc: "Definition 4(3), Corollary 57" } ]

- id: rpac
  label: '\mathsf{RPAC}'
  name: Relative PAC learning
  kind: problem
  minor: true
  tags: [ weihrauch ]
  definition: >
    Given closed classes $C \subseteq H \subseteq 2^\mathbb{N}$ ($C$ by positive, $H$ by negative information) and $d \geq \mathrm{VCdim}(C)$,
    find a learner into $H$ and a sample complexity with which it PAC learns $C$ relative to $H$.
  instance: 'Closed classes $\emptyset \neq C \subseteq H \subseteq 2^\mathbb{N}$ and $d \geq \mathrm{VCdim}(C)$.'
  solution: 'A learner $A : S \to H$ and a sample complexity $m$ with which $A$ PAC learns $C$ relative to $H$.'
  refs: [ { ref: brattkachirache2026, role: origin, loc: "Definition 4(1)" } ]

- id: atrw
  label: '\mathsf{ATR}'
  name: Arithmetical transfinite recursion (problem)
  kind: problem
  formulationOf: atr
  tags: [weihrauch]
  aliases: [ ATR problem ]
  caution: 'The Weihrauch problem of Kihara, Marcone and Pauly [@kiharamarconepauly2020]; the sentence ATR₀ of reverse mathematics is [[atr]].'
  definition: >
    Given a set $Z$, a well-order $X$ and an arithmetical operator (an index of an arithmetical formula), return the
    hierarchy obtained by iterating the operator along $X$ starting from $Z$. A single-valued problem, strongly Weihrauch
    equivalent to $\mathsf{UC}_{\mathbb{N}^\mathbb{N}}$.
  instance: A set $Z$, a well-order $X$ and an index of an arithmetical formula.
  solution: The unique hierarchy along $X$ starting from $Z$.
  refs:
    - { ref: kiharamarconepauly2020, role: origin, loc: Definition 3.12 }
    - { ref: goh2019b, role: rm, loc: Section 2 }

# Baire category theorem as problems (Brattka, Hendtlass and Kreuzer 2018, Definition
# 1.3), on a computable perfect Polish space; by their Corollary 6.7 the strong degree
# does not depend on the space.
- id: bct0
  label: '\mathsf{BCT}_0'
  name: Baire category theorem (negative information, point)
  kind: problem
  tags: [weihrauch]
  definition: >
    Given a sequence of nowhere dense closed sets by negative information, find a point outside their union.
  instance: A sequence of nowhere dense closed sets, given by negative information.
  solution: A point outside their union.
  refs: [ { ref: brattkahendtlasskreuzer2018, role: origin, loc: Definition 1.3 } ]

- id: bct1
  label: '\mathsf{BCT}_1'
  name: Baire category theorem (negative information, index)
  kind: problem
  tags: [weihrauch]
  definition: >
    Given a sequence of closed sets by negative information whose union is the whole space, find an index of a set with
    nonempty interior.
  instance: A sequence of closed sets covering the space, given by negative information.
  solution: An $i$ such that the $i$-th set has nonempty interior.
  refs: [ { ref: brattkahendtlasskreuzer2018, role: origin, loc: Definition 1.3 } ]

- id: bct2
  label: '\mathsf{BCT}_2'
  name: Baire category theorem (positive information, point)
  kind: problem
  tags: [weihrauch]
  definition: >
    Given a sequence of nowhere dense closed sets by positive information, find a point outside their union.
  instance: A sequence of nowhere dense closed sets, given by positive information.
  solution: A point outside their union.
  refs: [ { ref: brattkahendtlasskreuzer2018, role: origin, loc: Definition 1.3 } ]

- id: bct3
  label: '\mathsf{BCT}_3'
  name: Baire category theorem (positive information, index)
  kind: problem
  tags: [weihrauch]
  definition: >
    Given a sequence of closed sets by positive information whose union is the whole space, find an index of a set with
    nonempty interior.
  instance: A sequence of closed sets covering the space, given by positive information.
  solution: An $i$ such that the $i$-th set has nonempty interior.
  refs: [ { ref: brattkahendtlasskreuzer2018, role: origin, loc: Definition 1.3 } ]
