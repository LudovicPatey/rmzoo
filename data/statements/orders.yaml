# Linear and partial orders.

- id: cac
  label: '\mathsf{CAC}'
  name: Chain–antichain principle
  kind: problem
  tags: [ orders, ramsey ]
  aliases: [ chain antichain, Dilworth ]
  definition: Every infinite partial order has an infinite chain or an infinite antichain.
  instance: An infinite partial order $(\mathbb{N}, \preceq)$.
  solution: An infinite chain or an infinite antichain.
  refs:
    - { ref: hirschfeldtshore2007, role: rm }

- id: scac
  label: '\mathsf{SCAC}'
  name: Stable chain–antichain principle
  kind: problem
  tags: [ orders, ramsey, stable ]
  definition: >
    Every infinite stable partial order has an infinite chain or an infinite antichain.
  instance: An infinite stable partial order.
  solution: An infinite chain or an infinite antichain.
  refs:
    - { ref: hirschfeldtshore2007, role: origin }

- id: ads
  label: '\mathsf{ADS}'
  name: Ascending or descending sequence
  caution: 'For strong Weihrauch reducibility the domain of the instance matters. Here the linear order has domain ℕ, as in Astor et al. [@astoretal2017]; Fiori-Carones, Shafer and Soldà [@fioricaronesshafersolda2022] allow any infinite subset of ℕ, which gives the cylindrification of this problem (same Weihrauch degree). Their strong reductions and cylinder claims are about that version.'
  kind: problem
  tags: [ orders, ramsey ]
  aliases: [ ascending descending sequence ]
  definition: >
    Every infinite linear order has an infinite ascending or an infinite descending sequence.
  instance: An infinite linear order $(\mathbb{N}, <_L)$.
  solution: An infinite ascending or descending sequence.
  refs:
    - { ref: hirschfeldtshore2007, role: rm }

- id: sads
  label: '\mathsf{SADS}'
  name: Stable ascending or descending sequence
  kind: problem
  tags: [ orders, ramsey, stable ]
  definition: >
    Every infinite linear order of type $\omega + \omega^*$ has an infinite ascending or descending sequence.
  instance: An infinite linear order of type $\omega + \omega^*$.
  solution: An infinite ascending or descending sequence.
  refs:
    - { ref: hirschfeldtshore2007, role: origin }

- id: cads
  label: '\mathsf{CADS}'
  name: Cohesive ascending or descending sequence
  kind: problem
  tags: [ orders, ramsey, cohesive ]
  definition: >
    Every infinite linear order has a stable suborder, i.e. an infinite suborder of type $\omega$, $\omega^*$ or $\omega + \omega^*$.
  instance: An infinite linear order.
  solution: An infinite stable suborder.
  refs:
    - { ref: hirschfeldtshore2007, role: origin }

- id: trt22
  label: '\mathsf{TRT}^2_2'
  name: Ramsey's theorem for transitive colorings
  kind: problem
  minor: true
  tags: [ orders, ramsey ]
  definition: >
    Every transitive coloring of pairs with 2 colors (each color class is a transitive relation on pairs $x < y$) has an
    infinite homogeneous set. Equivalent to ADS.
  instance: 'A transitive coloring $f : [\mathbb{N}]^2 \to 2$.'
  solution: An infinite $f$-homogeneous set.
  refs: [ { ref: hirschfeldtshore2007, role: rm, loc: Definition 5.1 and Theorem 5.3 }, { ref: steilayokoyama2015, role: rm, loc: Section 2 } ]

- id: mc
  label: '\mathsf{MC}'
  name: Maximal chain theorem for well partial orders
  kind: sentence
  minor: true
  tags: [ orders, well-orders ]
  definition: >
    Every well partial order $P$ has a chain $C$ such that every chain of $P$ embeds into $C$ (Wolk's theorem).
  refs: [ { ref: marconeshore2010, role: rm, loc: Definition 2.12 } ]

# Termination of programs (Steila and Yokoyama 2015).
- id: wrt
  label: '\mathsf{WRT}^2'
  name: Weak Ramsey theorem for pairs
  kind: sentence
  minor: true
  tags: [ ramsey, orders ]
  definition: >
    For every $k$ and every $P : [\mathbb{N}]^2 \to k$ there are a color $c$ and an infinite set $\{x_0 < x_1 < \dots\}$
    with $P(x_i, x_{i+1}) = c$ for all $i$. With two colors it is psRT²₂, equivalent to ADS.
  refs: [ { ref: steilayokoyama2015, role: rm, loc: Definition 2.2 } ]

- id: prtt
  label: '\textsf{Termination Theorem}'
  name: Podelski–Rybalchenko termination theorem
  kind: sentence
  minor: true
  tags: [ orders ]
  definition: >
    A binary relation $R$ is well-founded if there are $k$ well-founded relations whose union contains the transitive
    closure of $R$ (a disjunctively well-founded transition invariant).
  refs: [ { ref: steilayokoyama2015, role: rm, loc: "Theorem 3.1, Theorem 4.4(1)" } ]

- id: hct
  label: '\textsf{H-closure Theorem}'
  name: H-closure theorem
  kind: sentence
  minor: true
  tags: [ orders ]
  definition: The union of finitely many H-well-founded relations is H-well-founded.
  refs: [ { ref: steilayokoyama2015, role: rm, loc: "Definition 3.2, Theorem 4.2" } ]

- id: io-11
  label: '\textsf{1-1 interval orders}'
  name: Characterization of 1-1 interval orders
  kind: sentence
  minor: true
  tags: [ orders ]
  definition: >
    A partial order is a 1-1 interval order iff it does not contain $2 \oplus 2$. A 1-1 interval order is given
    by a linear order $L$ and nonempty intervals $F(p) \subseteq L$ with $p <_P q$ iff every point of $F(p)$ is
    below every point of $F(q)$, and $F(p) \neq F(q)$ for $p \neq q$; $P$ does not contain $2 \oplus 2$ if
    $p_0 <_P q_0$ and $p_1 <_P q_1$ imply $p_0 \leq_P q_1$ or $p_1 \leq_P q_0$. (For plain interval orders the
    characterization is provable in $\mathsf{RCA}_0$, Theorem 1.1.)
  refs:
    - { ref: marcone2006, role: rm, loc: "Definitions 2.7 and 2.9, Theorem 1.2(ii)" }

- id: io-closed
  label: '\textsf{Closed interval orders}'
  name: Characterization of closed interval orders
  kind: sentence
  minor: true
  tags: [ orders ]
  definition: >
    A partial order is a closed interval order iff it does not contain $2 \oplus 2$. $P$ is a closed interval
    order if there are a linear order $L$ and $f_0, f_1 : P \to L$ with $f_0(p) \leq_L f_1(p)$ and
    $p <_P q \iff f_1(p) <_L f_0(q)$. The versions for 1-1 closed and for distinguishing interval orders are
    also equivalent to $\mathsf{WKL}_0$ (Theorem 1.2(iv), (v)).
  refs:
    - { ref: marcone2006, role: rm, loc: "Definitions 2.7 and 2.9, Theorem 1.2(iii)" }

- id: pio-closed
  label: '\textsf{Proper closed interval orders}'
  name: Characterization of proper closed interval orders
  kind: sentence
  minor: true
  tags: [ orders ]
  definition: >
    A partial order is a proper closed interval order iff it contains neither $2 \oplus 2$ nor $3 \oplus 1$. A
    proper closed interval order is a closed interval order ($f_0, f_1 : P \to L$ as for closed interval orders)
    with $f_0(p) <_L f_0(q) \iff f_1(p) <_L f_1(q)$; $P$ does not contain $3 \oplus 1$ if
    $p_0 <_P p_1 <_P p_2$ implies $p_0 \leq_P q$ or $q \leq_P p_2$. The versions for proper 1-1, proper 1-1 closed
    and proper distinguishing interval orders are also equivalent to $\mathsf{WKL}_0$ (Theorem 1.4); for plain
    proper interval orders the characterization is provable in $\mathsf{RCA}_0$ (Theorem 1.3).
  refs:
    - { ref: marcone2006, role: rm, loc: "Definitions 6.1 and 6.2, Theorem 1.4(iii)" }
