# Constructive reverse mathematics: the base of the reduction bish (data/reductions.yaml).
# Principles already in the zoo (LPO, LLPO, WKL, IVT…) keep their statement: over BISH
# they are read as the corresponding axioms; principles specific to constructive
# mathematics (WLPO, MP, FAN, BD-N…) get their own entries.

- id: bish
  label: '\mathsf{BISH}'
  name: Bishop-style constructive mathematics
  kind: sentence
  base: [ bish ]
  tags: [ constructive ]
  aliases: [ BISH ]
  definition: >
    Mathematics with intuitionistic logic in the style of Bishop, worked informally (formalizable in several set- or
    type-theoretic systems, or in restricted systems such as Veldman's BIM), with the axioms of countable and dependent
    choice tacitly accepted. The base of constructive reverse mathematics: implied by every statement over BISH.
  refs:
    - { ref: diener2018, role: rm, loc: "Section 0.4" }

- id: el0
  label: '\mathsf{EL}_0'
  name: Elementary analysis EL₀ (intuitionistic RCA₀)
  kind: sentence
  base: [ el0 ]
  tags: [ constructive ]
  aliases: [ EL0, EL₀ ]
  phrases: [ intuitionistic RCA₀ ]
  definition: >
    The two-sorted system over intuitionistic logic with number and function variables, symbols for all primitive
    recursive functions, λ-abstraction and recursion, quantifier-free induction (QF-IA) and quantifier-free choice
    QF-AC⁰,⁰; it proves induction and choice for Σ⁰₁-formulas. RCA₀ ([[rca0]]) is EL₀ + LEM. The base of
    intuitionistic reverse mathematics: implied by every statement over EL₀.
  refs:
    - { ref: dorais2014, role: rm, loc: "Section 2" }
    - { ref: kuyper2017, role: rm, loc: "Definition 2.2 and Proposition 2.3" }

- id: wlpo
  label: '\mathsf{WLPO}'
  name: Weak limited principle of omniscience
  kind: sentence
  tags: [ constructive ]
  aliases: [ WLPO, ∀-PEM ]
  definition: >
    For every binary sequence $(a_n)_n$, either $\forall n\, a_n = 0$ or $\neg \forall n\, a_n = 0$. Provable in classical
    logic; a principle of constructive reverse mathematics, between LPO and BISH.
  refs:
    - { ref: diener2018, role: rm, loc: "Section 1.3" }

- id: pem
  label: \mathsf{LEM}
  name: Law of excluded middle
  kind: sentence
  tags:
    - constructive
  aliases:
    - LEM
    - PEM
    - law of excluded middle
    - principle of excluded middle
    - tertium non datur
  definition: >
    For every statement $\varphi$, $\varphi \vee \neg\varphi$. Over intuitionistic logic equivalent to double negation
    elimination $\neg\neg\varphi \Rightarrow \varphi$. The strongest omniscience principle: it implies every statement
    provable in classical logic.
  caution: Not [[lem]], whose id is lem but which is the long Erdős–Moser theorem $\ell\text{-}\mathsf{EM}$.
  refs:
    - ref: diener2018
      role: rm
      loc: Section 1.1

- id: wlem
  label: \mathsf{WLEM}
  name: Weak law of excluded middle
  kind: sentence
  tags:
    - constructive
  aliases:
    - WLEM
    - WEM
    - weak law of excluded middle
    - weak excluded middle
  phrases:
    - weak law of excluded middle
    - weak excluded middle
  definition: >
    For every statement $\varphi$, $\neg\varphi \vee \neg\neg\varphi$. Equivalent to De Morgan's law $\neg(\varphi
    \wedge \psi) \Rightarrow \neg\varphi \vee \neg\psi$ (diener2018, Proposition 1.1.4).
  refs:
    - ref: diener2018
      role: rm
      loc: Section 1.1

- id: mp
  label: \mathsf{MP}
  name: Markov's principle
  kind: sentence
  tags:
    - constructive
  aliases:
    - MP
    - MP1
    - LPE
    - Markov's principle
  phrases:
    - Markov's principle
  definition: >
    For every binary sequence $(a_n)_n$, if $\neg \forall n\, a_n = 0$ then $\exists n\, a_n = 1$; equivalently, every
    almost positive real number is positive ($\neg\neg(0 < x) \Rightarrow 0 < x$). The principle of unbounded search,
    accepted in recursive constructive mathematics (RUSS).
  refs:
    - ref: diener2018
      role: rm
      loc: Section 2.1, Proposition 2.1.1(1)
    - ref: veldman2011
      role: rm
      loc: Subsection 2.2.16

- id: wmp
  label: \mathsf{WMP}
  name: Weak Markov's principle
  kind: sentence
  tags:
    - constructive
  aliases:
    - WMP
    - WLPE
    - ASP
    - weak Markov's principle
  phrases:
    - weak Markov's principle
  definition: >
    Every pseudo-positive real number is positive: for every $x \in \mathbb{R}$, if $\forall y \in \mathbb{R}\,
    (\neg\neg(0 < y) \vee \neg\neg(y < x))$, then $0 < x$. Together with $\mathsf{MP}_\vee$ equivalent to MP.
  refs:
    - ref: diener2018
      role: rm
      loc: Section 2.2

- id: mpor
  label: \mathsf{MP}^{\vee}
  name: Disjunctive Markov's principle
  kind: sentence
  tags:
    - constructive
  aliases:
    - MP∨
    - MP_or
    - LLPE
    - WLLPO
    - disjunctive Markov's principle
  phrases:
    - disjunctive Markov's principle
  definition: >
    Every almost positive real number is pseudo-positive: for every $x \in \mathbb{R}$, if $\neg\neg(0 < x)$ then
    $\forall y \in \mathbb{R}\, (\neg\neg(0 < y) \vee \neg\neg(y < x))$. Equivalently (diener2018, Proposition
    2.3.1(1)): for every binary sequence $(a_n)_n$ with at most one $1$ and $\neg\forall n\, a_n = 0$, either $\forall
    n\, a_{2n} = 0$ or $\forall n\, a_{2n+1} = 0$; also the De Morgan law for $\Pi^0_1$ formulas. Implied by LLPO and by
    MP.
  refs:
    - ref: diener2018
      role: rm
      loc: Section 2.3

- id: bdn
  label: \mathsf{BD}\text{-}\mathbb{N}
  name: Ishihara's boundedness principle
  kind: sentence
  tags:
    - constructive
  aliases:
    - BD-N
    - BD-ℕ
    - BDN
  definition: >
    Every inhabited, countable, pseudobounded subset of $\mathbb{N}$ is bounded, where $S \subseteq \mathbb{N}$ is
    pseudobounded if $\lim_{n} s_n / n = 0$ (equivalently, $s_n < n$ eventually) for every sequence $(s_n)_{n \geq 1}$
    in $S$. Holds in classical, intuitionistic and recursive mathematics but is not provable in BISH.
  refs:
    - ref: diener2018
      role: rm
      loc: Section 4.1
    - ref: ishiharaschuster2008
      role: rm
      loc: Section 1

- id: fandelta
  label: \mathsf{FAN}_\Delta
  name: Fan theorem for decidable bars
  kind: sentence
  tags:
    - constructive
    - compactness
  aliases:
    - FAN_Δ
    - FAN∆
    - FT
    - FT_1
    - fan theorem for decidable bars
    - fan theorem for detachable bars
  phrases:
    - fan theorem for decidable bars
    - fan theorem for detachable bars
  definition: >
    Every decidable bar of Cantor space is uniform: if $B \subseteq 2^{<\mathbb{N}}$ is decidable and $\forall \alpha
    \in 2^\mathbb{N}\, \exists n\, \overline{\alpha} n \in B$, then $\exists N\, \forall \alpha \in 2^\mathbb{N}\,
    \exists n \leq N\, \overline{\alpha} n \in B$. Equivalently (Veldman's strict fan theorem FT), every decidable bar
    of Cantor space has a finite subset that is still a bar. The constructive contraposition of WKL; true in
    intuitionistic mathematics, refuted by Church's thesis (Kleene's alternative).
  caution: >
    The bare names FAN and FT vary: berger2009 and kawai2026b write FAN for this principle, veldman2011 writes FAN for
    the full fan theorem over arbitrary fans ([[fanfull]]) and FT for this one, moschovakis2021b writes FT for the full
    fan theorem and FT_1 for this one.
  refs:
    - ref: diener2018
      role: rm
      loc: Chapter 3, introduction (Fan theorems)
    - ref: veldman2011
      role: rm
      loc: Subsection 2.2.4

- id: fanc
  label: \mathsf{FAN}_c
  name: Fan theorem for c-bars
  kind: sentence
  tags:
    - constructive
    - compactness
  aliases:
    - FANc
    - FAN_c
    - c-FAN
    - c-FT
    - fan theorem for c-bars
  phrases:
    - fan theorem for c-bars
  definition: >
    Every c-bar of Cantor space is uniform, where a bar $C \subseteq 2^{<\mathbb{N}}$ is a c-bar if there is a decidable
    $C' \subseteq 2^{<\mathbb{N}}$ with $u \in C \iff \forall w \in 2^{<\mathbb{N}}\, u * w \in C'$. Introduced by
    Berger; equivalent to the anti-Specker property for $[0,1]$ ([[antispecker]]) and to the uniform continuity of
    point-wise continuous functions $2^\mathbb{N} \to \mathbb{N}$.
  refs:
    - ref: diener2018
      role: rm
      loc: Chapter 3, introduction (Fan theorems)

- id: fanpi01
  label: \mathsf{FAN}_{\Pi^0_1}
  name: Fan theorem for Π⁰₁-bars
  kind: sentence
  tags:
    - constructive
    - compactness
  aliases:
    - FAN_Π01
    - FANΠ01
    - Π01-FAN
    - Π01-FANM
    - fan theorem for monotone Π01 bars
  phrases:
    - fan theorem for monotone Π01 bars
  definition: >
    Every $\Pi^0_1$-bar of Cantor space is uniform, where a bar $B \subseteq 2^{<\mathbb{N}}$ is a $\Pi^0_1$-bar if $B =
    \bigcap_{n \geq 1} B_n$ for a sequence of decidable sets $B_n \subseteq 2^{<\mathbb{N}}$ closed under extension.
    Between [[fanfull]] and [[fanc]].
  refs:
    - ref: diener2018
      role: rm
      loc: Chapter 3, introduction (Fan theorems)
    - ref: kawai2018
      role: rm
      loc: Section 2

- id: fanfull
  label: \mathsf{FAN}_{\mathrm{full}}
  name: Full fan theorem
  kind: sentence
  tags:
    - constructive
    - compactness
  aliases:
    - FANfull
    - FAN_full
    - full fan theorem
  phrases:
    - full fan theorem
  definition: >
    Every bar of Cantor space is uniform, with no condition on the complexity of the bar $B \subseteq 2^{<\mathbb{N}}$.
    Equivalent to the cover compactness of $2^\mathbb{N}$ (diener2018, Proposition 3.7.1). Veldman's scheme FAN states
    it for arbitrary fans: every bar of a fan contains a finite subset that is a bar.
  refs:
    - ref: diener2018
      role: rm
      loc: Chapter 3, introduction (Fan theorems)
    - ref: veldman2011
      role: rm
      loc: Subsection 2.2.3

- id: wcn
  label: \mathsf{WC}\text{-}\mathsf{N}
  name: Weak continuity for numbers (Brouwer's continuity principle)
  kind: sentence
  tags:
    - constructive
  aliases:
    - WC-N
    - WCN
    - BCP
    - Brouwer's continuity principle
    - weak continuity for numbers
  phrases:
    - weak continuity for numbers
    - Brouwer's continuity principle
  definition: >
    For every relation $R \subseteq \mathbb{N}^\mathbb{N} \times \mathbb{N}$: if $\forall \alpha\, \exists n\, R(\alpha,
    n)$, then $\forall \alpha\, \exists m\, \exists n\, \forall \beta\, (\overline{\beta} m = \overline{\alpha} m
    \Rightarrow R(\beta, n))$. An axiom of intuitionistic mathematics, inconsistent with Church's thesis; implies BD-N
    and refutes LLPO (veldman2011, Theorem 2.8).
  refs:
    - ref: veldman2011
      role: rm
      loc: Subsection 2.2.9
    - ref: ishiharaschuster2008
      role: rm
      loc: Section 1
    - ref: diener2018
      role: rm
      loc: Section 4.1½

- id: ac10
  label: \mathsf{AC}_{1,0}
  name: First axiom scheme of continuous choice
  kind: sentence
  minor: true
  tags:
    - constructive
  aliases:
    - AC1,0
    - AC_{ω^ω,ω}
    - continuous choice
  phrases:
    - axiom of continuous choice
  definition: >
    For every relation $R \subseteq \mathbb{N}^\mathbb{N} \times \mathbb{N}$: if $\forall \alpha\, \exists n\, R(\alpha,
    n)$, then there is a continuous $\varphi : \mathbb{N}^\mathbb{N} \to \mathbb{N}$ with $\forall \alpha\, R(\alpha,
    \varphi(\alpha))$. Strengthens [[wcn]].
  caution: "Not connected choice $\\mathsf{CC}_{[0,1]}$ ([[ivt]]): diener2018 writes CC for continuous choice (split into
    CC(1), every function $\\mathbb{N}^\\mathbb{N} \\to \\mathbb{N}$ is point-wise continuous, and CC(2), a choice
    function exists), Weihrauch papers write CC for connected choice."
  refs:
    - ref: veldman2011
      role: rm
      loc: Subsection 2.2.10

- id: ks
  label: \mathsf{KS}
  name: Kripke's schema
  kind: sentence
  tags:
    - constructive
  aliases:
    - KS
    - Kripke's schema
    - Kripke's scheme
  phrases:
    - Kripke's schema
  definition: >
    For every statement $\varphi$ there is a binary sequence $(a_n)_n$ such that $\varphi \iff \exists n\, a_n = 1$:
    every statement is simply existential. Formalizes Brouwer's creating subject; refutes MP together with the failure
    of LPO.
  refs:
    - ref: diener2018
      role: rm
      loc: Section 6.2

- id: ka
  label: \mathsf{KA}
  name: Kleene's alternative (to the fan theorem)
  kind: sentence
  tags:
    - constructive
    - compactness
  aliases:
    - KA
    - ¬!FT
    - Kleene's alternative
  phrases:
    - Kleene's alternative
  definition: >
    There is a decidable bar of Cantor space no finite part of which is a bar: $\exists \alpha\,
    [\mathrm{Bar}_{2^\mathbb{N}}(D_\alpha) \wedge \forall m\, \neg
    \mathrm{Bar}_{2^\mathbb{N}}(D_{\overline{\alpha}m})]$, where $D_\alpha = \{s : \alpha(s) \neq 0\}$ and
    $D_{\overline{\alpha}m} = \{s < m : \alpha(s) \neq 0\}$. A strong negation of [[fandelta]]; provable from Church's
    thesis (Kleene).
  caution: >
    Its tree form, the existence of a Kleene tree (an infinite decidable binary tree without infinite path), is labelled
    KT in diener2018 (Section 5.3, also called Anti-FAN_Δ), which is not Kruskal's theorem [[kt]].
  refs:
    - ref: veldman2011
      role: rm
      loc: Subsection 2.2.8
    - ref: diener2018
      role: rm
      loc: Section 5.3 (KT)

- id: ct
  label: \mathsf{CT}
  name: Church's thesis
  kind: sentence
  tags:
    - constructive
    - computability
  aliases:
    - CT
    - Church's thesis
  phrases:
    - Church's thesis
  definition: >
    Every function $\alpha : \mathbb{N} \to \mathbb{N}$ is computable. In Veldman's cautious formulation: there are
    $\tau, \psi$ such that for every $\alpha$ there is $e$ with, for all $n$, $\alpha(n) = \psi(\mu i\,[\tau(e, n, i)
    \neq 0])$ (the $\mu$ being defined). The axiom of recursive constructive mathematics (RUSS); implies [[ka]], refutes
    [[fandelta]] and [[wcn]].
  caution: >
    Several non-equivalent forms: veldman2011 states the function form CT above; kajikawaetal2026 and moschovakis2021b
    use the arithmetical schemas CT_0 (every total relation has a computable choice function), CT_0!, CT_1; bauer2021 a
    realizability predicate. Check which form a paper uses before linking a result.
  refs:
    - ref: veldman2011
      role: rm
      loc: Subsection 2.2.7

- id: antispecker
  label: \mathsf{AS}^{\mathbb{R}}_{[0,1]}
  name: Anti-Specker property of the unit interval
  kind: sentence
  tags:
    - constructive
    - analysis
    - compactness
  aliases:
    - AS
    - AS_[0,1]
    - anti-Specker property
  phrases:
    - anti-Specker property
  definition: >
    Every sequence of real numbers that is eventually bounded away from each point of $[0,1]$ is eventually bounded away
    from the whole of $[0,1]$; a sequence $(x_n)_n$ is eventually bounded away from a point $x$ (from a set $X$) if
    there is $N$ with $d(x_n, x) > 2^{-N}$ for all $n \geq N$ (and all $x \in X$). The general property
    $\mathsf{AS}^Y_X$ is stated for a subspace $X$ of a metric space $Y$. Fails in the presence of a Specker sequence;
    equivalent to [[fanc]] (diener2018, Proposition 3.4.1).
  refs:
    - ref: diener2018
      role: rm
      loc: Chapter 3, introduction
    - ref: dienerloeb2011
      role: rm
      loc: Section 2

- id: posinf
  label: \mathsf{POS}
  name: Positivity of the infimum
  kind: sentence
  minor: true
  tags:
    - constructive
    - analysis
  aliases:
    - positivity property
  definition: >
    Every uniformly continuous, positive-valued function $f : [0,1] \to \mathbb{R}^+$ has a positive infimum. Equivalent
    to [[fandelta]] (diener2018, Proposition 3.3.3; for compact metric spaces, kawai2026b, Theorem 5.1).
  caution: Not [[pos]] (positive-measure classes are inhabited), a randomness principle with the same acronym.
  refs:
    - ref: diener2018
      role: rm
      loc: Proposition 3.3.3(1)
    - ref: dienerloeb2011
      role: rm
      loc: Section 2

- id: wklu
  label: \mathsf{WKL}!
  name: Weak König's lemma with a uniqueness condition
  kind: sentence
  minor: true
  tags:
    - constructive
    - compactness
  aliases:
    - WKL!
  definition: >
    Every infinite decidable binary tree with at most one infinite path has an infinite path, where "at most one path"
    is meant positively: any two distinct $\gamma, \delta \in 2^\mathbb{N}$ (that is, $\gamma \perp \delta$) leave the
    tree at some finite stage. Equivalent to [[fandelta]] (Berger and Ishihara; veldman2011, Theorems 2.6 and 2.7).
  refs:
    - ref: veldman2011
      role: rm
      loc: Subsection 2.2.13
    - ref: kawai2026b
      role: rm
      loc: Section 5

- id: pi01acw2
  label: \Pi^0_1\text{-}\mathsf{AC}_{\omega,2}
  name: Π⁰₁ axiom of countable binary choice
  kind: sentence
  minor: true
  tags:
    - constructive
  aliases:
    - Π01-ACω,2
    - Pi01-AC_{ω,2}
  definition: >
    For every enumerable $E \subseteq \mathbb{N} \times 2$: if $\forall n\, \exists m < 2\, (n, m) \notin E$, then there
    is $\gamma \in 2^\mathbb{N}$ with $\forall n\, (n, \gamma(n)) \notin E$. Not provable in BIM; with LLPO equivalent
    to WKL (veldman2011, Theorem 4.3).
  refs:
    - ref: veldman2011
      role: rm
      loc: Subsection 4.7

- id: uivt
  label: \mathsf{UIVT}
  name: Uniform intermediate value theorem
  kind: sentence
  minor: true
  tags:
    - constructive
    - analysis
  aliases:
    - UIVT
  definition: >
    For every sequence $(\varphi_n)_n$ of continuous functions $[0,1] \to \mathbb{R}$, if each $\varphi_n$ has points
    $\gamma^0_n, \gamma^1_n \in [0,1]$ with $\varphi_n(\gamma^0_n) \leq 0 \leq \varphi_n(\gamma^1_n)$, then there is a
    sequence $(\gamma_n)_n$ in $[0,1]$ with $\varphi_n(\gamma_n) = 0$ for all $n$. A sequential IVT; equivalent to WKL
    over RCA₀ (Simpson, Exercise IV.2.12), its contraposition equivalent to [[fandelta]] over BIM.
  caution: sanders2015c uses UIVT for a different, higher-order statement (a functional producing zeros of all continuous
    functions).
  refs:
    - ref: veldman2011
      role: rm
      loc: Subsection 10.4

- id: almft
  label: \mathsf{AlmFT}
  name: Almost-fan theorem
  kind: sentence
  minor: true
  tags:
    - constructive
    - compactness
  aliases:
    - AlmFT
    - almost-fan theorem
  phrases:
    - almost-fan theorem
  definition: >
    In an almost-fan, every thin bar is almost-finite: for every spread $F_\beta$ in which each node has an
    almost-finite set of immediate successors, every decidable thin bar $D_\alpha$ of $F_\beta$ (no element a proper
    initial segment of another) consisting of nodes of $F_\beta$ is almost-finite, i.e. every strictly increasing $\zeta
    \in [\omega]^\omega$ has some $n$ with $\zeta(n) \notin D_\alpha$. Implies [[appft]]; follows from bar induction.
  refs:
    - ref: veldman2014
      role: rm
      loc: Section 8.2, Definitions 23-24
    - ref: veldman2011
      role: rm
      loc: Subsection 12.4

- id: appft
  label: \mathsf{AppFT}
  name: Approximate-fan theorem
  kind: sentence
  minor: true
  tags:
    - constructive
    - compactness
  aliases:
    - AppFT
    - approximate-fan theorem
  phrases:
    - approximate-fan theorem
  definition: >
    In an explicit approximate fan, every thin bar is almost-finite: for every spread $F_\beta$ with a $\gamma$ such
    that for each $n$ the set $\{t \in \omega^n : \beta(t) = 0\}$ has at most $\gamma(n)$ members, every decidable thin
    bar $D_\alpha$ of $F_\beta$ consisting of nodes of $F_\beta$ is almost-finite. Extends [[fandelta]], implies
    [[open-induction]] in BIM.
  refs:
    - ref: veldman2014
      role: rm
      loc: Section 8.2, Definitions 23-24
    - ref: veldman2011
      role: rm
      loc: Subsection 12.5

- id: wwklbar
  label: \mathsf{WWKL}_{\mathrm{bar}}
  name: Weak weak König's lemma (bar form)
  kind: sentence
  tags:
    - constructive
    - compactness
    - randomness
  aliases:
    - WWKL (constructive)
    - constructive WWKL
  definition: >
    For every decidable bar $B \subseteq 2^{<\mathbb{N}}$ that is closed under extensions, $\lim_{n\to\infty} |\{u
    \notin B : |u| = n\}| / 2^n = 0$. The constructive reading of weak weak König's lemma, as a weakening of
    [[fandelta]] (the decidable bar need not be uniform, only the proportion of unbarred nodes tends to $0$); over BISH
    equivalent to Vitali's covering theorem in finite form ([[vitalifin]]).
  caution: >
    Not [[wwkl]] (trees of positive measure have a path): this is its contraposition, called WWKL in constructive
    reverse mathematics; the two are classically equivalent, not over BISH.
  refs:
    - ref: dienerhedin2012
      role: rm
      loc: Section 4
    - ref: diener2018
      role: rm
      loc: Section 3.2

- id: vitalifin
  label: \textsf{Vitali}_{\mathrm{fin}}
  name: Vitali covering theorem (finite form)
  kind: sentence
  minor: true
  tags:
    - constructive
    - analysis
    - randomness
  aliases:
    - VCT
  definition: >
    Let $\varepsilon > 0$. If $V$ is a countable Vitali cover of $[a,b]$ (for every $x \in [a,b]$ and $\delta > 0$ some
    interval of $V$ contains $x$ and has length $< \delta$), then there are finitely many pairwise disjoint intervals
    $I_1, \dots, I_m$ in $V$ with $\mu([a,b] \setminus \bigcup_{i \leq m} I_i) < \varepsilon$. Over BISH equivalent to
    [[wwklbar]] (dienerhedin2012, Theorem 12 and the remark after it); fails in RUSS.
  caution: >
    Not [[vitali]] (Simpson's form: a disjoint sequence of intervals of the cover whose union has full measure);
    classically equivalent.
  refs:
    - ref: dienerhedin2012
      role: rm
      loc: Theorem 12
    - ref: diener2018
      role: rm
      loc: Proposition 3.2.1(2)

- id: buct
  label: \mathsf{BUCT}
  name: Uniform continuity theorem for bounded functions
  kind: sentence
  minor: true
  tags:
    - constructive
    - analysis
    - compactness
  aliases:
    - BUCT
    - BUCT[0,1]
  definition: >
    Every bounded, point-wise continuous function $f : [0,1] \to \mathbb{R}$ is uniformly continuous. Equivalent over
    BISH to the uniform continuity theorem [[ucont]] (dienerloeb2011, Proposition 6; diener2018, Proposition 3.5.6).
  refs:
    - ref: dienerloeb2011
      role: rm
      loc: Section 2
    - ref: diener2018
      role: rm
      loc: Proposition 3.5.6(1)

- id: luct
  label: \mathsf{LUCT}
  name: Locally uniform continuity theorem
  kind: sentence
  minor: true
  tags:
    - constructive
    - analysis
    - compactness
  aliases:
    - LUCT
    - LUCT[0,1]
  definition: >
    Every point-wise continuous function $f : [0,1] \to \mathbb{R}$ is locally uniformly continuous: for every $x \in
    [0,1]$ there is $h > 0$ such that $f$ is uniformly continuous on $[x-h, x+h] \cap [0,1]$. Equivalent over BISH to
    [[ucont]] and to its version for continuous maps from a compact metric space to a metric space (dienerloeb2011,
    Section 2; diener2018, Proposition 3.5.6).
  refs:
    - ref: dienerloeb2011
      role: rm
      loc: Section 2, Definition 3
    - ref: diener2018
      role: rm
      loc: Proposition 3.5.6(2)

- id: minprinciple
  label: \mathsf{MIN}
  name: Minimum principle
  kind: sentence
  minor: true
  tags:
    - constructive
    - analysis
    - compactness
  aliases:
    - MIN
    - minimum principle
  phrases:
    - minimum principle
  definition: >
    Every uniformly continuous function $f : X \to \mathbb{R}$ on a compact (complete and totally bounded) metric space
    $X$ attains its minimum: there is $z \in X$ with $f(z) = \inf f$. Equivalent to [[wkl]] over BISH (Ishihara;
    diener2018, Proposition 1.4.7) and over EL₀ (kawai2026b, Theorem 3.1).
  refs:
    - ref: kawai2026b
      role: rm
      loc: Section 1
    - ref: diener2018
      role: rm
      loc: Proposition 1.4.7(2)
    - ref: kawai2026
      role: rm
      loc: Section 3
    - ref: ishihara2007
      role: rm
      loc: Section 1

- id: minunique
  label: \mathsf{MIN}!
  name: Minimum principle with uniqueness
  kind: sentence
  minor: true
  tags:
    - constructive
    - analysis
    - compactness
  aliases:
    - MIN!
  definition: >
    Every uniformly continuous function $f : X \to \mathbb{R}$ on a compact metric space $X$ having at most one minimum
    point ($x \neq y \Rightarrow f(x) > \inf f \vee f(y) > \inf f$) attains its minimum. Equivalent to [[fandelta]],
    [[wklu]] and [[posinf]] over EL₀ (kawai2026b, Theorem 5.1).
  refs:
    - ref: kawai2026b
      role: rm
      loc: Section 5
    - ref: ishihara2007
      role: rm
      loc: Section 1

- id: riemannperm
  label: \textsf{Riemann perm.}
  name: Converse of the Riemann permutation theorem
  kind: sentence
  minor: true
  tags:
    - constructive
    - analysis
  aliases:
    - Riemann permutation theorem
    - Riemann-Troelstra theorem
  phrases:
    - permutably convergent series
  definition: >
    Every permutably convergent series of real numbers is absolutely convergent: if $\sum_n a_{\sigma(n)}$ converges for
    every permutation $\sigma$ of $\mathbb{N}$, then $\sum_n |a_n|$ converges. Provable in classical mathematics and in
    intuitionistic mathematics (Troelstra); implied by [[bdn]] over BISH (bergeretal2025, Theorem 7).
  caution: Not [[riemann]] (Riemann integrability of continuous functions).
  refs:
    - ref: bergeretal2025
      role: rm
      loc: Section 1, Theorem 7
    - ref: diener2018
      role: rm
      loc: Proposition 4.2.1(7)

# Statement pass of November 2026 (proposals of the AI readers; definitions read in the sources)

- id: wkluu
  label: \mathsf{WKL}!!
  name: Weak König's lemma with the hypothesis that any two paths agree
  kind: sentence
  minor: true
  tags:
    - constructive
    - compactness
  aliases:
    - WKL!!
  definition: >
    For every detachable subtree of the binary fan, coded by $\rho$: if $\forall y\, \exists \alpha \in 2^\mathbb{N}\,
    \forall x \leq y\, \rho(\overline{\alpha}(x)) = 0$ and any two infinite paths agree ($\forall \alpha, \beta \in
    2^\mathbb{N}\, [\forall x\, \rho(\overline{\alpha}(x)) = 0 \wedge \forall x\, \rho(\overline{\beta}(x)) = 0
    \rightarrow \forall x\, \alpha(x) = \beta(x)]$), then $\exists \alpha \in 2^\mathbb{N}\, \forall x\,
    \rho(\overline{\alpha}(x)) = 0$ (moschovakis2012, Section 3). Its uniqueness hypothesis is weaker than the positive
    one of [[wklu]] (WKL!), so the principle is stronger; classically equivalent to WKL.
  refs:
    - ref: moschovakis2012
      role: origin
      loc: Section 3
    - ref: moschovakisvafeiadou2012
      role: rm
      loc: Section 5.4

- id: nnwkl
  label: \neg\neg\mathsf{WKL}
  name: Double negation of weak König's lemma
  kind: sentence
  minor: true
  tags:
    - constructive
    - compactness
  aliases:
    - ¬¬WKL
    - not-not-WKL
  definition: >
    The double negation of the open axiom WKL, schematic in the tree code $\rho$: if $\forall y\, \exists \alpha \in
    2^\mathbb{N}\, \forall x \leq y\, \rho(\overline{\alpha}(x)) = 0$, then $\neg\neg \exists \alpha \in 2^\mathbb{N}\,
    \forall x\, \rho(\overline{\alpha}(x)) = 0$ (moschovakis2012, Section 4). Its universal closure is weaker than the
    double negation of the universal closure of WKL. Provable classically.
  refs:
    - ref: moschovakis2012
      role: origin
      loc: Section 4
    - ref: moschovakisvafeiadou2012
      role: rm
      loc: Section 5.4, proof of Proposition 19

- id: bid
  label: \mathsf{BI}_{\mathrm{d}}
  name: Bar induction with a decidable bar
  kind: sentence
  minor: true
  tags:
    - constructive
  aliases:
    - BId
    - BI_d
    - BID
    - decidable bar induction
  phrases:
    - bar induction with a decidable bar
  definition: >
    Kleene's schema of bar induction with a decidable bar: if $\forall \alpha\, \exists x\, R(\overline{\alpha}(x))$,
    $\forall w\, (R(w) \vee \neg R(w))$, $\forall w\, (R(w) \rightarrow A(w))$ and $\forall w\, (\forall s\, A(w *
    \langle s \rangle) \rightarrow A(w))$, then $A(\langle\,\rangle)$, for arbitrary predicates $R$ and $A$ of finite
    sequences (moschovakisvafeiadou2012, Section 4.1). Brouwer's bar theorem as an axiom schema of Kleene and Vesley's
    intuitionistic analysis FIM; classically provable.
  caution: Not the classical [[pi11-ti]] (Π¹₁ transfinite induction, also called Π¹₁ bar induction).
  refs:
    - ref: moschovakisvafeiadou2012
      role: rm
      loc: Section 4.1

- id: dini
  label: \mathsf{DT}
  name: Dini's theorem
  kind: sentence
  tags:
    - analysis
    - constructive
  aliases:
    - DT
  phrases:
    - Dini's theorem
  caution: Not [[dt2]] (Devlin's theorem for pairs, $\mathsf{DT}^2$).
  definition: >
    For every compact metric space $X$: if a monotone sequence $(f_n)_n$ of continuous functions on $X$ converges
    pointwise to a continuous function $f$ on $X$, then $(f_n)_n$ converges uniformly to $f$ (bergerschuster2006,
    statement $\mathrm{DT}_X$ in Section 2, for all compact $X$). In the constructive setting compact means totally
    bounded and complete and a continuous function on a compact space comes with a modulus of uniform continuity
    (Bishop); over RCA₀ the functions are coded continuous functions (Theorem 5.2). Constructively equivalent to the
    cases $X = 2^\mathbb{N}$ and $X = [0,1]$ (Theorem 4.8).
  refs:
    - ref: bergerschuster2006
      role: origin
      loc: Section 2 (DT_X), Theorems 4.8 and 5.2
    - ref: diener2018
      role: rm
      loc: Proposition 3.3.3(5)

- id: sephyp
  label: \mathsf{SEP}
  name: Separating hyperplane theorem for convex hulls of finitely many vectors
  kind: sentence
  minor: true
  tags:
    - constructive
    - analysis
  definition: >
    Let $H$ be a Hilbert space and $C \subseteq H$ convex, closed and located. If $x_1, \dots, x_n \in H$ and $C$ is
    disjoint from the convex hull $C(x_1, \dots, x_n)$, then there are $\varepsilon > 0$ and $p \in H$ with $\langle p,
    x - c \rangle \geq \varepsilon$ for all $x \in C(x_1, \dots, x_n)$ and $c \in C$ (bergersvindland2016, Section 1,
    statement SEP).
  caution: Not [[sep]] ($\Sigma^0_1$ separation), sometimes also abbreviated SEP.
  refs:
    - ref: bergersvindland2016
      role: origin
      loc: Section 1 (SEP), Proposition 2

- id: ftap
  label: \mathsf{FTAP}
  name: Fundamental theorem of asset pricing
  kind: sentence
  minor: true
  tags:
    - constructive
    - analysis
  aliases:
    - FTAP
  phrases:
    - fundamental theorem of asset pricing
  definition: >
    The non-trivial direction of the fundamental theorem of asset pricing for a finite market: for every real $m \times
    n$ matrix $A$ with linearly independent rows, if $\{\xi \cdot A : \xi \in \mathbb{R}^m\} \cap Y_n = \emptyset$,
    where $Y_n = \{x \in \mathbb{R}^n : \sum_i x_i > 0,\ x_i \geq 0\}$ (no arbitrage), then there is $p \in P_n = \{x :
    \sum_i x_i = 1,\ x_i > 0\}$ with $A \cdot p = 0$ (an equivalent martingale measure) (bergersvindland2016, Section 1,
    statement FTAP).
  refs:
    - ref: bergersvindland2016
      role: origin
      loc: Section 1 (FTAP), Proposition 2

- id: lindenb
  label: \textsf{Lindenbaum}_{\mathrm{dec}}
  name: Lindenbaum's lemma for decidable sets of propositional formulas
  kind: sentence
  minor: true
  tags:
    - constructive
    - compactness
  phrases:
    - Lindenbaum's lemma
  definition: >
    For every decidable set $\Gamma$ of formulas of classical propositional calculus: if for every $\alpha \in
    2^\mathbb{N}$ there is $n$ such that $\overline{\alpha}n$ is inconsistent, incomplete, does not contain $\Gamma$, or
    is open (as a candidate valuation of the enumerated formulas, Definitions 6.1–6.4), then $\Gamma$ is contradictory
    (proves $A_0 \wedge \neg A_0$) (loeb2005, Theorem 6.5(2)).
  refs:
    - ref: loeb2005
      role: origin
      loc: Definitions 6.1–6.4, Theorem 6.5(2)

- id: pcompl
  label: \textsf{Completeness}_{\mathrm{dec}}
  name: Completeness of propositional calculus for decidable sets of formulas
  kind: sentence
  minor: true
  tags:
    - constructive
    - compactness
  definition: >
    For every decidable set $\Gamma$ of formulas of classical propositional calculus: if $\Gamma$ is lying (every
    valuation makes some formula of $\Gamma$ false), then $\Gamma$ is contradictory (proves $A_0 \wedge \neg A_0$)
    (loeb2005, Section 6 and Theorem 6.5(3)).
  caution: Not [[completeness]] (Gödel's completeness theorem, a classical second-order statement equivalent to WKL₀).
  refs:
    - ref: loeb2005
      role: origin
      loc: Theorem 6.5(3)

- id: pcompact
  label: \textsf{Compactness}_{\mathrm{dec}}
  name: Compactness of propositional calculus for decidable sets of formulas
  kind: sentence
  minor: true
  tags:
    - constructive
    - compactness
  definition: >
    For every decidable set $\Gamma$ of formulas of classical propositional calculus: if $\Gamma$ is lying (every
    valuation makes some formula of $\Gamma$ false), then some finite subset of $\Gamma$ is lying (loeb2005, Section 6
    and Theorem 6.5(4)).
  refs:
    - ref: loeb2005
      role: origin
      loc: Theorem 6.5(4)

- id: ubt
  label: \textsf{UBT}_{\mathrm{tvs}}
  name: Uniform boundedness theorem for sequences of maps from separable F-spaces
  kind: sentence
  minor: true
  tags:
    - constructive
    - analysis
  phrases:
    - uniform boundedness theorem
    - Banach–Steinhaus theorem
  definition: >
    If $(T_m)_m$ is a sequence of continuous linear mappings from a separable F-space $E$ (a topological vector space
    whose topology is given by a complete invariant metric) into a separated topological vector space $F$ such that
    $\{T_m x : m \in \mathbb{N}\}$ is bounded for each $x \in E$, then $(T_m)_m$ is equicontinuous (ishihara2012,
    Theorem 7(2); separated as defined in Section 2).
  refs:
    - ref: ishihara2012
      role: origin
      loc: Theorems 6 and 7(2)

- id: bslim
  label: \textsf{Banach–Steinhaus}_{\lim}
  name: Continuity of pointwise limits of continuous linear maps on separable F-spaces
  kind: sentence
  minor: true
  tags:
    - constructive
    - analysis
  definition: >
    If $(T_m)_m$ is a sequence of continuous linear mappings from a separable F-space $E$ into a separated topological
    vector space $F$ such that $Tx = \lim_m T_m x$ exists for each $x \in E$, then $T$ is continuous (ishihara2012,
    Theorem 7(3)).
  refs:
    - ref: ishihara2012
      role: origin
      loc: Theorem 7(3)
