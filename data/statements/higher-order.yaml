# Higher-order reverse mathematics: third-order statements (order: 3), compared over
# Kohlenbach's RCA₀^ω (the reduction rca0 read in finite types; data/reductions.yaml).

- id: rca0omega
  label: '\mathsf{RCA}_0^\omega'
  name: Recursive comprehension in all finite types
  kind: sentence
  order: 3
  base: [ rca0 ]
  tags: [ higher-order ]
  aliases: [ 'RCA₀^ω', RCA0omega, RCA0^omega ]
  definition: >
    Kohlenbach's base system of higher-order reverse mathematics, $\mathsf{E\text{-}PRA}^\omega + \mathsf{QF\text{-}AC}^{1,0}$:
    extensional primitive recursive arithmetic in all finite types with quantifier-free choice from functions to numbers. It
    is conservative over $\mathsf{RCA}_0$ for second-order sentences (Proposition 3.1), so third-order statements are
    compared over it by the same relation as second-order ones over $\mathsf{RCA}_0$: every statement implies it.
  refs:
    - { ref: kohlenbach2005, role: origin, loc: "Section 2 and Proposition 3.1" }

- id: exists2
  label: '(\exists^2)'
  name: Kleene's quantifier ∃²
  kind: sentence
  order: 3
  tags: [ higher-order ]
  aliases: [ '∃²', E2, '(∃2)' ]
  definition: >
    There is a functional $\varphi^2$ such that $\forall f^1\, (\varphi(f) = 0 \leftrightarrow \exists x^0\, f(x) = 0)$:
    the existence of the Turing jump as a type-2 functional, the higher-order counterpart of $\mathsf{ACA}_0$.
  refs:
    - { ref: kohlenbach2005, role: origin, loc: "Section 1, (∃²)" }

- id: discontr
  label: '\textsf{discontinuous function}'
  name: Existence of a discontinuous function on the reals
  kind: sentence
  order: 3
  tags: [ higher-order, analysis ]
  definition: >
    There exists a function $F : \mathbb{R} \to \mathbb{R}$ which is not everywhere sequentially continuous.
  refs:
    - { ref: kohlenbach2005, role: rm, loc: "Proposition 3.12(3)" }

- id: suslin
  label: (\mathsf{S}^2)
  name: Existence of the Suslin functional
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - S2
    - (S2)
    - Suslin functional
  definition: >
    $(\exists \mathbf{S}^2 \leq_2 1)(\forall f^1)\big[(\exists g^1)(\forall n^0)(f(\overline{g}n) = 0) \leftrightarrow
    \mathbf{S}(f) = 0\big]$: the Suslin functional decides $\Sigma^1_1$-formulas in normal form.
    $\Pi^1_1\text{-}\mathsf{CA}_0^\omega \equiv \mathsf{RCA}_0^\omega + (\mathsf{S}^2)$ proves the same
    $\Pi^1_3$-sentences as $\Pi^1_1\text{-}\mathsf{CA}_0$.
  refs:
    - ref: normannsanders2019
      role: rm
      loc: Section 2.1.4, (S²)
    - ref: normannsanders2017b
      role: rm
      loc: Section 2.4, (S²)

- id: exists3
  label: (\exists^3)
  name: Kleene's quantifier ∃³
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - ∃³
    - E3
    - (∃3)
  definition: >
    $(\exists E^3 \leq_3 1)(\forall Y^2)\big[(\exists f^1)\, Y(f) = 0 \leftrightarrow E(Y) = 0\big]$.
    $\mathsf{Z}_2^\Omega \equiv \mathsf{RCA}_0^\omega + (\exists^3)$ is a conservative extension of $\mathsf{Z}_2$.
  refs:
    - ref: normannsanders2019
      role: rm
      loc: Section 2.1.4, (∃³)
    - ref: normannsanders2017b
      role: rm
      loc: Section 2.4, (∃³)

- id: mu2
  label: (\mu^2)
  name: Feferman's search operator μ²
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  aliases:
    - µ2
    - (µ2)
    - Feferman's mu
  definition: >
    $(\exists \mu^2)(\forall f^1)\big[(\exists n)(f(n) = 0) \rightarrow [f(\mu(f)) = 0 \wedge (\forall i < \mu(f))\,
    f(i) \neq 0] \wedge [(\forall n)(f(n) \neq 0) \rightarrow \mu(f) = 0]\big]$. $\mathsf{ACA}_0^\omega \equiv
    \mathsf{RCA}_0^\omega + (\mu^2)$; equivalent to $(\exists^2)$ over $\mathsf{RCA}_0^\omega$.
  refs:
    - ref: normannsanders2019
      role: rm
      loc: Section 2.1.4, (μ²)
    - ref: kohlenbach2005
      role: rm
      loc: Definition 3.8(1), Proposition 3.9

- id: uwkl
  label: \mathsf{UWKL}
  name: Uniform weak König's lemma
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  definition: >
    $(\exists \Phi^{1\to 1})(\forall f^1)\big(T^1(f) \rightarrow (\forall x^0)\, f(\overline{\Phi(f)}x) = 0\big)$, where
    $T^1(f)$ expresses that $f$ is (the characteristic function of) an infinite binary tree: a functional selecting a
    path through every infinite binary tree. Equivalent to $(\exists^2)$ over $\mathsf{RCA}_0^\omega$.
  refs:
    - ref: kohlenbach2005
      role: rm
      loc: Definition 3.8(2), Proposition 3.9
    - ref: sanders2015c
      role: rm
      loc: (UWKL)

- id: muc
  label: \mathsf{MUC}
  name: Intuitionistic fan functional (modulus of uniform continuity)
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - (MUC)
  definition: >
    $(\exists \Omega^3)(\forall Y^2)(\forall f, g \leq_1 1)\big(\overline{f}\Omega(Y) = \overline{g}\Omega(Y)
    \rightarrow Y(f) = Y(g)\big)$: $\Omega$ gives a modulus of uniform continuity on Cantor space for every type-2
    functional. Inconsistent with $(\exists^2)$ but consistent relative to $\mathsf{RCA}_0^\omega$.
  refs:
    - ref: kohlenbach2005
      role: rm
      loc: Section 3, (MUC), Proposition 3.15
    - ref: bergsanders2014
      role: rm
      loc: Section 4.2.6, (MUC)

- id: uatr
  label: \mathsf{UATR}
  name: Trivially uniform arithmetical transfinite recursion
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  definition: >
    $(\exists \Phi^{1\to 1})(\forall X^1, f^1)\big(\mathrm{WO}(X) \rightarrow H_f(X, \Phi(X, f))\big)$, where $H_f(X,Y)$
    is $H_\theta(X,Y)$ (Simpson, V.2) with $\theta(n, Z)$ defined as $(\exists m^0)(f(n, m, \overline{Z}m) = 0)$.
  refs:
    - ref: normannsanders2017
      role: rm
      loc: Section 6.2, (UATR)
    - ref: normannsanders2018
      role: rm
      loc: Section 2.3, (UATR)

- id: boot
  label: \mathsf{BOOT}
  name: Bootstrap principle
  kind: sentence
  order: 3
  tags:
    - higher-order
  definition: |
    $(\forall Y^2)(\exists X^1)(\forall n^0)\big(n \in X \leftrightarrow (\exists f^1)(Y(f, n) = 0)\big)$.
  refs:
    - ref: sanders2019b
      role: origin
      loc: Definition 1.2, Definition 3.1
    - ref: normannsanders2020b
      role: rm
      loc: Principle 2.9

- id: bootminus
  label: \mathsf{BOOT}^-
  name: Bootstrap principle with unique witnesses
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  aliases:
    - BOOT−
  definition: >
    For $Y^2$ such that $(\forall n \in \mathbb{N})(\exists \text{ at most one } f^1)(Y(f, n) = 0)$, we have $(\exists X
    \subset \mathbb{N})(\forall n \in \mathbb{N})\big(n \in X \leftrightarrow (\exists f^1)(Y(f, n) = 0)\big)$.
  refs:
    - ref: normannsanders2019b
      role: origin
      loc: Definition 4.2
    - ref: normannsanders2021
      role: rm
      loc: Section 1.3.3, (1.1)

- id: deltaca3
  label: \Delta\text{-}\mathsf{CA}
  name: Third-order Δ-comprehension
  caution: "Not $\\Delta^0_1$- or $\\Delta^1_1$-comprehension: the formulas have the form $(\\exists f \\in
    \\mathbb{N}^\\mathbb{N})(Y(f,n) = 0)$ with a type-2 parameter $Y$ (the ECF-translation turns it into
    $\\Delta^0_1$-comprehension)."
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - ∆-CA
    - Δ-CA
  definition: >
    For $i = 0, 1$, $Y_i^2$, and $A_i(n) \equiv (\exists f \in \mathbb{N}^\mathbb{N})(Y_i(f, n) = 0)$: $(\forall n \in
    \mathbb{N})(A_0(n) \leftrightarrow \neg A_1(n)) \rightarrow (\exists X \subset \mathbb{N})(\forall n \in
    \mathbb{N})(n \in X \leftrightarrow A_0(n))$.
  refs:
    - ref: normannsanders2021
      role: rm
      loc: Principle 1.8
    - ref: sanders2020
      role: rm
      loc: Principle 2.6
    - ref: normannsanders2020b
      role: rm
      loc: Principle 3.34

- id: sigmasep3
  label: \Sigma\text{-}\mathsf{SEP}
  name: Third-order Σ-separation
  caution: "Not $\\Sigma^0_1$- or $\\Sigma^1_1$-separation: the formulas have the form $(\\exists f^1)(Y(f,n) = 0)$ with a
    type-2 parameter $Y$."
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - Σ-SEP
  definition: >
    For $\varphi_i(n) \equiv (\exists f_i^1)(Y_i(f_i, n) = 0)$ ($i = 0, 1$): $(\forall n^0)(\neg\varphi_0(n) \vee
    \neg\varphi_1(n)) \rightarrow (\exists Z^1)(\forall n^0)\big[(\varphi_0(n) \rightarrow n \in Z) \wedge (\varphi_1(n)
    \rightarrow n \notin Z)\big]$.
  refs:
    - ref: sanders2019b
      role: origin
      loc: Definition 4.22
    - ref: normannsanders2021
      role: rm
      loc: Principle 3.6

- id: ind03
  label: \mathsf{IND}_0
  name: Finite comprehension for unique witnesses (IND₀)
  caution: "The label $\\mathsf{IND}_0$ is not an induction scheme for a formula class. Normann and Sanders use
    $\\mathsf{IND}_0$, $\\mathsf{IND}_1$, $\\mathsf{IND}_2$ for slightly different formulations in different papers
    (e.g. sanders2024d derives $\\mathsf{IND}_0$ from its $\\mathsf{IND}_2$ by restricting the hypothesis): check the
    definition in each paper."
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  aliases:
    - IND0
  definition: >
    Let $Y^2$ satisfy $(\forall n \in \mathbb{N})(\exists \text{ at most one } f \in 2^\mathbb{N})(Y(f, n) = 0)$. For $k
    \in \mathbb{N}$, there is $w^{1^*}$ with $|w| = k$ such that for $m \leq k$: $(w(m) \in 2^\mathbb{N} \wedge Y(w(m),
    m) = 0) \leftrightarrow (\exists f \in 2^\mathbb{N})(Y(f, m) = 0)$.
  refs:
    - ref: normannsanders2021
      role: origin
      loc: Definition 2.9
    - ref: normannsanders2022
      role: rm
      loc: Definition 2.29
    - ref: sanders2023
      role: rm
      loc: Definition 1.7

- id: nfp3
  label: \mathsf{NFP}
  name: Neighbourhood function principle
  caution: In second-order reverse mathematics, NFP also names "Noetherian rings have finitely many prime ideals"
    ([[nfp]]), an unrelated statement.
  kind: sentence
  order: 3
  tags:
    - higher-order
  definition: >
    The schema: for any formula $A(\sigma^{0^*})$ of $\mathsf{L}_\omega$, $(\forall f^1)(\exists n^0)A(\overline{f}n)
    \rightarrow (\exists \gamma \in K_0)(\forall f^1)A(\overline{f}\gamma(f))$, where $\gamma \in K_0$ means that
    $\gamma$ is a total associate on Baire space.
  refs:
    - ref: sanders2019b
      role: rm
      loc: Definition 5.1

- id: a0
  label: \mathsf{A}_0
  name: Fragment A₀ of the neighbourhood function principle
  caution: "The token A0 also denotes formulas, sets and parameters in many papers: the miners should not look for it as
    an acronym."
  kind: sentence
  order: 3
  tags:
    - higher-order
  definition: >
    For $Y^2$ and $A(\sigma^{0^*}) \equiv (\exists f \in 2^\mathbb{N})(Y(f, \sigma) = 0)$: $(\forall f \in
    \mathbb{N}^\mathbb{N})(\exists n \in \mathbb{N})A(\overline{f}n) \rightarrow (\exists \Phi^2)(\forall f \in
    \mathbb{N}^\mathbb{N})A(\overline{f}\Phi(f))$.
  refs:
    - ref: sanders2019b
      role: origin
      loc: Definitions 5.2 and 5.3
    - ref: normannsanders2021
      role: rm
      loc: Definition 3.9
    - ref: sanders2021
      role: rm
      loc: Principle 1.7

- id: ncc
  label: \mathsf{NCC}
  name: Weak countable choice NCC
  kind: sentence
  order: 3
  tags:
    - higher-order
  definition: >
    For $Y^2$ and $A(n, m) \equiv (\exists f \in 2^\mathbb{N})(Y(f, m, n) = 0)$: $(\forall n^0)(\exists m^0)A(n, m)
    \rightarrow (\exists g^1)(\forall n^0)A(n, g(n))$.
  refs:
    - ref: normannsanders2020
      role: origin
      loc: Definition 1.1
    - ref: normannsanders2020b
      role: rm
      loc: Principle 3.29
    - ref: sanders2020
      role: rm
      loc: Principle 3.10

- id: scf
  label: (\exists \Theta)\,\mathsf{SCF}(\Theta)
  name: Existence of a special fan functional
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - SCF(Θ)
    - SFF(Θ)
    - special fan functional
  definition: >
    There is $\Theta^{2 \to 1^*}$ with $(\forall G^2)(\forall f^1 \leq_1 1)(\exists g \in \Theta(G))(f \in
    [\overline{g}G(g)])$, where $f \in [\overline{g}G(g)]$ is the quantifier-free formula $\overline{f}G(g) =_{0^*}
    \overline{g}G(g)$: $\Theta(G)$ is a finite sub-cover of the canonical cover $\cup_{f \in 2^\mathbb{N}}
    [\overline{f}G(f)]$ of Cantor space.
  refs:
    - ref: normannsanders2017b
      role: rm
      loc: Definition 2.7
    - ref: normannsanders2018
      role: rm
      loc: Definition 2.1

- id: wff
  label: (\exists \Lambda)\,\mathsf{WFF}(\Lambda)
  name: Existence of a weak fan functional
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  aliases:
    - WFF(Λ)
    - WCF(Λ)
    - weak fan functional
  definition: >
    There is $\Lambda^{(2 \times 0) \to 1^*}$ with $(\forall G^2, k^0)\, \mathsf{m}(\{f \in 2^\mathbb{N} : (\exists g
    \in \Lambda(G, k))(f \in [\overline{g}G(g)])\}) \geq 1 - \frac{1}{2^k}$, $\mathsf{m}$ the coin-toss measure on
    $2^\mathbb{N}$.
  refs:
    - ref: normannsanders2018
      role: rm
      loc: Definition 2.2

- id: hbu
  label: \mathsf{HBU}
  name: Heine–Borel theorem for uncountable coverings (Cousin's lemma)
  kind: sentence
  order: 3
  tags:
    - higher-order
    - analysis
    - compactness
  aliases:
    - Cousin's lemma
  definition: >
    $(\forall \Psi : \mathbb{R} \to \mathbb{R}^+)(\exists \langle y_1, \ldots, y_k \rangle)(\forall x \in I)(\exists i
    \leq k)(x \in I^\Psi_{y_i})$, where $I = [0,1]$ and $I^\Psi_y = (y - \Psi(y), y + \Psi(y))$: the canonical cover
    $\cup_{x \in I} I^\Psi_x$ has a finite sub-cover.
  refs:
    - ref: normannsanders2017b
      role: origin
      loc: Section 3.1, (HBU)
    - ref: normannsanders2019
      role: rm
      loc: Principle 2.9
    - ref: normannsanders2021
      role: rm
      loc: Principle 1.9

- id: hbuc
  label: \mathsf{HBU}_{\mathsf{c}}
  name: Heine–Borel theorem for uncountable coverings of Cantor space
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
    - compactness
  aliases:
    - HBUc
  definition: >
    $(\forall G^2)(\exists f_1, \ldots, f_k \in 2^\mathbb{N})(\forall f \in 2^\mathbb{N})(\exists i \leq k)(f \in
    [\overline{f_i}G(f_i)])$.
  refs:
    - ref: normannsanders2021
      role: rm
      loc: Principle 1.10

- id: hbt
  label: \mathsf{HBT}
  name: Heine–Borel theorem for generalised canonical coverings
  caution: "The acronyms HB and HBT name the Heine–Borel covering lemma ([[heine-borel]]) and the Hahn–Banach theorem
    ([[hb]]) in other papers: check the definition in each paper."
  kind: sentence
  order: 3
  tags:
    - higher-order
    - analysis
    - compactness
  definition: >
    $(\forall \psi : I \to \mathbb{R})\big(I \subset \cup_{x \in I} I^\psi_x \rightarrow (\exists y_1, \ldots, y_k \in
    I)(I \subset \cup_{i \leq k} I^\psi_{y_i})\big)$, where $I^\psi_x = (x - \psi(x), x + \psi(x))$ may be empty, and $I
    \subset \cup_{x \in I} I^\psi_x$ means $(\forall x \in I)(\exists y \in I)(x \in I^\psi_y)$.
  refs:
    - ref: sanders2018d
      role: origin
      loc: Section 3.1, (HBT)
    - ref: normannsanders2021
      role: rm
      loc: Principle 1.11

- id: whbu
  label: \mathsf{WHBU}
  name: Weak Heine–Borel theorem for uncountable coverings (Vitali covering theorem)
  caution: "Formulations differ: sanders2018b states WHBU with the sum of the lengths of the intervals at least $1 -
    2^{-k}$, normannsanders2020b (Principle 2.8) with pairwise distinct points and the lengths of the disjointified
    intervals; this entry follows normannsanders2019."
  kind: sentence
  order: 3
  tags:
    - higher-order
    - analysis
    - analysis
  definition: >
    For $\Psi : [0,1] \to \mathbb{R}^+$ and $\varepsilon >_\mathbb{R} 0$, there are $y_0, \ldots, y_n \in [0,1]$ such
    that the measure of $\cup_{i \leq n} I^\Psi_{y_i}$ is at least $1 - \varepsilon$, the measure being read in the
    comparative ("virtual") sense of second-order reverse mathematics.
  refs:
    - ref: normannsanders2019
      role: rm
      loc: Principle 3.2, Remark 3.1
    - ref: sanders2018b
      role: rm
      loc: Section 3.5.2, (WHBU)

- id: hbc0
  label: \mathsf{HBC}_0
  name: Heine–Borel theorem for countable coverings given as countable sets
  kind: sentence
  order: 3
  tags:
    - higher-order
    - analysis
    - compactness
  aliases:
    - HBC0
  definition: >
    For countable $A \subset \mathbb{R}^2$ (Definition 1.4: there is $Y : \mathbb{R}^2 \to \mathbb{N}$ injective on $A$)
    with $(\forall x \in [0,1])(\exists (a, b) \in A)(x \in (a, b))$, there are $(a_0, b_0), \ldots, (a_k, b_k) \in A$
    with $(\forall x \in [0,1])(\exists i \leq k)(x \in (a_i, b_i))$.
  refs:
    - ref: normannsanders2021
      role: rm
      loc: Principle 3.1
    - ref: sanders2021
      role: rm
      loc: Principle 2.7
    - ref: normannsanders2020b
      role: rm
      loc: Principle 3.21

- id: lind
  label: \mathsf{LIND}
  name: Lindelöf lemma for uncountable coverings of ℝ
  caution: Also written LIN; but normannsanders2021 (Principle 3.4) uses LIN for a Lindelöf lemma for arbitrary subsets of
    Baire space, a different statement.
  kind: sentence
  order: 3
  tags:
    - higher-order
    - analysis
  aliases:
    - LIN
  definition: >
    For every $\Psi : \mathbb{R} \to \mathbb{R}^+$, there is a sequence of open intervals $\cup_{n \in \mathbb{N}} (a_n,
    b_n)$ covering $\mathbb{R}$ such that $(\forall n \in \mathbb{N})(\exists x \in \mathbb{R})[(a_n, b_n) = I^\Psi_x]$.
  refs:
    - ref: normannsanders2017b
      role: origin
      loc: Definition 3.10
    - ref: sanders2018b
      role: rm
      loc: Definition 3.17
    - ref: normannsanders2019
      role: rm
      loc: Principle 2.10

- id: lindbaire
  label: \mathsf{LIND}(\mathbb{N}^\mathbb{N})
  name: Lindelöf lemma for canonical coverings of Baire space
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - LIND(NN)
    - LIND4
  definition: >
    $(\forall \Psi^2)(\exists f_{(\cdot)}^{0 \to 1})(\forall g^1)(\exists n^0)\big(g \in
    [\overline{f_n}\Psi(f_n)]\big)$: the canonical covering $\cup_{f \in \mathbb{N}^\mathbb{N}} [\overline{f}\Psi(f)]$
    of Baire space has a countable sub-covering.
  refs:
    - ref: normannsanders2017b
      role: origin
      loc: Section 4.1.2, (LIND₄)
    - ref: normannsanders2018b
      role: rm
      loc: Section 5, (LIND(ℕ^ℕ))
    - ref: sanders2019b
      role: rm
      loc: Definition 5.5

- id: pito
  label: \mathsf{PIT}_o
  name: Pincherle's theorem (original version) for Cantor space
  kind: sentence
  order: 3
  tags:
    - higher-order
    - analysis
  aliases:
    - PITo
  definition: >
    $(\forall F, G : 2^\mathbb{N} \to \mathbb{N})(\exists N \in \mathbb{N})\big(\mathrm{LOC}(F, G) \rightarrow (\forall
    g \in 2^\mathbb{N})(F(g) \leq N)\big)$, where $\mathrm{LOC}(F, G) \equiv (\forall f, g \in 2^\mathbb{N})(g \in
    [\overline{f}G(f)] \rightarrow F(g) \leq G(f))$ ($G$ bounds $F$ locally).
  refs:
    - ref: normannsanders2018b
      role: origin
      loc: Section 1.3.1, (PIT_o)

- id: pitu
  label: \mathsf{PIT}_u
  name: Uniform Pincherle's theorem for Cantor space
  kind: sentence
  order: 3
  tags:
    - higher-order
    - analysis
  aliases:
    - PITu
  definition: >
    $(\forall G : 2^\mathbb{N} \to \mathbb{N})(\exists N \in \mathbb{N})(\forall F : 2^\mathbb{N} \to
    \mathbb{N})\big(\mathrm{LOC}(F, G) \rightarrow (\forall g \in 2^\mathbb{N})(F(g) \leq N)\big)$, with $\mathrm{LOC}$
    as in $\mathsf{PIT}_o$.
  refs:
    - ref: normannsanders2018b
      role: origin
      loc: Section 1.3.1, (PIT_u)

- id: bwnet
  label: \mathsf{BW}_{\mathrm{net}}
  name: Bolzano–Weierstrass theorem for nets
  kind: sentence
  order: 3
  tags:
    - higher-order
    - analysis
  aliases:
    - BWnet
  definition: >
    Every net in the unit interval has a convergent sub-net, where nets are restricted to index sets $D \subseteq
    \mathbb{N}^\mathbb{N}$ (a directed set given by the characteristic function of its relation).
  refs:
    - ref: normannsanders2017b
      role: origin
      loc: Section 3.4, Definition 3.36, Theorem 3.37
    - ref: sanders2019
      role: rm
      loc: Section 3.1.1, Definition 2.7

- id: mctnet
  label: \mathsf{MCT}_{\mathrm{net}}
  name: Monotone convergence theorem for nets
  caution: normannsanders2019 (Principle 3.36) uses MCT_net for a different statement about increasing nets of continuous
    functions and their Riemann integrals; sanders2019b (Definition 3.6) uses MCT^C_net for Cantor space with the
    lexicographic order.
  kind: sentence
  order: 3
  tags:
    - higher-order
    - analysis
  aliases:
    - MCTnet
    - MCT0net
  definition: |
    Every increasing net in the unit interval converges, where nets are indexed by subsets of $\mathbb{N}^\mathbb{N}$.
  refs:
    - ref: sanders2019
      role: rm
      loc: Section 3.1.2
    - ref: sanders2019c
      role: rm
      loc: Definition 3.4

- id: nin
  label: \mathsf{NIN}
  name: No injection from [0,1] to ℕ
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - NIN[0,1]
  definition: >
    For any $Y : [0,1] \to \mathbb{N}$, there are $x, y \in [0,1]$ such that $x \neq_\mathbb{R} y$ and $Y(x)
    =_\mathbb{N} Y(y)$.
  refs:
    - ref: normannsanders2020b
      role: origin
      loc: Principle 1.2
    - ref: normannsanders2026
      role: rm
      loc: Principle 1.1

- id: nbi
  label: \mathsf{NBI}
  name: No bijection from [0,1] to ℕ
  kind: sentence
  order: 3
  tags:
    - higher-order
  definition: >
    For any $Y : [0,1] \to \mathbb{N}$, either there are $x, y \in [0,1]$ such that $x \neq_\mathbb{R} y$ and $Y(x)
    =_\mathbb{N} Y(y)$, or there is $N \in \mathbb{N}$ such that $(\forall x \in [0,1])(Y(x) \neq N)$.
  refs:
    - ref: normannsanders2020b
      role: origin
      loc: Principle 1.3

- id: ninalt
  label: \mathsf{NIN}_{\mathrm{alt}}
  name: The unit interval is not height countable
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - NINalt
  definition: >
    The unit interval is not height countable, where $A \subset \mathbb{R}$ is height countable if there is a height
    function $H : \mathbb{R} \to \mathbb{N}$ for $A$, i.e. for all $n \in \mathbb{N}$, $A_n := \{x \in A : H(x) < n\}$
    is finite (finite in the sense of Definition 1.2 of the paper).
  refs:
    - ref: sanders2022b
      role: origin
      loc: Section 1.1, Definitions 1.1 and 1.2
    - ref: normannsanders2024b
      role: rm
      loc: Principle 3.5
    - ref: sanders2023b
      role: rm
      loc: Principle 3.2

- id: cocode0
  label: \mathsf{cocode}_0
  name: Countable subsets of [0,1] can be enumerated
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - cocode0
  definition: >
    For any non-empty countable set $A \subseteq [0,1]$, there is a sequence $(x_n)_{n \in \mathbb{N}}$ in $A$ such that
    $(\forall x \in \mathbb{R})(x \in A \leftrightarrow (\exists n \in \mathbb{N})(x_n =_\mathbb{R} x))$; here $A
    \subset \mathbb{R}$ is countable if there is $Y : \mathbb{R} \to \mathbb{N}$ with $(\forall x, y \in A)(Y(x) =_0
    Y(y) \rightarrow x =_\mathbb{R} y)$.
  refs:
    - ref: normannsanders2021
      role: rm
      loc: Principle 1.6, Definition 1.4
    - ref: sanders2019d
      role: rm
      loc: Principle 6.2

- id: cocode1
  label: \mathsf{cocode}_1
  name: Strongly countable subsets of [0,1] can be enumerated
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  aliases:
    - cocode1
  definition: >
    $\mathsf{cocode}_0$ restricted to strongly countable sets: for any non-empty strongly countable $A \subseteq [0,1]$
    (there is $Y : \mathbb{R} \to \mathbb{N}$ injective on $A$ and surjective, $(\forall n \in \mathbb{N})(\exists x \in
    A)(Y(x) = n)$), there is a sequence $(x_n)_{n \in \mathbb{N}}$ in $A$ such that $(\forall x \in \mathbb{R})(x \in A
    \leftrightarrow (\exists n)(x_n =_\mathbb{R} x))$.
  refs:
    - ref: normannsanders2021
      role: rm
      loc: Section 2.2.1, Definition 1.4

- id: cbn
  label: \mathsf{CBN}
  name: Cantor–Bernstein theorem for ℕ (countable subsets of ℝ)
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  definition: >
    A countable set $A \subset \mathbb{R}$ is strongly countable if there exists a sequence $(x_n)_{n \in \mathbb{N}}$
    of pairwise distinct reals such that $(\forall n \in \mathbb{N})(x_n \in A)$ (countable and strongly countable as in
    $\mathsf{cocode}_0$, $\mathsf{cocode}_1$).
  refs:
    - ref: sanders2020
      role: origin
      loc: Principle 3.9
    - ref: normannsanders2021
      role: rm
      loc: Principle 2.14

- id: bwc0fun
  label: \mathsf{BW}^{\mathsf{C}}_0
  name: Bolzano–Weierstrass theorem for countable subsets of Cantor space
  caution: Normann and Sanders (normannsanders2021) write $\mathsf{BWC}^{\mathrm{fun}}_0$ for this statement and
    $\mathsf{BWC}_0$ for the version without $F$ (sup A exists), while sanders2019d and normannsanders2020b call this
    statement $\mathsf{BW}^{\mathsf{C}}_0$.
  kind: sentence
  order: 3
  tags:
    - higher-order
    - analysis
  aliases:
    - BWC0
    - BWCfun0
  definition: >
    For any countable $A \subset 2^\mathbb{N}$ and $F : 2^\mathbb{N} \to 2^\mathbb{N}$, the supremum $\sup_{f \in A}
    F(f)$ exists (lexicographic order; countable as in $\mathsf{cocode}_0$).
  refs:
    - ref: sanders2019d
      role: rm
      loc: Principle 6.3
    - ref: normannsanders2020b
      role: rm
      loc: Principle 3.24
    - ref: normannsanders2021
      role: rm
      loc: Principle 1.1 and the variants listed after it

# quantifier-free choice, used as an extra base axiom (RCA₀^ω + QF-AC^{0,1}…): results proved over such a base
# are entered as implications from the conjunction with it
- id: qfac01
  label: '\mathsf{QF\text{-}AC}^{0,1}'
  name: Quantifier-free choice from numbers to functions
  kind: sentence
  tags: [ higher-order ]
  aliases: [ 'QF-AC^{0,1}', QF-AC01, 'QF-AC0,1' ]
  definition: >
    $(\forall x^0)(\exists y^1)A(x, y) \to (\exists Y^{0\to1})(\forall x^0)A(x, Y(x))$ for quantifier-free $A$ (the scheme
    $\mathsf{QF\text{-}AC}^{\sigma,\tau}$ with $\sigma = 0$, $\tau = 1$). It only mentions numbers and functions on $\mathbb{N}$.
  refs:
    - { ref: normannsanders2017b, role: rm, loc: Definition 2.4 }

- id: qfac11
  label: '\mathsf{QF\text{-}AC}^{1,1}'
  name: Quantifier-free choice from functions to functions
  kind: sentence
  order: 3
  minor: true
  tags: [ higher-order ]
  aliases: [ 'QF-AC^{1,1}', QF-AC11, 'QF-AC1,1' ]
  definition: >
    $(\forall x^1)(\exists y^1)A(x, y) \to (\exists Y^{1\to1})(\forall x^1)A(x, Y(x))$ for quantifier-free $A$ (the scheme
    $\mathsf{QF\text{-}AC}^{\sigma,\tau}$ with $\sigma = \tau = 1$).
  refs:
    - { ref: normannsanders2017b, role: rm, loc: Definition 2.4 }

- id: qfac21
  label: '\mathsf{QF\text{-}AC}^{2,1}'
  name: Quantifier-free choice from type-2 functionals to functions
  kind: sentence
  order: 3
  tags: [ higher-order ]
  aliases: [ 'QF-AC^{2,1}', QF-AC21, 'QF-AC2,1' ]
  definition: >
    $(\forall x^2)(\exists y^1)A(x, y) \to (\exists Y^{2\to1})(\forall x^2)A(x, Y(x))$ for quantifier-free $A$ (the scheme
    $\mathsf{QF\text{-}AC}^{\sigma,\tau}$ with $\sigma = 2$, $\tau = 1$). Used as an extra base axiom, as in $\mathsf{RCA}_0^\omega +
    \mathsf{QF\text{-}AC}^{2,1}$.
  refs:
    - { ref: normannsanders2017b, role: rm, loc: Definition 2.4 }

- id: indomega
  label: \mathsf{IND}
  name: Induction axiom for all formulas of L_ω
  caution: Not $\mathsf{IND}_0$, $\mathsf{IND}_1$, $\mathsf{IND}_2$ ([[ind03]], [[ind13]], [[ind23]]), which are
    finite-choice principles named after induction. normannsanders2019b writes $\mathsf{IND}_\omega$.
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - IND
    - IND_ω
    - INDω
    - INDomega
  definition: >
    The induction axiom for all formulas of $\mathsf{L}_\omega$ (the language of higher-order arithmetic, with
    parameters of any finite type). $\mathsf{RCA}_0^\omega + \mathsf{IND}$ has the first-order strength of Peano
    arithmetic. Used as an extra base axiom, as in $\mathsf{RCA}_0^\omega + \mathsf{IND}$.
  refs:
    - ref: sanders2019b
      role: rm
      loc: Section 2.1, IND
    - ref: normannsanders2018b
      role: rm
      loc: Section 4.2, IND (before Corollary 4.7)
    - ref: normannsanders2019b
      role: rm
      loc: Section 2.1, IND_ω
    - ref: sanders2020b
      role: rm
      loc: Section 3.3, IND (before Theorem 3.10)

- id: sigmaind3
  label: \Sigma\text{-}\mathsf{IND}
  name: Third-order Σ-induction
  caution: "Not $\\Sigma^0_1$- or $\\Sigma^1_1$-induction: the formulas have the form $(\\exists f \\in
    \\mathbb{N}^\\mathbb{N})(Y(f,n) = 0)$ with a type-2 parameter $Y$ (the same class as in [[sigmasep3]])."
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - Σ-IND
    - IND_Σ
    - INDΣ
  definition: >
    The induction axiom for formulas $\varphi(n) \equiv (\exists f \in \mathbb{N}^\mathbb{N})(Y(f, n) = 0)$, for any
    $Y^2$ ("Σ-formulas"). Used as an extra base axiom, as in $\mathsf{ACA}_0^\omega + \Sigma\text{-}\mathsf{IND}$.
  refs:
    - ref: sanderstaranovsky2026
      role: rm
      loc: Principle 1.4
    - ref: sanders2024c
      role: rm
      loc: Principle 1.4
    - ref: sanders2026b
      role: rm
      loc: Principle 1.5
    - ref: sanders2020
      role: rm
      loc: Section 3.3.1, IND_Σ (before Corollary 3.22)

- id: ind13
  label: \mathsf{IND}_1
  name: Finite choice for unique witnesses (IND₁)
  caution: "The label $\\mathsf{IND}_1$ is not an induction scheme for a formula class (see [[ind03]]): sanders2024d
    defines it as its $\\mathsf{IND}_2$ with $(\\exists f \\in 2^\\mathbb{N})$ restricted to $(\\exists! f \\in
    2^\\mathbb{N})$, which is the same principle."
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  aliases:
    - IND1
  definition: >
    Let $Y^2$ satisfy $(\forall n \in \mathbb{N})(\exists! f \in 2^\mathbb{N})[Y(n, f) = 0]$. Then $(\forall n \in
    \mathbb{N})(\exists w^{1^*})\big[|w| = n \wedge (\forall i < n)(Y(i, w(i)) = 0)\big]$. A special case of finite
    choice, trivial under $\neg(\exists^2)$.
  refs:
    - ref: normannsanders2021
      role: rm
      loc: Principle 2.3
    - ref: sanders2024
      role: rm
      loc: Principle 2.1
    - ref: sanders2024d
      role: rm
      loc: Section 2.1, after Principle 2.3

- id: ind23
  label: \mathsf{IND}_2
  name: Finite choice for Σ-formulas (IND₂)
  caution: "The label $\\mathsf{IND}_2$ is not an induction scheme for a formula class (see [[ind03]]). sanders2024d
    (Principle 2.3) states it with the hypothesis for all $n$: if $(\\forall n)(\\exists f \\in 2^\\mathbb{N})[Y(n, f) =
    0]$, then $(\\forall n)(\\exists w^{1^*})[|w| = n \\wedge (\\forall i < n)(Y(i, w(i)) = 0)]$."
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  aliases:
    - IND2
  definition: >
    Let $Y^2, k^0$ satisfy $(\forall n \leq k)(\exists f \in 2^\mathbb{N})(Y(f, n) = 0)$. There is $w^{1^*}$ such that
    $(\forall n \leq k)(\exists i < |w|)(Y(w(i), n) = 0)$. A fragment of the induction axiom that also follows from
    $\mathsf{QF\text{-}AC}^{0,1}$.
  refs:
    - ref: normannsanders2022
      role: rm
      loc: Definition 2.18
    - ref: normannsanders2021
      role: rm
      loc: Definition 3.32
    - ref: sanders2024d
      role: rm
      loc: Principle 2.3

- id: indr
  label: \mathsf{IND}_{\mathbb{R}}
  name: Finite comprehension for Σ-formulas over the reals (IND_ℝ)
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  aliases:
    - IND_R
    - INDR
    - IND_ℝ
  definition: >
    For $F : (\mathbb{R} \times \mathbb{N}) \to \mathbb{N}$ and $k \in \mathbb{N}$, there is $X \subset \mathbb{N}$ such
    that $(\forall n \leq k)\big[(\exists x \in \mathbb{R})(F(x, n) = 0) \leftrightarrow n \in X\big]$: bounded
    comprehension for third-order Σ-formulas, provable from the induction axiom. Used as an extra base axiom, as in
    $\mathsf{ACA}_0^\omega + \mathsf{IND}_{\mathbb{R}}$.
  refs:
    - ref: sanders2023
      role: rm
      loc: Principle 2.22
    - ref: sanders2023b
      role: rm
      loc: Principle 3.13
    - ref: normannsanders2024b
      role: rm
      loc: Principle 3.21

- id: z2omega
  label: \mathsf{Z}_2^\omega
  name: Higher-order second-order arithmetic Z₂^ω (all functionals S²ₖ)
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - Z_2^ω
    - Z2omega
    - Z2^omega
    - Zω2
  definition: >
    $\mathsf{Z}_2^\omega \equiv \cup_k \Pi^1_k\text{-}\mathsf{CA}_0^\omega$, where $\Pi^1_k\text{-}\mathsf{CA}_0^\omega
    \equiv \mathsf{RCA}_0^\omega + (\mathsf{S}^2_k)$ and $(\mathsf{S}^2_k)$ expresses the existence of the functional
    $\mathsf{S}^2_k$ deciding the truth of $\Sigma^1_k$-formulas in normal form (function parameters allowed, type-2
    parameters not); as a statement, the conjunction of all $(\mathsf{S}^2_k)$, $k \geq 1$ ($(\mathsf{S}^2_1)$ is
    [[suslin]]). Conservative over $\mathsf{Z}_2$, like $\mathsf{Z}_2^\Omega \equiv \mathsf{RCA}_0^\omega + (\exists^3)$
    ([[exists3]]), but many third-order theorems provable in $\mathsf{Z}_2^\Omega$ are not provable in
    $\mathsf{Z}_2^\omega$.
  refs:
    - ref: normannsanders2019
      role: rm
      loc: Section 2.1.4, Z₂^ω
    - ref: normannsanders2017b
      role: rm
      loc: Section 1.3, Z₂^ω
    - ref: sanders2018b
      role: rm
      loc: Section 2.2, Z₂^ω

- id: mu1
  label: (\mu_1)
  name: Feferman's search operator μ₁
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  aliases:
    - µ1
    - (µ1)
    - μ_1
    - Feferman's second mu-operator
  definition: >
    $(\exists \mu_1^{1\to1})\big[(\forall f^1)\big((\exists g^1)(\forall x^0)(f(\overline{g}x) = 0) \rightarrow (\forall
    x^0)(f(\overline{\mu_1(f)}x) = 0)\big)\big]$: $\mu_1$ selects a witness for every $\Sigma^1_1$-formula in normal
    form that holds. normannsanders2018 takes $\Pi^1_1\text{-}\mathsf{CA}_0^\omega \equiv \mathsf{RCA}_0^\omega +
    (\mu_1)$, a $\Pi^1_3$-conservative extension of $\Pi^1_1\text{-}\mathsf{CA}_0$.
  refs:
    - ref: bergsanders2014
      role: rm
      loc: Section 4.1.2, (μ₁)
    - ref: normannsanders2018
      role: rm
      loc: Section 2.3, (μ₁)
    - ref: normannsanders2017
      role: rm
      loc: Section 3.2, (μ₁)

- id: ff
  label: \mathsf{FF}
  name: Tait's classical fan functional
  caution: Not the intuitionistic fan functional [[muc]] ($\mathsf{MUC}$), which applies to all $Y^2$ and contradicts
    $(\exists^2)$; $\mathsf{FF}$ only applies to continuous $Y^2$ and follows from $(\exists^2)$ (sanders2018b, Section
    3.1). sanders2024b (Corollary 2.9) quantifies over $Y^2$ continuous on $2^\mathbb{N}$ instead of
    $\mathbb{N}^\mathbb{N}$.
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - (FF)
    - FF(Φ)
    - Tait's fan functional
    - classical fan functional
  definition: >
    $(\exists \Phi^3)(\forall Y^2 \in \mathsf{cont})(\forall f, g \in C)\big(\overline{f}\Phi(Y) = \overline{g}\Phi(Y)
    \rightarrow Y(f) = Y(g)\big)$, where $Y \in \mathsf{cont}$ means that $Y$ is continuous on Baire space and $C =
    2^\mathbb{N}$: $\Phi$ gives a modulus of uniform continuity on Cantor space for every continuous type-2 functional.
  refs:
    - ref: sanders2018b
      role: rm
      loc: Section 3.1, (FF)
    - ref: normannsanders2018b
      role: rm
      loc: Section 4.2, (FF)
    - ref: normannsanders2017
      role: rm
      loc: Section 3.1, FF(Φ)
    - ref: sanders2024b
      role: rm
      loc: Corollary 2.9, (FF)

- id: qfac20
  label: \mathsf{QF\text{-}AC}^{2,0}
  name: Quantifier-free choice from type-2 functionals to numbers
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - QF-AC^{2,0}
    - QF-AC20
    - QF-AC2,0
  definition: >
    $(\forall x^2)(\exists y^0)A(x, y) \to (\exists Y^{2\to0})(\forall x^2)A(x, Y(x))$ for quantifier-free $A$ (the
    scheme $\mathsf{QF\text{-}AC}^{\sigma,\tau}$ with $\sigma = 2$, $\tau = 0$). Used as an extra base axiom, as in
    $\mathsf{WKL}_0^\omega + \mathsf{QF\text{-}AC}^{2,0}$.
  refs:
    - ref: sanders2018b
      role: rm
      loc: Definition 2.2
    - ref: bergsanders2014
      role: rm
      loc: Definition 2.2

- id: nfp03
  label: \mathsf{NFP}_0
  name: Neighbourhood function principle without codes (NFP₀)
  caution: sanders2019 restricts $\mathsf{NFP}_0$ to $\Pi^1_\infty$-formulas with a type-2 parameter; sanders2019b
    (Section 5.3) defines it for all formulas of $\mathsf{L}_\omega$ (as [[nfp3]] with $(\exists \Phi^2)$ for $(\exists
    \gamma \in K_0)$) and uses its fragment $\Sigma\vee\Pi\text{-}\mathsf{NFP}_0$; sanders2018d uses the fragment
    $\mathsf{C}\text{-}\mathsf{NFP}_0$.
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  aliases:
    - NFP0
    - NFP_0
  definition: >
    For any $\Pi^1_\infty$-formula $A$ with any type-2 parameter: $(\forall f^1)(\exists n^0)A(\overline{f}n)
    \rightarrow (\exists \Phi^2)(\forall f^1)A(\overline{f}\Phi(f))$. The special case of the neighbourhood function
    principle [[nfp3]] that gives a functional $\Phi$ instead of an RM code (associate) for it.
  refs:
    - ref: sanders2019
      role: rm
      loc: Definition 3.4
    - ref: sanders2019b
      role: rm
      loc: Section 5.3, NFP₀

- id: jordan3
  label: \textsf{Jordan decomposition (third order)}
  name: Jordan decomposition theorem for arbitrary functions of bounded variation
  caution: "The third-order version, for arbitrary (uncoded) $f : [0,1] \\to \\mathbb{R}$; [[jordan]] ($\\mathsf{JD}$) is
    the second-order version for codes, provable in $\\mathsf{ACA}_0$. sanders2024d (Definition 3.1, Theorem 3.2) states
    it for functions with a total variation (item (b): the supremum exists), a different statement."
  kind: sentence
  order: 3
  tags:
    - higher-order
    - analysis
  aliases:
    - Jordan decomposition theorem (third-order)
  definition: >
    A function $f : [0,1] \to \mathbb{R}$ of bounded variation is the difference of two non-decreasing functions $g, h :
    [0,1] \to \mathbb{R}$. Here $f$ has bounded variation if there is $k_0 \in \mathbb{N}$ such that $k_0 \geq
    \sum_{i=0}^{n-1} |f(x_i) - f(x_{i+1})|$ for any partition $0 = x_0 < x_1 < \dots < x_n = 1$ (the supremum of these
    sums need not exist).
  refs:
    - ref: normannsanders2022
      role: rm
      loc: Definition 1.3(a), Theorem 1.4
    - ref: normannsanders2021
      role: rm
      loc: Definition 3.26(a), Theorem 3.27
    - ref: normannsanders2024b
      role: rm
      loc: Theorem 2.9
    - ref: sanders2022b
      role: rm
      loc: Definition 1.12(a), Theorem 1.13

- id: udnr
  label: \mathsf{UDNR}
  name: Uniform diagonally non-recursive functions
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  aliases:
    - UDNR
  definition: >
    $(\exists \Psi^{1 \to 1})(\forall A^1)(\forall e^0)\big(\Psi(A)(e) \neq \Phi^A_e(e)\big)$: the uniform version of
    $\mathsf{DNR}$, where $\Psi$ produces, uniformly in $A$, a function that is diagonally non-recursive relative to
    $A$. Explicitly equivalent to $(\mu^2)$, hence to $(\exists^2)$, over $\mathsf{RCA}_0^\omega$ (sanders2014b,
    Corollary 3.4).
  refs:
    - ref: sanders2014b
      role: rm
      loc: Section 1, (UDNR); Section 3, Corollary 3.4
    - ref: sanders2016
      role: rm
      loc: Section 1, (UDNR)
    - ref: sanders2016b
      role: rm
      loc: Section 4.3, UDNR

- id: kappa03
  label: (\kappa_0^3)
  name: Comprehension on Cantor space (κ₀³)
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - κ30
    - (κ30)
    - κ₀³
  definition: >
    $(\exists \kappa_0^3 \leq_3 1)(\forall Y^2)\big[\kappa_0(Y) = 0 \leftrightarrow (\exists f \in C)(Y(f) = 0)\big]$,
    where $C = 2^\mathbb{N}$ is Cantor space (sanders2018b and sanders2018d write $Y(f) > 0$ instead of $Y(f) = 0$, an
    inessential difference). $(\exists^3) \leftrightarrow [(\exists^2) + (\kappa_0^3)]$ (Kohlenbach).
  refs:
    - ref: normannsanders2018b
      role: rm
      loc: Section 2.3, (κ₀³)
    - ref: sanders2018b
      role: rm
      loc: Section 3.1, (κ₀³)
    - ref: normannsanders2017b
      role: rm
      loc: Section 4.1.2, (κ₀³)
    - ref: normannsanders2020
      role: rm
      loc: Section 2.2, (κ₀³)

- id: bootminusc
  label: \mathsf{BOOT}^-_C
  name: Bootstrap principle with unique witnesses, restricted to Cantor space
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  aliases:
    - BOOT−C
    - BOOT− C
  definition: >
    For all $Y^2$ such that $(\forall n^0)(\exists \text{ at most one } f \in 2^\mathbb{N})(Y(f, n) = 0)$, we have
    $(\exists X \subset \mathbb{N})(\forall n \in \mathbb{N})\big(n \in X \leftrightarrow (\exists g \in
    2^\mathbb{N})(Y(g, n) = 0)\big)$: $\mathsf{BOOT}^-$ with $\mathbb{N}^\mathbb{N}$ replaced by $2^\mathbb{N}$.
  refs:
    - ref: normannsanders2020b
      role: rm
      loc: Section 3.2.5, proof of Theorem 3.25, (3.4)
    - ref: sanders2020
      role: rm
      loc: Section 2.2; Theorem 3.16(iii)

- id: open
  label: \mathsf{open}
  name: Open sets of reals have countable codes (coding principle)
  kind: sentence
  order: 3
  tags:
    - higher-order
    - analysis
  definition: >
    For every open set $Y \subseteq \mathbb{R}$ there is $X \subset \mathbb{N}$ such that $(\forall n \in \mathbb{N})(n
    \in X \leftrightarrow B(q_n, r_n) \subseteq Y)$, where $(q_n, r_n)_{n}$ enumerates the basic open balls with
    rational centre and radius. Here (Definition 1.2) $Y : \mathbb{R} \to \mathbb{R}$ represents the set $\{x : Y(x)
    >_\mathbb{R} 0\}$, called open if every point of it has an open ball around it contained in it; thus $\mathsf{open}$
    says that every open set given by a (third-order, possibly discontinuous) characteristic function is RM-open.
  refs:
    - ref: normannsanders2019b
      role: rm
      loc: Definition 4.1, Definition 1.2
    - ref: sanderstaranovsky2026
      role: rm
      loc: Theorem 3.15(d)
    - ref: sanders2024c
      role: rm
      loc: Remark 2.28
    - ref: normannsanders2020b
      role: rm
      loc: Section 3.2.5, list after Theorem 3.25, item (d)

- id: openminus
  label: \mathsf{open}^-
  name: Open sets with a radius function have countable codes
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
    - analysis
  aliases:
    - open−
  definition: >
    Every open set $O \subseteq [0,1]$ represented by $Y : [0,1] \to [0,1]$ with $O = \{x : Y(x) >_\mathbb{R} 0\}$ and
    $(x - Y(x), x + Y(x)) \cap [0,1] \subseteq O$ whenever $Y(x) > 0$ (representation (R.2)) is a countable union
    $\bigcup_{n} (a_n, b_n)$ of intervals with rational end-points (representation (R.4)). sanderstaranovsky2026 states
    it on $\mathbb{R}$: every R2-open set ($Y : \mathbb{R} \to \mathbb{R}^+ \cup \{0\}$ with $x \in O \leftrightarrow
    Y(x) > 0$ and $B(x, Y(x)) \subset O$) is RM-open. Provable in $\mathsf{RCA}_0^\omega + \mathsf{HBU} +
    \mathsf{QF\text{-}AC}^{0,1}$ (normannsanders2019b, Theorem 7.8).
  refs:
    - ref: normannsanders2019b
      role: rm
      loc: Definition 7.7, Section 7 (R.2), (R.4)
    - ref: sanderstaranovsky2026
      role: rm
      loc: Definitions 3.13, 3.14

- id: openplus
  label: \mathsf{open}^+
  name: Open sets given as uncountable unions have countable codes
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
    - analysis
  aliases:
    - open+
  definition: >
    For every open set $Z \subseteq \mathbb{R}$ there is $X \subseteq \mathbb{N}$ with $(\forall n \in \mathbb{N})(n \in
    X \leftrightarrow B(q_n, r_n) \subseteq Z)$, where open sets are given as uncountable unions (Definition 4.2): $\psi
    : \mathbb{R} \to \mathbb{R}^2$ represents $O = \bigcup_{y \in \mathbb{R}} I^\psi_y$, with $I^\psi_y$ the open
    interval $(\psi(y)(1), \psi(y)(1) + |\psi(y)(2)|)$ (empty if the end-points coincide). $[\mathsf{BOOT} +
    \mathsf{ACA}_0] \leftrightarrow \mathsf{open}^+$ over $\mathsf{RCA}_0^\omega + \mathsf{QF\text{-}AC}^{0,1}$
    (sanders2019b, Section 4.2.2).
  refs:
    - ref: sanders2019b
      role: rm
      loc: Definition 4.3, Definition 4.2
    - ref: normannsanders2020
      role: rm
      loc: Definition 3.13, Definition 3.12, Theorem 3.14

- id: ury
  label: \mathsf{URY}
  name: Urysohn's lemma for closed sets given by characteristic functions
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
    - analysis
  aliases:
    - URY
  definition: >
    For closed disjoint sets $C_0, C_1 \subseteq \mathbb{R}$, there is a continuous function $g : \mathbb{R} \to [0,1]$
    such that $x \in C_i \leftrightarrow g(x) = i$ for any $x \in \mathbb{R}$ and $i \in \{0,1\}$; closed sets are
    complements of open sets given by characteristic functions as in $\mathsf{open}$ (normannsanders2019b, Definition
    1.2; normannsanders2020, Definition 3.4). $\mathsf{URY} \leftrightarrow \mathsf{open}$ over $\mathsf{ACA}_0^\omega$
    (normannsanders2019b, Theorem 5.3).
  refs:
    - ref: normannsanders2019b
      role: rm
      loc: Definition 5.1, Theorem 5.3
    - ref: normannsanders2020
      role: rm
      loc: Definition 3.9, Definition 3.4

- id: tie
  label: \mathsf{TIE}
  name: Tietze extension theorem for closed sets given by characteristic functions
  caution: Not the second-order Tietze extension theorem $\mathsf{TET}$ (id tietze) nor the strong Tietze theorems for codes.
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
    - analysis
  aliases:
    - TIE
  definition: >
    For $f : \mathbb{R} \to \mathbb{R}$ continuous on the closed $D \subseteq [0,1]$, there is $g : \mathbb{R} \to
    \mathbb{R}$, continuous on $[0,1]$, such that $f(x) =_\mathbb{R} g(x)$ for $x \in D$; closed sets are complements of
    open sets given by characteristic functions (normannsanders2019b, Definition 1.2; normannsanders2020, Definition
    3.4).
  refs:
    - ref: normannsanders2019b
      role: rm
      loc: Definition 5.5, Theorem 5.6
    - ref: normannsanders2020
      role: rm
      loc: Definition 3.10, Definition 3.4

- id: hbcs
  label: \mathsf{HBC}_s
  name: Heine–Borel theorem for countable coverings by open sets (closed sets without codes)
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
    - analysis
    - compactness
  aliases:
    - HBCs
  definition: >
    Let $C \subseteq [0,1]$ be closed and let $(O_n)_{n \in \mathbb{N}}$ be a sequence of open sets with $C \subseteq
    \bigcup_{n} O_n$. Then $C \subseteq \bigcup_{n \leq n_0} O_n$ for some $n_0 \in \mathbb{N}$. Open and closed sets
    are given by characteristic functions, without codes. Not provable in $\mathsf{Z}_2^\omega$, already for $C = [0,1]$
    (normannsanders2019b, Theorem 3.15). Not $\mathsf{HBC}_0$ (coverings given as countable sets of intervals).
  refs:
    - ref: normannsanders2019b
      role: rm
      loc: Definition 3.14, Theorem 3.15
    - ref: normannsanders2024
      role: rm
      loc: Principle 2.4

- id: bct01
  label: \mathsf{BCT}_{[0,1]}
  name: Baire category theorem for open sets given by characteristic functions
  caution: >
    The acronym BCT also names Brattka–Gherardi's Weihrauch problems $\mathsf{BCT}_0$–$\mathsf{BCT}_3$ and Sanders'
    "Brouwer continuity theorem" (sanders2015d, Section 6).
  kind: sentence
  order: 3
  tags:
    - higher-order
    - analysis
  aliases:
    - BCT[0,1]
  definition: >
    If $(O_n)_{n \in \mathbb{N}}$ is a (decreasing) sequence of dense open sets of reals in $[0,1]$, then $\bigcap_{n}
    O_n$ is non-empty; sets are given by characteristic functions, without codes. sanders2023 and sanders2023b assume
    $O_{n+1} \subseteq O_n$ to avoid induction; normannsanders2019b (called $\mathsf{BCT}$ there) and
    normannsanders2024b state it for arbitrary sequences, normannsanders2019b over $\mathbb{R}$. Not provable in
    $\mathsf{Z}_2^\omega + \mathsf{QF\text{-}AC}^{0,1}$ (normannsanders2019b, Theorem 6.16); provable in
    $\mathsf{RCA}_0^\omega + \mathsf{BOOT}$.
  refs:
    - ref: sanders2023
      role: rm
      loc: Principle 2.1
    - ref: normannsanders2019b
      role: rm
      loc: Section 6.2.2, (BCT), Theorems 6.14, 6.16
    - ref: normannsanders2024b
      role: rm
      loc: Section 3.3.2, (BCT[0,1])
    - ref: sanders2023b
      role: rm
      loc: Principle 3.16
    - ref: sanderstaranovsky2026
      role: rm
      loc: Section 4.1, list

- id: php01
  label: \mathsf{PHP}_{[0,1]}
  name: Tao's pigeonhole principle for measure (closed sets of reals)
  kind: sentence
  order: 3
  tags:
    - higher-order
    - analysis
  aliases:
    - PHP[0,1]
  definition: >
    If $(X_n)_{n \in \mathbb{N}}$ is an increasing sequence of measure zero closed sets of reals in $[0,1]$, then
    $\bigcup_{n} X_n$ has measure zero. Sets are given by characteristic functions, without codes; $A$ has measure zero
    if for every $\varepsilon > 0$ there is a sequence of open intervals $(I_n)_n$ covering $A$ with $\sum_n |I_n| <
    \varepsilon$ (Definition 1.8), so no Lebesgue measure is needed.
  refs:
    - ref: sanders2023
      role: rm
      loc: Principle 3.5, Definition 1.8
    - ref: sanders2023b
      role: rm
      loc: Principle 3.12
    - ref: normannsanders2024b
      role: rm
      loc: Principle 3.22
    - ref: sanderstaranovsky2026
      role: rm
      loc: Section 4.1, list

- id: range3
  label: \mathsf{RANGE}
  name: Existence of the range of a type-two functional
  caution: Not the Weihrauch problem $\mathsf{Range}$ (id range), the range of an injection $\mathbb{N} \to \mathbb{N}$.
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  aliases:
    - RANGE
  definition: >
    $(\forall G : \mathbb{N}^\mathbb{N} \to \mathbb{N})(\exists X \subset \mathbb{N})(\forall n \in \mathbb{N})\big(n
    \in X \leftrightarrow (\exists f \in \mathbb{N}^\mathbb{N})(G(f) = n)\big)$. Equivalent to $\mathsf{BOOT}$ over
    $\mathsf{RCA}_0^\omega$ (sanders2019c, Theorem 3.6).
  refs:
    - ref: sanders2019c
      role: rm
      loc: Theorem 3.6
    - ref: sanders2019b
      role: rm
      loc: Theorem 3.17
    - ref: sanders2024c
      role: rm
      loc: Theorem 2.2, proof
    - ref: sanders2026
      role: rm
      loc: Theorem 2.3, proof

- id: enum
  label: \mathsf{enum}
  name: Height-countable subsets of [0,1] can be enumerated
  kind: sentence
  order: 3
  tags:
    - higher-order
  aliases:
    - enum
  definition: >
    A height-countable set in $[0,1]$ can be enumerated, i.e. there is a sequence of reals that includes all its
    elements. Here $A \subset \mathbb{R}$ is height-countable if there is a height function $H : \mathbb{R} \to
    \mathbb{N}$ for $A$: for all $n \in \mathbb{N}$, $A_n := \{x \in A : H(x) < n\}$ is finite (Definition 1.8: there is
    $N$ such that any $N+1$ distinct reals include one outside the set). Equivalently, a union over $\mathbb{N}$ of
    finite sets can be enumerated (sanders2026b, Remark 3.9). Generalizes $\mathsf{cocode}_0$.
  refs:
    - ref: sanders2023b
      role: rm
      loc: Principle 3.6, Definitions 1.7, 1.8
    - ref: normannsanders2024b
      role: rm
      loc: Principle 3.11
    - ref: sanders2026b
      role: rm
      loc: Remark 3.9

- id: ninc
  label: \mathsf{NIN}_{2^\mathbb{N}}
  name: No injection from Cantor space to ℕ
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
  aliases:
    - NIN2N
    - NIN^C
    - NINC
  definition: >
    There is no injection $Y : 2^\mathbb{N} \to \mathbb{N}$: for any $Y : 2^\mathbb{N} \to \mathbb{N}$ there are $f \neq
    g$ in $2^\mathbb{N}$ with $Y(f) = Y(g)$. Equivalent to $\mathsf{NIN}$ over $\mathsf{ACA}_0^\omega$ (sanders2022,
    Theorem 6, where it is written $\mathsf{NIN}^C$).
  refs:
    - ref: sanders2022
      role: rm
      loc: Section 2.1, Theorem 6
    - ref: normannsanders2026
      role: rm
      loc: Theorem 2.9
    - ref: sanders2026b
      role: rm
      loc: Section 3.2, proof of Theorem 3.12

- id: mctnet1
  label: \mathsf{MCT}^{\mathrm{net}}_1
  name: Monotone convergence theorem for nets with strongly countable index sets, with modulus
  caution: Not $\mathsf{MCT}^1_{\mathrm{net}}$ of sanders2019 (Appendix, Theorem A.3), for nets indexed by subsets of
    $\mathbb{N}^\mathbb{N} \to \mathbb{N}$.
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
    - analysis
  aliases:
    - MCTnet1
  definition: >
    $\mathsf{MCT}^{\mathrm{net}}_0$ restricted to strongly countable index sets and with a modulus of convergence in the
    conclusion, where $\mathsf{MCT}^{\mathrm{net}}_0$ is the monotone convergence theorem for nets in $[0,1]$ whose
    index set is $D = \{w : w$ a finite sequence without repetitions of elements of $A\}$ for a countable $A \subset
    \mathbb{R}$, ordered by inclusion. Equivalent to $\mathsf{cocode}_1$ over $\mathsf{ACA}_0^\omega$ (sanders2020,
    Theorem 3.21).
  refs:
    - ref: sanders2020
      role: rm
      loc: Section 3.3.1, (3.6), before Principle 3.20, Theorem 3.21
    - ref: normannsanders2021
      role: rm
      loc: Section 2.2.1

- id: pito2
  label: \mathsf{PIT}'_o
  name: Pincherle's theorem for Cantor space without a realiser for local boundedness
  kind: sentence
  order: 3
  minor: true
  tags:
    - higher-order
    - analysis
  aliases:
    - PIT′o
    - PIT'o
  definition: >
    $(\forall F^2)\big[(\forall f \in C)(\exists n^0)(\forall g \in C)\big(g \in [\overline{f}n] \rightarrow F(g) \leq
    n\big) \rightarrow (\exists m^0)(\forall h \in C)(F(h) \leq m)\big]$: $\mathsf{PIT}_o$ with the realiser $G$ for
    local boundedness replaced by local boundedness itself. $\mathsf{PIT}_o \leftrightarrow \mathsf{PIT}'_o
    \leftrightarrow \mathsf{WKL}$ over $\mathsf{RCA}_0^\omega + \mathsf{QF\text{-}AC}^{0,1}$ (normannsanders2018b);
    $\mathsf{NCC}$ suffices instead of $\mathsf{QF\text{-}AC}^{0,1}$ (normannsanders2020, Corollary 3.3).
  refs:
    - ref: normannsanders2018b
      role: rm
      loc: Section 4, after Corollary 4.8
    - ref: normannsanders2020
      role: rm
      loc: (3.3), Corollary 3.3
