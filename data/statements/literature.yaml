- id: fincoh
  label: '\mathsf{fin}\text{-}\mathsf{COH}'
  name: Finite cohesiveness principle
  kind: problem
  tags: [ cohesive ]
  definition: COH restricted to finite sequences of sets.
  refs: [ { ref: sun2025, role: rm } ]
  instance: A finite sequence of sets $R_0, \dots, R_{n-1}$.
  solution: An infinite set $C$ with $C \subseteq^* R_i$ or $C \subseteq^* \overline{R_i}$ for each $i < n$.

- id: tac
  label: '\mathsf{CAC}\text{ for trees}'
  name: CAC for trees
  kind: problem
  tags: [ orders, ramsey ]
  aliases: [ TCAC, CAC for trees ]
  caution: 'Not the tree antichain theorem TAC of Conidis ([[ctac]]), which only concerns completely branching c.e. binary trees and is strictly weaker: CAC for trees is equivalent to TAC + BΣ⁰₂ (Theorem 2.5 of [@cervellegaudelierpatey2022]).'
  definition: Every infinite subtree of $\mathbb{N}^{<\mathbb{N}}$ has an infinite path or an infinite antichain.
  instance: An infinite subtree $T$ of $\mathbb{N}^{<\mathbb{N}}$.
  solution: An infinite path of $T$ or an infinite antichain of $T$.
  refs: [ { ref: cervellegaudelierpatey2022, role: rm, loc: Definition 2.1 } ]

- id: ctac
  label: '\mathsf{TAC}'
  name: Tree antichain theorem (Conidis)
  kind: problem
  tags: [ orders ]
  aliases: [ tree antichain theorem ]
  caution: 'Not CAC for trees ([[tac]]), which is equivalent to TAC + BΣ⁰₂ (Theorem 2.5 of [@cervellegaudelierpatey2022]); TAC does not imply BΣ⁰₂.'
  definition: >
    Every infinite completely branching $\Sigma^0_1$-definable (c.e.) tree $T \subseteq 2^{<\mathbb{N}}$ has an infinite
    antichain; completely branching: if $\sigma i \in T$ then $\sigma(1-i) \in T$.
  instance: An infinite completely branching c.e. tree $T \subseteq 2^{<\mathbb{N}}$.
  solution: An infinite antichain of $T$.
  refs: [ { ref: dzhafarovmummert2022, role: rm, loc: Definition 11.6.7 (Conidis) }, { ref: cervellegaudelierpatey2022, role: rm, loc: Definition 2.4 } ]

- id: henson-indiv
  label: '\mathsf{IND}_{\mathcal{H}_3}'
  name: Indivisibility of the triangle-free Henson graph
  kind: problem
  tags: [ ramsey, graphs ]
  aliases: [ triangle-free Henson graph, Henson indivisibility ]
  definition: >
    For every 2-coloring of the vertices of the universal countable triangle-free (Henson) graph, there is a monochromatic set of vertices inducing a copy of the whole graph.
  instance: A 2-coloring of the vertices of the triangle-free Henson graph.
  solution: A monochromatic set of vertices inducing a copy of the graph.
  refs: [ { ref: liupatey2026, role: rm, loc: Main Theorem 1.6 } ]

