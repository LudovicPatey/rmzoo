    analysis: HYP is its minimum $\omega$-model.
  refs:
    - { ref: simpson2009, role: origin, loc: Definition VIII.4.12 }
    - { ref: montalban2006, role: rm, loc: Section 1.5 }

- id: indec
  label: '\mathsf{INDEC}'
  name: Jullien's indecomposability theorem
  kind: sentence
  tags: []
  aliases: [ INDEC0 ]
  phrases: [ Jullien's indecomposability theorem ]
  definition: >
    Every scattered indecomposable linear ordering is either indecomposable to the right or indecomposable to
    the left. A linear ordering $A$ is indecomposable if for every cut $\langle L, R \rangle$, $A$ embeds into $L$
    or into $R$; indecomposable to the right if it embeds into $R$ for every cut with $R$ nonempty (and to the
    left symmetrically).
  refs:
    - { ref: montalban2006, role: origin, loc: "Definition 1.2, Statement 1.3" }

- id: iht
  label: '\mathsf{IHT}'
  name: Iterated Hindman's theorem
  kind: sentence
  tags: [ ramsey ]
  definition: >
    For every sequence of 2-colorings $\langle C_i : i \in \mathbb{N} \rangle$ there is an increasing sequence $\langle x_i \rangle$ such that for every $j$, the set $\{x_i : i > j\}$ satisfies Hindman's theorem for $C_j$. Equivalent over $\mathsf{RCA}_0$ to AUF and to the Milliken–Taylor theorem $\mathsf{MT}^n$ for $n \ge 3$, and over $\mathsf{ACA}_0$ to the Auslander–Ellis theorem.
  refs:
    - { ref: dzhafarovmummert2022, role: rm, loc: Theorem 10.6.14 }

- id: padeg
  caution: 'In Weihrauch and computability papers this problem is usually written PA; here PA ([[pa]]) is first-order Peano arithmetic, the full induction scheme.'
  label: '\textsf{PA degrees}'
  name: PA degrees (problem)
  kind: problem
  tags: [ computability, weihrauch ]
  definition: Given $p$, find $q$ of PA degree relative to $p$ ($p \ll q$).
  instance: A set $p$.
  solution: A set $q$ with $p \ll q$, i.e. of PA degree relative to $p$.
  refs:
    - { ref: brattkachirache2026, role: rm, loc: "Definition 14(11)" }
    - { ref: brattkahendtlasskreuzer2017, role: rm, loc: "Definition 6.2 (on Turing degrees)" }

- id: sigma11ac
  label: '\Sigma^1_1\text{-}\mathsf{AC}'
  name: Σ¹₁ axiom of choice
  kind: sentence
  tags: []
  definition: >
    $\mathsf{ACA}_0$ plus the scheme $\forall n \exists Y \eta(n, Y) \to \exists Z \forall n \eta(n, (Z)_n)$ for $\Sigma^1_1$ formulas $\eta$. Strictly between $\Delta^1_1\text{-}\mathsf{CA}_0$ and $\mathsf{ATR}_0$; HYP is an $\omega$-model of it.
  refs:
    - { ref: simpson2009, role: rm, loc: "Definition VII.6.1(1)" }

- id: cacord
  label: '\mathsf{CAC}^{\mathrm{ord}}'
  name: Chain–antichain principle for ω-ordered partial orders
  kind: problem
  minor: true
  tags: [ orders, ramsey ]
  definition: >
    Every infinite $\omega$-ordered partial order ($x \le_P y$ implies $x \le y$) has an infinite chain or antichain.
  instance: An infinite $\omega$-ordered partial order $(P, \le_P)$.
  solution: An infinite chain or antichain of $P$.
  refs:
    - { ref: dzhafarovmummert2022, role: rm, loc: "Definition 9.2.30(2) (Hughes; Towsner)" }

- id: scacord
  label: '\mathsf{SCAC}^{\mathrm{ord}}'
  name: Stable chain–antichain principle for ω-ordered partial orders
  kind: problem
  minor: true
  tags: [ orders, ramsey, stable ]
  definition: >
    Every infinite $\omega$-ordered stable partial order has an infinite $\omega$-ordered chain or antichain.
  instance: An infinite $\omega$-ordered stable partial order $(P, \le_P)$.
  solution: An infinite chain or antichain of $P$.
  refs:
    - { ref: dzhafarovmummert2022, role: rm, loc: "Definition 9.2.30(3) (Hughes; Towsner)" }

- id: sdnr2
  label: '2\text{-}\mathsf{SDNR}'
  name: Stable diagonal non-computability
  kind: problem
  minor: true
  tags: [ ramsey, stable ]
  aliases: [ 2-SDNR ]
  definition: >
    Every $\Delta^0_2$ function $f : \mathbb{N} \to \mathbb{N}$ has an $f$-diagonalizing function,
    i.e. a function $g$ with $g(x) \neq f(x)$ for every $x$. A characterization of $\mathsf{SRRT}^2_2$.
  instance: 'A $\Delta^0_2$ function $f : \mathbb{N} \to \mathbb{N}$, given by an approximation $h$ with $f(x) = \lim_s h(x, s)$.'
  solution: 'A function $g$ with $g(x) \neq f(x)$ for every $x$.'
  refs: [ { ref: patey2016c, role: origin, loc: "Definition 12.4.1, Theorem 9.2.11(iii)" } ]

- id: rsat2b
  label: '\mathsf{RSAT}_{\text{2-branching}}'
  name: Ramsey-type satisfiability for 2-branching clauses
  kind: problem
  minor: true
  tags: [ ramsey, compactness ]
  definition: >
    $\mathsf{RSAT}$ restricted to 2-branching sets of clauses over atoms $\{a_i : i \in \mathbb{N}\}$:
    in every clause $\ell_0 \vee \dots \vee \ell_{n-1}$, each literal $\ell_i$ is $a_i$ or $\neg a_i$.
  instance: A finitely satisfiable 2-branching set $C$ of clauses.
  solution: An infinite set of atoms homogeneous for $C$.
  refs: [ { ref: patey2016c, role: origin, loc: Definition 11.2.4 } ]

- id: sigma02sep
  label: '\Sigma^0_2\textsf{-separation}'
  name: Σ⁰₂ separation principle
  kind: sentence
  minor: true
  tags: [ induction ]
  aliases: [ Σ02-separation, Σ02 separation principle ]
  definition: >
    For every two disjoint $\Sigma^0_2$ sets $A_0, A_1$ (with set parameters) there is a $\Delta^0_2$ set $D$
    with $A_0 \subseteq D$ and $D \cap A_1 = \emptyset$. Equivalent to $\mathsf{COH}$ over $\mathsf{RCA}_0 + \mathrm{B}\Sigma^0_2$.
  refs:
    - { ref: belanger2022, role: origin, loc: "Theorem 3(ii)" }
    - { ref: kowalik2024, role: rm, loc: Section 3.2 }

- id: ph
  label: '\mathsf{PH}'
  name: Paris–Harrington principle
  kind: sentence
  tags: [ ramsey, first-order ]
  aliases: [ Paris-Harrington theorem, Paris–Harrington theorem ]
  definition: >
    For all $n, k, l$ there is $u$ such that for every finite set $X$ of size at least $u$, every
    $k$-coloring of $[X]^n$ has a homogeneous set $H$ of size at least $l$ with $\min H \geq |H|$.
    An arithmetic sentence, true but not provable in Peano arithmetic.
  refs:
    - { ref: hirschfeldt2015, role: rm, loc: Section 6.3 }

- id: extomega
  label: '\mathsf{EXT}(\omega^*)'
  name: Well-ordered linear extensions
  kind: sentence
  tags: [ orders ]
  aliases: [ EXT(ω*) ]
  definition: >
    Every countable well-founded partial order has a well-ordered linear extension (the order type
    $\omega^*$ is weakly extendible).
  refs:
    - { ref: hirschfeldt2015, role: rm, loc: "Section 10.2, before Theorem 10.8" }
    - { ref: hirschfeldt2017, role: rm, loc: Definition 2.2 }

- id: extzeta
  label: '\mathsf{EXT}(\zeta)'
  name: Weak extendibility of ζ
  kind: sentence
  minor: true
  tags: [ orders ]
  aliases: [ EXT(ζ) ]
  definition: >
    Every countable partial order with no linear suborder of type $\zeta$ (the integers) has a linear
    extension with no suborder of type $\zeta$.
  refs:
    - { ref: hirschfeldt2015, role: rm, loc: "Definition 10.12, Theorem 10.18" }

- id: dm
  label: '\textsf{Dushnik–Miller}'
  name: Dushnik–Miller theorem (countable linear orders)
  kind: problem
  minor: true
  tags: [ orders ]
  aliases: [ Dushnik-Miller theorem ]
  definition: >
    Every countable infinite linear order has a nontrivial self-embedding (an order-preserving map
    into itself that is not the identity).
  instance: A countable infinite linear order $L$.
  solution: A nontrivial self-embedding of $L$.
  refs:
    - { ref: hirschfeldt2015, role: rm, loc: Section 10.1 }
    - { ref: downeylempp1999, role: rm }
    - { ref: simpson2009, role: rm, loc: Remark X.3.32 }

- id: atomic-trees
  label: '\textsf{Strongly atomic trees}'
  name: Atomic trees are strongly atomic
  kind: sentence
  minor: true
  tags: [ induction ]
  definition: >
    Every atomic binary tree with no dead ends is strongly atomic. A node $\sigma$ is an atom if it has exactly
    one extension of each length; the tree is atomic if every node extends to an atom, and strongly atomic if for
    all $\sigma_0, \dots, \sigma_n$ in the tree, each $\sigma_i$ extends to an atom.
  refs:
    - { ref: hirschfeldt2015, role: rm, loc: "Section 4.6, Exercise 4.35" }

# Theorems of hyperarithmetic analysis (Goh 2019, Chapters 6 and 7).
- id: finite-sigma11-ac
  label: '\textsf{finite-}\Sigma^1_1\textsf{-AC}_0'
  name: Σ¹₁ axiom of finite choice
  kind: sentence
  minor: true
  tags: [ big-five ]
  definition: >
    For every arithmetic $\varphi(n, Y)$: if for each $n$ there are finitely many $Y$ with $\varphi(n, Y)$, then there is a
    sequence $(Z_n)_n$ with $\varphi(n, Z_n)$ for every $n$ (implicitly, at least one $Y$; equivalently, a sequence of trees
    with finitely many paths has a sequence of paths). A theory of hyperarithmetic analysis.
  refs: [ { ref: goh2019b, role: origin, loc: Definition 6.6 } ]

- id: abw
  label: '\mathsf{ABW}_0'
  name: Arithmetic Bolzano–Weierstrass theorem
  kind: sentence
  minor: true
  tags: [ compactness ]
  aliases: [ ABW0, ABW ]
  definition: >
    For every arithmetic predicate $A(X)$ on $2^\mathbb{N}$, either $A$ has finitely many solutions or the set
    $\{X \in 2^\mathbb{N} : A(X)\}$ has an accumulation point.
  refs: [ { ref: goh2019b, role: rm, loc: Definition 6.7 } ]

- id: irt
  label: '\mathsf{IRT}'
  name: Infinite ray theorem (Halin)
  kind: sentence
  tags: [ graphs ]
  aliases: [ infinite ray theorem ]
  definition: >
    If a graph $G$ has, for each $k$, a set of $k$ disjoint rays, then it has an infinite set of disjoint rays. A natural
    theorem of hyperarithmetic analysis.
  refs: [ { ref: goh2019b, role: origin, loc: Definition 7.2 } ]

- id: wirt
  label: '\mathsf{WIRT}'
  name: Weak infinite ray theorem
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    If $G$ is a graph and $(X_k)_k$ is a sequence such that each $X_k$ is a set of $k$ disjoint rays of $G$, then $G$ has an
    infinite set of disjoint rays.
  refs: [ { ref: goh2019b, role: origin, loc: Definition 7.2 } ]

# Principles inspired by cardinal invariants (Belanger, Chong, Hölzl and Stephan 2024),
# stated for weakly represented families (Definition 1): by Lemma 2 every such family is
# contained in the total functions computable from some set. HI is hyp.
- id: dom
  label: '\mathsf{DOM}'
  name: Domination principle
  kind: problem
  tags: [ computability ]
  definition: >
    Every weakly represented family of functions has a function dominating it, i.e. eventually greater than each
    member; equivalently, for every set $C$ there is a function dominating every $C$-computable function. In
    ω-models, this is the existence of sets of high degree relative to any set (Martin).
  instance: A set $C$.
  solution: A function $g$ dominating every $C$-computable function.
  refs: [ { ref: belangeretal2024, role: rm, loc: "Statement 4, Definition 1, Lemma 2" } ]

- id: avoid
  label: '\mathsf{AVOID}'
  name: Avoidance principle
  kind: problem
  tags: [ computability ]
  definition: >
    Every weakly represented family of functions has a function eventually different from each member; equivalently,
    for every set $C$ there is a function eventually different from every $C$-computable function.
  instance: A set $C$.
  solution: A function $g$ eventually different from every $C$-computable function.
  refs: [ { ref: belangeretal2024, role: rm, loc: "Statement 17" } ]

- id: bi
  label: '\mathsf{BI}'
  name: Bi-immunity principle
  kind: problem
  tags: [ computability ]
  definition: >
    For every weakly represented family of infinite sets there is a set $B$ such that no member is contained in $B$
    or in its complement; equivalently, for every set $C$ there is a set which is bi-immune relative to $C$.
  instance: A set $C$.
  solution: A set $B$ such that neither $B$ nor its complement contains an infinite $C$-computable set.
  refs: [ { ref: belangeretal2024, role: rm, loc: "Statement 27" } ]

# Matchings in countable graphs (Flood, Jura, Levin and Markkanen 2022, Statement 2.1).
- id: pm
  label: '\mathsf{PM}'
  name: Perfect matching theorem (Steffens)
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    Every countable graph satisfying condition (A) (for every matching $M$ and every vertex outside $M$ there is an
    $M$-augmenting path starting at it) has a perfect matching.
  refs: [ { ref: floodetal2022, role: rm, loc: "Definition 1.1, Statement 2.1(1)" } ]

- id: mm
  label: '\mathsf{MM}'
  name: Maximal matching theorem (Steffens)
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    Every countable graph has a matching whose support is not properly contained in the support of another matching.
  refs: [ { ref: floodetal2022, role: rm, loc: "Statement 2.1(2)" } ]

- id: mim
  label: '\mathsf{MIM}'
  name: Maximal independent matching
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    Every countable graph has an independent matching whose support is not properly contained in the support of another
    independent matching.
  refs: [ { ref: floodetal2022, role: rm, loc: "Definition 4.1, Statement 2.1(3)" } ]

# Bounded diagonally non-recursive functions (Dorais, Hirst and Shafer 2014, Definition 2.6).
- id: udnrb
  label: '\exists k \forall f\, \mathsf{DNR}(k, f)'
  name: Uniformly bounded DNR
  kind: sentence
  minor: true
  tags: [ computability ]
  definition: There is a $k$ such that for every $f$ there is a $k$-bounded function which is diagonally non-recursive relative to $f$.
  refs: [ { ref: doraishirstshafer2014, role: origin, loc: Definition 2.6 } ]

- id: dnrb
  label: '\forall f \exists k\, \mathsf{DNR}(k, f)'
  name: Non-uniformly bounded DNR
  kind: sentence
  minor: true
  tags: [ computability ]
  definition: For every $f$ there are a $k$ and a $k$-bounded function which is diagonally non-recursive relative to $f$.
  refs: [ { ref: doraishirstshafer2014, role: origin, loc: Definition 2.6 } ]

- id: ucol
  label: '\forall \ell \exists k \forall G\, \mathsf{COL}(\ell, k, G)'
  name: Uniformly bounded coloring of locally colorable graphs
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    For every $\ell$ there is a $k$ such that every locally $\ell$-colorable graph is $k$-colorable (a graph is locally
    $\ell$-colorable when each finite induced subgraph is $\ell$-colorable).
  refs: [ { ref: doraishirstshafer2014, role: origin, loc: "Section 5, after Question 5.5" } ]

- id: col
  label: '\forall \ell \forall G \exists k\, \mathsf{COL}(\ell, k, G)'
  name: Non-uniformly bounded coloring of locally colorable graphs
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: For every $\ell$, every locally $\ell$-colorable graph is $k$-colorable for some $k$.
  refs: [ { ref: doraishirstshafer2014, role: origin, loc: "Section 5, after Question 5.5" } ]

# Frame definability in modal logic (Takeda 2026).
- id: vel
  label: '\mathsf{VEL}'
  name: Valuation extension lemma
  kind: sentence
  minor: true
  definition: >
    For every Kripke frame $(W, R)$ and every assignment $v : W \times \mathrm{Prop} \to 2$ of the propositional variables,
    there is a valuation on $(W, R)$ (a truth value for every modal formula at every world, respecting the clauses of
    the connectives and of $\Box$) extending $v$.
  refs: [ { ref: takeda2026, role: origin, loc: "Theorem 2.5, Definition 2.4" } ]

- id: rvel
  label: '\mathsf{VEL}_{\mathrm{res}}'
  name: Restricted valuation extension lemma
  kind: sentence
  minor: true
  definition: >
    For every Kripke frame $(W, R)$, assignment $v$ and $k$, there is a $k$-restricted valuation (defined on the formulas
    of modal degree at most $k$) extending $v$.
  refs: [ { ref: takeda2026, role: origin, loc: Corollary 2.6 } ]

# From Hirst's thesis (1987).
- id: cbbt
  label: '\textsf{Countable bounded Banach}'
  name: Countable bounded Banach theorem
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    For injections $f, g : \mathbb{N} \to \mathbb{N}$ whose ranges exist, there is a bijection $h : \mathbb{N} \to \mathbb{N}$ such
    that $h(n) = m$ implies $f(n) = m$ or $g(m) = n$ (the Cantor–Schröder–Bernstein argument of Banach).
  refs: [ { ref: hirst1987, role: rm, loc: "Section 3, before Theorem 3.5" } ]

- id: milliken
  label: '\textsf{Milliken}'
  name: Milliken's theorem (block sums)
  kind: sentence
  minor: true
  tags: [ ramsey ]
  caution: 'Not Milliken''s tree theorem ([[mtt]]), which colors strong subtrees.'
  definition: >
    For each $n$, every finite coloring of the $n$-tuples of block sums has an infinite set $X$ such that all $n$-tuples
    $\{\sum A_0, \dots, \sum A_{n-1}\}$ with $A_i$ finite subsets of $X$ and $\max A_i < \min A_j$ for $i < j$ have the same
    color. For $n = 1$ it is Hindman's theorem.
  refs: [ { ref: hirst1987, role: rm, loc: "Definition 7.20(i)" } ]

- id: mirt
  label: '\mathsf{MIRT}'
  name: Maximal infinite ray theorem
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    Every graph has a (possibly finite) sequence of disjoint rays which is maximal: no ray of the graph is disjoint from
    all of them (for each of the variants of graphs, disjointness and rays of the infinite ray theorem).
  refs: [ { ref: barnesgohshore2023, role: rm, loc: Definition 6.17 } ]

- id: dbp
  label: '\mathsf{DB}_p'
  name: Dimension bound for removing a point
  kind: sentence
  minor: true
  tags: [ orders ]
  aliases: [ DBp ]
  definition: >
    For every poset $(P, \preceq)$ and every $x_0 \in P$, $\dim(P, \preceq) \leq \dim(P \setminus \{x_0\}, \preceq) + 1$,
    where the dimension is the least number of linear extensions realizing the order.
  refs: [ { ref: marconevolpi2026, role: origin, loc: Section 3 } ]

- id: dbpplus
  label: '\mathsf{DB}^+_p'
  name: Strong dimension bound for removing a point
  kind: sentence
  minor: true
  tags: [ orders ]
  aliases: [ DB+p ]
  definition: >
    For every poset $P$ and $x_0 \in P$, if linear orders $(L_j)_{j<n}$ realize $P \setminus \{x_0\}$, then there are
    $(L'_j)_{j<n+1}$ realizing $P$ with $L_j = L'_j \setminus \{x_0\}$ for $j < n - 1$. Equivalent over RCA₀ to the finite
    parallelization LS* of the linear separation principle.
  refs: [ { ref: marconevolpi2026, role: origin, loc: "Section 5, before Theorem 5.3" } ]

- id: hlsigma01
  label: '\mathsf{HL}_{\Sigma^0_1}'
  name: Hechler–Laver principle for open sets
  kind: sentence
  minor: true
  tags: [ ramsey ]
  aliases: [ HLΣ01 ]
  definition: >
    For every open set $A \subseteq \omega^\omega$ there is either a Hechler tree $T$ (a Laver tree in which every node has
    all but finitely many immediate successors) with $[T] \subseteq A$, or a Laver tree $S$ with $[S] \cap A = \emptyset$.
  refs: [ { ref: marconeosso2026b, role: origin, loc: Definition 1.4 } ]

- id: sd
  label: '\mathsf{SD}'
  name: Infinite subset of a dense set
  kind: problem
  minor: true
  tags: [ ramsey ]
  definition: >
    Every set $A \subseteq \mathbb{N}$ of positive lower density has an infinite subset.
    Studied as a problem: its solutions are the infinite subsets of $A$ ("SD" stands for
    "subset of a dense set").
  instance: A set $A \subseteq \mathbb{N}$ of positive lower density.
  solution: An infinite subset of $A$.
  refs: [ { ref: harrisontrainorliulutz2023, role: origin, loc: Section 7.1 } ]

- id: gst1
  label: '\mathsf{GST}_1'
  name: Ginsburg–Sands theorem for T₁ spaces
  kind: problem
  tags: [ ramsey ]
  aliases: [ GST1 ]
  definition: >
    Every infinite T₁ CSC space (countable second-countable space, in Dorais's formalization) has an
    infinite subspace which is discrete or has the cofinite topology.
  instance: An infinite T₁ CSC space.
  solution: An infinite subspace which is discrete or has the cofinite topology.
  refs: [ { ref: benhametal2024, role: origin, loc: Definition 4.5 }, { ref: houeroupateymimouni2024, role: rm } ]

- id: sgst1
  label: '\mathsf{SGST}_1'
  name: Ginsburg–Sands theorem for stable T₁ spaces
  kind: problem
  minor: true
  tags: [ ramsey, stable ]
  aliases: [ SGST1 ]
  definition: >
    The restriction of GST₁ to stable CSC spaces: for every point $x$, either $\{x\}$ is open, or every open
    set containing $x$ is cofinite.
  instance: An infinite stable T₁ CSC space.
  solution: An infinite subspace which is discrete or has the cofinite topology.
  refs: [ { ref: benhametal2024, role: origin, loc: Definition 6.3 } ]

- id: gs
  label: '\mathsf{GS}'
  name: Ginsburg–Sands theorem
  kind: problem
  minor: true
  tags: [ ramsey ]
  definition: >
    Every infinite CSC space has an infinite subspace which is indiscrete, has the initial segment topology,
    has the final segment topology, is discrete, or has the cofinite topology.
  instance: An infinite CSC space.
  solution: An infinite subspace with one of the five topologies.
  refs: [ { ref: benhametal2024, role: rm, loc: Definition 4.1 } ]

- id: sigma02-subset
  label: '\Sigma^0_2\text{-}\mathsf{Subset}'
  name: Σ⁰₂ subset principle
  kind: sentence
  tags: [ ramsey ]
  aliases: [ Σ02-Subset, Sigma02-Subset ]
  definition: >
    For every $\Sigma^0_2$ formula $\varphi(x)$ there is an infinite set $H$ such that either $\varphi(x)$ holds
    for all $x \in H$, or $\neg\varphi(x)$ holds for all $x \in H$.
  refs: [ { ref: benhametal2024, role: origin, loc: Definition 6.7 }, { ref: houeroupateymimouni2024, role: rm, loc: Statement 1.2 } ]

- id: delta03-subset
  label: '\Delta^0_3\text{-}\mathsf{Subset}'
  name: Δ⁰₃ subset principle
  kind: sentence
  minor: true
  tags: [ ramsey ]
  aliases: [ Δ03-Subset, Delta03-Subset ]
  definition: >
    For every $\Sigma^0_3$ formula $\varphi(x)$ and every $\Pi^0_3$ formula $\psi(x)$ such that
    $\forall x (\varphi(x) \leftrightarrow \psi(x))$, there is an infinite set $H$ such that either $\varphi(x)$
    holds for all $x \in H$, or $\neg\varphi(x)$ holds for all $x \in H$.
  refs: [ { ref: houeroupateymimouni2024, role: origin, loc: Statement 1.2 } ]

- id: canrt2
  label: '\mathsf{canRT}^2'
  name: Canonical Ramsey theorem for pairs (Erdős–Rado)
  kind: problem
  minor: true
  tags: [ ramsey ]
  aliases: [ canRT2 ]
  definition: >
    For every $c : [\mathbb{N}]^2 \to \mathbb{N}$ there are an infinite set $H$ and a set $S \subseteq \{1, 2\}$ such
    that for all $I, J \in [H]^2$, $c(I) = c(J)$ if and only if $I$ and $J$ agree on the positions in $S$.
  instance: 'A coloring $c : [\mathbb{N}]^2 \to \mathbb{N}$.'
  solution: An infinite canonical set $H$ (with its set $S$).
  refs: [ { ref: carluccimainardi2022, role: rm, loc: Definition 2 }, { ref: mileti2004, role: rm, loc: Proposition 7.1.2 } ]

- id: regrt2
  label: '\mathsf{regRT}^2'
  name: Regressive Ramsey theorem for pairs (Kanamori–McAloon)
  kind: problem
  minor: true
  tags: [ ramsey ]
  aliases: [ regRT2, REG2 ]
  definition: >
    For every regressive $c : [\mathbb{N}]^2 \to \mathbb{N}$ (that is, $c(x, y) < x$ when $x > 0$) there is an
    infinite min-homogeneous set: $c(x, y) = c(x, z)$ for all $x < y < z$ in it.
  instance: 'A regressive coloring $c : [\mathbb{N}]^2 \to \mathbb{N}$.'
  solution: An infinite min-homogeneous set.
  refs: [ { ref: carluccimainardi2022, role: rm, loc: Definition 5 }, { ref: mileti2004, role: rm, loc: Proposition 7.1.2 } ]

- id: canht
  label: '\mathsf{canHT}'
  name: Taylor's canonical Hindman theorem
  kind: problem
  minor: true
  tags: [ ramsey ]
  aliases: [ canHT ]
  definition: >
    For every $c : \mathbb{N} \to \mathbb{N}$ there is an infinite set $H = \{h_0 < h_1 < \dots\}$ such that the color
    $c(\sum_{i \in I} h_i)$ of the finite sums over $H$ is constant, or injective in $I$, or depends exactly on
    $\min I$, or exactly on $\max I$, or exactly on the pair $(\min I, \max I)$.
  instance: 'A coloring $c : \mathbb{N} \to \mathbb{N}$.'
  solution: An infinite set $H$ as above.
  refs: [ { ref: carluccimainardi2022, role: rm, loc: Definition 7 } ]

- id: reght
  label: '\lambda\mathsf{regHT}'
  name: Regressive Hindman theorem
  kind: problem
  minor: true
  tags: [ ramsey ]
  aliases: [ λregHT ]
  definition: >
    For every $\lambda$-regressive $c : \mathbb{N} \to \mathbb{N}$ ($c(n) < \lambda(n)$ when $\lambda(n) > 0$, where
    $\lambda(n)$ is the least term of the binary expansion of $n$) there is an infinite set $H$ such that $FS(H)$ is
    min-term-homogeneous for $c$.
  instance: 'A $\lambda$-regressive coloring $c : \mathbb{N} \to \mathbb{N}$.'
  solution: An infinite set $H$ such that $FS(H)$ is min-term-homogeneous.
  refs: [ { ref: carluccimainardi2022, role: origin, loc: Definition 11 } ]

- id: reght-eq2-ap
  label: '\lambda\mathsf{regHT}^{=2}[\mathsf{ap}]'
  name: Regressive Hindman theorem for sums of exactly two terms, with apartness
  kind: problem
  minor: true
  tags: [ ramsey ]
  definition: >
    $\lambda\mathsf{regHT}$ restricted to sums of exactly two terms, with the apartness condition on the solution.
  instance: 'A $\lambda$-regressive coloring $c : \mathbb{N} \to \mathbb{N}$.'
  solution: An infinite apart set $H$ such that $FS^{=2}(H)$ is min-term-homogeneous.
  refs: [ { ref: carluccimainardi2022, role: origin, loc: Definition 14 } ]

- id: wop-omega
  label: '\mathsf{WOP}(X \mapsto \omega^X)'
  name: Well-ordering principle for base-ω exponentiation
  kind: problem
  tags: [ well-orders ]
  definition: >
    If $X$ is a well-ordering, then so is $\omega^X$. As a problem: an instance is a linear order $X$ with an infinite
    descending sequence in $\omega^X$, a solution an infinite descending sequence in $X$.
  instance: A linear order $X$ and an infinite descending sequence in $\omega^X$.
  solution: An infinite descending sequence in $X$.
  refs: [ { ref: hirst1994, role: rm, loc: Theorem 2.6 }, { ref: carluccimainardi2022, role: rm, loc: Section 4.2 } ]

- id: brt324
  label: '\mathsf{BRT}^3_{2,4}'
  name: Bounded Ramsey's theorem for triples with bound 4
  kind: problem
  minor: true
  tags: [ ramsey ]
  aliases: [ "BRT32,4" ]
  definition: >
    Every coloring $f : [\mathbb{N}]^3 \to 2$ with no $f$-homogeneous set of size 4 for color 1 has an infinite
    $f$-homogeneous set for color 0.
  instance: 'A coloring $f : [\mathbb{N}]^3 \to 2$ with no homogeneous set of size 4 for color 1.'
  solution: An infinite homogeneous set for color 0.
  refs: [ { ref: pateyshafer2026, role: rm, loc: "Section 1, Statement (Bounded Ramsey's theorem)" } ]

- id: rcoh
  label: '\mathsf{RCOH}'
  name: Ramsey-type cohesiveness principle
  kind: problem
  minor: true
  tags: [ ramsey ]
  aliases: [ RCOH ]
  definition: >
    Every sequence of sets $R_0, R_1, \dots$ has an infinite Ramsey-cohesive set $C$: for infinitely many $n$,
    either $C \subseteq^* R_n$ or $C \subseteq^* \overline{R_n}$.
  instance: A sequence of sets $R_0, R_1, \dots$
  solution: An infinite Ramsey-cohesive set.
  refs: [ { ref: cholaketal2020, role: origin, loc: Definition 2.4 } ]

- id: cdrt32
  label: '\mathsf{CDRT}^3_2'
  name: Combinatorial dual Ramsey theorem for 3-partitions
  kind: problem
  minor: true
  tags: [ ramsey ]
  aliases: [ CDRT32 ]
  definition: >
    For every 2-coloring of the finite ordered 2-partitions $(\omega)^2_{\mathrm{fin}}$ there are an infinite
    partition $p \in (\omega)^\omega$ and a color $i$ such that for every 3-partition $x$ coarser than $p$, the
    restriction of $x$ to the start of its last block, $x \upharpoonright \mu^x(2)$, has color $i$. By
    Proposition 3.7 of the source, the number of colors does not matter.
  instance: A 2-coloring of $(\omega)^2_{\mathrm{fin}}$.
  solution: An infinite partition $p$ (with a color) as above.
  refs: [ { ref: dzhafarovetal2017, role: rm, loc: "Definition 3.4(4), Proposition 3.7" } ]

- id: wkl-wbd
  label: '\mathsf{WKL}(\textsf{w-bd})'
  name: Weak König's lemma for trees of bounded width
  kind: sentence
  minor: true
  tags: [ compactness ]
  aliases: [ WKL(w-bd), WKL(ext-bd) ]
  definition: >
    An infinite binary tree $T \subseteq 2^{<\mathbb{N}}$ has a path if there is $c$ such that $|T^{=n}| \le c$ for every
    $n$. Equivalent over $\mathsf{RCA}_0$ to the version bounding the number of extendible nodes of each length
    (Theorem 3.2 of the source).
  refs: [ { ref: simpsonyokoyama2021, role: origin, loc: "Definition 1.1(2), Theorem 3.2" } ]

- id: mbs
  label: '\textsf{minimal bad sequence lemma}'
  name: Minimal bad sequence lemma
  kind: sentence
  minor: true
  tags: [ well-orders ]
  aliases: [ minimal bad sequence lemma ]
  phrases: [ minimal bad sequence lemma ]
  definition: >
    Let $(Q, \preceq)$ be a quasi-order and $<'$ a well-founded relation on $Q$ compatible with $\preceq$ ($q_0 <' q_1$
    implies $q_0 \preceq q_1$). If there is a bad $Q$-sequence, then there is a $Q$-sequence which is minimal bad with
    respect to $<'$.
  refs: [ { ref: marcone1994, role: rm, loc: "Definition 6.2, Theorem 6.5" } ]

- id: lmba
  label: '\textsf{locally minimal bad array lemma}'
  name: Locally minimal bad array lemma
  kind: sentence
  minor: true
  tags: [ well-orders ]
  aliases: [ locally minimal bad array lemma ]
  phrases: [ locally minimal bad array lemma ]
  definition: >
    Let $(Q, \preceq)$ be a quasi-order and $<'$ a well-founded relation on $Q$ compatible with $\preceq$. Every bad
    $Q$-array $f$ (indexed by a barrier) has a bad $Q$-array $g \le' f$ which is locally minimal bad with respect to $<'$.
  refs: [ { ref: marcone1994, role: origin, loc: "Definition 2.16, Theorem 2.17" } ]

- id: leftmost-path
  label: '\textsf{leftmost path}'
  name: Existence of leftmost paths
  kind: sentence
  minor: true
  tags: [ compactness ]
  definition: >
    Every non-well-founded tree $T \subseteq \mathbb{N}^{<\mathbb{N}}$ has a leftmost path: a path $f$ such that every
    other path $g$ satisfies $f(n) < g(n)$ at the first $n$ where they differ.
  refs: [ { ref: marcone1994, role: rm, loc: "Definition 6.4, Theorem 6.5" } ]

- id: swwkl
  label: '\mathsf{SWWKL}'
  name: Strong weak weak Kőnig's lemma
  kind: problem
  minor: true
  tags: [ compactness, randomness ]
  aliases: [ SWWKL ]
  definition: >
    If $T \subseteq 2^{<\mathbb{N}}$ is a tree with positive measure, then there is a nonempty subtree $S \subseteq T$
    such that for every $\sigma \in S$, $S$ has positive measure above $\sigma$.
  instance: A tree $T \subseteq 2^{<\mathbb{N}}$ of positive measure.
  solution: A nonempty subtree $S$ with positive measure above each of its nodes.
  refs: [ { ref: greenbergmillernies2021, role: origin, loc: Section 6 } ]

- id: wswwkl
  label: '\mathsf{WSWWKL}'
  name: Weak strong weak weak Kőnig's lemma
  kind: problem
  minor: true
  tags: [ compactness, randomness ]
  aliases: [ WSWWKL ]
  definition: >
    If $T \subseteq 2^{<\mathbb{N}}$ is a tree with positive measure, then there is a subtree $S \subseteq T$ of positive
    measure with no dead ends.
  instance: A tree $T \subseteq 2^{<\mathbb{N}}$ of positive measure.
  solution: A subtree of positive measure with no dead ends.
  refs: [ { ref: greenbergmillernies2021, role: origin, loc: Section 6 } ]

- id: pi01ga
  label: '\Pi^0_1\mathsf{GA}'
  name: Π⁰₁ generic approximation principle
  kind: sentence
  minor: true
  tags: [ computability ]
  aliases: [ Π01GA, Pi01GA ]
  definition: >
    For any uniformly $\Pi^0_1$ collection of sets of strings $D_0, D_1, \dots$, each dense in $2^{<\mathbb{N}}$, there is a
    sequence $g_0, g_1, \dots \in 2^{\mathbb{N}}$ such that for every $i$ there are $m$ and $t$ with
    $g_u \upharpoonright m = g_t \upharpoonright m \in D_i$ for all $u > t$.
  refs: [ { ref: hirschfeldtlangeshore2017, role: origin, loc: Section 3 } ]

- id: att
  omegaAbsolute: false
  label: '\mathsf{ATT}'
  name: Atomic tree theorem
  kind: problem
  minor: true
  tags: [ computability ]
  aliases: [ ATT ]
  definition: >
    If $T$ is an atomic extendible tree, then there is a listing of the isolated paths of $T$.
  instance: An atomic extendible tree $T$.
  solution: A listing of the isolated paths of $T$.
  refs: [ { ref: hirschfeldtlangeshore2017, role: origin, loc: "Section 3, after Proposition 3.6" } ]

- id: fatt
  label: '\mathsf{FATT}'
  name: Finite atomic tree theorem
  kind: sentence
  minor: true
  tags: [ computability ]
  aliases: [ FATT ]
  definition: >
    For each atomic extendible tree $T$ and each finite set of nodes $\sigma_0, \dots, \sigma_k \in T$, there are isolated
    paths $P_0, \dots, P_k$ of $T$ such that $P_i$ extends $\sigma_i$.
  refs: [ { ref: hirschfeldtlangeshore2017, role: origin, loc: Appendix B } ]

- id: cdg-ca
  label: '\mathsf{CDG}\text{-}\mathsf{CA}'
  name: Comprehension for completely determined clopen games
  kind: sentence
  tags: [ determinacy ]
  aliases: [ CDG-CA, "Lω1,ω-CA", "Lω1,ω-CA0", "L_{ω1,ω}-CA" ]
  definition: >
    Given a sequence $\{T_n : n \in \mathbb{N}\}$ of completely determined trees, there is a set $X$ such that
    $n \in X$ iff player I has a winning strategy in the finitely terminating game $G(T_n)$. A well-founded tree
    $T$ is completely determined if there is a winning function $d : T \to \{W, L\}$: for every $\sigma \in T$,
    if $d(\sigma) = W$ then I has a winning strategy in $G(T_\sigma)$, and if $d(\sigma) = L$ then II has one.
    Astor, Dzhafarov, Montalbán, Solomon and Westrick state it as $L_{\omega_1,\omega}$-CA: if
    $\{\varphi_i : i \in \mathbb{N}\}$ is a sequence of completely determined $L_{\omega_1,\omega}$ formulas
    (formulas with an evaluation map), then $\{i : \varphi_i \text{ is true}\}$ exists; they say that this is
    Montalbán's CDG-CA stated in terms of formulas. A statement of hyperarithmetic analysis.
  refs:
    - { ref: montalban2006, role: origin, loc: "Definition 1.6, Statement 1.9" }
    - { ref: astoretal2020, role: rm, loc: "Definition 2.15, Theorem 2.16" }

- id: cdg-ac
  label: '\mathsf{CDG}\text{-}\mathsf{AC}'
  name: Choice for completely determined clopen games
  kind: sentence
  minor: true
  tags: [ determinacy ]
  aliases: [ CDG-AC ]
  definition: >
    Given a sequence $\{T_n : n \in \mathbb{N}\}$ of completely determined trees, the tree $\sum_n T_n$ is
    also completely determined. Here $\sum_n T_n$ is the tree $S$ with $S_{\langle n \rangle} = T_n$: player I
    chooses $n$ and the game $G(T_n)$ is then played starting with player II.
  refs:
    - { ref: montalban2006, role: origin, loc: "Definition 1.8, Statement 1.9" }

- id: dg-ca
  label: '\mathsf{DG}\text{-}\mathsf{CA}'
  name: Comprehension for determined clopen games
  kind: sentence
  minor: true
  tags: [ determinacy ]
  aliases: [ DG-CA ]
  definition: >
    Given a sequence $\{T_n : n \in \mathbb{N}\}$ of determined trees (well-founded trees whose finitely
    terminating game $G(T_n)$ has a winning strategy for one of the players), there is a set $X$ such that
    $n \in X$ iff player I has a winning strategy for $G(T_n)$. Equivalent to $\Delta^1_1\text{-}\mathsf{CA}_0$.
  refs:
    - { ref: montalban2006, role: origin, loc: "Definition 1.6, Statement 1.9" }

- id: dg-ac
  label: '\mathsf{DG}\text{-}\mathsf{AC}'
  name: Choice for determined clopen games
  kind: sentence
  minor: true
  tags: [ determinacy ]
  aliases: [ DG-AC ]
  definition: >
    Given a sequence $\{T_n : n \in \mathbb{N}\}$ of determined trees, the tree $\sum_n T_n$ (player I chooses
    $n$, then $G(T_n)$ is played starting with player II) is also determined. A clopen-game version of Van
    Wesep's Game-AC (Remark 1.10 of the source).
  refs:
    - { ref: montalban2006, role: origin, loc: "Definition 1.8, Statement 1.9, Remark 1.10" }

- id: ji
  label: '\mathsf{JI}'
  name: Jump iteration
  kind: sentence
  tags: []
  aliases: [ JI, Jump Iteration ]
  phrases: [ jump iteration statement ]
  definition: >
    For every set $X$ and every ordinal $\alpha$, if $X^{(\beta)}$ exists for every $\beta < \alpha$, then
    $X^{(\alpha)}$ exists. A sentence of hyperarithmetic analysis: its $\omega$-models are hyperarithmetically
    closed.
  refs:
    - { ref: montalban2006, role: origin, loc: "Statement 1.11" }
    - { ref: astoretal2020, role: rm, loc: "Section 2.7, Figure 1" }

- id: sigma11dc
  label: '\Sigma^1_1\text{-}\mathsf{DC}'
  name: Σ¹₁ dependent choice
  kind: sentence
  tags: []
  aliases: [ Σ11-DC0, Sigma11-DC0, Σ11-DC, Sigma11-DC ]
  definition: >
    $\mathsf{ACA}_0$ plus the scheme of $\Sigma^1_1$ dependent choice:
    $\forall n\, \forall X\, \exists Y\, \eta(n, X, Y) \to \exists Z\, \forall n\, \eta(n, (Z)^n, (Z)_n)$ for
    $\Sigma^1_1$ formulas $\eta$ in which $Z$ does not occur, where $(Z)_n = \{i : (i, n) \in Z\}$ and
    $(Z)^n = \{(i, m) \in Z : m < n\}$. Equivalent over $\mathsf{ACA}_0$ to $\Pi^1_1$ transfinite induction
    (Theorem VIII.5.12). A theory of hyperarithmetic analysis, strictly stronger than
    $\Sigma^1_1\text{-}\mathsf{AC}_0$.
  refs:
    - { ref: simpson2009, role: origin, loc: "Definition VII.6.1(3)" }
    - { ref: montalban2006, role: rm, loc: "Section 1.6" }

- id: middle-cut
  label: '\textsf{Middle cut}'
  name: Existence of middle cuts of scattered weakly indecomposable linear orders
  kind: sentence
  minor: true
  tags: [ orders ]
  definition: >
    If $A$ is a scattered, weakly indecomposable linear ordering (for every $a \in A$, $A$ embeds into
    $A_{(\leq a)}$ or into $A_{(> a)}$), then the middle cut $\langle L, R \rangle$ of $A$ exists, with
    $L = \{a \in A : A \preceq A_{(> a)}\}$ and $R = \{a \in A : A \preceq A_{(\leq a)}\}$.
  refs:
    - { ref: montalban2006, role: origin, loc: "Definition 2.1, Theorem 2.2(2)" }

# ---------------------------------------------------------------- Borel sets (Astor et al.)

- id: cd-pb
  label: '\mathsf{CD}\text{-}\mathsf{PB}'
  name: Property of Baire for completely determined Borel sets
  kind: sentence
  minor: true
  tags: [ determinacy ]
  aliases: [ CD-PB ]
  definition: >
    Every completely determined Borel set has the property of Baire: every completely determined labeled Borel
    code $T$ has a Baire approximation, that is, open sets $U, V$ and $\{D_n\}$ with $U \cap V = \emptyset$ and
    $U \cup V$ and each $D_n$ dense, such that for all $X \in \bigcap_n D_n$, $X \in U \Rightarrow X \in |T|$
    and $X \in V \Rightarrow X \in |T^c|$. A labeled Borel code (a well-founded tree whose inner nodes are
    labeled $\cup$ or $\cap$ and whose leaves carry clopen subsets of $2^\omega$) is completely determined if
    every $X \in 2^\omega$ has an evaluation map in it. CD-PB fails in HYP, so it is not a statement of
    hyperarithmetic analysis, but every $\omega$-model of it is hyperarithmetically closed.
  refs:
    - { ref: astoretal2020, role: origin, loc: "Definitions 2.6, 2.9, 2.10, 3.1 and 3.5" }

- id: borel-drt32
  label: '\mathsf{Borel}\text{-}\mathsf{DRT}^3_2'
  name: Borel dual Ramsey theorem for 3-partitions and 2 colors
  kind: sentence
  minor: true
  tags: [ ramsey, determinacy ]
  aliases: [ Borel-DRT32, "Borel-DRT^3_2" ]
  definition: >
    Formalized with Borel codes: whenever $T_0, T_1$ are Borel codes such that every $X \in |P_3|$ (the
    partitions of $\omega$ into exactly 3 pieces, coded as elements of $3^\omega$) satisfies
    $X \in |T_0 \cup T_1|$, there are an infinite partition $p$ of $\omega$ and a color $i < 2$ such that
    $X \circ p \in |T_i|$ for every $X \in |P_3|$. The hypothesis requires evaluation maps for every
    $X \in |P_3|$.
  refs:
    - { ref: astoretal2020, role: rm, loc: "Definitions 8.2 and 8.3 (ℓ = 2)" }
    - { ref: dzhafarovetal2017, role: origin, loc: "Section 3" }

# ---------------------------------------------------------------- other sentences

- id: turing-incomp
  label: '\textsf{Turing incomparability}'
  name: Every incomputable set has a Turing incomparable set
  kind: sentence
  minor: true
  tags: [ computability ]
  definition: >
    For every set $A$ which is not computable there is a set $B$ such that $A \not\leq_T B$ and
    $B \not\leq_T A$. Studied in $\omega$-models (Kučera–Slaman: every Scott set satisfies it).
  refs:
    - { ref: conidis2010, role: rm, loc: "Section 1.2, sentence (1); Theorem 4.1" }

- id: reach-matrix
  label: '\textsf{Reachability matrices}'
  name: Existence of reachability matrices of graphs
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    Every (directed) graph $G = (V, E)$ has a reachability matrix: a function $M : V \times V \to \{0, 1\}$
    with $M(v, w) = 1$ iff there is a path in $G$ from $v$ to $w$. Equivalent to $\mathsf{ACA}_0$ already
    for 2-regular graphs, directed or not.
  refs: [ { ref: clotehirst1998, role: origin, loc: Theorem 1 } ]

- id: arc-count
  label: '\textsf{Arc counting}'
  name: Existence of the arc-counting function of graphs
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    For every (directed) graph $G$ there is a function $M : V \times V \to \mathbb{N} \cup \{\infty\}$ such that
    $M(v, w)$ is the number of distinct arcs (acyclic paths) from $v$ to $w$. Equivalent to $\mathsf{ACA}_0$
    already for 2-regular graphs, directed or not.
  refs: [ { ref: clotehirst1998, role: origin, loc: Theorem 4 } ]

- id: shortest-path
  label: '\textsf{Shortest path matrices}'
  name: Existence of shortest path matrices of weighted graphs
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    Every (directed) integer weighted graph has a shortest path matrix: a function
    $M : V \times V \to \mathbb{N} \cup \{\infty\}$ with $M(v, w) = \infty$ if there is no path from $v$ to $w$,
    and otherwise $M(v, w)$ a code for a path of minimal total weight. Equivalent to $\mathsf{ACA}_0$ already
    for 2-regular graphs, directed or not.
  refs: [ { ref: clotehirst1998, role: origin, loc: Theorem 6 } ]

- id: weak-topsort
  label: '\textsf{Weak topological sorting}'
  name: Weak topological sortings of path bounded graphs
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    Every path bounded directed graph with a source node $v_0$ (for every vertex $u$ there is a bound on the
    length of the paths from $v_0$ to $u$) has a weak topological sorting: a function $s : V \to \mathbb{N}$
    whose range is $\mathbb{N}$ or an initial segment of $\mathbb{N}$ and with $s(u) < s(v)$ for every edge
    $(u, v)$.
  refs: [ { ref: clotehirst1998, role: origin, loc: "Definition 7, Theorem 9" } ]

- id: topsort
  label: '\textsf{Topological sorting}'
  name: Topological sortings of path sparse graphs
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    Every path sparse directed graph with a source node $v_0$ (for every vertex $u \neq v_0$ there are only finitely
    many directed paths from $v_0$ to $u$) has a topological sorting: an injective weak topological sorting
    $s : V \to \mathbb{N}$ (range $\mathbb{N}$ or an initial segment, $s(u) < s(v)$ for every edge $(u, v)$).
  refs: [ { ref: clotehirst1998, role: origin, loc: "Definition 11, Theorem 13" } ]

- id: spanning-tree
  label: '\textsf{Spanning trees}'
  name: Every connected graph has a spanning tree
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    Every connected (undirected, countable) graph has a spanning tree: an acyclic connected subgraph
    containing every vertex.
  refs: [ { ref: clotehirst1998, role: origin, loc: Theorem 15 } ]

- id: mst
  label: '\textsf{Minimal spanning trees}'
  name: Minimal spanning trees of finitely connected weighted graphs
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    Every finitely connected (connected, with only finitely many distinct arcs between any two vertices)
    rationally weighted graph of bounded total weight has a minimal spanning tree: a spanning tree whose edge
    weights sum to a finite value no greater than the weight of any other spanning tree.
  refs: [ { ref: clotehirst1998, role: origin, loc: Theorem 17 } ]

- id: mst-decision
  label: '\textsf{Minimal spanning tree decision}'
  name: Deciding which weighted directed graphs have a minimal spanning tree
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    For every sequence $\langle G_n \rangle_n$ of rationally weighted directed graphs there is a function
    $f : \mathbb{N} \to \{0, 1\}$ with $f(n) = 1$ iff $G_n$ has a minimal spanning tree (a spanning tree, i.e. an
    acyclic directed spanning subgraph with a source node, of least total weight).
  refs: [ { ref: clotehirst1998, role: origin, loc: "Theorems 20 and 22" } ]

- id: konig-edge
  label: '\textsf{König edge colouring}'
  name: König's edge colouring theorem (countable bipartite graphs)
  kind: sentence
  minor: true
  tags: [ graphs ]
  phrases: [ König's edge coloring theorem ]
  definition: >
    If $G$ is a countable bipartite graph in which each vertex has degree at most $n$, then the edge chromatic
    number of $G$ is at most $n$: $G$ has a proper edge colouring with $n$ colours. Equivalent to
    $\mathsf{WKL}_0$ already for bounded bipartite graphs of degree at most 2.
  refs: [ { ref: mummert2020, role: origin, loc: "Corollary 2.3, Theorem 3.5" } ]

- id: bipartite-decomp
  label: '\textsf{Regular bipartite decomposition}'
  name: Decomposition of regular bipartite graphs into complete matchings
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    If $G$ is a countable regular bipartite graph of degree $n$, the edges of $G$ can be decomposed into $n$
    complete matchings. Equivalent to $\mathsf{WKL}_0$ already for 2-regular bipartite graphs.
  refs: [ { ref: mummert2020, role: origin, loc: Theorem 3.6 } ]

- id: vizing
  label: '\textsf{Vizing}'
  name: Vizing's edge colouring theorem (countable graphs)
  kind: sentence
  minor: true
  tags: [ graphs ]
  phrases: [ Vizing's theorem ]
  definition: >
    If $G$ is a countable graph with maximal degree $n$, then the edge chromatic number of $G$ is at most $n + 1$.
  refs: [ { ref: mummert2020, role: origin, loc: "Proposition 3.4, Question 4.1" } ]

- id: id0
  label: '\mathsf{ID0}'
  name: Existence of sets of intrinsic density 0
  kind: problem
  minor: true
  tags: [ computability ]
  aliases: [ ID0, ID_0 ]
  definition: >
    For every weakly represented class $\mathcal{F}$ of total functions there is a set $A$ such that every
    injective $f \in \mathcal{F}$ samples $A$ with density 0: $\rho(f^{-1}(A)) = 0$ for every total injection
    $f \in \mathcal{F}$. Statement 3.6 does not say “infinite”, but the set is meant to be infinite (the
    paper studies infinite sets of intrinsic density 0, Corollary 2.7, and the proof of Theorem 3.11 builds an
    infinite one); otherwise $A = \emptyset$ would do.
  instance: A weakly represented class $\mathcal{F}$ of total functions.
  solution: An infinite set $A$ with $\rho(f^{-1}(A)) = 0$ for every total injection $f \in \mathcal{F}$.
  refs: [ { ref: astor2017, role: origin, loc: "Statement 3.6" } ]

- id: exteta
  label: '\mathsf{EXT}(\eta)'
  name: Extendibility of η
  kind: sentence
  tags: [ orders ]
  aliases: [ EXT(η) ]
  phrases: [ extendibility of eta ]
  definition: >
    The order type $\eta$ of the rationals is extendible: every countable partial order with no subchain of
    type $\eta$ (a scattered partial order) has a linear extension with no subchain of type $\eta$ (a scattered
    linear extension). Provable in $\Pi^1_2\text{-}\mathsf{CA}_0$ (Theorem 2(1)); exact strength open.
  refs: [ { ref: downeyetal2003, role: rm, loc: "Section 1 (definition of extendible), Theorem 2" } ]

- id: bct-ii
  label: '\mathsf{B.C.T.II}'
  name: Baire category theorem for separably closed sets
  kind: sentence
  tags: [ analysis ]
  aliases: [ B.C.T.II, BCT II ]
  caution: >
    Brown and Simpson's second version of the Baire category theorem, for sets coded by positive information
    (separably closed sets) in an arbitrary complete separable metric space. The Weihrauch problem
    [[bct2]] of Brattka, Hendtlass and Kreuzer is its analogue on a fixed computable perfect Polish space.
  definition: >
    Let $\widehat{A}$ be a complete separable metric space and $\langle \langle x_{n,k} : k \in \mathbb{N} \rangle
    : n \in \mathbb{N} \rangle$ a sequence of codes for the complements of dense separably open sets $O_n$ (each
    $O_n$ is the complement of the separably closed set $\overline{\{x_{n,k} : k \in \mathbb{N}\}}$). If $U$ is a
    nonempty open set in $\widehat{A}$, then there is a point $x \in U$ such that $x \in O_n$ for all $n$, i.e.
    $x \notin \overline{\{x_{n,k} : k \in \mathbb{N}\}}$ for every $n$.
  refs: [ { ref: brownsimpson1993, role: origin, loc: "Section 1 (separably closed sets), Section 2 (B.C.T.II)" } ]

- id: rca0plus
  label: '\mathsf{RCA}_0^+'
  name: Brown–Simpson genericity scheme (*)
  kind: sentence
  tags: [ computability ]
  aliases: [ RCA0+ ]
  definition: >
    The scheme (*): for every arithmetical formula $\varphi(n, \tau)$ (with set parameters; $\sigma, \tau$ range
    over $2^{<\mathbb{N}}$), if $\forall n\, \forall \sigma\, \exists \tau\, (\tau \supseteq \sigma \wedge
    \varphi(n, \tau))$, then there is $X \in 2^{\mathbb{N}}$ with $\forall n\, \exists k\, \varphi(n, X[k])$.
    $\mathsf{RCA}_0^+$ is $\mathsf{RCA}_0$ plus (*), and $\mathsf{WKL}_0^+$ is $\mathsf{WKL}_0$ plus (*), the
    conjunction [[rca0plus-wkl]].
  refs: [ { ref: brownsimpson1993, role: origin, loc: "Section 4, scheme (*)" } ]

- id: nonprincipal-uf
  label: '\textsf{non-principal ultrafilters}'
  name: Non-principal ultrafilters on countable atomic algebras
  kind: sentence
  minor: true
  tags: []
  definition: >
    For every infinite set $V \subseteq \mathbb{N}$ and every atomic countable algebra $\mathcal{A} = \langle A_n :
    n \in \mathbb{N} \rangle$ over $V$ (subsets of $V$, containing $V$, closed under unions, intersections and
    complements relative to $V$, and containing $\{v\}$ for every $v \in V$), there is a non-principal ultrafilter
    on $\mathcal{A}$: a set $U \subseteq \mathbb{N}$ of indices which contains every $i$ with $A_i = V$, no $i$ with
    $A_i = \emptyset$, is closed upwards and under intersections, contains $i$ or $j$ whenever $A_j = V \setminus
    A_i$, and contains no $k$ with $A_k$ a singleton.
  refs: [ { ref: eastaugh2023, role: rm, loc: "Definitions 2.1, 2.4, Lemma 2.6" } ]

- id: delta02bqo3
  label: '\mathbf{3}\text{-}\Delta^0_2\text{-}\mathsf{BQO}'
  name: The antichain with three elements is a Δ⁰₂-bqo
  kind: sentence
  minor: true
  tags: [ well-orders ]
  aliases: [ 3 is a Delta02-bqo ]
  definition: >
    For every $\Delta^0_2$-function $F : [\mathbb{N}]^\mathbb{N} \to \mathbf{3}$ (a class function whose graph is
    defined by a $\Sigma^0_2$ formula with set parameters) there is $X \in [\mathbb{N}]^\mathbb{N}$ with $F(X) \le
    F(X^-)$, where $\mathbf{3}$ is the antichain with three elements (so $\le$ is equality) and $X^-$ is $X$ with its
    first element removed.
  refs: [ { ref: montalban2017, role: origin, loc: "Definitions 1.2, 1.3" } ]

- id: mrsf
  label: '\mathsf{MRSF}'
  name: Maximal representable subfamilies (Podewski–Steffens)
  kind: sentence
  tags: [ graphs ]
  aliases: [ MRSF ]
  definition: >
    Every countable family $F$ (a function with domain some $I \subseteq \mathbb{N}$ such that $\emptyset \neq F(i)
    \subseteq \mathbb{N}$ for $i \in I$) has a maximal representable subfamily: a maximal $S \subseteq I$ such that
    $F \upharpoonright S$ has an injective choice function (a one-one $f$ with $f(i) \in F(i)$ for $i \in S$).
  refs: [ { ref: shore2026, role: rm, loc: "Definition 5.1, Theorem 5.2" } ]

- id: mcsf
  label: '\mathsf{MCSF}'
  name: Maximal critical subfamilies (Podewski–Steffens)
  kind: sentence
  tags: [ graphs ]
  aliases: [ MCSF ]
  definition: >
    Every countable family $F$ has a maximal critical subfamily, where a family is critical if it is representable
    and every representation $f$ of it has $\mathrm{rg}(f) = \bigcup \mathrm{rg}(F)$.
  refs: [ { ref: shore2026, role: rm, loc: "Definitions 5.1, 5.3, Theorem 5.4" } ]

- id: ba-invariants
  label: '\textsf{Boolean algebra invariants}'
  name: Number invariants for elementary equivalence of countable Boolean algebras
  kind: sentence
  minor: true
  tags: []
  definition: >
    For every sequence $\langle A_i : i \in \mathbb{N} \rangle$ of countable Boolean algebras there is a sequence
    $\langle n_i : i \in \mathbb{N} \rangle$ of numbers such that, for all $i, j$, $A_i \equiv A_j$ if and only if
    $n_i = n_j$ (Shore's $\psi(\mathcal{B}, \equiv)$; elementary equivalence is defined through partial satisfaction
    relations, Definition 4.7).
  refs: [ { ref: shore2006, role: origin, loc: "Section 1 (the sentence ψ), Definition 4.7, Theorem 6.10" } ]

- id: dba-invariants
  label: '\textsf{dense Boolean algebra invariants}'
  name: Number invariants for isomorphism of countable dense Boolean algebras
  kind: sentence
  minor: true
  tags: []
  definition: >
    For every sequence $\langle A_i : i \in \mathbb{N} \rangle$ of countable dense Boolean algebras there is a
    sequence $\langle n_i : i \in \mathbb{N} \rangle$ of numbers such that, for all $i, j$, $A_i \cong A_j$ if and
    only if $n_i = n_j$ (Shore's $\psi(\mathcal{DB}, \cong)$).
  refs: [ { ref: shore2006, role: origin, loc: "Section 1 (the sentence ψ), Definitions 4.3, 6.2, Theorem 6.10" } ]

- id: grs-paths
  label: '\textsf{Galvin–Rival–Sands theorem}'
  name: Galvin–Rival–Sands theorem on traceable graphs
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    Every infinite traceable graph (one with a bijection $T : \mathbb{N} \to V$ such that $T(i)$ and $T(i+1)$ are
    adjacent for every $i$) either contains arbitrarily long finite chordless paths or contains a subgraph
    isomorphic to $\mathbf{A}$, the bipartite graph with vertices $a_n, b_n$ ($n \in \mathbb{N}$) and edges $a_n
    b_m$ for $n \le m$.
  refs: [ { ref: cholakgalvinsolomon2010, role: rm, loc: "Theorem 1.1" } ]

- id: grs-kww
  label: '\textsf{Galvin–Rival–Sands } K_{\omega,\omega}\textsf{ theorem}'
  name: Galvin–Rival–Sands theorem on traceable graphs without chordless 4-paths
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    Every infinite traceable graph containing no chordless 4-path contains a subgraph isomorphic to the complete
    countable bipartite graph $K_{\omega,\omega}$.
  refs: [ { ref: cholakgalvinsolomon2010, role: rm, loc: "Theorem 1.2" } ]

- id: least-nonext-pair
  label: '\textsf{least failing extension pair}'
  name: Least size of a failing extension pair in a non-random graph
  kind: sentence
  minor: true
  tags: [ graphs, induction ]
  definition: >
    For every graph $G$ not isomorphic to the random graph $R$, there is a least $n$ for which some $n$-extension
    pair $\langle X_0, X_1 \rangle$ (disjoint finite sets of vertices with $|X_0| + |X_1| = n$) fails the extension
    property, i.e. no vertex outside $X_0 \cup X_1$ is adjacent to every vertex of $X_0$ and to none of $X_1$.
  refs: [ { ref: dzhafarovsolomonvolpi2024, role: origin, loc: "Section 5, Theorem 5.1(1)" } ]

- id: ht-le3
  label: '\mathsf{HT}^{\le 3}'
  name: Hindman's theorem for sums of at most 3 elements (any finite number of colors)
  kind: problem
  tags: [ ramsey ]
  definition: >
    For every $r \ge 2$ and every coloring $c : \mathbb{N} \to r$ there is an infinite set $H \subseteq \mathbb{N}$
    such that all sums of at most 3 distinct elements of $H$ have the same color.
  instance: 'A number $r$ and a coloring $c : \mathbb{N} \to r$.'
  solution: An infinite set $H$ whose sums of at most 3 distinct elements are monochromatic.
  refs: [ { ref: liao2026, role: rm, loc: "Theorem 1.6 (k = 3)" } ]

- id: fut-simple
  label: '\textsf{FUT for simple colorings}'
  name: Finite union theorem for simple colorings
  kind: sentence
  minor: true
  tags: [ ramsey ]
  definition: >
    For every block sequence $X = \{a_0, a_1, \dots\}$ of finite sets and every simple coloring $f :
    \mathrm{FU}(X) \to \ell$ there is an infinite block sequence $Y \subseteq \mathrm{FU}(X)$ such that $f$ is
    monochromatic on $\mathrm{FU}(Y)$. The coloring is simple if $f(a_n \cup b_0) = f(a_n \cup b_1)$ for all $n$ and
    all $b_0, b_1 \in \mathrm{FU}(X)$ with $\max a_n < \min b_0, \min b_1$, $\min b_0 = \min b_1$, $\max b_0 = \max
    b_1$ and $f(b_0) = f(b_1)$.
  refs: [ { ref: liupatey2026b, role: origin, loc: "Definition 3.1, Section 3" } ]

- id: vsmall
  label: '\mathsf{VSMALL}'
  name: Path axiom for trees with very small sets of branching nodes
  kind: sentence
  minor: true
  tags: [ compactness ]
  definition: >
    If $T$ is an infinite binary tree such that there is no function $f : \mathbb{N} \to \mathbb{N}$ with
    $\exists^\infty n\, \exists \sigma\, [f(n) \leq |\sigma| < f(n+1) \wedge \sigma \in \mathrm{Br}(T)]$, then $T$ has a path.
    Here $\mathrm{Br}(T)$ is the set of branching nodes of $T$ (both $\sigma 0$ and $\sigma 1$ are extendible).
  refs: [ { ref: binnskjoshanssen2014, role: rm, loc: "Section 2, Definition 2.1" } ]

- id: dim
  label: '\mathsf{DIM}'
  name: Path axiom for diminutive trees
  kind: sentence
  minor: true
  tags: [ compactness ]
  definition: >
    If $T$ is an infinite binary tree such that there is no function $f : \mathbb{N} \to \mathbb{N}$ with
    $\forall \sigma \in \mathrm{Ext}(T)\, \exists \tau \in \mathrm{Br}(T)\, [\tau \supseteq \sigma \wedge |\tau| \leq f(|\sigma|)]$
    (no witness to the perfection of $T$), then $T$ has a path. $\mathrm{Ext}(T)$ is the set of extendible nodes,
    $\mathrm{Br}(T)$ the set of branching nodes.
  refs: [ { ref: binnskjoshanssen2014, role: rm, loc: "Section 2, Definition 2.1" } ]

- id: perfect-positive-closed
  label: '\textsf{Perfect subsets of positive closed sets}'
  name: Every positive closed set contains a perfect subset
  kind: sentence
  minor: true
  tags: [ randomness ]
  definition: >
    Every closed subset of $2^{\mathbb{N}}$ of positive measure contains a perfect subset: for every binary tree $T$ with
    $\mu([T]) > 0$ there is a perfect tree $P$ with $[P] \subseteq [T]$. The instance of (3.1) for closed sets.
  refs: [ { ref: chongetal2018, role: rm, loc: "Section 3, (3.1)" } ]

- id: perfect-positive-pi02
  label: '\textsf{Perfect subsets of positive }\Pi^0_2\textsf{ sets}'
  name: Every positive Π⁰₂ set contains a perfect subset
  kind: sentence
  minor: true
  tags: [ randomness ]
  definition: >
    Every $\Pi^0_2$ subset of $2^{\mathbb{N}}$ of positive measure contains a perfect subset. The instance of (3.1)
    for $\Pi^0_2$ sets.
  refs: [ { ref: chongetal2018, role: rm, loc: "Section 3, (3.1), Proposition 3.1" } ]

- id: wop-two-asc
  label: '\textsf{Restricted }\mathsf{WOP}(X \mapsto 2^X)'
  name: Base-2 exponentiation preserves well orders whose infinite suborders contain ascending sequences
  kind: sentence
  minor: true
  tags: [ well-orders ]
  definition: >
    The map $\alpha \mapsto 2^\alpha$ preserves well orders $\alpha$ for which each infinite suborder contains a
    strictly ascending sequence: if $\alpha$ is such a well order, then $2^\alpha$ is a well order.
  refs: [ { ref: uftring2025, role: rm, loc: Theorem 2 } ]

- id: evaluation-field
  label: '\textsf{Evaluation fields}'
  name: Every countable field is an evaluation field
  kind: sentence
  minor: true
  tags: [ algebra ]
  definition: >
    For every countable field $F$ and every $n$ there is an evaluation function
    $E : \mathbb{Z}[x_0, \dots, x_{n-1}] \times F^n \to F$ with $E(0, a) = 0$, $E(1, a) = 1$, $E(x_i, a) = a_i$,
    $E(f + g, a) = E(f, a) + E(g, a)$ and $E(f \cdot g, a) = E(f, a) \cdot E(g, a)$.
  refs: [ { ref: simpsonsmith1986, role: rm, loc: "Definition 3.2, Theorem 3.3" } ]

- id: poly-finite-roots
  label: '\textsf{Finitely many roots}'
  name: Polynomials over countable fields have finitely many roots
  kind: sentence
  minor: true
  tags: [ algebra ]
  definition: >
    For every countable field $F$ and every polynomial $f(x) \in F[x]$, $f(x)$ has only finitely many roots in $F$.
    (Equivalent over $\mathsf{RCA}_0^*$ to the same statement for evaluation fields.)
  refs: [ { ref: simpsonsmith1986, role: rm, loc: "Theorem 3.9(b)" } ]

- id: poly-factorization
  label: '\textsf{Finite factorization}'
  name: Polynomials over countable fields factor into irreducibles
  kind: sentence
  minor: true
  tags: [ algebra ]
  definition: >
    For every countable field $F$ and every polynomial $f(x) \in F[x]$, $f(x)$ has a finite factorization into
    irreducible polynomials over $F$. (Equivalent over $\mathsf{RCA}_0^*$ to the same statement for evaluation fields.)
  refs: [ { ref: simpsonsmith1986, role: rm, loc: "Theorem 3.10(b)" } ]

- id: poly-irreducible-factor
  label: '\textsf{Irreducible factor}'
  name: Polynomials over countable fields have an irreducible factor
  kind: sentence
  minor: true
  tags: [ algebra ]
  definition: >
    For every countable field $F$ and every polynomial $f(x) \in F[x]$, $f(x)$ has an irreducible factor over $F$.
    (Equivalent over $\mathsf{RCA}_0^*$ to the same statement for evaluation fields.)
  refs: [ { ref: simpsonsmith1986, role: rm, loc: "Theorem 3.11(b)" } ]

- id: open-induction
  label: '\textsf{Open induction}_{[0,1]}'
  name: Open induction on [0,1]
  kind: sentence
  minor: true
  tags: [ analysis ]
  definition: >
    For every (code for an) open set $O \subseteq [0,1]$: if
    $\forall y \in [0,1]\, ((\forall z \in [0,1])(z < y \rightarrow z \in O) \rightarrow y \in O)$, then
    $[0,1] \subseteq O$. (The single-statement form $\mathrm{OI}_4$ of the paper.)
  refs: [ { ref: deansanders2025, role: rm, loc: "Section 6.2 (OI4), Theorem 6(i)" } ]

- id: creeping-lemma
  label: '\textsf{Creeping lemma}'
  name: Creeping lemma for Σ⁰₁ formulas
  kind: sentence
  minor: true
  tags: [ analysis, compactness ]
  definition: >
    For every $\Sigma^0_1$ formula $\Psi(x)$: if there is a covering $(O_i)_i$ of $[0,1]$ by open intervals such that
    $\Psi(x) \leftrightarrow \Psi(y)$ for all $x, y$ in the same $O_i$, and $\Psi(0)$ holds, then $\Psi(x)$ for all
    $x \in [0,1]$.
  refs: [ { ref: deansanders2025, role: rm, loc: "Section 5 (CL), (18), Theorem 7(c)" } ]

- id: sigma00-cub
  label: '\Sigma^0_0\text{-}\mathsf{CUB}'
  name: Continuous uniform boundedness for Σ⁰₀ formulas
  kind: sentence
  minor: true
  tags: [ compactness ]
  definition: >
    For every $\Sigma^0_0$ formula $A(f, x)$:
    $\forall n\, (\mathrm{cont}(A) \wedge \forall f : \mathbb{N} \to [n]\, \exists x\, A(f, x) \rightarrow
    \exists z\, \forall f : \mathbb{N} \to [n]\, \exists x \leq z\, A(f, x))$, where $\mathrm{cont}(A)$ says that
    $A$ depends continuously on $f$. Equivalent over $\mathsf{RCA}_0$ to $\Sigma^0_1$-CUB (Proposition 19).
  refs: [ { ref: gasparkohlenbach2010, role: rm, loc: "Definition 18, Proposition 19" } ]

- id: pi01-cub
  label: '\Pi^0_1\text{-}\mathsf{CUB}'
  name: Continuous uniform boundedness for Π⁰₁ formulas
  kind: sentence
  minor: true
  tags: [ compactness ]
  definition: >
    The continuous uniform boundedness principle restricted to $\Pi^0_1$ formulas $A(f, x)$:
    $\forall n\, (\mathrm{cont}(A) \wedge \forall f : \mathbb{N} \to [n]\, \exists x\, A(f, x) \rightarrow
    \exists z\, \forall f : \mathbb{N} \to [n]\, \exists x \leq z\, A(f, x))$.
  refs: [ { ref: gasparkohlenbach2010, role: rm, loc: Definition 18 } ]

- id: fipp2
  label: '\mathsf{FIPP}_2'
  name: Second finitary infinite pigeonhole principle
  kind: sentence
  minor: true
  tags: [ ramsey ]
  definition: >
    For every $n$ and every asymptotically stable $F : \mathbb{N} \to \mathbb{N}$ (on codes of finite sets) there is $k$
    such that every $f : [k] \to [n]$ has a monochromatic set $A \subseteq [k]$ with $|A| > F(A)$.
  refs: [ { ref: gasparkohlenbach2010, role: rm, loc: "Definitions 5, 7.3" } ]

- id: fipp3
  label: '\mathsf{FIPP}_3'
  name: Third finitary infinite pigeonhole principle (Tao)
  kind: sentence
  minor: true
  tags: [ ramsey ]
  definition: >
    For every $n$ and every $F : \mathbb{N} \to \mathbb{N}$ asymptotically stable near infinite sets there is $k$ such
    that every $f : [k] \to [n]$ has a color class $A = f^{-1}(c)$ with $|A| > F(A)$.
  refs: [ { ref: gasparkohlenbach2010, role: rm, loc: "Definitions 5, 7.4" } ]

- id: wop-two
  label: '\mathsf{WOP}(X \mapsto 2^X)'
  name: Well-ordering principle for base-2 exponentiation
  kind: sentence
  minor: true
  tags: [ well-orders ]
  definition: >
    If $X$ is a well-ordering, then so is $2^X$, the set of finite sequences $\langle x_1, \ldots, x_n\rangle$
    of elements of $X$ with $x_n <_X \cdots <_X x_1$, ordered lexicographically (elements of $2^X$ are
    ordinals in base-2 Cantor normal form).
  refs:
    - { ref: hirst1994, role: rm, loc: "Definitions 2.1, 2.2, Theorem 2.6 (iii)" }
    - { ref: freund2019b, role: rm, loc: Theorem 1.1 }

- id: wwo
  label: '\textsf{Weak well orders}'
  name: Every weak well order is a well order
  kind: sentence
  minor: true
  tags: [ well-orders ]
  definition: >
    Every weak well order is a well order, where a countable linear order $X$ is a weak well order if no
    initial segment $I \subseteq X$ can be embedded into a proper initial segment $I_0 \subsetneq I$.
  refs:
    - { ref: freundmanca2023, role: rm, loc: "Definition 1.1, Theorem 3.5" }

- id: bh-fp-omega
  label: '\textsf{BH fixed points}(Y \mapsto 1 + X \times Y)'
  name: Well-founded Bachmann–Howard fixed points of Y ↦ 1 + X × Y
  kind: sentence
  minor: true
  tags: [ well-orders ]
  definition: >
    For every well-order $X$ the transformation $Y \mapsto 1 + X \times Y$ has a well-founded
    Bachmann–Howard fixed point: a well-order $Y$ with a Bachmann–Howard collapse $\vartheta : 1 + X \times Y
    \to Y$, i.e. (i) $\sigma < \tau$ implies $\vartheta(\sigma) < \vartheta(\tau)$ whenever every element of
    the support of $\sigma$ is below $\vartheta(\tau)$, and (ii) every element of the support of $\sigma$ is
    below $\vartheta(\sigma)$.
  refs:
    - { ref: freund2020c, role: rm, loc: "Definitions 1.2, 1.3, Corollary 2.3" }

- id: bh-fp-eps
  label: '\textsf{BH fixed points}(Y \mapsto 1 + Y^2 + X)'
  name: Well-founded Bachmann–Howard fixed points of Y ↦ 1 + Y² + X
  kind: sentence
  minor: true
  tags: [ well-orders ]
  definition: >
    For every well-order $X$ the transformation $Y \mapsto 1 + Y^2 + X$ has a well-founded Bachmann–Howard
    fixed point (a well-order $Y$ with a Bachmann–Howard collapse $1 + Y^2 + X \to Y$ in the sense of
    Definition 1.3). The minimal such fixed point is $\varepsilon_X$ (Theorem 2.6).
  refs:
    - { ref: freund2020c, role: rm, loc: "Definition 1.3, Theorem 2.6, Corollary 2.7" }

- id: bh-fp-veblen
  label: '\textsf{BH fixed points}(Y \mapsto 1 + (Y + X) \times Y)'
  name: Well-founded Bachmann–Howard fixed points of Y ↦ 1 + (Y + X) × Y
  kind: sentence
  minor: true
  tags: [ well-orders ]
  definition: >
    For every well-order $X$ the transformation $Y \mapsto 1 + (Y + X) \times Y$ has a well-founded
    Bachmann–Howard fixed point (Definition 1.3). The minimal such fixed point is $\varphi(1 + X)0$
    (Theorem 1.4).
  refs:
    - { ref: freund2020c, role: rm, loc: "Definition 1.3, Theorem 1.4, Corollary 1.5" }

- id: htbin
  label: '\mathsf{HT}^{\mathrm{bin}}'
  name: Hindman's theorem for sums along finite paths of the full binary tree
  kind: sentence
  minor: true
  tags: [ ramsey ]
  aliases: [ HTbin, HT^bin ]
  definition: >
    For every $k \ge 1$ and every $c : \mathbb{N} \to k$ there are an infinite set $H = \{h_1 < h_2 < \cdots\}$
    and $z < k$ such that $c(\sum_{i \in J} h_i) = z$ for every path $J$, where a path is a finite set
    $i_1 < \cdots < i_n$ of positive integers with $i_1 = 1$ and $i_j \in \{2i_{j-1}, 2i_{j-1}+1\}$ for
    $1 < j \le n$ (labels of finite paths from the root of $2^{<\mathbb{N}}$).
  refs:
    - { ref: carluccitavernelli2022, role: origin, loc: "Definitions 3, 4" }

- id: aphtbin
  label: '\mathsf{apHT}^{\mathrm{bin}}'
  name: Hindman's theorem for sums along finite paths of the full binary tree, with apartness
  kind: sentence
  minor: true
  tags: [ ramsey ]
  aliases: [ apHTbin, apHT^bin ]
  definition: >
    $\mathsf{HT}^{\mathrm{bin}}$ with the extra requirement that the solution set $H$ is apart: for $n < m$ in
    $H$, $\mu(n) < \lambda(m)$, where for $n = 2^{e_1} + \cdots + 2^{e_m}$ with $e_1 < \cdots < e_m$,
    $\lambda(n) = e_1$ and $\mu(n) = e_m$.
  refs:
    - { ref: carluccitavernelli2022, role: origin, loc: "Definitions 4, 5" }

- id: aptt1
  label: '\mathsf{apTT}^1'
  name: Tree pigeonhole principle with tree apartness
  kind: sentence
  minor: true
  tags: [ ramsey ]
  aliases: [ apTT1, apTT^1 ]
  definition: >
    For every $k \ge 1$, every coloring of $2^{<\mathbb{N}}$ with $k$ colors has a monochromatic subtree
    $S \cong 2^{<\mathbb{N}}$ which is apart: $S$ has at most one sequence of each length, its
    length-increasing enumeration $\sigma_1, \sigma_2, \ldots$ is level-by-level (the children of $\sigma_i$
    in $S$ are $\sigma_{2i}$ and $\sigma_{2i+1}$), and for every $i \ge 1$, $\sigma_{i+1} =
    \mathrm{parent}(\sigma_{i+1})^\frown 0^{|\sigma_i| - |\mathrm{parent}(\sigma_{i+1})|\,\frown}\sigma$ for
    some $\sigma \in 2^{<\mathbb{N}} \setminus \{0\}^{<\mathbb{N}}$.
  refs:
    - { ref: carluccitavernelli2022, role: origin, loc: "Definitions 6, 7, 8" }

- id: mfmt
  label: '\mathsf{MFMT}'
  name: Metrization theorem for countably based MF spaces
  kind: sentence
  minor: true
  tags: [ analysis ]
  definition: >
    A countably based MF space (the space $MF(P)$ of maximal filters on a countable poset $P$) is
    homeomorphic to a complete separable metric space if and only if it is regular.
  refs:
    - { ref: mummertsimpson2005, role: origin, loc: "Definitions 2, 5, 6" }

- id: mba-simpson
  label: '\textsf{minimal bad array lemma}'
  name: Minimal bad array lemma (Simpson's version)
  kind: sentence
  minor: true
  tags: [ well-orders ]
  phrases: [ minimal bad array lemma ]
  caution: Different from the locally minimal bad array lemma ([[lmba]]) and from Laver's version ([[mba-laver]]).
  definition: >
    Let $Q$ be a quasi order and $\le'$ a partial ranking of $\le_Q$ (a well-founded partial order on $Q$ such
    that $p \le_Q q \le' r$ implies $p \le_Q r$). Whenever $f_0$ is a $\le_Q$-bad $Q$-array (a continuous map
    $f : [V]^\omega \to Q$, given on a block), there is a $Q$-array $f \le' f_0$ that is $\le'$-minimal
    $\le_Q$-bad.
  refs:
    - { ref: freundpakhomovsolda2023, role: rm, loc: "Definitions 1.1, 1.2 and the statement following them" }

- id: mba-laver
  label: '\textsf{minimal bad array lemma (Laver)}'
  name: Minimal bad array lemma (Laver's version)
  kind: sentence
  minor: true
  tags: [ well-orders ]
  caution: Different from Simpson's version ([[mba-simpson]]) and from the locally minimal bad array lemma ([[lmba]]).
  definition: >
    Let $\le'$ be a partial ranking of a reflexive relation $R$ on a set $Q$. For any $R$-bad $Q$-array $f_0$
    given as a function on a block, there is an $R$-bad $Q$-array $f \mathrel{\underline{\lessdot}'} f_0$
    that admits no $R$-bad $Q$-array $g \lessdot' f$ (the relations on blocks and arrays of Definition 3.1).
  refs:
    - { ref: freundpakhomovsolda2023, role: rm, loc: "Definition 3.1 and the statement following it" }

- id: sigma0-lpp
  label: '\Sigma_0\text{-}\mathsf{LPP}'
  name: Σ₀-relative leftmost path principle
  kind: sentence
  minor: true
  tags: [ well-orders ]
  aliases: [ Σ0-LPP, Σ0-LPP0 ]
  definition: >
    Whenever $T$ is an ill-founded tree of finite sequences, there is a path $\Lambda$ through $T$ such that
    no path through $T$ which is $\Sigma_0$ in $T \oplus \Lambda$ is to the left of $\Lambda$ (the case $n =
    0$ of the $\Sigma_n$-relative leftmost path principle).
  refs:
    - { ref: towsner2011, role: origin, loc: Definition 3.3 }

- id: sigma2-lpp
  label: '\Sigma_2\text{-}\mathsf{LPP}'
  name: Σ₂-relative leftmost path principle
  kind: sentence
  minor: true
  tags: [ well-orders ]
  aliases: [ Σ2-LPP, Σ2-LPP0 ]
  definition: >
    Whenever $T$ is an ill-founded tree of finite sequences, there is a path $\Lambda$ through $T$ such that
    no path through $T$ which is $\Sigma_2$ in $T \oplus \Lambda$ is to the left of $\Lambda$.
  refs:
    - { ref: towsner2011, role: origin, loc: Definition 3.3 }

- id: mpp
  label: '\mathsf{MPP}'
  name: Minimal path principle
  kind: sentence
  minor: true
  tags: [ well-orders ]
  aliases: [ MPP0 ]
  definition: >
    If $T$ is an ill-founded tree and $\prec$ is a well-founded partial order, then there is a path through
    $T$ which is minimal with respect to $\prec$ (no path $\Lambda'$ through $T$ with $\Lambda' \prec
    \Lambda$).
  refs:
    - { ref: towsner2011, role: origin, loc: Definition 3.1 }

- id: sorites
  label: '\textsf{Sorites connectedness}'
  name: Connectedness implies lack of tolerance (countable V-spaces)
  kind: sentence
  minor: true
  tags: []
  definition: >
    Let $(X, \{W_x : x \in X\})$ be a weak V-space ($X \subseteq \omega$ non-empty, each $W_x$ a sequence
    $\langle W_{x,n} : n \in \omega\rangle$ with $x \in W_{x,n} \subseteq X$), $Y$ a set and $\pi : X \to Y$.
    If $a, b \in X$ are connected (for every cover $\{V_x \in W_x : x \in X\}$ there is a finite chain $a =
    x_0, \ldots, x_k = b$ with $V_{x_j} \cap V_{x_{j+1}} \ne \emptyset$) and $\pi(a) \ne \pi(b)$, then some
    $x \in X$ has no vicinity in $W_x$ on which $\pi$ is constant. The version for strong V-spaces (pairwise
    distinct vicinities) is equivalent.
  refs:
    - { ref: dzhafarov2016b, role: rm, loc: "Definitions 1.2, 2.1, Theorem 2.4" }

- id: wpo-young
  label: '\mathsf{WPO}(\mathcal{D})'
  name: Young diagrams are well partially ordered
  kind: sentence
  minor: true
  tags: [ orders ]
  aliases: [ "WPO(D)" ]
  definition: >
    The set $\mathcal{D}$ of Young diagrams, ordered by $D \le E$ iff $r_i(D) \le r_i(E)$ for all $i$ (where $r_i$ is
    the length of the $i$-th row), is a well partial ordering: every infinite sequence $\langle D_i \rangle$ has
    $i < j$ with $D_i \le D_j$.
  refs: [ { ref: hatzikiriakousimpson2015, role: rm, loc: "Section 1, Theorem 2.3" } ]

- id: formanek-lawrence
  label: "\\textsf{Formanek–Lawrence theorem}"
  name: Ascending chain condition for two-sided ideals of K[S]
  kind: sentence
  minor: true
  tags: [ algebra ]
  phrases: [ Formanek/Lawrence theorem ]
  definition: >
    Let $S$ be the group of finitely supported permutations of $\mathbb{N}$ and $K$ a countable field of
    characteristic 0 (e.g. $\mathbb{Q}$). There is no infinite ascending sequence of two-sided ideals of the group
    algebra $K[S]$ (equivalently over $\mathsf{RCA}_0$: every two-sided ideal of $K[S]$ is finitely generated).
  refs: [ { ref: hatzikiriakousimpson2015, role: rm, loc: "Definition 4.1, Theorem 4.4" } ]

- id: wpo-fin-down-nk
  label: "\\textsf{Finite down-sets of }\\mathbb{N}^k\\textsf{ wpo}"
  name: Finite downwards closed subsets of N^k are well partially ordered
  kind: sentence
  minor: true
  tags: [ orders ]
  definition: >
    For every $k$, the finite downwards closed subsets of $\mathbb{N}^k$ ($k$-tuples ordered coordinatewise), ordered
    by inclusion, form a well partial order (every bad sequence is finite). The case $k = 2$ is equivalent to
    $\mathsf{WPO}(\mathcal{D})$ for Young diagrams.
  refs: [ { ref: pelupessy2016c, role: rm, loc: "Definition 1, Theorem 2" } ]

- id: adjacent-ramsey2
  label: "\\textsf{Adjacent Ramsey for pairs}"
  name: Friedman's adjacent Ramsey theorem for pairs
  kind: sentence
  minor: true
  tags: [ ramsey, well-orders ]
  phrases: [ adjacent Ramsey theorem for pairs, adjacent Ramsey for pairs ]
  definition: >
    For every $r$ and every function $C : \mathbb{N}^2 \to \mathbb{N}^r$ there are $a < b < c$ with
    $C(a, b) \le C(b, c)$ (coordinatewise order on $\mathbb{N}^r$).
  refs: [ { ref: pelupessy2016c, role: rm, loc: "Definition 6, Theorem 7" } ]

- id: heine-borel-q
  label: "\\textsf{Heine–Borel}_{\\mathbb{Q}}"
  name: Heine/Borel compactness of closed sets of rationals in [0,1]
  kind: sentence
  minor: true
  tags: [ compactness, analysis ]
  definition: >
    Every closed set of rationals in $[0,1]$ (closed: the complement of an open set) is Heine/Borel compact: every
    covering of it by a sequence of open intervals has a finite subcovering.
  refs: [ { ref: hirst2005c, role: rm, loc: Theorem 1 }]

- id: heine-borel-q-sep
  label: "\\textsf{Heine–Borel}^{\\mathrm{sep}}_{\\mathbb{Q}}"
  name: Heine/Borel compactness of separably closed sets of rationals in [0,1]
  kind: sentence
  minor: true
  tags: [ compactness, analysis ]
  definition: >
    Every separably closed set of rationals in $[0,1]$ (the set $\bar X$ of limit points of a countable set $X$) is
    Heine/Borel compact: every covering of it by a sequence of open intervals has a finite subcovering.
  refs: [ { ref: hirst2005c, role: rm, loc: Theorem 2 }]

- id: transitive-orientation
  label: "\\textsf{Transitive orientation}"
  name: Transitive orientation of comparability graphs (Ghouila-Houri)
  kind: problem
  minor: true
  tags: [ graphs ]
  definition: >
    Every countable graph in which every cycle of odd length has a triangular chord has a transitive orientation.
    (A cycle $a_0, \dots, a_k = a_0$ has a triangular chord if $a_1 E a_{k-1}$ or $a_i E a_{i+2}$ for some
    $i < k-1$; an orientation $\to$ of $E$ is transitive if $a \to b \to c$ implies $a \to c$.) Backward direction
    of Ghouila-Houri's characterization of comparability graphs.
  instance: A countable graph in which every cycle of odd length has a triangular chord.
  solution: A transitive orientation of it.
  refs: [ { ref: fioricaronesmarcone2021, role: rm, loc: "Theorem 1.1, Lemma 1.2(2)" } ]

- id: pseudo-transitive-orientation
  label: "\\textsf{Pseudo-transitive orientation}"
  name: Pseudo-transitive orientation of graphs with triangular chords
  kind: problem
  minor: true
  tags: [ graphs ]
  definition: >
    Every countable graph in which every cycle of odd length has a triangular chord has a pseudo-transitive
    orientation: an orientation $\to$ such that $a \to b \to c$ implies $a \to c$ or $c \to a$ (first step of
    Ghouila-Houri's proof).
  instance: A countable graph in which every cycle of odd length has a triangular chord.
  solution: A pseudo-transitive orientation of it.
  refs: [ { ref: fioricaronesmarcone2021, role: rm, loc: "Lemma 1.2(3)" } ]

- id: transitive-reorientation
  label: "\\textsf{Transitive reorientation}"
  name: Transitive reorientation of pseudo-transitive oriented graphs
  kind: problem
  minor: true
  tags: [ graphs ]
  definition: >
    Every countable pseudo-transitive ograph (oriented graph: at most one edge between two vertices) has a transitive
    reorientation, i.e. one obtained by reversing some edges (second step of Ghouila-Houri's proof; Theorem 1.5).
  instance: A countable pseudo-transitive ograph.
  solution: A transitive reorientation of it.
  refs: [ { ref: fioricaronesmarcone2021, role: rm, loc: "Theorem 1.5, Main Theorem" } ]

- id: rkron
  label: '\mathsf{RKRON}'
  name: Kronecker's lemma with a rate of convergence
  kind: sentence
  minor: true
  tags: [ analysis ]
  definition: >
    For all sequences of reals $\langle x_n \rangle$ and $\langle a_n \rangle$ with $0 < a_n \le a_{n+1}$,
    $\langle a_n \rangle$ unbounded and $\sum_{i \le n} x_i$ Cauchy, there is $g : \mathbb{N} \to \mathbb{N}$ which is a
    rate of convergence to 0 of $\frac{1}{a_n} \sum_{i \le n} a_i x_i$: $\forall k\, \forall n \ge g(k)\,
    |\frac{1}{a_n}\sum_{i \le n} a_i x_i| \le 2^{-k}$. (Kronecker's lemma without the rate is provable in
    $\mathsf{RCA}_0$, Theorem 3.8(i).)
  refs: [ { ref: neri2024, role: rm, loc: "Section 3.2, Theorem 3.8" } ]
