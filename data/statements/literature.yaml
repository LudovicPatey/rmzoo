  kind: problem
  tags: [ orders ]
  definition: >
    Every infinite partial order $P$ of finite width contains an infinite chain $C$ such that every element of $P$ is comparable with no element or with infinitely many elements of $C$.
  instance: An infinite partial order of finite width.
  solution: An infinite chain $C$ as above.
  refs: [ { ref: fioricaronesetal2024, role: rm } ]

