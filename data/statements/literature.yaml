- id: rsg
  label: '\mathsf{RSg}'
  name: Rival–Sands theorem for graphs
  kind: problem
  tags: [ ramsey ]
  aliases: [ inside/outside Ramsey theorem, Rival-Sands ]
  definition: >
    Every infinite graph $G$ contains an infinite subset $H$ such that every vertex of $G$ is adjacent to none, exactly one, or infinitely many vertices of $H$.
  instance: An infinite graph $G$.
  solution: An infinite set $H$ as above.
  refs: [ { ref: fioricaronesshafersolda2022, role: rm } ]

- id: rspo
  label: '\mathsf{RSpo}'
  name: Rival–Sands theorem for partial orders of finite width
  kind: problem
  tags: [ orders ]
  definition: >
    Every infinite partial order $P$ of finite width contains an infinite chain $C$ such that every element of $P$ is comparable with no element or with infinitely many elements of $C$.
  instance: An infinite partial order of finite width.
  solution: An infinite chain $C$ as above.
  refs: [ { ref: fioricaronesetal2024, role: rm } ]

- id: rspo3
  label: '\mathsf{RSpo}_3'
  name: Rival–Sands theorem for partial orders of width at most 3
  kind: problem
  formulationOf: rspo
  tags: [ orders ]
  definition: The Rival–Sands theorem restricted to partial orders of width at most 3.
  refs: [ { ref: fioricaronesetal2024, role: rm } ]
  instance: An infinite partial order of width at most 3.
  solution: An infinite chain $C$ such that every element is comparable with no element or with infinitely many elements of $C$.

- id: rspo2c
  label: '\mathsf{RSpo}_{\mathrm{CD}}'
  name: Rival–Sands theorem for unions of two chains
  kind: problem
  tags: [ orders ]
  definition: The Rival–Sands theorem restricted to partial orders decomposable into two chains.
  refs: [ { ref: fioricaronesetal2024, role: rm } ]
  instance: An infinite partial order which is a union of two chains.
  solution: An infinite chain $C$ such that every element is comparable with no element or with infinitely many elements of $C$.

- id: ert
  label: '\mathsf{ERT}'
  name: Eventually constant Ramsey-type principle
  kind: problem
  tags: [ induction ]
  definition: >-
    For every coloring $f : \mathbb{N} \to k$ there is $b$ such that every color appearing after $b$ appears at least twice after $b$: for all $x \ge b$ there is $y \ge b$ with $y \ne x$ and $f(x) = f(y)$.
  refs:
    - ref: davisetal2020
      role: origin
      loc: Introduction (ERT)

- id: ect
  label: '\mathsf{ECT}'
  name: Eventually constant tail principle
  kind: problem
  tags: [ induction ]
  definition: >-
    For every coloring $f : \mathbb{N} \to k$ there is $b$ such that every color appearing after $b$ appears infinitely often (eventually constant palette tail).
  refs:
    - ref: davisetal2020
      role: rm
      loc: Introduction (ECT, due to Hirst)

