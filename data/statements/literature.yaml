- id: ovw0
  label: '\mathsf{OVW}^0'
  name: Ordered variable word theorem for 0-variable words
  kind: problem
  tags: [ ramsey ]
  aliases: [ OVW0, "OVW^0", Carlson-Simpson theorem ]
  caution: 'Several papers write OVW (or OVW(k, l) in Miller and Solomon) for this statement, the case n = 0 of the ordered variable word theorem [[ovw]].'
  definition: >
    For every finite alphabet $A$ and finite coloring of the words over $A$, there is a word $c_0$ and an infinite sequence of left-variable words $w_1, w_2, \dots$ such that all words $c_0 \cdot w_1[a_1] \cdots w_k[a_k]$ have the same color.
  refs: [ { ref: liumoninpatey2017, role: origin }, { ref: lehoueroupatey2024, role: rm } ]
  instance: A finite alphabet $A$ and a finite coloring of $A^{<\mathbb{N}}$.
  solution: A word $c_0$ and an infinite sequence of left-variable words as in the statement.

- id: ovw
  label: '\mathsf{OVW}'
  name: Ordered variable word theorem
  kind: problem
  tags: [ ramsey ]
  aliases: [ "∀n OVWn", ordered variable word ]
  phrases: [ ordered variable word theorem, higher-order ordered variable word theorem ]
  caution: 'Some papers write OVW for the case n = 0, [[ovw0]].'
  definition: >
    For every $n$, every finite alphabet $A$ and every finite coloring of the ordered $n$-variable words over $A$ of
    finite length, there is an ordered $\omega$-variable word $W$ over $A$ (each variable $x_i$ occurs, and its last
    occurrence comes before the first occurrence of $x_{i+1}$) whose ordered $n$-variable subwords all have the same
    color ($\forall n\, \mathsf{OVW}^n$). It follows from Carlson's theorem.
  refs: [ { ref: lehoueroupatey2026, role: origin, loc: "Theorem 2.2 and the notation after it" } ]
  instance: Some $n$, a finite alphabet $A$ and a finite coloring of the ordered $n$-variable words over $A$.
  solution: 'An ordered ω-variable word W over A whose ordered n-variable subwords are monochromatic.'

- id: csl1
  label: '\mathsf{CSL}^1'
  name: Carlson–Simpson lemma for 1-variable words
  kind: problem
  tags: [ ramsey ]
  aliases: [ CSL1, "CSL^1" ]
  definition: >
    For every finite alphabet $A$, every $\ell \geq 1$ and every $\ell$-coloring of $A^{<\omega,1}$, the
    1-variable words over $A$ of finite length, there is an $\omega$-variable word $W$ over $A$ such that
    $\{W[u] : u \in A^{<\omega,1}\}$ is monochromatic. Here $W[u]$ replaces each variable $x_j$ of $W$ by
    $u(j)$ and is cut before the first occurrence of $x_{|u|}$.
  refs: [ { ref: liupatey2026, role: origin, loc: "Lemma 1.2 and the definition after it (n = 1)" } ]
  instance: A finite alphabet $A$, some $\ell \geq 1$ and an $\ell$-coloring of $A^{<\omega,1}$.
  solution: 'An $\omega$-variable word $W$ over $A$ such that $\{W[u] : u \in A^{<\omega,1}\}$ is monochromatic.'

- id: csl12
  label: '\mathsf{CSL}^1_2'
  name: Carlson–Simpson lemma for 1-variable words and 2 colors
  kind: problem
  tags: [ ramsey ]
  aliases: [ CSL12, "CSL^1_2" ]
  definition: >
    The Carlson–Simpson lemma $\mathsf{CSL}^1$ restricted to 2-colorings: for every finite alphabet $A$ and every
    2-coloring of $A^{<\omega,1}$, the 1-variable words over $A$ of finite length, there is an $\omega$-variable word
    $W$ over $A$ such that $\{W[u] : u \in A^{<\omega,1}\}$ is monochromatic.
  refs: [ { ref: lehoueroupatey2026, role: origin, loc: "Theorem 2.1 and the notation after it" } ]
  instance: A finite alphabet $A$ and a 2-coloring of $A^{<\omega,1}$.
  solution: 'An ω-variable word W over A such that {W[u] : u ∈ A^{<ω,1}} is monochromatic.'

- id: csl2
  label: '\mathsf{CSL}^2'
  name: Carlson–Simpson lemma for 2-variable words
  kind: problem
  minor: true
