- id: ovw
  label: '\mathsf{OVW}'
  name: Ordered variable word theorem
  kind: problem
  tags: [ ramsey ]
  aliases: [ OVW0, Carlson-Simpson theorem, ordered variable word ]
  definition: >
    For every finite alphabet $A$ and finite coloring of the words over $A$, there is a word $c_0$ and an infinite sequence of left-variable words $w_1, w_2, \dots$ such that all words $c_0 \cdot w_1[a_1] \cdots w_k[a_k]$ have the same color.
  refs: [ { ref: liumoninpatey2017, role: origin }, { ref: lehoueroupatey2024, role: rm } ]
  instance: A finite alphabet $A$ and a finite coloring of $A^{<\mathbb{N}}$.
  solution: A word $c_0$ and an infinite sequence of left-variable words as in the statement.

- id: fincoh
  label: '\mathsf{fin}\text{-}\mathsf{COH}'
  name: Finite cohesiveness principle
  kind: problem
  tags: [ cohesive ]
  definition: COH restricted to finite sequences of sets.
  refs: [ { ref: sun2025, role: rm } ]
  instance: A finite sequence of sets $R_0, \dots, R_{n-1}$.
  solution: An infinite set $C$ with $C \subseteq^* R_i$ or $C \subseteq^* \overline{R_i}$ for each $i < n$.

- id: tac
  label: '\mathsf{CAC}\text{ for trees}'
  name: CAC for trees
  kind: problem
  tags: [ orders, ramsey ]
  aliases: [ TCAC, CAC for trees ]
  caution: 'Not the tree antichain theorem TAC of Conidis ([[ctac]]), which only concerns completely branching c.e. binary trees and is strictly weaker: CAC for trees is equivalent to TAC + BΣ⁰₂ (Theorem 2.5 of [@cervellegaudelierpatey2022]).'
  definition: Every infinite subtree of $\mathbb{N}^{<\mathbb{N}}$ has an infinite path or an infinite antichain.
  instance: An infinite subtree $T$ of $\mathbb{N}^{<\mathbb{N}}$.
  solution: An infinite path of $T$ or an infinite antichain of $T$.
  refs: [ { ref: cervellegaudelierpatey2022, role: rm, loc: Definition 2.1 } ]

- id: ctac
  label: '\mathsf{TAC}'
  name: Tree antichain theorem (Conidis)
  kind: problem
  tags: [ orders ]
  aliases: [ tree antichain theorem ]
  caution: 'Not CAC for trees ([[tac]]), which is equivalent to TAC + BΣ⁰₂ (Theorem 2.5 of [@cervellegaudelierpatey2022]); TAC does not imply BΣ⁰₂.'
  definition: >
    Every infinite completely branching $\Sigma^0_1$-definable (c.e.) tree $T \subseteq 2^{<\mathbb{N}}$ has an infinite
    antichain; completely branching: if $\sigma i \in T$ then $\sigma(1-i) \in T$.
  instance: An infinite completely branching c.e. tree $T \subseteq 2^{<\mathbb{N}}$.
  solution: An infinite antichain of $T$.
  refs: [ { ref: dzhafarovmummert2022, role: rm, loc: Definition 11.6.7 (Conidis) }, { ref: cervellegaudelierpatey2022, role: rm, loc: Definition 2.4 } ]

- id: henson-indiv
  label: '\mathsf{IND}_{\mathcal{H}_3}'
  name: Indivisibility of the triangle-free Henson graph
  kind: problem
  tags: [ ramsey, graphs ]
  aliases: [ triangle-free Henson graph, Henson indivisibility ]
  definition: >
    For every 2-coloring of the vertices of the universal countable triangle-free (Henson) graph, there is a monochromatic set of vertices inducing a copy of the whole graph.
  instance: A 2-coloring of the vertices of the triangle-free Henson graph.
  solution: A monochromatic set of vertices inducing a copy of the graph.
  refs: [ { ref: liupatey2026, role: rm, loc: Main Theorem 1.6 } ]

# Entered on 2026-11-04 from the review queue (AI reader proposals, checked in the full texts).
- id: sadc
  label: '\mathsf{SADC}'
  name: Stable ascending or descending chain
  kind: problem
  tags: [ orders, ramsey, stable ]
  definition: >
    Every infinite stable linear order has an infinite ascending chain or an infinite descending chain (a chain need not be a sequence in the order of $\mathbb{N}$, unlike for SADS).
  instance: An infinite stable linear order $L$.
  solution: An infinite $C \subseteq L$ which is an ascending chain or a descending chain of $L$.
  refs:
    - { ref: solda2021, role: rm, loc: Definition 2.2.3 }
    - { ref: dzhafarovmummert2022, role: rm, loc: "Definition 9.2.27(3)" }

- id: wrsg
  label: '\mathsf{wRSg}'
  name: Weak Rival–Sands theorem for graphs
  caution: 'For strong Weihrauch reducibility the vertex set matters. Here, as in Fiori-Carones, Shafer and Soldà [@fioricaronesshafersolda2022], it is any infinite subset of ℕ; this version is the cylindrification of the one with vertex set ℕ (their Proposition 7.2), and both have the same Weihrauch degree.'
  kind: problem
  tags: [ graphs, ramsey ]
  definition: >
    For every infinite graph $G = (V, E)$ there is an infinite $H \subseteq V$ such that for every $x \in H$, either $H \cap N(x)$ is infinite or $|H \cap N(x)| \le 1$.
  instance: An infinite graph $G = (V, E)$.
  solution: An infinite $H \subseteq V$ such that every $x \in H$ has either infinitely many or at most one neighbour in $H$.
  refs:
    - { ref: solda2021, role: origin, loc: Definition 2.1.3 }

- id: mmlc
  label: '\mathsf{MMLC}'
  name: Maximal max-less chain principle
  kind: sentence
  minor: true
  tags: [ orders ]
  definition: >
    Every partial order has a max-less chain (a chain with no maximum element) which is $\subseteq$-maximal among the max-less chains.
  refs:
    - { ref: solda2021, role: origin, loc: Definition 3.2.1 }

- id: nfp
