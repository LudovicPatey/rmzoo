- id: odrt3
  label: '\mathsf{ODRT}_3'
  name: Open dual Ramsey theorem for 3-partitions
  kind: problem
  tags: [ ramsey ]
  aliases: [ ODRT3, "ODRT(3,2)" ]
  definition: >
    For every $\ell$ and every open $\ell$-coloring of $(\mathbb{N})^3$, the partitions of $\mathbb{N}$ into
    exactly 3 non-empty blocks, there is a partition $p$ of $\mathbb{N}$ into infinitely many blocks such that
    the partitions into 3 blocks coarser than $p$ all have the same color. Open colorings are given by
    open codes, as in Miller and Solomon (Definition 2.1 and before Theorem 2.2).
  refs: [ { ref: liupatey2026, role: origin, loc: "Section 1, after Theorem 1.1" }, { ref: millersolomon2004, role: rm, loc: "Section 2, before Theorem 2.2" } ]
  instance: An open finite coloring of $(\mathbb{N})^3$.
  solution: An infinite partition $p$ such that $(p)^3$ is monochromatic.

