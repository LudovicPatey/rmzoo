- id: brt22
  label: '\mathsf{BRT}^2_2'
  name: Bounded Ramsey's theorem for pairs
  kind: problem
  tags: [ ramsey ]
  definition: >
    For every coloring $f : [\mathbb{N}]^2 \to 2$ whose 1-homogeneous sets have bounded size, there is an infinite 0-homogeneous set.
  instance: A coloring whose 1-homogeneous sets are of bounded size.
  solution: An infinite 0-homogeneous set.
  refs: [ { ref: lehoueroupatey2025, role: origin } ]

- id: brt32
  label: '\mathsf{BRT}^3_2'
  name: Bounded Ramsey's theorem for triples
  kind: problem
  tags: [ ramsey ]
  definition: >
    For every coloring $f : [\mathbb{N}]^3 \to 2$ whose 1-homogeneous sets have bounded size, there is an infinite 0-homogeneous set.
  instance: A coloring of triples whose 1-homogeneous sets are of bounded size.
  solution: An infinite 0-homogeneous set.
  refs: [ { ref: pateyshafer2026, role: origin } ]

- id: ovw
  label: '\mathsf{OVW}'
  name: Ordered variable word theorem
  kind: problem
  tags: [ ramsey ]
  aliases: [ Carlson-Simpson theorem, ordered variable word ]
  definition: >
    For every finite alphabet $A$ and finite coloring of the words over $A$, there is a word $c_0$ and an infinite sequence of left-variable words $w_1, w_2, \dots$ such that all words $c_0 \cdot w_1[a_1] \cdots w_k[a_k]$ have the same color.
  refs: [ { ref: liumoninpatey2017, role: origin }, { ref: lehoueroupatey2024, role: rm } ]
  instance: A finite alphabet $A$ and a finite coloring of $A^{<\mathbb{N}}$.
  solution: A word $c_0$ and an infinite sequence of left-variable words as in the statement.

- id: fincoh
  label: '\mathsf{fin}\text{-}\mathsf{COH}'
  name: Finite cohesiveness principle
  kind: problem
  tags: [ cohesive ]
  definition: COH restricted to finite sequences of sets.
  refs: [ { ref: sun2025, role: rm } ]
  instance: A finite sequence of sets $R_0, \dots, R_{n-1}$.
  solution: An infinite set $C$ with $C \subseteq^* R_i$ or $C \subseteq^* \overline{R_i}$ for each $i < n$.
