- id: brt22
  label: '\mathsf{BRT}^2_2'
  name: Bounded Ramsey's theorem for pairs
  kind: problem
  tags: [ ramsey ]
  definition: >
    For every coloring $f : [\mathbb{N}]^2 \to 2$ whose 1-homogeneous sets have bounded size, there is an infinite 0-homogeneous set.
  instance: A coloring whose 1-homogeneous sets are of bounded size.
  solution: An infinite 0-homogeneous set.
  refs: [ { ref: lehoueroupatey2025, role: origin } ]

- id: brt32
  label: '\mathsf{BRT}^3_2'
  name: Bounded Ramsey's theorem for triples
  kind: problem
  tags: [ ramsey ]
  definition: >
    For every coloring $f : [\mathbb{N}]^3 \to 2$ whose 1-homogeneous sets have bounded size, there is an infinite 0-homogeneous set.
  instance: A coloring of triples whose 1-homogeneous sets are of bounded size.
  solution: An infinite 0-homogeneous set.
  refs: [ { ref: pateyshafer2026, role: origin } ]

- id: ovw
  label: '\mathsf{OVW}'
  name: Ordered variable word theorem
  kind: problem
  tags: [ ramsey ]
  aliases: [ OVW0, Carlson-Simpson theorem, ordered variable word ]
  definition: >
    For every finite alphabet $A$ and finite coloring of the words over $A$, there is a word $c_0$ and an infinite sequence of left-variable words $w_1, w_2, \dots$ such that all words $c_0 \cdot w_1[a_1] \cdots w_k[a_k]$ have the same color.
  refs: [ { ref: liumoninpatey2017, role: origin }, { ref: lehoueroupatey2024, role: rm } ]
  instance: A finite alphabet $A$ and a finite coloring of $A^{<\mathbb{N}}$.
  solution: A word $c_0$ and an infinite sequence of left-variable words as in the statement.

- id: fincoh
  label: '\mathsf{fin}\text{-}\mathsf{COH}'
  name: Finite cohesiveness principle
  kind: problem
  tags: [ cohesive ]
  definition: COH restricted to finite sequences of sets.
  refs: [ { ref: sun2025, role: rm } ]
  instance: A finite sequence of sets $R_0, \dots, R_{n-1}$.
  solution: An infinite set $C$ with $C \subseteq^* R_i$ or $C \subseteq^* \overline{R_i}$ for each $i < n$.

- id: tac
  label: '\mathsf{TAC}'
  name: CAC for trees
  kind: problem
  tags: [ orders, ramsey ]
  aliases: [ tree antichain, TCAC, CAC for trees ]
  definition: Every infinite subtree of $\mathbb{N}^{<\mathbb{N}}$ has an infinite path or an infinite antichain.
  instance: An infinite subtree $T$ of $\mathbb{N}^{<\mathbb{N}}$.
  solution: An infinite path of $T$ or an infinite antichain of $T$.
  refs: [ { ref: cervellegaudelierpatey2022, role: rm } ]

- id: henson-indiv
  label: '\mathsf{IND}_{\mathcal{H}_3}'
  name: Indivisibility of the triangle-free Henson graph
  kind: problem
  tags: [ ramsey, graphs ]
  aliases: [ triangle-free Henson graph, Henson indivisibility ]
  definition: >
    For every 2-coloring of the vertices of the universal countable triangle-free
    (Henson) graph, there is a monochromatic set of vertices inducing a copy of the
    whole graph.
  instance: A 2-coloring of the vertices of the triangle-free Henson graph.
  solution: A monochromatic set of vertices inducing a copy of the graph.
  refs: [ { ref: liupatey2026, role: rm, loc: Main Theorem 1.6 } ]

# Entered on 2026-11-04 from the review queue (AI reader proposals, checked in the full texts).
- id: sadc
  label: '\mathsf{SADC}'
  name: Stable ascending or descending chain
  kind: problem
  tags: [ orders, ramsey, stable ]
  definition: >
    Every infinite stable linear order has an infinite ascending chain or an infinite descending
    chain (a chain need not be a sequence in the order of $\mathbb{N}$, unlike for SADS).
  instance: An infinite stable linear order $L$.
  solution: An infinite $C \subseteq L$ which is an ascending chain or a descending chain of $L$.
  refs:
    - { ref: solda2021, role: rm, loc: Definition 2.2.3 }
    - { ref: dzhafarovmummert2022, role: rm, loc: "Definition 9.2.27(3)" }

- id: wrsg
  label: '\mathsf{wRSg}'
  name: Weak Rival–Sands theorem for graphs
  kind: problem
  tags: [ graphs, ramsey ]
  definition: >
    For every infinite graph $G = (V, E)$ there is an infinite $H \subseteq V$ such that for every
    $x \in H$, either $H \cap N(x)$ is infinite or $|H \cap N(x)| \le 1$.
  instance: An infinite graph $G = (V, E)$.
  solution: An infinite $H \subseteq V$ such that every $x \in H$ has either infinitely many or at most one neighbour in $H$.
  refs:
    - { ref: solda2021, role: origin, loc: Definition 2.1.3 }

- id: mmlc
  label: '\mathsf{MMLC}'
  name: Maximal max-less chain principle
  kind: sentence
  minor: true
  tags: [ orders ]
  definition: >
    Every partial order has a max-less chain (a chain with no maximum element) which is
    $\subseteq$-maximal among the max-less chains.
  refs:
    - { ref: solda2021, role: origin, loc: Definition 3.2.1 }

- id: nfp
  label: '\mathsf{NFP}'
  name: Noetherian rings have finitely many prime ideals
  kind: sentence
  tags: [ algebra ]
  definition: Every Noetherian ring has only finitely many prime ideals.
  refs:
    - { ref: dzhafarovmummert2022, role: rm, loc: "Definition 11.6.6 (Conidis)" }

- id: delta11ca
  label: '\Delta^1_1\text{-}\mathsf{CA}'
  name: Δ¹₁ comprehension
  kind: sentence
  tags: [ ]
  definition: >
    Comprehension for $\Delta^1_1$-definable sets: if $\varphi$ and $\psi$ are $\Sigma^1_1$ formulas with
    $(\forall n)[\varphi(n) \leftrightarrow \neg\psi(n)]$, then $\{n : \varphi(n)\}$ exists. HYP is its minimum $\omega$-model.
  refs:
    - { ref: dzhafarovmummert2022, role: rm, loc: Definition 5.8.14 }
    - { ref: simpson2009, role: rm, loc: Section VIII.4 }

- id: iht
  label: '\mathsf{IHT}'
  name: Iterated Hindman's theorem
  kind: sentence
  tags: [ ramsey ]
  definition: >
    For every sequence of 2-colorings $\langle C_i : i \in \mathbb{N} \rangle$ there is an increasing sequence
    $\langle x_i \rangle$ such that for every $j$, the set $\{x_i : i > j\}$ satisfies Hindman's theorem for $C_j$.
    Equivalent over $\mathsf{RCA}_0$ to AUF and to the Milliken–Taylor theorem $\mathsf{MT}^n$ for $n \ge 3$, and over $\mathsf{ACA}_0$ to the Auslander–Ellis theorem.
  refs:
    - { ref: dzhafarovmummert2022, role: rm, loc: Theorem 10.6.14 }

- id: padeg
  label: '\textsf{PA degrees}'
  name: PA degrees (problem)
  kind: problem
  tags: [ computability, weihrauch ]
  definition: Given $p$, find $q$ of PA degree relative to $p$ ($p \ll q$).
  instance: A set $p$.
  solution: A set $q$ with $p \ll q$, i.e. of PA degree relative to $p$.
  refs:
    - { ref: brattkachirache2026, role: rm, loc: "Definition 14(11)" }
    - { ref: brattkahendtlasskreuzer2017, role: rm, loc: "Definition 6.2 (on Turing degrees)" }

- id: sigma11ac
  label: '\Sigma^1_1\text{-}\mathsf{AC}'
  name: Σ¹₁ axiom of choice
  kind: sentence
  tags: [ ]
  definition: >
    $\mathsf{ACA}_0$ plus the scheme $\forall n \exists Y \eta(n, Y) \to \exists Z \forall n \eta(n, (Z)_n)$ for
    $\Sigma^1_1$ formulas $\eta$. Strictly between $\Delta^1_1\text{-}\mathsf{CA}_0$ and $\mathsf{ATR}_0$; HYP is an $\omega$-model of it.
  refs:
    - { ref: simpson2009, role: rm, loc: "Definition VII.6.1(1)" }

- id: cacord
  label: '\mathsf{CAC}^{\mathrm{ord}}'
  name: Chain–antichain principle for ω-ordered partial orders
  kind: problem
  minor: true
  tags: [ orders, ramsey ]
  definition: >
    Every infinite $\omega$-ordered partial order ($x \le_P y$ implies $x \le y$) has an infinite chain or antichain.
  instance: An infinite $\omega$-ordered partial order $(P, \le_P)$.
  solution: An infinite chain or antichain of $P$.
  refs:
    - { ref: dzhafarovmummert2022, role: rm, loc: "Definition 9.2.30(2) (Hughes; Towsner)" }

