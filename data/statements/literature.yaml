# Statements introduced by papers after the RM Zoo import (2015–2026).

- id: srt23
  label: '\mathsf{SRT}^2_3'
  name: Stable Ramsey's theorem for pairs (3 colors)
  kind: problem
  formulationOf: srt22
  tags: [ ramsey, stable ]
  definition: >
    Every stable coloring $f : [\mathbb{N}]^2 \to 3$ has an infinite homogeneous set.
  instance: >
    A stable coloring $f : [\mathbb{N}]^2 \to 3$.
  solution: An infinite homogeneous set.
  refs: [ { ref: patey2016, role: rm } ]

- id: adc
  label: '\mathsf{ADC}'
  name: Ascending or descending chain
  caution: 'For strong Weihrauch reducibility the domain of the instance matters. Here the linear order has domain ℕ, as in Astor et al. [@astoretal2017]; Fiori-Carones, Shafer and Soldà [@fioricaronesshafersolda2022] allow any infinite subset of ℕ, which gives the cylindrification of this problem (same Weihrauch degree). Their strong reductions and cylinder claims are about that version.'
  kind: problem
  formulationOf: ads
  tags: [ orders ]
  definition: >
    Every infinite linear order has an infinite ascending chain or an infinite descending chain (as sets, without the order of enumeration).
  instance: An infinite linear order.
  solution: An infinite set which is an ascending chain or a descending chain.
  refs: [ { ref: astoretal2017, role: origin } ]

- id: ht
  caution: 'Hindman''s theorem is also called the finite sums theorem; FS here is the free set theorem ([[fs]]).'
  label: '\mathsf{HT}'
  name: Hindman's theorem
  kind: problem
  tags: [ ramsey ]
  aliases: [ Hindman, finite sums ]
  definition: >
    For every finite coloring of $\mathbb{N}$ there is an infinite set $H$ such that all nonempty finite sums of distinct elements of $H$ have the same color.
  instance: >
    A coloring $c : \mathbb{N} \to k$.
  solution: An infinite set all of whose finite sums have the same color.
  refs: [ { ref: blasshirstsimpson1987, role: rm } ]

