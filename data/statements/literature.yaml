- id: rsg
  label: '\mathsf{RSg}'
  name: Rival–Sands theorem for graphs
  caution: 'For strong Weihrauch reducibility the vertex set matters. Here, as in Fiori-Carones, Shafer and Soldà [@fioricaronesshafersolda2022], it is any infinite subset of ℕ; this version is the cylindrification of the one with vertex set ℕ (their Proposition 7.2), and both have the same Weihrauch degree.'
  kind: problem
  tags: [ ramsey ]
  aliases: [ inside/outside Ramsey theorem, Rival-Sands ]
  definition: >
    Every infinite graph $G$ contains an infinite subset $H$ such that every vertex of $G$ is adjacent to none, exactly one, or infinitely many vertices of $H$.
  instance: An infinite graph $G$.
  solution: An infinite set $H$ as above.
  refs: [ { ref: fioricaronesshafersolda2022, role: rm } ]

- id: rsgr
  label: '\mathsf{RSgr}'
  name: Rival–Sands theorem for graphs, refined
  kind: problem
  minor: true
  tags: [ ramsey ]
  aliases: [ RSgr ]
  definition: >
    Every infinite graph $G = (V, E)$ contains an infinite $H \subseteq V$ such that every vertex of $G$ has infinitely
    many or at most one neighbours in $H$, and every vertex of $H$ has infinitely many or no neighbours in $H$.
  instance: An infinite graph $G$.
  solution: An infinite set $H$ as above.
  refs: [ { ref: fioricaronesshafersolda2022, role: origin, loc: Section 3 } ]

- id: wrsgr
  label: '\mathsf{wRSgr}'
  name: Weak Rival–Sands theorem for graphs, refined
  kind: problem
  minor: true
  tags: [ ramsey ]
  aliases: [ wRSgr ]
  definition: >
    Every infinite graph $G = (V, E)$ contains an infinite $H \subseteq V$ such that every vertex of $H$ has infinitely
    many or no neighbours in $H$.
  instance: An infinite graph $G$.
  solution: An infinite set $H$ as above.
  refs: [ { ref: fioricaronesshafersolda2022, role: origin, loc: Section 3 } ]

