  name: Noetherian rings have finitely many prime ideals
  caution: 'In higher-order reverse mathematics, NFP is the neighbourhood function principle, an unrelated statement about functionals (Definition 5.1 of [@sanders2019b]); it is not in the catalogue.'
  kind: sentence
  tags: [ algebra ]
  definition: Every Noetherian ring has only finitely many prime ideals.
  refs:
    - { ref: dzhafarovmummert2022, role: rm, loc: "Definition 11.6.6 (Conidis)" }

- id: delta11ca
  label: '\Delta^1_1\text{-}\mathsf{CA}'
  name: Δ¹₁ comprehension
  kind: sentence
  tags: []
  definition: >
    Comprehension for $\Delta^1_1$-definable sets: if $\varphi$ and $\psi$ are $\Sigma^1_1$ formulas with $(\forall n)[\varphi(n) \leftrightarrow \neg\psi(n)]$, then $\{n : \varphi(n)\}$ exists. HYP is its minimum $\omega$-model.
  refs:
    - { ref: dzhafarovmummert2022, role: rm, loc: Definition 5.8.14 }
    - { ref: simpson2009, role: rm, loc: Section VIII.4 }

- id: iht
  label: '\mathsf{IHT}'
  name: Iterated Hindman's theorem
  kind: sentence
  tags: [ ramsey ]
  definition: >
    For every sequence of 2-colorings $\langle C_i : i \in \mathbb{N} \rangle$ there is an increasing sequence $\langle x_i \rangle$ such that for every $j$, the set $\{x_i : i > j\}$ satisfies Hindman's theorem for $C_j$. Equivalent over $\mathsf{RCA}_0$ to AUF and to the Milliken–Taylor theorem $\mathsf{MT}^n$ for $n \ge 3$, and over $\mathsf{ACA}_0$ to the Auslander–Ellis theorem.
  refs:
    - { ref: dzhafarovmummert2022, role: rm, loc: Theorem 10.6.14 }

- id: padeg
  caution: 'In Weihrauch and computability papers this problem is usually written PA; here PA ([[pa]]) is first-order Peano arithmetic, the full induction scheme.'
  label: '\textsf{PA degrees}'
  name: PA degrees (problem)
  kind: problem
  tags: [ computability, weihrauch ]
  definition: Given $p$, find $q$ of PA degree relative to $p$ ($p \ll q$).
  instance: A set $p$.
  solution: A set $q$ with $p \ll q$, i.e. of PA degree relative to $p$.
  refs:
    - { ref: brattkachirache2026, role: rm, loc: "Definition 14(11)" }
    - { ref: brattkahendtlasskreuzer2017, role: rm, loc: "Definition 6.2 (on Turing degrees)" }

- id: sigma11ac
  label: '\Sigma^1_1\text{-}\mathsf{AC}'
  name: Σ¹₁ axiom of choice
  kind: sentence
  tags: []
  definition: >
    $\mathsf{ACA}_0$ plus the scheme $\forall n \exists Y \eta(n, Y) \to \exists Z \forall n \eta(n, (Z)_n)$ for $\Sigma^1_1$ formulas $\eta$. Strictly between $\Delta^1_1\text{-}\mathsf{CA}_0$ and $\mathsf{ATR}_0$; HYP is an $\omega$-model of it.
  refs:
    - { ref: simpson2009, role: rm, loc: "Definition VII.6.1(1)" }

