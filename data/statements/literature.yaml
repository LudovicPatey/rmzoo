  name: Stable ascending or descending chain
  kind: problem
  tags: [ orders, ramsey, stable ]
  definition: >
    Every infinite stable linear order has an infinite ascending chain or an infinite descending chain (a chain need not be a sequence in the order of $\mathbb{N}$, unlike for SADS).
  instance: An infinite stable linear order $L$.
  solution: An infinite $C \subseteq L$ which is an ascending chain or a descending chain of $L$.
  refs:
    - { ref: solda2021, role: rm, loc: Definition 2.2.3 }
