# Theorems of ordinary mathematics and further principles from the 2009–2026 literature sweep.

- { id: "cousin-c", label: "\\mathsf{CL}_{\\mathrm{c}}", name: "Cousin's lemma for continuous gauges", kind: "sentence", tags: [ "analysis" ], definition: "For every continuous gauge $\\delta : [0,1] \\to \\mathbb{R}^+$ there is a $\\delta$-fine tagged partition of $[0,1]$.", refs: [ { ref: barrettdowneygreenberg2021, role: rm, loc: "Definition 2.3, Theorem 4.2" } ] }
- { id: "cousin-b1", label: "\\mathsf{CL}_{\\mathrm{B1}}", name: "Cousin's lemma for Baire class 1 gauges", kind: "sentence", tags: [ "analysis" ], definition: "Cousin's lemma restricted to gauges of Baire class 1.", refs: [ { ref: barrettdowneygreenberg2021, role: rm, loc: "Definition 2.3, Theorem 5.5" } ] }
- { id: "ukt", label: "\\mathsf{UKT}", name: "Uniform Kruskal theorem", kind: "sentence", tags: [ "well-orders" ], definition: "The uniform Kruskal theorem of Freund, Rathjen and Weiermann: a uniform version of Kruskal's theorem for recursive data types given by normal transformations of well partial orders.", refs: [ { ref: uftring2025, role: rm, loc: "Theorem 10" } ] }
- { id: "tlpp", label: "\\mathsf{TLPP}", name: "Transfinite leftmost path principle", kind: "sentence", tags: [ "well-orders" ], definition: "Towsner's transfinite leftmost path principle: an axiom asserting the existence of leftmost paths through ill-founded trees, relative to hyperarithmetic hierarchies along well-orders. The theory $\\mathsf{TLPP}_0$ ($\\mathsf{RCA}_0$ + TLPP) lies between $\\mathsf{ATR}_0$ and $\\Pi^1_1\\text{-}\\mathsf{CA}_0$.", refs: [ { ref: fernandezduqueetal2023, role: rm, loc: §2 (Definition 2.3 and following) } ] }
- { id: "jordan", label: "\\mathsf{JD}", name: "Jordan decomposition theorem", kind: "sentence", tags: [ "analysis" ], definition: "Every function $f : [0,1] \\to \\mathbb{R}$ of bounded variation is the difference of two non-decreasing functions.", refs: [ { ref: niestriplettyokoyama2017, role: rm, loc: "Theorem 3.1" } ] }
- { id: "jordan-c", label: "\\mathsf{JD}_{\\mathrm{c}}", name: "Jordan decomposition theorem (continuous)", kind: "sentence", tags: [ "analysis" ], definition: "Every continuous function of bounded variation on $[0,1]$ is the difference of two continuous non-decreasing functions.", refs: [ { ref: niestriplettyokoyama2017, role: rm, loc: "Theorem 3.1" } ] }
- { id: "bvdiff", label: "\\mathsf{BV}\\text{-}\\mathsf{DIFF}", name: "Differentiability of BV functions", kind: "sentence", tags: [ "analysis", "randomness" ], definition: "Every function of bounded variation on $[0,1]$ is differentiable almost everywhere.", refs: [ { ref: niestriplettyokoyama2017, role: rm, loc: "Theorem 6.8" } ] }
- { id: "art22", label: "\\mathsf{ART}^2_2", name: "Ramsey theorem for additive colourings", kind: "problem", tags: [ "ramsey" ], definition: "Ramsey's theorem for pairs restricted to additive colourings (colourings into a finite semigroup with $c(i,k) = c(i,j) \\cdot c(j,k)$), asserting an infinite homogeneous set.", instance: "A coloring $c : [\\mathbb{N}]^2 \\to S$ into a finite semigroup with $c(i,k) = c(i,j) \\cdot c(j,k)$.", solution: An infinite homogeneous set., refs: [ { ref: koodziejczyketal2016, role: rm, loc: "Definition 2.1, Theorem 1.1(2)" } ] }
- { id: "buchi", label: "\\mathsf{BC}", name: "Büchi's complementation theorem", kind: "sentence", tags: [ "induction" ], definition: "Every language recognized by a nondeterministic Büchi automaton has a complement recognized by a nondeterministic Büchi automaton.", refs: [ { ref: koodziejczyketal2016, role: rm, loc: "Theorem 1.1(3′)" } ] }
- { id: "fishburn", label: "\\mathsf{FPT}", name: "Fishburn's possibility theorem", kind: "sentence", tags: [ "first-order" ], definition: "Fishburn's possibility theorem for countable societies: there is a social welfare function satisfying Arrow's conditions.", refs: [ { ref: eastaugh2023, role: rm, loc: "Theorem 1.2" } ] }
- { id: "aht", label: "\\mathsf{AHT}", name: "Adjacent Hindman's theorem", kind: "problem", tags: [ "ramsey" ], definition: "For every coloring $c : \\mathbb{N} \\to k$ there is an infinite set $H = \\{h_1 < h_2 < \\dots\\}$ such that all sums of finitely many consecutive elements $h_i + h_{i+1} + \\dots + h_j$ have the same color (with the apartness condition on the binary expansions of the $h_i$).", instance: "A finite coloring of $\\mathbb{N}$.", solution: An infinite set whose finite sums of adjacent elements are monochromatic., refs: [ { ref: carlucci2016, role: origin, loc: Definition 1 } ] }
- { id: "hilbert", label: "\\mathsf{HIL}", name: "Hilbert's theorem", kind: "sentence", tags: [ "ramsey" ], definition: "The variant of the finite-unions form of Hindman's theorem in which the blocks need only be distinct, not unmeshed: for every finite coloring $f$ of the finite subsets of $\\mathbb{N}$, there are an infinite sequence $(X_i)_{i \\in \\mathbb{N}}$ of pairwise distinct finite sets and a color $c$ with $f(\\bigcup_{i \\in F} X_i) = c$ for every finite nonempty $F$.", todo: "Definition taken from the zbMATH review 1239.03038 (A. Kreuzer) of Hirst 2012; the full text is not available (not open access, not on the author's page).", refs: [ { ref: hirst2012, role: origin, loc: "main theorem (zbMATH review)" }, { ref: carlucci2016, role: rm, loc: Section 1 } ] }
- { id: "gowers", label: "\\mathsf{FIN}_k", name: "Gowers' FIN_k theorem", kind: "problem", tags: [ "ramsey" ], definition: "Gowers' pigeonhole principle for $\\mathrm{FIN}_k$, a generalization of Hindman's theorem.", instance: "A number $k$ and a finite coloring of $\\mathrm{FIN}_k$.", solution: An infinite block sequence whose generated combinatorial subspace is monochromatic., refs: [ { ref: kreuzer2015, role: rm, loc: "Section 1" } ] }
- { id: "ap", label: "\\mathsf{AP}", name: "Existence of almost periodic points", kind: "sentence", tags: [ "analysis" ], definition: "Every continuous map on a compact metric space has an almost periodic point.", refs: [ { ref: day2013, role: rm, loc: "Section 1" } ] }
- { id: "aca-plus", label: "\\mathsf{ACA}^+", name: "ω-th jump", kind: "problem", tags: [ "computability" ], definition: "For every $X$, the $\\omega$-th jump $X^{(\\omega)}$ exists.", instance: "A set $X$.", solution: "The $\\omega$-th jump $X^{(\\omega)}$.", refs: [ { ref: blasshirstsimpson1987, role: origin, loc: Section 1 (ACA₀⁺) } ] }
- { id: "aca-prime", label: "\\mathsf{ACA}'", name: "Finite jumps", kind: "problem", tags: [ "computability" ], definition: "For every $n$ and every $X$, the $n$-th jump $X^{(n)}$ exists.", instance: "A set $X$ and a number $n$.", solution: "The $n$-th jump $X^{(n)}$.", refs: [ { ref: dzhafarovmummert2022, role: rm, loc: "Definition 5.6.5" } ] }
- { id: "wop-eps", label: "\\mathsf{WOP}(\\varepsilon_X)", name: "Well-ordering principle for ε", kind: "sentence", tags: [ "well-orders" ], definition: "If $X$ is a well-ordering, then so is $\\varepsilon_X$.", refs: [ { ref: marconemontalban2009, role: rm, loc: "Abstract, Theorem 1.7" } ] }
- { id: "wop-omega-n", label: "\\forall n\\, \\mathsf{WOP}(X \\mapsto \\omega^{\\langle n, X\\rangle})", name: "Well-ordering principle for iterated ω-exponentiation", kind: "sentence", minor: true, tags: [ "well-orders" ], definition: "For every $n$: if $X$ is a well-ordering, then so is $\\omega^{\\langle n, X\\rangle}$, the $n$-th iterate of $X \\mapsto \\omega^X$.", refs: [ { ref: marconemontalban2009, role: rm, loc: "Definition 2.2, Theorem 1.5" } ] }
- { id: "wop-veblen", label: "\\mathsf{WOP}(X \\mapsto \\varphi(X, 0))", name: "Well-ordering principle for the Veblen function", kind: "sentence", tags: [ "well-orders" ], definition: "If $X$ is a well-ordering, then so is $\\varphi(X, 0)$, where $\\varphi$ is the binary Veblen function.", refs: [ { ref: marconemontalban2009, role: rm, loc: "Theorem 1.2 (Friedman), Theorem 6.17" } ] }
- { id: "henson", label: "\\mathsf{BRD}_{\\mathbb{H}}", name: "Finite big Ramsey degrees of Henson graphs", kind: "sentence", tags: [ "ramsey", "graphs" ], definition: "The Henson graphs have finite big Ramsey degrees.", refs: [ { ref: liupatey2026, role: rm, loc: "Main Theorem 1.6" } ] }
- { id: "lebesgue", label: "\\mathsf{CPT}\\Rightarrow\\mathsf{LEB}", name: "Compact spaces are Lebesgue", kind: "sentence", tags: [ "analysis" ], definition: "Every compact metric space is Lebesgue: every open covering has a Lebesgue number.", refs: [ { ref: giustomarcone1996, role: rm, loc: "Definition 3.11, Theorem 5.5" } ] }
- { id: "brooks", label: "\\mathsf{BROOKS}", name: "Brooks' theorem", kind: "sentence", tags: [ "graphs" ], definition: "Brooks' theorem for arbitrary countable graphs: a connected graph of maximum degree $d \\ge 3$ other than $K_{d+1}$ is $d$-colorable.", refs: [ { ref: marconeosso2026, role: rm, loc: "Introduction" } ] }
- { id: "bqo3", label: "\\mathbf{3}\\text{-}\\mathsf{BQO}", name: "The antichain with three elements is bqo", kind: "sentence", tags: [ "well-orders" ], definition: "The discrete order with three elements is a better quasi-order.", refs: [ { ref: freund2022b, role: rm, loc: "Corollary 3.9" } ] }
- { id: "brouwer-inv", label: "\\mathsf{INV}", name: "Brouwer invariance theorems", kind: "sentence", tags: [ "analysis" ], definition: "Brouwer's invariance of dimension and domain theorems (in the formulations of Kihara 2020).", refs: [ { ref: kihara2020b, role: rm, loc: "Theorem 1.1" } ] }
- { id: "ekeland", label: "\\mathsf{EVP}", name: "Ekeland's variational principle", kind: "sentence", tags: [ "analysis" ], definition: "Ekeland's variational principle for lower semicontinuous functions on complete separable metric spaces.", refs: [ { ref: fernandezduqueshaferyokoyama2019, role: rm, loc: "Theorem 1.3" } ] }
- { id: "sct", label: "\\mathsf{SCT}", name: "Size-change termination criterion", kind: "sentence", tags: [ "induction" ], definition: "The size-change termination criterion of Lee, Jones and Ben-Amram.", refs: [ { ref: frittaionsteilayokoyama2016, role: rm, loc: "Section 1" } ] }
- { id: "tietze", label: "\\mathsf{TET}", name: "Tietze extension theorem", kind: "sentence", tags: [ "analysis" ], definition: "Versions of the Tietze extension theorem for functions with moduli of uniform continuity.", refs: [ { ref: shafer2016, role: rm, loc: "Introduction" } ] }
- { id: "hst", label: "\\mathsf{HST}", name: "Helly's selection theorem", kind: "sentence", tags: [ "analysis" ], definition: "Every bounded sequence of functions of bounded variation has a subsequence converging in the weak* topology.", refs: [ { ref: kreuzer2014b, role: rm, loc: "Theorem 19" } ] }
- { id: "ttall", label: "\\mathsf{TT}", name: "Tree theorem for all exponents", kind: "problem", tags: [ "ramsey" ], definition: "For every $n$ and $k$, the tree theorem $\\mathsf{TT}^n_k$ holds.", instance: "Numbers $n, k$ and a coloring of the $n$-element chains of $2^{<\\mathbb{N}}$ with $k$ colors.", solution: "A homogeneous subtree isomorphic to $2^{<\\mathbb{N}}$.", refs: [ { ref: chubbhirstmcnicholl2009, role: origin, loc: "Section 1, statement TTⁿₖ" } ] }
- { id: "pr2", label: "\\mathsf{PR}^2", name: "Packed Ramsey theorem for pairs", kind: "problem", tags: [ "ramsey" ], definition: "$\\mathsf{PRT}^2_k$: for every $\\varphi : \\mathbb{N} \\to \\mathbb{N}$ with $w \\to (\\varphi(w))^2_{k+1}$ for all $w$, and every $f : [\\mathbb{N}]^2 \\to \\{1, \\dots, k\\}$, there is a set $H$ which is packed for $\\varphi$ and semi-homogeneous for $f$ (Erdős–Galvin).", refs: [ { ref: flood2013, role: rm, loc: Statement 1.5 } ], instance: "A function $\\varphi : \\mathbb{N} \\to \\mathbb{N}$ with $w \\to (\\varphi(w))^2_{k+1}$ for all $w$, and a coloring $f : [\\mathbb{N}]^2 \\to \\{1, \\dots, k\\}$.", solution: An infinite set packed for $\varphi$ and semi-homogeneous for $f$. }
- { id: "hb", label: "\\mathsf{HB}", name: "Hahn–Banach theorem (separable)", kind: "problem", tags: [ "analysis", "compactness", "weihrauch" ], definition: "Every bounded linear functional on a closed subspace of a separable Banach space extends to the whole space with the same norm.", instance: "A separable Banach space, a closed subspace and a bounded functional on it.", solution: "A norm-preserving extension of the functional.", refs: [ { ref: gherardimarcone2009, role: rm }, { ref: simpson2009, role: rm, loc: "Section IV.9" } ], caution: "The acronyms HB and HBT name the Hahn–Banach theorem in some papers and the Heine–Borel covering lemma ([[heine-borel]]) in others: check the definition in each paper." }

- id: fra
  label: '\mathsf{FRA}'
  name: Fraïssé's conjecture
  kind: sentence
  tags: [ well-orders, orders ]
  aliases: [ Fraisse conjecture ]
  caution: 'Laver proved it, so some papers call it Laver''s theorem; Laver''s stronger bqo statement is [[lav]].'
  definition: >
    The countable linear orders are well-quasi-ordered under embeddability: for every sequence $(L_n)$ of countable linear orders there are $i < j$ such that $L_i$ embeds into $L_j$.
  refs: [ { ref: shore1993, role: rm }, { ref: montalban2017, role: rm } ]

- id: nwt
  label: '\mathsf{NWT}'
  name: Nash-Williams' theorem on transfinite sequences
  kind: sentence
  tags: [ well-orders ]
  aliases: [ Nash-Williams theorem ]
  phrases: [ "Nash-Williams' theorem" ]
  definition: >
    If $Q$ is a better quasi-order and $\alpha$ is a countable well-order, then the set $S_\alpha(Q)$ of $\alpha$-sequences of elements of $Q$, ordered by embeddability, is a better quasi-order.
  refs: [ { ref: marcone1994, role: rm } ]

- id: nwt-fin
  label: '\mathsf{NWT}_{\mathrm{fin}}'
  name: Nash-Williams' theorem for sequences with finite range
  kind: sentence
  tags: [ well-orders ]
  definition: >
    If $Q$ is a well-quasi-order and $\alpha$ is a countable well-order, then the set of $\alpha$-sequences of elements of $Q$ with finite range, ordered by embeddability, is a well-quasi-order.
  refs: [ { ref: pakhomovsolda2024, role: rm } ]

- id: ght
  label: '\mathsf{GHT}'
  name: Generalized Higman theorem
  kind: sentence
  phrases: [ generalized Higman theorem, "generalized Higman's theorem", generalised Higman theorem, "generalised Higman's theorem" ]
  tags: [ well-orders ]
  definition: >
    If $Q$ is a better quasi-order, then so is the set $Q^{<\omega}$ of finite sequences of elements of $Q$ under embeddability.
  refs: [ { ref: marcone1994, role: rm } ]

- id: aet
  label: '\mathsf{AET}'
  name: Auslander–Ellis theorem
  kind: sentence
  tags: [ analysis ]
  aliases: [ Auslander-Ellis ]
  definition: >
    For every point $x$ of a compact dynamical system $(X, T)$ there is a uniformly recurrent point $y$ which is proximal to $x$.
  refs: [ { ref: blasshirstsimpson1987, role: rm }, { ref: kreuzer2013, role: rm } ]

- id: vdw
  label: '\mathsf{VDW}'
  name: Van der Waerden's theorem
  kind: sentence
  tags: [ ramsey, induction ]
  aliases: [ van der Waerden ]
  definition: >
    For every finite coloring of $\mathbb{N}$, some color class contains arbitrarily long finite arithmetic progressions.
  refs: [ { ref: frittaion2017, role: rm, loc: Theorem 4.1 } ]

- id: brown
  label: '\mathsf{BL}'
  name: Brown's lemma
  kind: sentence
  tags: [ ramsey, induction ]
  aliases: [ Brown's lemma ]
  definition: >
    Every finite coloring $C : \mathbb{N} \to r$ has a homogeneous piecewise syndetic set, i.e. a homogeneous set that, for some $d$, contains arbitrarily large finite sets whose consecutive elements differ by at most $d$.
  refs: [ { ref: frittaion2017, role: rm, loc: Theorem 1.2 } ]

- id: rudin
  label: '\mathsf{RL}'
  name: Rudin's lemma
  kind: sentence
  tags: [ orders ]
  aliases: [ Rudin's lemma ]
  definition: >
    Given a countable poset $(X, \preceq)$ and a $\preceq$-directed family $(F_i)_{i \in \mathbb{N}}$ of nonempty finite subsets of $X$, there is a $\preceq$-directed subset $D \subseteq \bigcup_i F_i$ that meets every $F_i$.
  refs: [ { ref: liruwu2017, role: rm, loc: Theorem 1 } ]

- id: mtt
  label: '\mathsf{MTT}'
  name: Milliken's tree theorem
  kind: sentence
  tags: [ ramsey ]
  aliases: [ Milliken ]
  definition: >
    Let $T$ be an infinite tree with no leaves. For all $n, k \ge 1$ and every coloring $f : S_n(T) \to k$ of the strong subtrees of $T$ of height $n$, there is a strong subtree $S$ of $T$ of height $\omega$ such that $f$ is constant on $S_n(S)$.
  refs: [ { ref: dauriacetal2024, role: rm, loc: Theorem 2.26 } ]

- id: mtt2
  label: '\mathsf{MTT}^2'
  name: Milliken's tree theorem for height 2
  kind: sentence
  tags: [ ramsey ]
  definition: >
    Milliken's tree theorem restricted to colorings of the strong subtrees of height 2.
  refs: [ { ref: dauriacetal2024, role: rm, loc: Statement 2.27 } ]

- id: mtt3
  label: '\mathsf{MTT}^3'
  name: Milliken's tree theorem for height 3
  kind: sentence
  tags: [ ramsey ]
  definition: >
    Milliken's tree theorem restricted to colorings of the strong subtrees of height 3.
  refs: [ { ref: dauriacetal2024, role: rm, loc: Statement 2.27 } ]

- id: hl
  label: '\mathsf{HL}'
  name: Halpern–Läuchli theorem
  kind: problem
  tags: [ ramsey ]
  aliases: [ Halpern-Läuchli theorem, PMTT1 ]
  definition: >
    For infinite trees $T_0, \dots, T_{d-1}$ with no leaves and every $k$-coloring of $\bigcup_n T_0(n) \times \dots \times T_{d-1}(n)$,
    there are strong subtrees $S_0, \dots, S_{d-1}$ with a common level function such that the coloring is constant on
    $\bigcup_n S_0(n) \times \dots \times S_{d-1}(n)$. It is the product Milliken tree theorem for height 1.
  instance: 'Infinite bounded trees $T_0, \dots, T_{d-1}$ with no leaves and a coloring $f : \bigcup_n T_0(n) \times \dots \times T_{d-1}(n) \to k$.'
  solution: 'Strong subtrees $(S_0, \dots, S_{d-1}) \in S_\omega(T_0, \dots, T_{d-1})$ on whose level product $f$ is constant.'
  refs: [ { ref: dauriacetal2024, role: rm, loc: Theorem 2.28 } ]

- id: pmtt
  label: '\mathsf{PMTT}'
  name: Product Milliken tree theorem
  kind: sentence
  minor: true
  tags: [ ramsey ]
  definition: >
    For infinite trees $T_0, \dots, T_{d-1}$ with no leaves, all $n, k$ and every $f : S_n(T_0, \dots, T_{d-1}) \to k$, there is
    $(S_0, \dots, S_{d-1}) \in S_\omega(T_0, \dots, T_{d-1})$ such that $f$ is constant on $S_n(S_0, \dots, S_{d-1})$.
  refs: [ { ref: dauriacetal2024, role: rm, loc: Theorem 2.29 } ]

- id: pmtt2
  label: '\mathsf{PMTT}^2'
  name: Product Milliken tree theorem for height 2
  kind: sentence
  tags: [ ramsey ]
  definition: The product version of Milliken's tree theorem restricted to colorings of strong subtree products of height 2.
  refs: [ { ref: dauriacetal2024, role: rm, loc: Statement 2.30 } ]

- id: dt2
  label: '\mathsf{DT}^2'
  name: Devlin's theorem for pairs
  kind: sentence
  tags: [ ramsey, orders ]
  aliases: [ Devlin's theorem ]
  definition: >
    For every $k$ and every $f : [\mathbb{Q}]^2 \to k$ there is a dense suborder $S \subseteq \mathbb{Q}$ without endpoints with
    $|f([S]^2)| \leq 2$ (that is, $(\forall k)\,\mathsf{DT}^2_{k,2}$; the bound 2 is optimal, as observed by Galvin).
  refs: [ { ref: dauriacetal2024, role: rm, loc: "Statement 2.32, Theorem 2.31" } ]

- id: rg2
  label: '\mathsf{RG}^2'
  name: Rado graph theorem for pairs
  kind: sentence
  tags: [ ramsey, graphs ]
  aliases: [ Rado graph theorem ]
  definition: >
    For every $k$ and every coloring $f : [R]^2 \to k$ of the pairs of the Rado graph $R$, there is a subgraph $R' \subseteq R$
    isomorphic to $R$ with $|f''[R']^2| \leq 4$ (that is, $(\forall k)\,\mathsf{RG}^2_{k,4}$).
  refs: [ { ref: dauriacetal2024, role: rm, loc: "Statement 2.35, Theorem 6.32" } ]

- id: bcg
  label: '\mathsf{BCG}\text{-}\mathsf{Det}'
  name: Determinacy of binary choice games
  kind: sentence
  tags: [ well-orders ]
  definition: >
    Every clopen game on integers in which each player has at most two possible moves at each turn (a well-founded binary choice game tree) is determined.
  refs: [ { ref: aguilerakouptchinsky2026, role: rm, loc: Theorem 1.1 } ]

- id: mle
  label: '\mathsf{MLE}'
  name: Maximal linear extension theorem
  kind: sentence
  tags: [ well-orders, orders ]
  definition: >
    Every well partial order has a linear extension of maximal order type (de Jongh and Parikh).
  refs: [ { ref: marconeshore2010, role: rm } ]

- id: kt
  label: '\mathsf{KT}'
  name: Kruskal's theorem
  kind: sentence
  tags: [ well-orders ]
  aliases: [ Kruskal's tree theorem ]
  phrases: [ "Kruskal's theorem", "Kruskal's tree theorem" ]
  definition: >
    For every infinite sequence $(T_k)_{k \in \mathbb{N}}$ of finite trees there are $i < j$ such that $T_i$ embeds into
    $T_j$, where a finite tree is a finite partial order with a least element in which the predecessors of each node
    are linearly ordered, and an embedding is an injection preserving infima.
  refs: [ { ref: simpson1985b, role: rm, loc: "Definitions 1.1, 1.2, Satz 1.3" } ]

- id: gmt
  label: '\mathsf{GMT}'
  name: Graph minor theorem
  kind: sentence
  tags: [ well-orders, graphs ]
  aliases: [ Robertson-Seymour theorem ]
  phrases: [ graph minor theorem ]
  definition: >
    The finite graphs are well-quasi-ordered by minor inclusion (Robertson and Seymour).
  refs: [ { ref: friedmanrobertsonseymour1987, role: rm, loc: Introduction } ]

- id: gmtb
  label: '\mathsf{GMT}_{\mathrm{bd}}'
  name: Graph minor theorem for bounded tree-width
  kind: sentence
  minor: true
  tags: [ well-orders, graphs ]
  phrases: [ bounded graph minor theorem ]
  definition: >
    For every $k$, the finite graphs of tree-width less than $k$ are well-quasi-ordered by minor inclusion.
  refs: [ { ref: friedmanrobertsonseymour1987, role: rm, loc: "Introduction, Theorem 4.2" } ]

- id: lav
  label: '\mathsf{LAV}'
  name: Laver's theorem
  kind: sentence
  tags: [ well-orders ]
  phrases: [ "Laver's theorem" ]
  caution: 'Some papers call Fraïssé''s conjecture ([[fra]]) Laver''s theorem, since Laver proved it; LAV is his stronger result for labelled orders and bqos.'
  definition: >
    If $Q$ is a better quasi-order, then so is the class $\mathcal{L}_Q$ of countable linear orders labelled by
    elements of $Q$, under label-respecting order-preserving embeddability. With a one-element $Q$ it gives that
    countable linear orders are bqo under embeddability, which implies Fraïssé's conjecture.
  refs: [ { ref: marcone2005, role: rm, loc: "Definition 2.27, Statement 2.29" }, { ref: montalban2011, role: rm, loc: Question 24 } ]

- id: lo-bqo
  label: '\textsf{linear orders bqo}'
  name: Countable linear orders are bqo
  kind: sentence
  minor: true
  tags: [ well-orders ]
  definition: >
    The class $\mathcal{L}$ of countable linear orders is better-quasi-ordered by embeddability (an unlabelled form of
    Laver's theorem).
  refs: [ { ref: marcone2017, role: rm, loc: "Statement 6.27" } ]
  caution: 'Marcone 2017 calls this Laver''s theorem; the labelled form of Marcone 2005 is [[lav]].'

- id: inf-vs
  label: '\mathsf{INF}'
  name: Infinite dimensional proper subspaces
  kind: sentence
  minor: true
  tags: [ algebra ]
  aliases: [ INF0 ]
  definition: >
    Every infinite dimensional vector space (over ℚ, of arbitrarily large finite dimension) contains an infinite
    dimensional proper subspace.
  refs: [ { ref: conidis2014, role: origin, loc: "Section 1, list of systems" } ]

- id: inf2b
  label: '\mathsf{INF}^{2B}'
  name: Infinite dimensional proper subspaces of 2-based vector spaces
  kind: sentence
  tags: [ algebra ]
  aliases: [ INF2B0, "INF^{2B}_0" ]
  definition: >
    Every infinite dimensional 2-based vector space contains an infinite dimensional proper subspace. A vector space
    $V = \mathbb{Q}^\infty / S$ is 2-based if $S$ is generated by vectors of the form $v_i - k_{i,j} v_j$ with
    $k_{i,j} \in \mathbb{Q}$.
  refs: [ { ref: conidis2014, role: origin, loc: "Section 1, list of systems; Definition 4.2" } ]

- id: aht2
  label: '\mathsf{AHT}_2'
  name: Adjacent Hindman's theorem for 2 colors
  kind: problem
  minor: true
  tags: [ ramsey ]
  aliases: [ AHT2, AHT_2 ]
  definition: >
    For every coloring $c : \mathbb{N} \to 2$ there is an infinite set $H = \{h_1 < h_2 < \cdots\}$ such that all
    sums of finitely many adjacent elements $h_i + h_{i+1} + \cdots + h_j$ have the same color, and $H$ satisfies
    the apartness condition: if $h < h'$ are in $H$ then $\mu(h) < \lambda(h')$ (the largest exponent in the
    binary expansion of $h$ is smaller than the least exponent in that of $h'$).
  instance: 'A coloring $c : \mathbb{N} \to 2$.'
  solution: An infinite set with the apartness condition whose sums of adjacent elements are monochromatic.
  refs:
    - { ref: carlucci2016, role: origin, loc: Definition 1 }

- id: gap-seq-weak
  label: '\textsf{Weak gap sequences wpo}'
  name: Sequences with the weak (Gordeev's symmetric) gap condition form a wpo
  kind: sentence
  minor: true
  tags: [ well-orders ]
  definition: >
    For every well order $\alpha$, the partial order $\mathsf{S}^{\mathrm{w}}_\alpha$ of finite sequences in
    $\alpha$ is a well partial order, where $s \leq t$ iff there is a strictly increasing $f : |s| \to |t|$ with
    $s_i \leq t_{f(i)}$ for all $i < |s|$ and $s_{i+1} \leq t_j$ whenever $f(i) < j < f(i+1)$. This order is
    identical to Gordeev's $\mathsf{S}^{\mathrm{g}}_\alpha$ with the symmetric gap condition ($s_i \leq t_j$ or
    $s_{i+1} \leq t_j$ in the gaps), by Lemma 2.2 of the source.
  refs:
    - { ref: uftring2025b, role: rm, loc: "Definitions 1.1 and 1.2, Lemma 2.2, Theorem 3.3" }

- id: gap-seq-strong
  label: '\textsf{Strong gap sequences wpo}'
  name: Sequences with the strong gap condition form a wpo
  kind: sentence
  minor: true
  tags: [ well-orders ]
  definition: >
    For every well order $\alpha$, the partial order $\mathsf{S}^{\mathrm{s}}_\alpha$ is a well partial order: as
    for the weak gap condition, with in addition the outer gap condition $s_0 \leq t_j$ for all $j < f(0)$ when
    $|s| > 0$.
  refs:
    - { ref: uftring2025b, role: rm, loc: "Definitions 1.3 and 1.4, Theorem 3.3" }

- id: gap-btree
  label: '\textsf{Ascending binary trees wpo}'
  name: Binary trees with weakly ascending labels form a wpo
  kind: sentence
  minor: true
  tags: [ well-orders ]
  definition: >
    For every well order $\alpha$, the partial order $\mathsf{B}_{\alpha,1}$ is a well partial order: binary
    trees with inner labels in $\alpha$, weakly ascending (every inner label of a subtree is at least the label of
    its root), and leaves labelled by the one-element order, ordered by the least relation with
    $s \leq \beta \star [t_l, t_r]$ if $s \leq t_l$ or $s \leq t_r$, and
    $\beta \star [s_l, s_r] \leq \gamma \star [t_l, t_r]$ if $\beta \leq \gamma$, $s_l \leq t_l$ and $s_r \leq t_r$.
  refs:
    - { ref: uftring2025b, role: rm, loc: "Definition 1.5, Theorem 3.3" }

- id: gap-btree-l
  label: '\textsf{Left-strict ascending binary trees wpo}'
  name: Binary trees with weakly, on left subtrees strictly, ascending labels form a wpo
  kind: sentence
  minor: true
  tags: [ well-orders ]
  definition: >
    For every well order $\alpha$, the suborder $\mathsf{B}^l_{\alpha,1}$ of $\mathsf{B}_{\alpha,1}$, in which the
    label of a node is strictly smaller than every inner label of its left subtree and at most every inner label
    of its right subtree, is a well partial order.
  refs:
    - { ref: uftring2025b, role: rm, loc: "Definition 1.6, Theorem 3.3" }

- id: isct
  label: '\textsf{ISCT soundness}'
  name: Soundness of idempotent size-change termination
  kind: sentence
  minor: true
  tags: [ well-orders ]
  definition: >
    If $\mathcal{G}$ is a safe description of a first-order functional program $P$ and $\mathcal{G}$ is ISCT
    (every idempotent size-change graph in the closure $\mathrm{cl}(\mathcal{G})$ has a strict arc
    $x \to x$), then $P$ terminates.
  refs:
    - { ref: frittaionetal2017, role: origin, loc: "Definition 1.1, Theorem 1.2" }

- id: msct
  label: '\textsf{MSCT soundness}'
  name: Soundness of multipath size-change termination
  kind: sentence
  minor: true
  tags: [ well-orders ]
  definition: >
    If $\mathcal{G}$ is a safe description of a first-order functional program $P$ and $\mathcal{G}$ is MSCT
    (size-change terminating: every infinite multipath has an infinitely descending thread), then $P$
    terminates.
  refs:
    - { ref: frittaionetal2017, role: origin, loc: "Definition 1.1, Theorem 1.2" }

- id: stietze-closed
  label: '\textsf{Strong Tietze}_{\mathrm{closed}}'
  name: Strong Tietze extension theorem for closed subsets of [0,1]
  kind: sentence
  minor: true
  tags: [ analysis ]
  definition: >
    For every closed set $K \subseteq [0,1]$ (the complement of a sequence of open balls), every
    $\varphi \in C(K)$ (a continuous real-valued function with a modulus of uniform continuity) extends to some
    $\psi \in C([0,1])$.
  refs:
    - { ref: friedmansimpson2000, role: rm, loc: "Section 5, statement (3)" }

- id: stietze-csc
  label: '\textsf{Strong Tietze}_{\mathrm{csc}}'
  name: Strong Tietze extension theorem for closed, separably closed subsets of [0,1]
  kind: sentence
  minor: true
  tags: [ analysis ]
  definition: >
    For every $K \subseteq [0,1]$ which is both closed (the complement of a sequence of open balls) and
    separably closed (the closure of a sequence of points), every $\varphi \in C(K)$ (a continuous real-valued
    function with a modulus of uniform continuity) extends to some $\psi \in C([0,1])$.
  refs:
    - { ref: friedmansimpson2000, role: rm, loc: "Section 5, statement (4)" }

- id: uo-interval-graphs
  label: '\textsf{Uniquely orderable interval graphs}'
  name: Characterization of uniquely orderable interval graphs (Fishburn)
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    A countable connected interval graph is uniquely orderable (the incomparability graph of a partial order
    unique up to duality) iff it does not contain a buried subgraph: a set $B$ of vertices containing two
    non-adjacent vertices such that, with $K(B)$ the vertices adjacent to all of $B$ and
    $R(B) = V \setminus (B \cup K(B))$, $K(B) \cap B = \emptyset$, $R(B) \neq \emptyset$, and no vertex of $B$
    is adjacent to a vertex of $R(B)$.
  refs:
    - { ref: fioricaronesmarcone2021b, role: rm, loc: "Definitions 2.2, 2.3 and 3.1, Theorem 2" }

- id: ig-char
  label: '\textsf{Interval graph characterization}'
  name: Triangulated graphs without asteroidal triples are interval graphs
  kind: sentence
  minor: true
  tags: [ graphs ]
  definition: >
    If a reflexive graph is triangulated (every simple cycle of length at least four has a chord) and has no
    asteroidal triples, then it is an interval graph (its vertices can be represented by intervals of a linear
    order, adjacent iff the intervals intersect). The converse is provable in $\mathsf{RCA}_0$ (Theorem 4.5).
  refs:
    - { ref: fioricaronesmarcone2021b, role: rm, loc: "Definitions 2.4 and 4.1, Theorem 4.6" }

- id: rudin-disjoint
  label: '\textsf{Rudin''s lemma for disjoint families}'
  name: Rudin's lemma with singleton intersections (disjoint families)
  kind: sentence
  minor: true
  tags: [ orders ]
  definition: >
    Given a countable poset $(X, \preceq)$ and a $\preceq$-directed family $(F_i)_{i \in \mathbb{N}}$ of pairwise
    disjoint nonempty finite subsets of $X$ (directed for the Smyth preorder), there is a $\preceq$-directed
    subset $E \subseteq \bigcup_i F_i$ such that each $E \cap F_i$ is a singleton.
  refs: [ { ref: liruwu2017, role: origin, loc: Theorem 2 } ]

- id: worm-bc
  label: '\textsf{Worm termination for BC}'
  name: Termination of fundamental sequences of worms in the bracket calculus
  kind: sentence
  minor: true
  firstOrder: true
  tags: [ well-orders, first-order ]
  definition: >
    For each worm $a \in \mathbb{W}^{()}$ of Beklemishev's bracket calculus $\mathsf{BC}$ there is $i \in \mathbb{N}$
    with $a⦃i⦄ = \top$, where $a⦃0⦄ = a$ and $a⦃n+1⦄ = a⦃n⦄\{n+1\}$ for the fundamental sequences
    $a\{n\}$ of Section 8. A true arithmetical sentence (by the well-foundedness of $\Gamma_0$), not provable
    in $\mathsf{ATR}_0$.
  refs: [ { ref: fernandezduquereyes2020, role: origin, loc: "Theorem 42, Theorem 52" } ]

- id: bachmann-howard
  label: '\textsf{Bachmann–Howard principle}'
  name: Abstract Bachmann–Howard principle
  kind: sentence
  tags: [ well-orders ]
  phrases: [ abstract Bachmann-Howard principle, Bachmann-Howard principle ]
  definition: >
    Every (coded) dilator $T$ has a well-founded Bachmann–Howard fixed point: a well-order $X$ with a
    Bachmann–Howard collapse $\vartheta : T_X \to X$, i.e. (i) if $\sigma <_{T_X} \tau$ and
    $\mathrm{supp}_X(\sigma) <^{\mathrm{fin}}_X \vartheta(\tau)$ then $\vartheta(\sigma) <_X \vartheta(\tau)$, and
    (ii) $\mathrm{supp}_X(\sigma) <^{\mathrm{fin}}_X \vartheta(\sigma)$. A dilator is a prae-dilator (an
    endofunctor of linear orders with a support transformation) that preserves well-foundedness. Second-order
    version of the set-theoretic principle; equivalent over $\mathsf{RCA}_0$ to the computable version
    ($\vartheta(T)$ is well-founded for every coded dilator $T$, Definition 4.4).
  refs:
    - { ref: freund2018, role: rm, loc: "Definitions 1.1–1.3, Definition 2.16, Theorem 4.6" }

- id: ordrt
  label: '\textsf{Ordered Ramsey''s theorem}'
  name: Ordered Ramsey's theorem for pairs
  kind: problem
  minor: true
  tags: [ ramsey, induction ]
  phrases: [ Ordered Ramsey's Theorem ]
  definition: >
    If $(P, \preceq)$ is a finite partial order and $C : [\mathbb{N}]^2 \to P$ is a colouring with
    $C(i, j) \preceq C(i, k)$ for all $i < j < k$, there is an infinite homogeneous set. Equivalent to its
    restriction to linear orders.
  instance: 'A finite partial order $(P, \preceq)$ and a colouring $C : [\mathbb{N}]^2 \to P$ with $C(i,j) \preceq C(i,k)$ for $i < j < k$.'
  solution: An infinite set $I$ with $C$ constant on $[I]^2$.
  refs: [ { ref: koodziejczyketal2016, role: origin, loc: Definition 4.2 } ]

- id: wilke
  label: '\textsf{Wilke extension principle}'
  name: Wilke extension principle
  kind: sentence
  minor: true
  tags: [ ramsey, induction ]
  phrases: [ Wilke extension principle ]
  definition: >
    For every alphabet $\Sigma$, finite Wilke algebra $(S_+, S_\infty)$ with a semigroup homomorphism
    $f : \Sigma^+ \to S_+$ and every $\alpha \in \Sigma^{\mathbb{N}}$, there is a unique $x \in S_\infty$ such that
    $x = f(U_0) \cdot f(U_1)^\infty$ for every weakly Ramseyan decomposition $\alpha = U_0 U_1 \cdots$ of $\alpha$
    with respect to $f$.
  refs: [ { ref: koodziejczyketal2016, role: origin, loc: Definition 10.1 } ]

- id: mso-depth5
  label: '\textsf{Decidability of depth-5 MSO}(\mathbb{N}, \le)'
  name: Decidability of the depth-5 fragment of the MSO theory of (ℕ, ≤)
  kind: sentence
  minor: true
  tags: [ induction ]
  definition: >
    The sentence $\varphi_5$ stating that the depth-5 fragment of the monadic second-order theory of
    $(\mathbb{N}, \le)$ is decidable (with the truth definition for depth-$n$ formulae expressible in
    $\mathsf{RCA}_0$; depth counts alternating blocks of $\wedge/\forall$ and $\vee/\exists$). Over
    $\mathsf{RCA}_0$, $\varphi_5$ implies $\varphi_n$ for every $n \in \omega$.
  refs: [ { ref: koodziejczyketal2016, role: origin, loc: "Section 3, Theorem 1.1(4), Proposition 7.1" } ]

- id: mcnaughton
  label: '\textsf{McNaughton''s theorem}'
  name: Determinisation of Büchi automata (McNaughton's theorem)
  kind: sentence
  minor: true
  tags: [ induction ]
  phrases: [ determinisation of Büchi automata, McNaughton's theorem ]
  definition: >
    There is an algorithm which, for each nondeterministic Büchi automaton $A$, outputs a deterministic Rabin
    automaton $B$ accepting exactly the infinite words that $A$ accepts.
  refs: [ { ref: koodziejczyketal2016, role: origin, loc: "Theorem 1.1(5), Theorem 12.1" } ]

- id: bcg-clopen
  label: '\Delta^0_1\text{-}\mathsf{Det}\textsf{ for binary choice game trees}'
  name: Clopen determinacy for binary choice game trees
  kind: sentence
  minor: true
  tags: [ determinacy ]
  definition: >
    For every binary choice game tree $T$ (a tree $T \subseteq \mathbb{N}^{<\mathbb{N}}$ in which every node has at most
    two immediate successors) and every $\Delta^0_1$ payoff $\varphi$, the game $G(T, \varphi)$ is determined, where the
    first player to leave $T$ loses: one of the players has a winning strategy for the payoff
    $\psi(x) \equiv \neg\mu_I(x) \wedge (\varphi(x) \vee \mu_{II}(x))$, $\mu_I$ ($\mu_{II}$) saying that player I (II)
    played outside $T$ first.
  refs: [ { ref: aguilerakouptchinsky2026, role: rm, loc: "Definitions 2.1, 2.4, Theorem 1.1" } ]

- id: pi11-ti
  label: '\Pi^1_1\text{-}\mathsf{TI}'
  name: Π¹₁ transfinite induction (Π¹₁ bar induction)
  kind: sentence
  tags: [ well-orders ]
  aliases: [ Π11-TI0, Pi11-TI0, Π11-bar induction ]
  phrases: [ Π11-bar induction, Π11 bar induction, Π11 transfinite induction ]
  definition: >
    $\Pi^1_1$-induction is available along any well-order: for every $\Pi^1_1$ formula $\varphi$ and every
    well-order $X$, if $\varphi$ is progressive along $X$, then $\varphi(x)$ holds for all $x$ in $X$.
  refs:
    - { ref: freund2019b, role: rm, loc: "Introduction, Section 3 (before Corollary 3.4)" }

- id: dilator-derivative
  label: '\textsf{Derivatives of normal dilators}'
  name: Derivatives of normal dilators are dilators
  kind: sentence
  minor: true
  tags: [ well-orders ]
  phrases: [ every normal function has a derivative ]
  definition: >
    If $T$ is a normal dilator, then so is its derivative $\partial T$ (a formalization, through Girard's
    dilators coded in second-order arithmetic, of "every normal function has a derivative").
  refs:
    - { ref: freund2019b, role: rm, loc: "Corollary 3.4 (1)" }

- id: bwt-weak-l2
  label: '\mathsf{BWT}_{\text{weak-}\ell_2}'
  name: Bolzano–Weierstrass theorem for weak convergence in ℓ²
  kind: problem
  minor: true
  tags: [ analysis ]
  aliases: [ weak-BW, BWTweak-l2 ]
  definition: >
    Every bounded sequence $(x_i)_{i}$ in the separable Hilbert space $\ell_2$ has a subsequence converging
    weakly to some point $x$ ($\lim_i \langle y, x_i\rangle = \langle y, x\rangle$ for all $y$), i.e. has a
    weak cluster point.
  instance: A bounded sequence in $\ell_2$.
  solution: A weak cluster point of the sequence.
  refs:
    - { ref: kreuzer2012c, role: origin, loc: "Definition 6, Remark 14" }

- id: lwqo-trees
  label: '\mathsf{LWQO}(\mathcal{T})'
  name: Friedman's finite miniaturization of Kruskal's theorem
  kind: sentence
  minor: true
  tags: [ well-orders, first-order ]
  phrases: [ finite Kruskal theorem ]
  definition: >
    For every $c$ there is $k$ such that for every finite sequence $T_0, \ldots, T_k$ of finite trees with
    $|T_i| \le c \cdot (i+1)$ for all $i$, there are $i < j \le k$ with $T_i$ embeddable in $T_j$. A
    $\Pi^0_2$ sentence.
  refs:
    - { ref: simpson1985b, role: rm, loc: Definition 3.1 }

- id: kt-gap
  label: '\forall n\, \mathsf{WQO}(\mathcal{T}_n)'
  name: Friedman's extended Kruskal theorem (gap condition)
  kind: sentence
  tags: [ well-orders ]
  phrases: [ extended Kruskal theorem, gap condition ]
  definition: >
    For every $n$, the set $\mathcal{T}_n$ of finite trees with labels in $\{0, \ldots, n-1\}$ is a
    well-quasi-order under: $(T_1, l_1) \le (T_2, l_2)$ if there is an embedding $f : T_1 \to T_2$ with
    $l_1(b) = l_2(f(b))$ for all $b \in T_1$ and, whenever $b$ is an immediate successor of $a$ in $T_1$,
    $l_2(c) \ge l_2(f(b))$ for every $c \in T_2$ with $f(a) < c < f(b)$ (gap condition).
  refs:
    - { ref: simpson1985b, role: rm, loc: "Definition 4.1, Satz 4.2" }

- id: menger
  label: '\textsf{Menger}'
  name: Menger's theorem for countable graphs
  kind: sentence
  tags: [ graphs ]
  phrases: [ Menger's theorem ]
  definition: >
    For any countable graph $G$ and any $A, B \subseteq V(G)$, there are a set $M$ of disjoint $A$-$B$ paths
    and an $A$-$B$ separator $C$ consisting of exactly one vertex from each path in $M$.
  refs:
    - { ref: towsner2011, role: rm, loc: "Definition 7.13, Theorem 7.14" }
    - { ref: shafer2012, role: rm, loc: Theorem 4.4 }
