# Theorems of ordinary mathematics and further principles from the 2009–2026 literature sweep.

- { id: "cousin-c", label: "\\mathsf{CL}_{\\mathrm{c}}", name: "Cousin's lemma for continuous gauges", kind: "sentence", tags: [ "analysis" ], definition: "For every continuous gauge $\\delta : [0,1] \\to \\mathbb{R}^+$ there is a $\\delta$-fine tagged partition of $[0,1]$." }
- { id: "cousin-b1", label: "\\mathsf{CL}_{\\mathrm{B1}}", name: "Cousin's lemma for Baire class 1 gauges", kind: "sentence", tags: [ "analysis" ], definition: "Cousin's lemma restricted to gauges of Baire class 1." }
- { id: "ukt", label: "\\mathsf{UKT}", name: "Uniform Kruskal theorem", kind: "sentence", tags: [ "well-orders" ], definition: "The uniform Kruskal theorem of Freund, Rathjen and Weiermann: a uniform version of Kruskal's theorem for recursive data types given by normal transformations of well partial orders." }
- { id: "tlpp", label: "\\mathsf{TLPP}", name: "Transfinite leftmost path principle", kind: "sentence", tags: [ "well-orders" ], definition: "Towsner's transfinite leftmost path principle; see the source.", todo: true }
- { id: "jordan", label: "\\mathsf{JD}", name: "Jordan decomposition theorem", kind: "sentence", tags: [ "analysis" ], definition: "Every function $f : [0,1] \\to \\mathbb{R}$ of bounded variation is the difference of two non-decreasing functions." }
- { id: "jordan-c", label: "\\mathsf{JD}_{\\mathrm{c}}", name: "Jordan decomposition theorem (continuous)", kind: "sentence", tags: [ "analysis" ], definition: "Every continuous function of bounded variation on $[0,1]$ is the difference of two continuous non-decreasing functions." }
- { id: "bvdiff", label: "\\mathsf{BV}\\text{-}\\mathsf{DIFF}", name: "Differentiability of BV functions", kind: "sentence", tags: [ "analysis", "randomness" ], definition: "Every function of bounded variation on $[0,1]$ is differentiable almost everywhere." }
- { id: "art22", label: "\\mathsf{ART}^2_2", name: "Ramsey theorem for additive colourings", kind: "problem", tags: [ "ramsey" ], definition: "Ramsey's theorem for pairs restricted to additive colourings (colourings into a finite semigroup with $c(i,k) = c(i,j) \\cdot c(j,k)$), asserting an infinite homogeneous set.", instance: "A coloring $c : [\\mathbb{N}]^2 \\to S$ into a finite semigroup with $c(i,k) = c(i,j) \\cdot c(j,k)$.", solution: An infinite homogeneous set. }
- { id: "buchi", label: "\\mathsf{BC}", name: "Büchi's complementation theorem", kind: "sentence", tags: [ "induction" ], definition: "Every language recognized by a nondeterministic Büchi automaton has a complement recognized by a nondeterministic Büchi automaton." }
- { id: "fishburn", label: "\\mathsf{FPT}", name: "Fishburn's possibility theorem", kind: "sentence", tags: [ "first-order" ], definition: "Fishburn's possibility theorem for countable societies: there is a social welfare function satisfying Arrow's conditions." }
- { id: "aht", label: "\\mathsf{AHT}", name: "Adjacent Hindman's theorem", kind: "problem", tags: [ "ramsey" ], definition: "Hindman's theorem where homogeneity is only required for finite sums of adjacent elements.", todo: true, instance: "A finite coloring of $\\mathbb{N}$.", solution: An infinite set whose finite sums of adjacent elements are monochromatic. }
- { id: "hilbert", label: "\\mathsf{HIL}", name: "Hilbert's theorem", kind: "sentence", tags: [ "ramsey" ], definition: "Variant of Hindman's theorem studied by Hirst, equivalent to the infinite pigeonhole principle; see the source.", todo: true }
- { id: "gowers", label: "\\mathsf{FIN}_k", name: "Gowers' FIN_k theorem", kind: "problem", tags: [ "ramsey" ], definition: "Gowers' pigeonhole principle for $\\mathrm{FIN}_k$, a generalization of Hindman's theorem.", instance: "A number $k$ and a finite coloring of $\\mathrm{FIN}_k$.", solution: An infinite block sequence whose generated combinatorial subspace is monochromatic. }
- { id: "ap", label: "\\mathsf{AP}", name: "Existence of almost periodic points", kind: "sentence", tags: [ "analysis" ], definition: "Every continuous map on a compact metric space has an almost periodic point." }
- { id: "aca-plus", label: "\\mathsf{ACA}^+", name: "ω-th jump", kind: "problem", tags: [ "computability" ], definition: "For every $X$, the $\\omega$-th jump $X^{(\\omega)}$ exists.", instance: "A set $X$.", solution: "The $\\omega$-th jump $X^{(\\omega)}$." }
- { id: "aca-prime", label: "\\mathsf{ACA}'", name: "Finite jumps", kind: "problem", tags: [ "computability" ], definition: "For every $n$ and every $X$, the $n$-th jump $X^{(n)}$ exists.", instance: "A set $X$ and a number $n$.", solution: "The $n$-th jump $X^{(n)}$." }
- { id: "wop-eps", label: "\\mathsf{WOP}(\\varepsilon_X)", name: "Well-ordering principle for ε", kind: "sentence", tags: [ "well-orders" ], definition: "If $X$ is a well-ordering, then so is $\\varepsilon_X$." }
- { id: "henson", label: "\\mathsf{BRD}_{\\mathbb{H}}", name: "Finite big Ramsey degrees of Henson graphs", kind: "sentence", tags: [ "ramsey", "graphs" ], definition: "The Henson graphs have finite big Ramsey degrees." }
- { id: "lebesgue", label: "\\mathsf{CPT}\\Rightarrow\\mathsf{LEB}", name: "Compact spaces are Lebesgue", kind: "sentence", tags: [ "analysis" ], definition: "Every compact metric space is Lebesgue: every open covering has a Lebesgue number." }
- { id: "brooks", label: "\\mathsf{BROOKS}", name: "Brooks' theorem", kind: "sentence", tags: [ "graphs" ], definition: "Brooks' theorem for arbitrary countable graphs: a connected graph of maximum degree $d \\ge 3$ other than $K_{d+1}$ is $d$-colorable." }
- { id: "bqo3", label: "\\mathbf{3}\\text{-}\\mathsf{BQO}", name: "The antichain with three elements is bqo", kind: "sentence", tags: [ "well-orders" ], definition: "The discrete order with three elements is a better quasi-order." }
- { id: "brouwer-inv", label: "\\mathsf{INV}", name: "Brouwer invariance theorems", kind: "sentence", tags: [ "analysis" ], definition: "Brouwer's invariance of dimension and domain theorems (in the formulations of Kihara 2020)." }
- { id: "ekeland", label: "\\mathsf{EVP}", name: "Ekeland's variational principle", kind: "sentence", tags: [ "analysis" ], definition: "Ekeland's variational principle for lower semicontinuous functions on complete separable metric spaces." }
- { id: "sct", label: "\\mathsf{SCT}", name: "Size-change termination criterion", kind: "sentence", tags: [ "induction" ], definition: "The size-change termination criterion of Lee, Jones and Ben-Amram." }
- { id: "tietze", label: "\\mathsf{TET}", name: "Tietze extension theorem", kind: "sentence", tags: [ "analysis" ], definition: "Versions of the Tietze extension theorem for functions with moduli of uniform continuity." }
- { id: "hst", label: "\\mathsf{HST}", name: "Helly's selection theorem", kind: "sentence", tags: [ "analysis" ], definition: "Every bounded sequence of functions of bounded variation has a subsequence converging in the weak* topology." }
- { id: "ttall", label: "\\mathsf{TT}", name: "Tree theorem for all exponents", kind: "problem", tags: [ "ramsey" ], definition: "For every $n$ and $k$, the tree theorem $\\mathsf{TT}^n_k$ holds.", instance: "Numbers $n, k$ and a coloring of the $n$-element chains of $2^{<\\mathbb{N}}$ with $k$ colors.", solution: "A homogeneous subtree isomorphic to $2^{<\\mathbb{N}}$." }
- { id: "pr2", label: "\\mathsf{PR}^2", name: "Packed Ramsey theorem for pairs", kind: "problem", tags: [ "ramsey" ], definition: "Erdős–Galvin packed Ramsey theorem for pairs: every coloring admits an infinite \"packed\" set using few colors; see the source.", todo: true }
- { id: "hb", label: "\\mathsf{HB}", name: "Hahn–Banach theorem (separable)", kind: "problem", tags: [ "analysis", "compactness", "weihrauch" ], definition: "Every bounded linear functional on a closed subspace of a separable Banach space extends to the whole space with the same norm.", instance: "A separable Banach space, a closed subspace and a bounded functional on it.", solution: "A norm-preserving extension of the functional.", refs: [ { ref: gherardimarcone2009, role: rm }, { ref: simpson2009, role: rm, loc: "Section IV.9" } ] }
