# Base system, Big Five, compactness and randomness.
#
# Fields:
#   id            unique identifier (used in URLs and results)
#   label         TeX label (math mode)
#   name          full name
#   kind          problem   -> has an instance/solution reading (Π¹₂ problem)
#                 sentence  -> only compared over theories / ω-models
#   tags          list of tag ids
#   definition    statement, with inline TeX in $...$
#   instance / solution   for problems
#   formulationOf id of the main formulation of the same principle
#   conjunction   list of ids (compound statement)
#   base          true for the base system / identity problem
#   firstOrder    true for arithmetical statements true in ℕ
#   aliases       other names, used by search
#   refs          [{ref: key, role: origin | rm | survey, loc: "..."}]

- id: rcastar
  label: '\mathsf{RCA}_0^*'
  name: Weak recursive comprehension
  kind: sentence
  base: [ rca0star, rca0, omega ]
  priority: 5
  firstOrder: true
  tags: [ big-five, induction ]
  aliases: [ RCA0*, RCA0 star, weak base theory ]
  definition: >
    Δ⁰₁ comprehension together with Δ⁰₀ induction and the totality of exponentiation (Simpson–Smith 1986). It is the base theory of the reduction "provability over RCA₀*", and is implied by every statement over RCA₀* , RCA₀ and ω-models.
  refs:
    - { ref: simpsonsmith1986, role: origin }

- id: rca0
  label: '\mathsf{RCA}_0'
  name: Recursive comprehension
  kind: sentence
  base: [ rca0, omega ]
  firstOrder: true
  tags: [ big-five, induction ]
  aliases: [ recursive comprehension, RCA0, base system ]
  definition: >
    Δ⁰₁ comprehension together with Σ⁰₁ induction. It is the usual base system of reverse mathematics, and hence implied by every statement over RCA₀ and over ω-models. Over the weaker base theory RCA₀* it is a genuine statement, equivalent to Σ⁰₁ induction.
  refs:
    - { ref: friedman1975, role: origin }
    - { ref: simpson2009, role: survey, loc: Chapter II }
    - { ref: simpson1985, role: survey }
    - { ref: dzhafarovmummert2022, role: survey }

- id: wkl
  label: '\mathsf{WKL}'
  name: Weak König's lemma
  kind: problem
  tags: [ big-five, compactness ]
  aliases: [ WKL0, weak konig lemma ]
  definition: Every infinite subtree of $2^{<\mathbb{N}}$ has an infinite path.
  instance: An infinite binary tree $T \subseteq 2^{<\mathbb{N}}$.
  solution: An infinite path through $T$.
  refs:
    - { ref: friedman1975, role: origin }
    - { ref: simpson2009, role: survey, loc: Chapter IV }

- id: sep
  label: '\Sigma^0_1\text{-}\mathsf{SEP}'
  name: Σ⁰₁ separation
  kind: problem
  formulationOf: wkl
  tags: [ compactness ]
  aliases: [ separation, sigma01 separation ]
  definition: >
    For every pair of disjoint $\Sigma^0_1$ sets $A, B$, there is a set $S$ with $A \subseteq S$ and $S \cap B = \emptyset$.
  instance: Two disjoint $\Sigma^0_1$ sets $A$, $B$ (given by enumerations).
  solution: A set $S$ separating $A$ from $B$.
  refs:
    - { ref: simpson2009, role: rm, loc: Lemma IV.4.4 }

- id: wwkl
  label: '\mathsf{WWKL}'
  name: Weak weak König's lemma
  kind: problem
  tags: [ compactness, randomness ]
  aliases: [ WWKL0, weak weak konig lemma ]
  definition: >
    Every binary tree $T$ of positive measure, i.e. $\lim_s |T \cap 2^s| / 2^s > 0$, has an infinite path.
  instance: A binary tree of positive measure.
  solution: An infinite path through it.
  refs:
    - { ref: yusimpson1990, role: rm }
    - { ref: simpson2009, role: survey, loc: Section X.1 }

- id: dnr
  label: '\mathsf{DNR}'
  name: Diagonally non-recursive functions
  kind: problem
  tags: [ computability, randomness ]
  aliases:
    - DNC
    - diagonally non computable
    - DNC_N
    - DNCN
  definition: >
    For every set $X$, there is a function $f$ such that $f(e) \neq \Phi^X_e(e)$ for every $e$.
  instance: A set $X$.
  solution: A function $f$ which is diagonally non-computable relative to $X$.
  refs:
    - { ref: giustosimpson2000, role: rm }
    - { ref: ambosspiesetal2004, role: rm }

- id: aca
  caution: 'ACA₀ is equivalent over RCA₀ to the existence of Turing jumps, but as problems they differ: ACA here receives an arithmetical formula with a set parameter and returns the set it defines, while the jump X ↦ X′ is [[tj]], which unlike ACA has the Δ⁰₂ basis property.'
  label: '\mathsf{ACA}'
  name: Arithmetical comprehension
  kind: problem
  tags: [ big-five ]
  aliases: [ ACA0, arithmetic comprehension ]
  definition: >
    Every set defined by an arithmetical formula exists. Equivalently over RCA₀, every set has a Turing jump
    (the problem form of the jump is TJ).
  instance: 'A set $X$ and an arithmetical formula $\varphi(n, X)$.'
  solution: 'The set $\{n : \varphi(n, X)\}$.'
  refs:
    - { ref: friedman1975, role: origin }
    - { ref: simpson2009, role: survey, loc: Chapter III }

- id: tj
  caution: 'Equivalent to ACA₀ over RCA₀, but not the same problem as ACA ([[aca]]), which returns the set defined by an arbitrary arithmetical formula with a set parameter.'
  label: '\mathsf{TJ}'
  name: Turing jump
  kind: problem
  tags: [ computability, weihrauch ]
  aliases: [ Turing jump, J, jump ]
  definition: >
    Every set has a Turing jump. As a problem: given $X$, compute $X'$ (the map $J$ of Weihrauch complexity,
    strongly Weihrauch equivalent to $\lim$). Over RCA₀ it is equivalent to ACA₀.
  instance: A set $X$.
  solution: The Turing jump $X'$.
  refs:
    - { ref: brattkagherardipauly2021, role: rm, loc: "Section 6, before Theorem 6.7 (the jump J)" }
    - { ref: dzhafarovmummert2022, role: rm, loc: "Definition 3.6.9 (the problem TJ)" }
    - { ref: dzhafarovsolomonyokoyama2023, role: rm, loc: "Section 4, before Theorem 4.2 (the problem TJ)" }

- id: atr
  caution: 'In the Weihrauch lattice, ATR names a problem (Definition 3.12 of [@kiharamarconepauly2020]) that is strongly Weihrauch equivalent to [[ucnn]] (Theorem 3.13), not to closed choice [[cnn]]; its two-sided version is [[atr2]]. The results here about ATR concern the axiom ATR₀.'
  label: '\mathsf{ATR}'
  name: Arithmetical transfinite recursion
  kind: sentence
  tags: [ big-five ]
  aliases: [ ATR0 ]
  definition: >
    Arithmetical comprehension can be iterated along any countable well-ordering.
  refs:
    - { ref: friedman1975, role: origin }
    - { ref: simpson2009, role: survey, loc: Chapter V }

- id: pi11ca
  label: '\Pi^1_1\text{-}\mathsf{CA}'
  name: Π¹₁ comprehension
  kind: sentence
  tags: [ big-five ]
  aliases: [ Pi11-CA0, pi11 comprehension ]
  definition: Every set defined by a $\Pi^1_1$ formula exists.
  refs:
    - { ref: friedman1975, role: origin }
    - { ref: simpson2009, role: survey, loc: Chapter VI }

- id: ss
  label: '\textsf{SS}'
  name: Every set belongs to a countable Scott set
  kind: sentence
  minor: true
  tags: [ compactness ]
  definition: >
    Every set belongs to a countable (coded) Scott set: a nonempty family closed under join, in which every infinite
    binary tree computable from a member has an infinite path in the family.
  refs: [ { ref: cholakjockuschslaman2001, role: rm, loc: "Definition 8.15, before Lemma 8.18" } ]

- id: pi12ca
  label: '\Pi^1_2\text{-}\mathsf{CA}'
  name: Π¹₂ comprehension
  kind: sentence
  tags: []
  aliases: [ Pi12-CA0, Π12-CA0, pi12 comprehension ]
  definition: >
    Comprehension for $\Pi^1_2$ formulas: for every formula $\varphi(n)$ of the form $\forall Y \exists Z\,
    \theta(n, Y, Z)$ with $\theta$ arithmetical (parameters allowed), the set $\{n : \varphi(n)\}$ exists.
  refs:
    - { ref: mummertsimpson2005, role: rm, loc: Definition 1 }
    - { ref: freundpakhomovsolda2023, role: rm, loc: Section 1 }
