- id: ssig2
  label: '\mathsf{S}\Sigma^0_2'
  name: Σ⁰₂ strong collection
  kind: sentence
  firstOrder: true
  minor: true
  tags: [ induction, first-order ]
  aliases: [ SSigma2, sigma2 strong collection ]
  definition: >
    The scheme $\forall u\, \exists v\, \forall x \le u\, (\exists y\, \varphi(x, y) \to \exists y \le v\, \varphi(x,
    y))$ for every $\Sigma^0_2$ formula $\varphi$.
  refs: [ { ref: hajekpudlak1998, role: rm, loc: "Chapter I, 2.20 and 2.22" } ]

- id: ssig3
  label: '\mathsf{S}\Sigma^0_3'
  name: Σ⁰₃ strong collection
  kind: sentence
  firstOrder: true
