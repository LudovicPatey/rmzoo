  aliases: [ SSigma3, sigma3 strong collection ]
  definition: >
    The scheme $\forall u\, \exists v\, \forall x \le u\, (\exists y\, \varphi(x, y) \to \exists y \le v\, \varphi(x,
    y))$ for every $\Sigma^0_3$ formula $\varphi$.
  refs: [ { ref: hajekpudlak1998, role: rm, loc: "Chapter I, 2.20 and 2.22" } ]

- id: rsig1
  label: '\mathsf{R}\Sigma^0_1'
  name: Σ⁰₁ regularity
  kind: sentence
  firstOrder: true
  minor: true
  tags: [ induction, first-order ]
  aliases: [ RSigma1, sigma1 regularity ]
  definition: >
    The scheme $(\mathrm{C}x)\, \exists y \le u\, \varphi(x, y) \to \exists y \le u\, (\mathrm{C}x)\, \varphi(x, y)$
    for every $\Sigma^0_1$ formula $\varphi$, where $(\mathrm{C}x)$ is the quantifier $\forall w\, \exists x > w$
    (there are unboundedly many $x$): if unboundedly many $x$ have a value below $u$, some $y \le u$ is a value of
    unboundedly many $x$.
  refs: [ { ref: hajekpudlak1998, role: rm, loc: "Chapter I, 2.20 and 2.22" } ]

- id: rsig2
  label: '\mathsf{R}\Sigma^0_2'
  name: Σ⁰₂ regularity
  kind: sentence
