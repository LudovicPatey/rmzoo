    for every $\Sigma^0_2$ formula $\varphi$, where $(\mathrm{C}x)$ is the quantifier $\forall w\, \exists x > w$
    (there are unboundedly many $x$).
  refs: [ { ref: hajekpudlak1998, role: rm, loc: "Chapter I, 2.20 and 2.22" } ]

- id: php-sig2
  label: '\mathsf{PHP}(\Sigma^0_2)'
  name: Σ⁰₂ pigeonhole principle
  kind: sentence
  firstOrder: true
  minor: true
  tags: [ induction, first-order ]
  aliases: [ PHP(Sigma2), sigma2 pigeonhole principle ]
  definition: >
    For every $\Sigma^0_2$ formula $\varphi(x, y)$ and every $u$, $\varphi$ does not define a bijection between
    $\{x : x \le u\}$ and $\{y : y \le u + 1\}$: $\neg[\forall x \le u\, \exists! y \le u + 1\, \varphi(x, y) \wedge
    \forall y \le u + 1\, \exists! x \le u\, \varphi(x, y)]$.
  refs: [ { ref: hajekpudlak1998, role: rm, loc: "Chapter I, 2.20 and 2.22" } ]

- id: php-sig3
  label: '\mathsf{PHP}(\Sigma^0_3)'
  name: Σ⁰₃ pigeonhole principle
  kind: sentence
  firstOrder: true
  minor: true
  tags: [ induction, first-order ]
  aliases: [ PHP(Sigma3), sigma3 pigeonhole principle ]
  definition: >
    For every $\Sigma^0_3$ formula $\varphi(x, y)$ and every $u$, $\varphi$ does not define a bijection between
    $\{x : x \le u\}$ and $\{y : y \le u + 1\}$.
  refs: [ { ref: hajekpudlak1998, role: rm, loc: "Chapter I, 2.20 and 2.22" } ]

- id: fac-sig2
  label: '\mathsf{FAC}(\Sigma^0_2)'
  name: Σ⁰₂ finite axiom of choice
  kind: sentence
  firstOrder: true
  minor: true
  tags: [ induction, first-order ]
  aliases: [ FAC(Sigma2), sigma2 finite axiom of choice ]
  definition: >
    For every $\Sigma^0_2$ formula $\varphi(x, y)$ and every $u$: if $\forall x \le u\, \exists y\, \varphi(x, y)$,
    then there is a finite sequence $s$ of length $u + 1$ with $\forall x \le u\, \varphi(x, (s)_x)$.
  refs: [ { ref: hajekpudlak1998, role: rm, loc: "Chapter I, 2.21 and 2.22" } ]

- id: fac-sig3
  label: '\mathsf{FAC}(\Sigma^0_3)'
  name: Σ⁰₃ finite axiom of choice
  kind: sentence
  firstOrder: true
