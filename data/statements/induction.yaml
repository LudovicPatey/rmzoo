- id: isig11
  label: '\Sigma^1_1\text{-}\mathsf{IND}'
  name: Σ¹₁ induction
  kind: sentence
  tags: [ induction ]
  aliases: [ Sigma11-IND, Σ11 induction, Σ11-IND ]
  definition: >
    The induction scheme for $\Sigma^1_1$ formulas (with parameters): $(\varphi(0) \wedge \forall n\, (\varphi(n)
    \to \varphi(n+1))) \to \forall n\, \varphi(n)$ for every $\Sigma^1_1$ formula $\varphi(n)$. $\mathsf{RCA}_0$
    plus this scheme is the base theory $\mathsf{RCA}^*$ of Neeman and Montalbán.
  refs:
    - { ref: simpson2009, role: rm, loc: "Definition VII.6.1(2)" }
    - { ref: neeman2011, role: rm, loc: Section 1 }

- id: bounded-sigma01-ca
  label: '\textsf{Bounded }\Sigma^0_1\textsf{ comprehension}'
  name: Bounded Σ⁰₁ comprehension
  kind: sentence
  minor: true
  tags: [ induction ]
  definition: >
    The scheme $\forall m\, \exists X\, \forall i\, (i \in X \leftrightarrow (i < m \wedge \varphi(i)))$ for every
    $\Sigma^0_1$ formula $\varphi(i)$ in which $X$ does not occur.
  refs: [ { ref: simpsonsmith1986, role: rm, loc: "Section 1, Lemma 2.5(d)" } ]

# Schemes of Hájek–Pudlák, Chapter I, Section 2 (least number principle, Π⁰ₙ and Δ⁰ₙ forms,
# strong collection, regularity, pigeonhole principle, finite choice, partial approximation).
# The book works in first-order arithmetic; here the schemes allow set parameters.

- id: lsig2
  label: '\mathsf{L}\Sigma^0_2'
  name: Σ⁰₂ least number principle
  kind: sentence
  firstOrder: true
  minor: true
  tags: [ induction, first-order ]
  aliases: [ LSigma2, sigma2 least number principle ]
  definition: >
    The scheme $\exists x\, \varphi(x) \to \exists x\, (\varphi(x) \wedge \forall y < x\, \neg\varphi(y))$ for every
    $\Sigma^0_2$ formula $\varphi$.
  refs: [ { ref: hajekpudlak1998, role: rm, loc: "Chapter I, 2.1 and 2.3" } ]

