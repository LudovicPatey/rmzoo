  definition: >
    For every $\Sigma^0_3$ formula $\varphi(x, y)$ and every $u$: if $\forall x \le u\, \exists y\, \varphi(x, y)$,
    then there is a finite sequence $s$ of length $u + 1$ with $\forall x \le u\, \varphi(x, (s)_x)$.
  refs: [ { ref: hajekpudlak1998, role: rm, loc: "Chapter I, 2.21 and 2.22" } ]

- id: psig1
  label: '\mathsf{P}\Sigma^0_1'
  name: Approximation of Σ⁰₁ partial functions
  kind: sentence
  firstOrder: true
  tags: [ induction, first-order ]
  aliases: [ PSigma1 ]
  definition: >
    $\mathsf{I}\Sigma^0_1$ plus the scheme: every partial function $F$ whose graph is defined by a $\Sigma^0_1$ formula
    has arbitrarily long approximations, that is, for every $z$ there is a finite sequence $s$ of length $z$ such
    that for every $i$ with $i + 1 < \mathrm{lh}(s)$ and every $x \le (s)_i$ in the domain of $F$, $F(x) \le
    (s)_{i+1}$.
  refs: [ { ref: hajekpudlak1998, role: rm, loc: "Chapter I, 2.21 and 2.22; Chapter IV, 1.26" } ]

- id: psig2
  label: '\mathsf{P}\Sigma^0_2'
  name: Approximation of Σ⁰₂ partial functions
  kind: sentence
  firstOrder: true
  tags: [ induction, first-order ]
  aliases: [ PSigma2 ]
  definition: >
    $\mathsf{I}\Sigma^0_1$ plus the scheme: every partial function $F$ whose graph is defined by a $\Sigma^0_2$ formula
    has arbitrarily long approximations (finite sequences $s$ such that $F(x) \le (s)_{i+1}$ for every $x \le (s)_i$
    in the domain of $F$).
  refs: [ { ref: hajekpudlak1998, role: rm, loc: "Chapter I, 2.21 and 2.22; Chapter IV, 1.26" } ]
