- id: ldelta2
  label: '\mathsf{L}\Delta^0_2'
  name: Δ⁰₂ least number principle
  kind: sentence
  firstOrder: true
  minor: true
  tags: [ induction, first-order ]
  aliases: [ LDelta2, delta2 least number principle ]
  definition: >
    For every $\Sigma^0_2$ formula $\sigma(x)$ and every $\Pi^0_2$ formula $\pi(x)$: if $\forall x\, (\sigma(x)
    \leftrightarrow \pi(x))$, then the least number principle holds for $\sigma$: $\exists x\, \sigma(x) \to
    \exists x\, (\sigma(x) \wedge \forall y < x\, \neg\sigma(y))$.
  refs: [ { ref: hajekpudlak1998, role: rm, loc: "Chapter I, 2.3" } ]

- id: ldelta3
  label: '\mathsf{L}\Delta^0_3'
