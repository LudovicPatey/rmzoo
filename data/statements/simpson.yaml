# Theorems of ordinary mathematics equivalent over RCA₀ to a Big Five system or to
# WWKL₀, from Simpson, Subsystems of Second Order Arithmetic (2009), entered on
# 2026-11-04 from the review queue (AI reader proposals, checked in the full text).
# They are minor statements: hidden from the catalogue by default, listed on the
# pages of the Big Five systems as equivalent statements.

- id: heine-borel
  caution: 'The acronyms HB and HBT name the Heine–Borel covering lemma in some papers and the Hahn–Banach theorem ([[hb]]) in others: check the definition in each paper.'
  label: "\\textsf{Heine–Borel}_{[0,1]}"
  name: "Heine–Borel covering lemma for [0,1]"
  kind: sentence
  minor: true
  tags: ["compactness", "analysis"]
  definition: "Every covering of the closed unit interval $[0,1]$ by a sequence of open intervals has a finite subcovering."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem IV.1.2" } ]

- id: bkl
  label: "\\textsf{Bounded König’s lemma}"
  name: "Bounded König's lemma"
  kind: sentence
  minor: true
  tags: ["compactness"]
  definition: "Every infinite tree $T \\subseteq \\mathbb{N}^{<\\mathbb{N}}$ bounded by a function $g$ (that is, $\\sigma(j) < g(j)$ for all $\\sigma \\in T$ and $j < |\\sigma|$) has an infinite path."
  refs: [ { ref: simpson2009, role: rm, loc: "Lemma IV.1.4" } ]

- id: ucont
  label: "\\textsf{Unif. cont.}_{[0,1]}"
  name: "Uniform continuity on [0,1]"
  kind: sentence
  minor: true
  tags: ["compactness", "analysis"]
  definition: "Every continuous function on the closed interval $[0,1]$ is uniformly continuous."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem IV.2.3(2)" } ]

- id: cont-bounded
  label: "\\textsf{Bounded}_{[0,1]}"
  name: "Boundedness of continuous functions on [0,1]"
  kind: sentence
  minor: true
  tags: ["compactness", "analysis"]
  definition: "Every continuous function on the closed interval $[0,1]$ is bounded."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem IV.2.3(3)" } ]

- id: weierstrass
  label: "\\textsf{Weierstrass}"
  name: "Weierstrass approximation theorem"
  kind: sentence
  minor: true
  tags: ["compactness", "analysis"]
  definition: "For every continuous function $\\varphi$ on $[0,1]$ there is a polynomial $f$ with $|\\varphi(x) - f(x)| < 1$ for all $x \\in [0,1]$ (equivalently, a sequence of polynomials converging to $\\varphi$ at rate $2^{-n}$)."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem IV.2.5" } ]

- id: riemann
  label: "\\textsf{Riemann}"
  name: "Riemann integrability of continuous functions"
  kind: sentence
  minor: true
  tags: ["compactness", "analysis"]
  definition: "For every continuous function $\\varphi$ on a closed bounded interval $[a,b]$, the Riemann integral $\\int_a^b \\varphi(x)\\,dx$ exists and is finite."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem IV.2.7" } ]

- id: completeness
  label: "\\textsf{Completeness}"
  name: "Gödel's completeness theorem"
  kind: sentence
  minor: true
  tags: ["compactness"]
  definition: "Every countable consistent set of sentences has a countable model. Equivalent over RCA₀ to Lindenbaum's lemma, to the compactness theorem, and to the completeness and compactness theorems for propositional logic (Theorem IV.3.3)."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem IV.3.3(3)" } ]

- id: formally-real
  label: "\\textsf{Formally real}"
  name: "Orderability of formally real fields"
  kind: sentence
  minor: true
  tags: ["compactness", "algebra"]
  definition: "Every countable formally real field is orderable (equivalently, has a real closure)."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem IV.4.5(2)" } ]

- id: alg-closure-unique
  label: "\\textsf{Unique alg. closure}"
  name: "Uniqueness of algebraic closures"
  kind: sentence
  minor: true
  tags: ["compactness", "algebra"]
  definition: "Every countable field has a unique algebraic closure, up to isomorphism over the field."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem IV.5.2" } ]

- id: prime-ideal
  label: "\\textsf{Prime ideal}"
  name: "Existence of prime ideals"
  kind: sentence
  minor: true
  tags: ["compactness", "algebra"]
  definition: "Every countable commutative ring contains a prime ideal (equivalently, a radical ideal)."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem IV.6.4(2)" } ]

- id: brouwer
  label: "\\textsf{Brouwer}"
  name: "Brouwer fixed point theorem"
  kind: sentence
  minor: true
  tags: ["compactness", "analysis"]
  definition: "If $C$ is the convex hull of a nonempty finite set of points of $\\mathbb{R}^n$, every continuous $f : C \\to C$ has a fixed point. Already the case of the unit square is equivalent to $\\mathsf{WKL}_0$."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem IV.7.7" } ]

- id: peano-ode
  label: "\\textsf{Peano}"
  name: "Peano existence theorem"
  kind: sentence
  minor: true
  tags: ["compactness", "analysis"]
  definition: "If $f(x, y)$ is continuous in a neighborhood of $(0, 0)$, the initial value problem $y' = f(x, y)$, $y(0) = 0$ has a continuously differentiable solution in some interval containing $0$."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem IV.8.2" } ]

- id: banach-sep
  label: "\\textsf{Banach sep.}"
  name: "Banach separation theorem"
  kind: sentence
  minor: true
  tags: ["compactness", "analysis"]
  definition: "Two disjoint open convex sets in a separable Banach space can be strictly separated by a bounded linear functional."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem X.2.1" } ]

- id: rng
  label: "\\textsf{Range existence}"
  name: "Range existence"
  kind: sentence
  minor: true
  tags: []
  definition: "Every one-to-one function $f : \\mathbb{N} \\to \\mathbb{N}$ has a range. Equivalent over RCA₀ to $\\Sigma^0_1$ comprehension."
  refs: [ { ref: simpson2009, role: rm, loc: "Lemma III.1.3(3)" } ]

- id: cauchy-r
  label: "\\textsf{Cauchy}_{\\mathbb{R}}"
  name: "Cauchy completeness of the reals"
  kind: sentence
  minor: true
  tags: ["analysis"]
  definition: "Every Cauchy sequence of real numbers converges."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem III.2.2(3)" } ]

- id: seqcompact
  label: "\\textsf{Seq. compactness}"
  name: "Sequential compactness of compact metric spaces"
  kind: sentence
  minor: true
  tags: ["analysis"]
  definition: "In any compact metric space, every sequence of points has a convergent subsequence."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem III.2.7(2)" } ]

- id: ascoli
  label: "\\textsf{Ascoli}"
  name: "Ascoli lemma"
  kind: sentence
  minor: true
  tags: ["analysis"]
  definition: "Every bounded equicontinuous sequence of continuous functions between compact metric spaces has a uniformly convergent subsequence."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem III.2.9" } ]

- id: strong-alg-closure
  label: "\\textsf{Strong alg. closure}"
  name: "Existence of strong algebraic closures"
  kind: sentence
  minor: true
  tags: ["algebra"]
  definition: "Every countable field has a strong algebraic closure, that is, an algebraic closure whose embedding has a range (equivalently, every countable field is isomorphic to a subfield of a countable algebraically closed field)."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem III.3.2(2)" } ]

- id: vs-basis
  label: "\\textsf{Vector space basis}"
  name: "Bases of countable vector spaces"
  kind: sentence
  minor: true
  tags: ["algebra"]
  definition: "Every countable vector space over a countable field has a basis (already over $\\mathbb{Q}$, Theorem III.4.3(3))."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem III.4.3(2)" } ]

- id: transcendence
  label: "\\textsf{Transcendence base}"
  name: "Existence of transcendence bases"
  kind: sentence
  minor: true
  tags: ["algebra"]
  definition: "For every pair of countable fields $K \\subseteq L$ there is a transcendence base for $L$ over $K$."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem III.4.6(2)" } ]

- id: max-ideal
  label: "\\textsf{Maximal ideal}"
  name: "Existence of maximal ideals"
  kind: sentence
  minor: true
  tags: ["algebra"]
  definition: "Every countable commutative ring has a maximal ideal (already every countable integral domain, Theorem III.5.5(3))."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem III.5.5(2)" } ]

- id: torsion
  label: "\\textsf{Torsion}"
  name: "Existence of torsion subgroups"
  kind: sentence
  minor: true
  tags: ["algebra"]
  definition: "Every countable Abelian group has a subgroup consisting of its torsion elements."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem III.6.2" } ]

- id: rado
  label: "\\textsf{Radó}"
  name: "Radó selection lemma"
  kind: sentence
  minor: true
  tags: []
  definition: "Countable Radó selection lemma (strong version): given a sequence of partial functions $f_i$ from $\\mathbb{N}$ to $\\mathbb{N}$ such that every finite set is included in some $\\mathrm{dom}(f_i)$ and the values at each point are bounded, there is $f : \\mathbb{N} \\to \\mathbb{N}$ each of whose finite restrictions agrees with some $f_i$ (with the uniformity condition of Theorem III.7.8)."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem III.7.8" } ]

- id: sigma11-sep
  caution: 'As a sentence, Σ¹₁ separation is equivalent to ATR₀, and the weaker Π¹₁ separation lies strictly between Δ¹₁-CA₀ and ATR₀. As Weihrauch problems the order is reversed: Σ¹₁-Sep is strongly Weihrauch equivalent to [[ucnn]] (Theorem 3.11 of [@kiharamarconepauly2020]) and lies strictly below Π¹₁-Sep ([[pi11-sep-w]]).'
  label: "\\Sigma^1_1\\text{-}\\mathsf{SEP}"
  name: "Σ¹₁ separation"
  kind: sentence
  minor: true
  tags: ["determinacy"]
  definition: "For any $\\Sigma^1_1$ formulas $\\varphi_0(n)$, $\\varphi_1(n)$ with no $n$ satisfying both, there is a set $Z$ containing every $n$ with $\\varphi_1(n)$ and no $n$ with $\\varphi_0(n)$."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem V.5.1" } ]

- id: cwo
  caution: 'As a sentence, CWO is equivalent to ATR₀ over RCA₀; the Weihrauch problem CWO of Kihara, Marcone and Pauly is strongly Weihrauch equivalent to [[ucnn]] (Theorem 5.5 of [@kiharamarconepauly2020]). The two-sided version is [[cwo2]].'
  label: "\\mathsf{CWO}"
  name: "Comparability of countable well-orderings"
  kind: sentence
  minor: true
  tags: ["well-orders"]
  definition: "For any two countable well-orderings, one embeds as an initial segment of the other: $\\forall X \\forall Y ((\\mathrm{WO}(X) \\wedge \\mathrm{WO}(Y)) \\to (|X| \\le |Y| \\vee |Y| \\le |X|))$."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem V.6.8" } ]

- id: sigma11-bound
  label: "\\Sigma^1_1\\textsf{ bounding}"
  name: "Σ¹₁ bounding"
  kind: sentence
  minor: true
  tags: ["well-orders"]
  definition: "If every element of an analytic set (given by an analytic code) is a well-ordering, there is a well-ordering $Y$ bounding the order types of all of them."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem V.6.9" } ]

- id: ulm
  label: "\\textsf{Ulm}"
  name: "Existence of Ulm resolutions"
  kind: sentence
  minor: true
  tags: ["algebra"]
  definition: "Every countable reduced Abelian $p$-group has an Ulm resolution."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem V.7.3(2)" } ]

- id: open-det
  label: "\\Sigma^0_1\\text{-}\\mathsf{Det}"
  name: "Open determinacy"
  kind: sentence
  minor: true
  tags: ["determinacy"]
  definition: "Every game on $\\mathbb{N}^\\mathbb{N}$ with a $\\Sigma^0_1$ payoff set is determined."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem V.8.7" } ]

- id: clopen-det
  label: "\\Delta^0_1\\text{-}\\mathsf{Det}"
  name: "Clopen determinacy"
  kind: sentence
  minor: true
  tags: ["determinacy"]
  definition: "Every game on $\\mathbb{N}^\\mathbb{N}$ with a $\\Delta^0_1$ payoff set is determined."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem V.8.7" } ]

- id: cb
  label: "\\textsf{Cantor–Bendixson}"
  name: "Cantor–Bendixson theorem (perfect kernels)"
  kind: sentence
  minor: true
  tags: ["determinacy"]
  definition: "Every tree $T \\subseteq \\mathbb{N}^{<\\mathbb{N}}$ has a perfect kernel (equivalently, a perfect subtree $P$ such that only countably many paths of $T$ are not paths of $P$)."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem VI.1.3(2)" } ]

- id: silver
  label: "\\textsf{Silver}"
  name: "Silver's theorem"
  kind: sentence
  minor: true
  tags: ["determinacy"]
  definition: "Every coanalytic equivalence relation on $\\mathbb{N}^\\mathbb{N}$ has either countably many equivalence classes or a perfect set of pairwise inequivalent points (already for $\\Delta^0_2$ relations)."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem VI.3.6" } ]

- id: div-red
  label: "\\textsf{Div+Red}"
  name: "Divisible–reduced decomposition"
  kind: sentence
  minor: true
  tags: ["algebra"]
  definition: "Every countable Abelian group is the direct sum of a divisible group and a reduced group."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem VI.4.1" } ]

- id: sigma01-pi01-det
  label: "(\\Sigma^0_1 \\wedge \\Pi^0_1)\\text{-}\\mathsf{Det}"
  name: "Determinacy of differences of open sets"
  kind: sentence
  minor: true
  tags: ["determinacy"]
  definition: "Every game on $\\mathbb{N}^\\mathbb{N}$ whose payoff set is the intersection of a $\\Sigma^0_1$ and a $\\Pi^0_1$ set is determined."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem VI.5.4" } ]

- id: delta02-rt-inf
  label: "\\Delta^0_2\\text{-}\\mathsf{RT}_{\\infty}"
  name: "Δ⁰₂ Ramsey theorem (infinite exponent)"
  kind: sentence
  minor: true
  tags: ["determinacy", "ramsey"]
  definition: "For every $\\Delta^0_2$ set $P \\subseteq [\\mathbb{N}]^\\mathbb{N}$ there is an infinite $H$ such that $[H]^\\mathbb{N} \\subseteq P$ or $[H]^\\mathbb{N} \\cap P = \\emptyset$ (equivalently, the same for arithmetical $P$)."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem VI.6.4" } ]

- id: countable-additivity
  label: "\\textsf{CA}_\\mu"
  name: "Countable additivity of Borel measures"
  kind: sentence
  minor: true
  tags: ["analysis", "randomness"]
  definition: "For any compact metric space $X$ and any Borel measure $\\mu$ on $X$, $\\mu$ is countably additive (equivalently, any covering of $[0,1]$ by open intervals $(a_n, b_n)$ has $\\sum_n |a_n - b_n| \\ge 1$)."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem X.1.9(2)" } ]

- id: vitali
  label: "\\textsf{Vitali}"
  name: "Vitali covering theorem"
  kind: sentence
  minor: true
  tags: ["analysis", "randomness"]
  definition: "If $I$ Vitali covers an interval $E$, then $I$ contains a pairwise disjoint sequence of intervals $I_n$ such that $\\mu(E \\setminus \\bigcup_n I_n) = 0$."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem X.1.13(2)" } ]

- id: mct-measure
  label: "\\textsf{MCT}_\\mu"
  name: "Monotone convergence theorem (measures)"
  kind: sentence
  minor: true
  tags: ["analysis", "randomness"]
  definition: "The monotone convergence theorem for Borel measures on compact metric spaces (already for Lebesgue measure on $[0,1]$)."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem X.1.14" } ]

# Combinatorics and well quasiorders (Section X.3), entered from the review queue.
- id: wo-omega-omega
  label: '\mathsf{WO}(\omega^\omega)'
  name: Well-orderedness of ω^ω
  kind: sentence
  tags: ["well-orders"]
  definition: "The ordinal $\\omega^\\omega$ (in its standard notation) is well ordered. Not provable in $\\mathsf{WKL}_0$: $\\omega^\\omega$ is the proof-theoretic ordinal of $\\mathsf{RCA}_0$ and $\\mathsf{WKL}_0$."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem IX.5.4, Theorem X.3.20" } ]

- id: dickson
  label: "\\textsf{Dickson's lemma}"
  name: "Dickson's lemma"
  kind: sentence
  minor: true
  tags: ["orders"]
  definition: "For each $m \\in \\mathbb{N}$, the $m$-fold Cartesian power $\\mathbb{N}^m$ is well quasiordered."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem X.3.20(2)" } ]

- id: hilbert-basis
  label: "\\textsf{Hilbert basis theorem}"
  name: "Hilbert basis theorem"
  kind: sentence
  minor: true
  tags: ["algebra"]
  definition: "For every countable field $K$ and every $m \\in \\mathbb{N}$, every ideal of the polynomial ring $K[x_1, \\dots, x_m]$ is finitely generated (already for $K = \\mathbb{Q}$)."
  refs: [ { ref: simpson2009, role: rm, loc: "Remark X.3.21" } ]

- id: higman
  label: "\\textsf{Higman's theorem}"
  name: "Higman's theorem"
  kind: sentence
  minor: true
  tags: ["orders"]
  definition: "If $Q$ is a well quasiordering, then so is $Q^{<\\mathbb{N}}$, the finite sequences of elements of $Q$ quasiordered by embedding: $\\langle a_i : i < m \\rangle \\leq \\langle b_j : j < n \\rangle$ if there are $j_0 < \\dots < j_{m-1} < n$ with $a_i \\leq b_{j_i}$."
  refs: [ { ref: simpson2009, role: rm, loc: "Remark X.3.19, Theorem X.3.22" } ]

- id: hall-lf
  label: "\\textsf{Hall's theorem}_{\\mathrm{lf}}"
  name: "Hall's theorem for countable locally finite bipartite graphs"
  kind: sentence
  minor: true
  tags: ["graphs"]
  definition: "A countable locally finite bipartite graph has a perfect matching if and only if it satisfies the Hall condition."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem X.3.15(2)" } ]

- id: marriage
  label: "\\textsf{Marriage theorem}"
  name: "Marriage theorem for countable regular bipartite graphs"
  kind: sentence
  minor: true
  tags: ["graphs"]
  definition: "Every countable bipartite graph which is $n$-regular for some $n \\geq 1$ has a perfect matching (equivalently, already for $n = 2$)."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem X.3.16" } ]

- id: konig-cover
  label: "\\textsf{Podewski–Steffens}"
  name: "Podewski–Steffens theorem (König coverings)"
  kind: sentence
  minor: true
  tags: ["graphs"]
  definition: "Every countable bipartite graph has a König covering: a pair $(C, M)$ where $C$ is a vertex covering, $M$ a matching, and $C$ consists of exactly one vertex from each edge of $M$."
  refs: [ { ref: simpson2009, role: rm, loc: "Definition X.3.10, Theorem X.3.12" } ]

- id: weak-star-closure
  label: "\\textsf{Weak-* closure}"
  name: "Smallest weak-*-closed set containing a countable set"
  kind: sentence
  minor: true
  tags: ["analysis"]
  definition: "For every separable Banach space $X$ and countable set $Y \\subseteq X^*$, there is a smallest weak-*-closed set in $X^*$ containing $Y$ (equivalently, a smallest weak-*-closed convex set, or linear subspace)."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem X.2.9" } ]

# Classical theorems equivalent to a Big Five system (Simpson, Chapter I surveys).
- id: lub
  label: "\\textsf{Lub}"
  name: "Least upper bound principle"
  kind: sentence
  minor: true
  tags: ["analysis"]
  definition: "Every bounded sequence of real numbers has a least upper bound."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem III.2.2(4); Theorem I.9.3(1)" } ]

- id: mct
  label: "\\textsf{MCT}"
  name: "Monotone convergence theorem"
  kind: problem
  minor: true
  tags: ["analysis"]
  aliases: [ monotone convergence theorem ]
  definition: "Every bounded increasing sequence of real numbers is convergent."
  instance: "A bounded increasing sequence $(x_n)$ of real numbers."
  solution: "Its limit $\\sup_n x_n$."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem III.2.2(5)" }, { ref: brattkagherardimarcone2012, role: rm, loc: "before Fact 11.26" } ]

- id: max-principle
  label: "\\textsf{Max}_{[0,1]}"
  name: "Maximum principle"
  kind: sentence
  minor: true
  tags: ["analysis"]
  definition: "Every continuous real-valued function on $[0,1]$ has a supremum, and attains it."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem I.10.3(6); Theorem IV.2.3(4, 5)" } ]

- id: perfect-set
  label: "\\textsf{Perfect set}"
  name: "Perfect set theorem"
  kind: sentence
  minor: true
  tags: ["analysis"]
  definition: "Every uncountable analytic set (in particular every uncountable closed set) has a nonempty perfect subset."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem I.11.5(3); Theorems V.4.3 and V.5.5" } ]

- id: lusin
  label: "\\textsf{Lusin}"
  name: "Lusin's separation theorem"
  kind: sentence
  minor: true
  tags: ["analysis"]
  definition: "Any two disjoint analytic sets can be separated by a Borel set."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem I.11.5(4); Sections V.3 and V.5" } ]

- id: baire
  label: "\\textsf{Baire}"
  name: "Baire category theorem"
  kind: sentence
  minor: true
  tags: ["analysis"]
  definition: "In a complete separable metric space, the intersection of a sequence of dense open sets is dense."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem II.5.8" } ]

- id: ulm-iso
  label: "\\textsf{Ulm}_{\\cong}"
  name: "Ulm's theorem (isomorphism form)"
  kind: sentence
  minor: true
  tags: ["algebra"]
  definition: "Any two countable reduced Abelian $p$-groups which have the same Ulm invariants are isomorphic."
  refs: [ { ref: simpson2009, role: rm, loc: "Theorem I.11.5(2); Section V.7" } ]

- id: modal-sc
  label: '\textsf{Modal strong completeness}'
  name: Strong completeness theorem for the modal logics KΣ
  kind: sentence
  minor: true
  tags: [ compactness ]
  definition: >
    For $\Sigma \subseteq \{T, B, 4, D\}$: if a set $\Gamma$ of modal formulas is $K\Sigma$-consistent, then
    $\Gamma \vdash_{K\Sigma} \varphi$ iff $\varphi$ holds in every Kripke model of $\Gamma$ on a frame
    appropriate to $\Sigma$.
  refs:
    - { ref: shimomichitakedayokoyama2025, role: rm, loc: "Theorems 6.12 and 6.13" }

- id: modal-scc
  label: '\textsf{Modal canonical completeness}'
  name: Strong completeness theorem for KΣ using canonical models
  kind: sentence
  minor: true
  tags: []
  definition: >
    For $\Sigma \subseteq \{T, B, 4, 5, D, .2\}$: for every $K\Sigma$-consistent set $\Gamma$ of modal formulas
    there are a frame $F$ appropriate to $\Sigma$ and a valuation $V$ such that $(F, V)$ is a model of $\Gamma$
    and, for every formula $\varphi$, $\Gamma \vdash_{K\Sigma} \varphi$ iff $\varphi$ holds at every world of
    $(F, V)$.
  refs:
    - { ref: shimomichitakedayokoyama2025, role: rm, loc: "Theorems 5.9 and 5.10" }

- id: auniq
  label: '\textsf{AUniqueness}'
  name: Uniqueness of atomic models
  kind: sentence
  minor: true
  tags: []
  aliases: [ AUniqueness ]
  definition: >
    If $\mathcal{A}$ and $\mathcal{B}$ are atomic models of a complete theory $T$ (every tuple satisfies an atom
    of $T$), then $\mathcal{A} \cong \mathcal{B}$.
  refs:
    - { ref: hirschfeldtshoreslaman2009, role: rm, loc: "Section 1, item 2; Theorem 2.3(3)" }

- id: pmt-exist
  label: '\textsf{Prime model existence}'
  name: Every atomic theory has a prime model
  kind: sentence
  minor: true
  tags: []
  definition: >
    Every complete atomic theory $T$ has a prime model (a model elementarily embeddable in every model of $T$).
    A complete theory is atomic if every formula consistent with it is implied by an atom of $T$.
  refs:
    - { ref: hirschfeldtshoreslaman2009, role: rm, loc: "Section 1, item 3; Theorem 2.3(4)" }

- id: atomic-prime
  label: '\textsf{Atomic models are prime}'
  name: Every atomic model is prime
  kind: sentence
  minor: true
  tags: []
  definition: >
    Every atomic model of a complete theory $T$ is prime (elementarily embeddable in every model of $T$). The
    converse, that every prime model is atomic, is provable in $\mathsf{RCA}_0$ (Proposition 2.2).
  refs:
    - { ref: hirschfeldtshoreslaman2009, role: rm, loc: "Section 1, item 5; Theorem 2.3(2)" }

# ---------------------------------------------------------------- Weihrauch problems

- id: riemann-bd
  label: '\textsf{Riemann}_{\mathrm{bd}}'
  name: Riemann integrability of bounded continuous functions
  kind: sentence
  minor: true
  tags: [ analysis, randomness ]
  definition: Every bounded continuous function on $[a, b]$ is (effectively) Riemann integrable.
  refs:
    - { ref: sandersyokoyama2012, role: rm, loc: "Theorem 10 (2)" }

- id: ddt
  label: '\mathsf{DDT}'
  name: Dirac delta theorem
  kind: sentence
  minor: true
  tags: [ analysis, randomness ]
  phrases: [ Dirac Delta Theorem ]
  definition: >
    For any continuous function $f$ on $\mathbb{R}$ with bounded support and large enough $n$, the integral
    $\int_{\mathbb{R}} f(x)\delta_n(x)\,dx$ exists and $\lim_n \int_{\mathbb{R}} f(x)\delta_n(x)\,dx = f(0)$,
    where $\delta_n(x) = 2^n\eta(2^n x)$ for a fixed smooth $\eta$ with support in $[-1,1]$ and integral $1$.
  refs:
    - { ref: sandersyokoyama2012, role: rm, loc: "Theorem 12 (2)" }

- id: nps
  label: '\textsf{Nontrivial proper subspace}'
  name: Existence of nontrivial proper subspaces
  kind: sentence
  minor: true
  tags: [ algebra, compactness ]
  definition: Every vector space of dimension greater than one (over an infinite field) has a nontrivial proper subspace.
  refs:
    - { ref: downeyetal2007, role: rm, loc: "Corollary 1.6 (1)" }

- id: fd-nps
  label: '\textsf{Finite-dim. nontrivial proper subspace}'
  name: Existence of finite-dimensional nontrivial proper subspaces
  kind: sentence
  minor: true
  tags: [ algebra ]
  definition: Every vector space of dimension greater than one (over an infinite field) has a finite-dimensional nontrivial proper subspace.
  refs:
    - { ref: downeyetal2007, role: rm, loc: "Corollary 1.6 (2)" }

- id: npi
  label: '\textsf{Nontrivial proper ideal}'
  name: Existence of nontrivial proper ideals
  kind: sentence
  minor: true
  tags: [ algebra, compactness ]
  definition: >
    Every (infinite) commutative ring with identity that is not a field has a nontrivial proper ideal
    (equivalently: if a ring has no nontrivial proper ideals, then it is a field).
  refs:
    - { ref: downeylemppmileti2007, role: rm, loc: "Proposition 3.4 (1)" }
    - { ref: downeyetal2007, role: rm, loc: "Corollary 1.2 (1)" }

- id: fg-npi
  label: '\textsf{F.g. nontrivial proper ideal}'
  name: Existence of finitely generated nontrivial proper ideals
  kind: sentence
  minor: true
  tags: [ algebra ]
  definition: >
    Every (infinite) commutative ring with identity that is not a field has a finitely generated nontrivial
    proper ideal (equivalently: if a ring has no nontrivial proper finitely generated ideals, then it is a
    field).
  refs:
    - { ref: downeylemppmileti2007, role: rm, loc: "Proposition 3.8 (2)" }
    - { ref: downeyetal2007, role: rm, loc: "Corollary 1.2 (2)" }

- id: wo-log
  label: '\textsf{Logarithms of well-orderings}'
  name: Existence of logarithms of countable well-orderings
  kind: sentence
  minor: true
  tags: [ well-orders ]
  definition: >
    If $\alpha > 1$ and $\beta$ are countable well-orderings, then there is a well-ordering $\gamma$ with
    $\alpha^\gamma \le \beta < \alpha^{\gamma+1}$ (for strong or weak comparability).
  refs:
    - { ref: hirst1994, role: rm, loc: "Definitions 2.1, 2.2, Theorem 2.7" }

- id: wcwo-indec
  label: '\textsf{Comparability of indecomposables}'
  name: Weak comparability of indecomposable well-orderings
  kind: sentence
  minor: true
  tags: [ well-orders ]
  definition: >
    Any two indecomposable countable well-orderings are weakly comparable (one embeds into the other by an
    order-preserving injection), where $\alpha$ is indecomposable if $\alpha \le_w \beta$ for every final
    segment $\beta$ of $\alpha$.
  refs:
    - { ref: hirst1994, role: rm, loc: "Definition 3.1, Theorem 4.4" }

- id: cnf
  label: '\textsf{Cantor normal form}'
  name: Cantor's normal form theorem for countable well-orderings
  kind: sentence
  minor: true
  tags: [ well-orders ]
  phrases: [ Cantor normal form theorem, Cantor's normal form theorem ]
  definition: >
    Every countable well-ordering $\beta$ is equal to $\omega^{\gamma_0} d_0 + \cdots + \omega^{\gamma_n}
    d_n$ for well-orderings $\gamma_0 > \cdots > \gamma_n$ and positive integers $d_0, \ldots, d_n$ (for
    strong or weak comparability).
  refs:
    - { ref: hirst1994, role: rm, loc: "Theorem 5.2 (iii)" }

- id: indec-omega
  label: '\textsf{Indecomposables are } \omega^\alpha'
  name: Characterization of indecomposable well-orderings
  kind: sentence
  minor: true
  tags: [ well-orders ]
  definition: >
    If $\beta$ is an indecomposable countable well-ordering, then $\beta \equiv_s \omega^\alpha$ for some
    well-ordering $\alpha$.
  refs:
    - { ref: hirst1994, role: rm, loc: "Definition 3.1, Theorem 5.3" }

- id: sherman
  label: '\textsf{Sherman}'
  name: Sherman's inequality for well-orderings
  kind: sentence
  minor: true
  tags: [ well-orders ]
  phrases: [ Sherman's inequality ]
  definition: >
    If $\alpha$, $\beta$ and $\gamma$ are countable well-orderings, then $(\alpha + \beta)\gamma \le
    \alpha\gamma + \beta\gamma$ (for strong or weak comparability).
  refs:
    - { ref: hirst1994, role: rm, loc: Theorem 5.4 }

- id: wo-omega-omega-omega
  label: '\mathsf{WO}(\omega^{\omega^\omega})'
  name: Well-orderedness of ω^(ω^ω)
  kind: sentence
  tags: [ well-orders ]
  aliases: [ "WO(ω^ω^ω)" ]
  definition: >
    The ordinal $\omega^{\omega^\omega}$ (in the standard notation system for ordinals below $\varepsilon_0$) is
    well ordered: there is no descending sequence through it. Over $\mathsf{RCA}_0$ it is equivalent to
    $\mathsf{WO}(\omega^{\omega^m})$ for all $m \in \mathbb{N}$.
  refs:
    - { ref: simpson1988, role: rm, loc: "Section 2, Proposition 2.6(4)" }
    - { ref: pelupessy2016c, role: rm, loc: "Theorems 2 and 7" }

- id: robson
  label: "\\textsf{Robson basis theorem}"
  name: "Robson basis theorem"
  kind: sentence
  minor: true
  tags: [ algebra ]
  phrases: [ Robson basis theorem ]
  definition: >
    For every countable field $K$ and every $m \in \mathbb{N}$, the ring $K\langle x_1, \dots, x_m\rangle$ of polynomials
    in $m$ noncommuting indeterminates is Robsonian: for every sequence $\langle h_k : k \in \mathbb{N}\rangle$ of
    homogeneous elements there is $k$ such that every $h_j$ is a $K$-linear combination of insertions
    $h_i[u_0, \dots, u_{l_i}]$ with $i \le k$ (Simpson's formal version of Robson's theorem that insertive homogeneous
    ideals are finitely generated as insertive homogeneous ideals).
  refs: [ { ref: simpson1988, role: rm, loc: "Definition 2.8, Theorem 2.9" } ]
