- { id: "sram", label: "\\mathsf{SRAM}", name: "Stable Ramsey for measure", definition: "For every set $X$ there is a set $Y$ such that every stable coloring $f : [\\mathbb{N}]^2 \\to 2$ with $f \\le_T X$ has an infinite homogeneous set $H \\le_T Y$.", tags: [ "ramsey", "randomness" ], kind: "sentence", refs: [ { ref: dzhafarov2011, role: origin, loc: Definition 5.3(2) } ] }
- id: srrt22
  label: '\mathsf{SRRT}^{2}_2'
  name: Stable rainbow Ramsey theorem for pairs (2 colors)
  kind: problem
  tags: [ ramsey, stable ]
  definition: >
    Every rainbow-stable 2-bounded coloring $f : [\mathbb{N}]^{2} \to \mathbb{N}$ has an infinite rainbow, that is a set $H$ on which $f$ is injective. $f$ is rainbow-stable if for every $x$, either there is $y \neq x$ with $f(x, s) = f(y, s)$ for almost every $s$, or $f(x, s) \neq f(y, s)$ for every $y \neq x$ and almost every $s$.
  instance: 'A rainbow-stable 2-bounded coloring $f : [\mathbb{N}]^{2} \to \mathbb{N}$.'
  solution: An infinite rainbow.
  refs: [ { ref: patey2015, role: origin, loc: Definition 1.5 } ]
- { id: "srrt32", label: "\\mathsf{SRRT}^{3}_2", name: "Stable rainbow Ramsey theorem for triples (2 colors)", kind: "problem", tags: [ "ramsey", "stable" ], definition: "The stable rainbow Ramsey theorem for triples: $\\mathsf{RRT}^3_2$ restricted to 2-bounded colorings of triples that are rainbow-stable, as for pairs in Definition 1.5 of Patey (2015). The paper uses it in Corollary 5.26 without defining stability for triples.", instance: "A rainbow-stable 2-bounded function $f : [\\mathbb{N}]^{3} \\to \\mathbb{N}$.", solution: "An infinite rainbow set.", refs: [ { ref: patey2015, role: rm, loc: "Corollary 5.26" } ] }
- { id: "srt2", label: "\\mathsf{SRT}^{2}_{<\\infty}", name: "Stable Ramsey's theorem for pairs (finitely many colors)", kind: "problem", tags: [ "ramsey", "stable" ], definition: "Every stable coloring $f : [\\mathbb{N}]^2 \\to k$ has an infinite homogeneous set for every $k$. $f : [\\mathbb{N}]^2 \\to k$ is stable if $\\lim_y f(x, y)$ exists for every $x$.", instance: "A stable coloring $f : [\\mathbb{N}]^2 \\to k$.", solution: "An infinite homogeneous set.", priority: -10, refs: [ { ref: cholakjockuschslaman2001, role: rm, loc: Statement 7.6 } ] }
- { id: "stcads", label: "\\mathsf{StCADS}", name: "Stable CADS", definition: "Every infinite linear order has a suborder that is of type ω, of type ω*, or strongly of type ω + ω*.", tags: [ "orders", "cohesive" ], kind: "problem", refs: [ { ref: hirschfeldtshore2007, role: origin, loc: Definition 4.3 and statement (StCADS) } ], instance: An infinite linear order $L$., solution: "A suborder of $L$ of type $\\omega$, of type $\\omega^*$, or strongly of type $\\omega + \\omega^*$." }
- { id: "stcoh", label: "\\mathsf{StCOH}", name: "Stable cohesiveness", definition: "COH restricted to stable sequences $\\vec R$ (for each $n$, $n \\in R_i$ for almost all $i$ or for almost no $i$).", tags: [ "cohesive" ], kind: "problem", priority: -10, instance: A stable sequence of sets $\vec R$., solution: An infinite $\vec R$-cohesive set., refs: [ { ref: dzhafarovmummert2022, role: rm, loc: "Definition 6.5.5" } ] }
- { id: "stcrt22", label: "\\mathsf{StCRT}^{2}_2", name: "Cohesive Ramsey theorem for stable-like colorings for pairs (2 colors)", kind: "problem", tags: [ "ramsey", "stable" ], definition: "For every coloring $f : [\\mathbb{N}]^2 \\to 2$ there is an infinite set $S$ on which $f$ is strongly stable: $(\\forall n)(\\exists y)(\\forall x \\in S)(x < n \\to (\\forall z \\in S)[z > y \\to f(x,y) = f(x,z)])$.", refs: [ { ref: hirschfeldtshore2007, role: origin, loc: "§4, statement (StCRT²₂)" } ], instance: "A coloring $f : [\\mathbb{N}]^2 \\to 2$.", solution: An infinite set on which $f$ is strongly stable. }
- { id: "sts2", label: "\\mathsf{STS}^{2}", name: "Stable thin set theorem for pairs", kind: "problem", tags: [ "ramsey", "stable" ], definition: "Every stable function $f : [\\mathbb{N}]^{2} \\to \\mathbb{N}$ has an infinite thin set $H$, i.e. $f[[H]^{2}] \\neq \\mathbb{N}$.", instance: "A stable function $f : [\\mathbb{N}]^{2} \\to \\mathbb{N}$.", solution: "An infinite set $H$ with $f[[H]^{2}] \\neq \\mathbb{N}$.", priority: -10, refs: [ { ref: cholaketal2005, role: rm, loc: Statement 3.1 (TS) } ] }
