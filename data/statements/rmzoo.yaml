- { id: "er1", label: "\\mathsf{ER}^1", name: "Erdős–Rado theorem for singletons (rationals)", definition: "For every $n$ and every coloring $f : \\mathbb{Q} \\to n$ there is a dense homogeneous set.", tags: [ "ramsey" ], kind: "problem", refs: [ { ref: frittaionpatey2017, role: origin, loc: Introduction (ER¹) } ], instance: "A number $n$ and a coloring $f : \\mathbb{Q} \\to n$.", solution: A dense homogeneous set. }
- { id: "er22", label: "\\mathsf{ER}^{2}_2", name: "Erdős–Rado theorem for the rationals for pairs (2 colors)", kind: "problem", tags: [ "ramsey" ], definition: "For every coloring $f : [\\mathbb{Q}]^2 \\to 2$ there is either an infinite 0-homogeneous set or a 1-homogeneous set which is dense (equivalently, of order type η).", refs: [ { ref: frittaionpatey2017, role: origin, loc: Introduction (ER²₂) } ], instance: "A coloring $f : [\\mathbb{Q}]^2 \\to 2$.", solution: An infinite 0-homogeneous set or a 1-homogeneous set of order type $\eta$. }
- { id: "fip", label: "\\mathsf{FIP}", name: "Finite intersection principle", definition: "Every nontrivial family of sets has a maximal subfamily with the finite intersection property.", tags: [ "computability" ], kind: "problem", instance: "A nontrivial family of sets.", solution: "A maximal subfamily with the finite intersection property.", priority: -10, refs: [ { ref: diamondstoneetal2016, role: rm } ] }
- { id: "fs", label: "\\mathsf{FS}", name: "Free set theorem", kind: "problem", tags: [ "ramsey" ], definition: "Every function $f : [\\mathbb{N}]^n \\to \\mathbb{N}$ has an infinite free set $H$: for every $s \\in [H]^{n}$, if $f(s) \\in H$ then $f(s) \\in s$ for every exponent $n$.", instance: "A function $f : [\\mathbb{N}]^n \\to \\mathbb{N}$.", solution: "An infinite free set.", refs: [ { ref: friedman1999, role: origin } ], caution: "FS names the free set theorem here. In papers on Hindman's theorem, FS(X) denotes the finite sums of X, and Hindman's theorem ([[ht]]) is also called the finite sums theorem." }
- { id: "fs2", label: "\\mathsf{FS}^{2}", name: "Free set theorem for pairs", kind: "problem", tags: [ "ramsey" ], definition: "Every function $f : [\\mathbb{N}]^{2} \\to \\mathbb{N}$ has an infinite free set $H$: for every $s \\in [H]^{2}$, if $f(s) \\in H$ then $f(s) \\in s$.", instance: "A function $f : [\\mathbb{N}]^{2} \\to \\mathbb{N}$.", solution: "An infinite free set.", refs: [ { ref: friedman1999, role: origin } ] }
- { id: "fs3", label: "\\mathsf{FS}^{3}", name: "Free set theorem for triples", kind: "problem", tags: [ "ramsey" ], definition: "Every function $f : [\\mathbb{N}]^{3} \\to \\mathbb{N}$ has an infinite free set $H$: for every $s \\in [H]^{3}$, if $f(s) \\in H$ then $f(s) \\in s$.", instance: "A function $f : [\\mathbb{N}]^{3} \\to \\mathbb{N}$.", solution: "An infinite free set.", refs: [ { ref: cholaketal2005, role: origin, loc: Statement 1.1 } ] }
- { id: "gdreg", label: "G_\\delta\\text{-}\\mathsf{REG}", name: "G_δ regularity", definition: "For every $G_\\delta$ set $P \\subseteq 2^\\mathbb{N}$ there is an $F_\\sigma$ set $Q \\subseteq P$ with $\\mu(Q) = \\mu(P)$.", tags: [ "randomness" ], kind: "problem", refs: [ { ref: kjoshanssenmillersolomon2012, role: rm, loc: "Introduction, statement (1)" } ], instance: "A (code for a) $G_\\delta$ set $P \\subseteq 2^\\mathbb{N}$.", solution: An $F_\sigma$ set $Q \subseteq P$ with $\mu(Q) = \mu(P)$. }
