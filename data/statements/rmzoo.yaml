- { id: "asram", label: "\\mathsf{ASRAM}", name: "Almost stable Ramsey for measure", definition: "For every set $X$ there is a set $Y$ such that for every martingale approximation $M \\le_T X$ there is a stable coloring $f \\le_T X$ on which $M$ does not succeed and which has an infinite homogeneous set $H \\le_T Y$.", tags: [ "ramsey", "randomness" ], kind: "sentence", refs: [ { ref: dzhafarov2011, role: origin, loc: Definition 5.3(3) } ] }
