- { id: "ctt22", label: "\\mathsf{CTT}^{2}_2", name: "Cohesive tree theorem for pairs (2 colors)", kind: "problem", tags: [ "ramsey" ], definition: "For every coloring $f : [2^{<\\mathbb{N}}]^2 \\to 2$ of comparable pairs there is a set $H \\subseteq 2^{<\\mathbb{N}}$ isomorphic to $2^{<\\mathbb{N}}$ on which $f$ is stable.", refs: [ { ref: dzhafarovpatey2017, role: origin, loc: Statement 2.10 } ], instance: "A coloring $f$ of the comparable pairs of $2^{<\\mathbb{N}}$ with 2 colors.", solution: "A set $H \\subseteq 2^{<\\mathbb{N}}$ isomorphic to $2^{<\\mathbb{N}}$ on which $f$ is stable." }
