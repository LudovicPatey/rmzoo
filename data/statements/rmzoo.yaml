- { id: "kl", label: "\\mathsf{KL}", name: "König's lemma", definition: "Every infinite finitely branching subtree of $\\mathbb{N}^{<\\mathbb{N}}$ has an infinite path.", tags: [ "compactness" ], kind: "problem", instance: "An infinite finitely branching tree.", solution: "An infinite path.", refs: [ { ref: dzhafarovmummert2022, role: rm, loc: "Definition 3.2.1(1)" } ] }
- { id: "nd2ip", label: "\\overline{\\mathsf{D}}_2\\mathsf{IP}", name: "2 intersection principle", aliases: [ 2IP ], definition: "Every nontrivial family of sets has a maximal subfamily with the $\\overline{\\mathsf{D}}_2$ intersection property, i.e. in which any two distinct sets intersect. Called 2IP in Dzhafarov–Mummert 2022 (Definition 9.10.18).", tags: [ "computability" ], kind: "problem", refs: [ { ref: dzhafarovmummert2013, role: origin, loc: Definitions 1.2 and 1.3 } ], instance: "A nontrivial family of sets $\\langle A_i : i \\in \\mathbb{N} \\rangle$.", solution: A maximal subfamily in which any two distinct sets intersect. }
- { id: "opt", label: "\\mathsf{OPT}", name: "Omitting partial types", definition: "For every complete theory $T$ and every family of partial types, there is a model of $T$ omitting all the nonprincipal ones.", tags: [ "computability" ], kind: "problem", priority: -10, instance: A complete theory $T$ and a family of partial types., solution: A model of $T$ omitting all the nonprincipal types of the family., refs: [ { ref: hirschfeldtshoreslaman2009, role: origin }, { ref: dzhafarovmummert2022, role: rm, loc: "Definition 9.10.10" } ] }
- { id: "p22", label: "\\mathsf{P}^2_2", name: "Path principle", definition: "For any $\\Pi^0_2$-definable sets $A_0, A_1$ with $A_0 \\cup A_1 = \\mathbb{N}$ there is an infinite set $H$ with $H \\subseteq A_0$ or $H \\subseteq A_1$.", tags: [ "ramsey" ], kind: "sentence", refs: [ { ref: flood2012, role: origin, loc: Statement 15 } ] }
- { id: "pa", label: "\\mathsf{PA}", name: "Full first-order induction", definition: "The induction scheme for all arithmetical formulas.", tags: [ "induction", "first-order" ], kind: "sentence", firstOrder: true, form: "Pi11", refs: [ { ref: simpson2009, role: rm, loc: "Definition IX.1.4" } ], caution: "Here PA is first-order Peano arithmetic (the full arithmetical induction scheme). In Weihrauch and computability papers, PA usually denotes the problem of finding a set of PA degree (Definition 6.2 of [@brattkahendtlasskreuzer2017]), entered here as [[padeg]]." }
- { id: "part", label: "\\mathsf{PART}", name: "Partition principle for ω+ω*", definition: "Every infinite linear order in which every element has finitely many predecessors or finitely many successors can be partitioned into its $\\omega$ part and its $\\omega^*$ part.", tags: [ "orders" ], kind: "problem", form: "Pi11", instance: An infinite linear order in which every element has finitely many predecessors or finitely many successors., solution: The set of elements with finitely many predecessors., refs: [ { ref: dzhafarovmummert2022, role: rm, loc: "Definition 6.5.7" } ] }
- { id: "phpm", label: "\\mathsf{PHPM}", name: "Pigeonhole principle for measure", definition: "For every finite partition of $2^{\\mathbb{N}}$ into Borel pieces, one piece has positive measure (formalized with codes; see Slaman).", tags: [ "randomness" ], kind: "sentence", todo: true, form: "Pi11" }
- { id: "pi01g", label: "\\Pi^0_1\\mathsf{G}", name: "Π⁰₁ genericity", definition: "For every uniform sequence of dense $\\Pi^0_1$ sets of strings, there is a set meeting each of them.", tags: [ "computability" ], kind: "problem", instance: A uniform sequence of dense $\Pi^0_1$ sets of strings., solution: A set meeting every set of the sequence., refs: [ { ref: hirschfeldtshoreslaman2009, role: origin, loc: "Section 4, statement (Π⁰₁G)" } ] }
- { id: "pos", label: "\\mathsf{POS}", name: "Positive-measure classes are inhabited", definition: "For every $G_\\delta$ set $P \\subseteq 2^\\mathbb{N}$ with $\\mu(P) > 0$ there is a closed set $F \\subseteq P$ with $\\mu(F) > 0$.", tags: [ "randomness" ], kind: "problem", refs: [ { ref: kjoshanssenmillersolomon2012, role: origin, loc: "Introduction, statement (3)" } ], instance: "A (code for a) $G_\\delta$ set $P \\subseteq 2^\\mathbb{N}$ with $\\mu(P) > 0$.", solution: A closed set $F \subseteq P$ with $\mu(F) > 0$. }
- { id: "pos-wwkl", conjunction: [ "pos", "wwkl" ], kind: "sentence", tags: [], priority: -10 }
- { id: "pos1", label: "\\mathsf{POS}_1", name: "Positive-measure Π⁰₁ classes are inhabited", definition: "Every closed ($\\Pi^0_1$) set of positive measure has an element (relativized to every set).", tags: [ "randomness" ], kind: "problem", formulationOf: wwkl, refs: [ { ref: avigaddeanrute2012, role: origin, loc: "§3, (1-POS)" } ], instance: "A closed set $P \\subseteq 2^\\mathbb{N}$ of positive measure.", solution: An element of $P$. }
- { id: "pos2", label: "\\mathsf{POS}_2", name: "Positive-measure Π⁰₂ classes are inhabited", definition: "Every $G_\\delta$ subset of Cantor space with positive measure has an element (relativized to every set); equivalent to WWKL relative to the jump of any set.", tags: [ "randomness" ], kind: "problem", refs: [ { ref: avigaddeanrute2012, role: origin, loc: "§1, (2-POS)" } ], instance: "A $G_\\delta$ set $P \\subseteq 2^\\mathbb{N}$ of positive measure.", solution: An element of $P$. }
- { id: "prodwqo", label: "\\mathsf{ProdWQO}", name: "Products of wqos", definition: "The product of two well-quasi-orders is a well-quasi-order.", tags: [ "orders" ], kind: "sentence", refs: [ { ref: towsner2020, role: rm, loc: "Definition 1.13" } ] }
- { id: "prodwqo-wkl", conjunction: [ "prodwqo", "wkl" ], kind: "sentence", tags: [] }
- { id: "psrt22", label: "\\mathsf{psRT}^{2}_2", name: "Pseudo Ramsey theorem for pairs (2 colors)", kind: "problem", tags: [ "ramsey" ], definition: "Every coloring $f : [\\mathbb{N}]^2 \\to 2$ has an infinite pseudo-homogeneous set $\\{x_0 < x_1 < \\dots\\}$, i.e. one with $f(x_i, x_{i+1}) = f(x_j, x_{j+1})$ for all $i, j$.", refs: [ { ref: patey2018a, role: origin, loc: Definition 19 } ], instance: "A coloring $f : [\\mathbb{N}]^2 \\to 2$.", solution: "An infinite set $\\{x_0 < x_1 < \\dots\\}$ with $f(x_i, x_{i+1}) = f(x_j, x_{j+1})$ for all $i, j$." }
- { id: "pt", label: "\\mathsf{PT}", name: "Polarized Ramsey theorem", kind: "problem", tags: [ "ramsey" ], definition: "For every coloring $f : [\\mathbb{N}]^n \\to k$ for every $k$, there are infinite sets $H_1, \\dots, H_{n}$ such that $f$ is constant on all sets $\\{x_1, \\dots, x_{n}\\} \\in [\\mathbb{N}]^n$ with $x_i \\in H_i$.", instance: "A coloring $f : [\\mathbb{N}]^n \\to k$.", solution: "An infinite homogeneous sequence of sets $(H_1, \\dots, H_n)$.", refs: [ { ref: dzhafarovhirst2009, role: origin, loc: Definitions 1.2 and 1.5 } ] }
- { id: "pt2", label: "\\mathsf{PT}^{2}_{<\\infty}", name: "Polarized Ramsey theorem for pairs (finitely many colors)", kind: "problem", tags: [ "ramsey" ], definition: "For every coloring $f : [\\mathbb{N}]^{2} \\to k$ for every $k$, there are infinite sets $H_1, \\dots, H_{2}$ such that $f$ is constant on all sets $\\{x_1, \\dots, x_{2}\\} \\in [\\mathbb{N}]^{2}$ with $x_i \\in H_i$.", instance: "A coloring $f : [\\mathbb{N}]^{2} \\to k$.", solution: "An infinite homogeneous sequence of sets $(H_1, \\dots, H_n)$.", refs: [ { ref: dzhafarovhirst2009, role: origin, loc: Definitions 1.2 and 1.5 } ] }
- { id: "pt22", label: "\\mathsf{PT}^{2}_2", name: "Polarized Ramsey theorem for pairs (2 colors)", kind: "problem", tags: [ "ramsey" ], definition: "For every coloring $f : [\\mathbb{N}]^{2} \\to 2$, there are infinite sets $H_1, \\dots, H_{2}$ such that $f$ is constant on all sets $\\{x_1, \\dots, x_{2}\\} \\in [\\mathbb{N}]^{2}$ with $x_i \\in H_i$.", instance: "A coloring $f : [\\mathbb{N}]^{2} \\to 2$.", solution: "An infinite homogeneous sequence of sets $(H_1, \\dots, H_n)$.", refs: [ { ref: dzhafarovhirst2009, role: origin, loc: Definitions 1.2 and 1.5 } ] }
- { id: "pt3", label: "\\mathsf{PT}^{3}_{<\\infty}", name: "Polarized Ramsey theorem for triples (finitely many colors)", kind: "problem", tags: [ "ramsey" ], definition: "For every coloring $f : [\\mathbb{N}]^{3} \\to k$ for every $k$, there are infinite sets $H_1, \\dots, H_{3}$ such that $f$ is constant on all sets $\\{x_1, \\dots, x_{3}\\} \\in [\\mathbb{N}]^{3}$ with $x_i \\in H_i$.", instance: "A coloring $f : [\\mathbb{N}]^{3} \\to k$.", solution: "An infinite homogeneous sequence of sets $(H_1, \\dots, H_n)$.", refs: [ { ref: dzhafarovhirst2009, role: origin, loc: Definitions 1.2 and 1.5 } ] }
- { id: "pt32", label: "\\mathsf{PT}^{3}_2", name: "Polarized Ramsey theorem for triples (2 colors)", kind: "problem", tags: [ "ramsey" ], definition: "For every coloring $f : [\\mathbb{N}]^{3} \\to 2$, there are infinite sets $H_1, \\dots, H_{3}$ such that $f$ is constant on all sets $\\{x_1, \\dots, x_{3}\\} \\in [\\mathbb{N}]^{3}$ with $x_i \\in H_i$.", instance: "A coloring $f : [\\mathbb{N}]^{3} \\to 2$.", solution: "An infinite homogeneous sequence of sets $(H_1, \\dots, H_n)$.", refs: [ { ref: dzhafarovhirst2009, role: origin, loc: Definitions 1.2 and 1.5 } ] }
- { id: "ptt2", label: "\\mathsf{PTT}^{2}_{<\\infty}", name: "Polarized tree theorem for pairs (finitely many colors)", kind: "problem", tags: [ "ramsey" ], definition: "Polarized version of the tree theorem $\\mathsf{TT}^{2}_{k}$: one asks for a sequence of subtrees isomorphic to $2^{<\\mathbb{N}}$, one per coordinate.", instance: "A coloring of the 2-element chains of $2^{<\\mathbb{N}}$.", solution: "A sequence of 2 subtrees isomorphic to $2^{<\\mathbb{N}}$ which is homogeneous in the polarized sense.", refs: [ { ref: dzhafarovhirstlakins2010, role: origin, loc: "Definition 1.5" } ], caution: "PTT names the polarized tree theorem of Dzhafarov, Hirst and Lakins [@dzhafarovhirstlakins2010] here. Kihara, Marcone and Pauly [@kiharamarconepauly2020] use PTT₁ and PTT₂ for the one-sided and two-sided perfect tree theorems ([[perfect1]], [[perfect2]])." }
- { id: "ptt22", label: "\\mathsf{PTT}^{2}_2", name: "Polarized tree theorem for pairs (2 colors)", kind: "problem", tags: [ "ramsey" ], definition: "Polarized version of the tree theorem $\\mathsf{TT}^{2}_{2}$: one asks for a sequence of subtrees isomorphic to $2^{<\\mathbb{N}}$, one per coordinate.", instance: "A coloring of the 2-element chains of $2^{<\\mathbb{N}}$.", solution: "A sequence of 2 subtrees isomorphic to $2^{<\\mathbb{N}}$ which is homogeneous in the polarized sense.", refs: [ { ref: dzhafarovhirstlakins2010, role: origin, loc: "Definition 1.5" } ], caution: "PTT names the polarized tree theorem of Dzhafarov, Hirst and Lakins [@dzhafarovhirstlakins2010] here. PTT₂ without a superscript is the two-sided perfect tree theorem of Kihara, Marcone and Pauly ([[perfect2]])." }
- { id: "ptt3", label: "\\mathsf{PTT}^{3}_{<\\infty}", name: "Polarized tree theorem for triples (finitely many colors)", kind: "problem", tags: [ "ramsey" ], definition: "Polarized version of the tree theorem $\\mathsf{TT}^{3}_{k}$: one asks for a sequence of subtrees isomorphic to $2^{<\\mathbb{N}}$, one per coordinate.", instance: "A coloring of the 3-element chains of $2^{<\\mathbb{N}}$.", solution: "A sequence of 3 subtrees isomorphic to $2^{<\\mathbb{N}}$ which is homogeneous in the polarized sense.", refs: [ { ref: dzhafarovhirstlakins2010, role: origin, loc: "Definition 1.5" } ] }
- { id: "ptt32", label: "\\mathsf{PTT}^{3}_2", name: "Polarized tree theorem for triples (2 colors)", kind: "problem", tags: [ "ramsey" ], definition: "Polarized version of the tree theorem $\\mathsf{TT}^{3}_{2}$: one asks for a sequence of subtrees isomorphic to $2^{<\\mathbb{N}}$, one per coordinate.", instance: "A coloring of the 3-element chains of $2^{<\\mathbb{N}}$.", solution: "A sequence of 3 subtrees isomorphic to $2^{<\\mathbb{N}}$ which is homogeneous in the polarized sense.", refs: [ { ref: dzhafarovhirstlakins2010, role: origin, loc: "Definition 1.5" } ] }
- { id: "ran1", label: "1\\text{-}\\mathsf{RAN}", name: "Existence of Martin-Löf randoms (1-RAN)", definition: "For every $X$ there is a set which is Martin-Löf random relative to $X$.", tags: [ "randomness" ], kind: "problem", instance: "A set $X$.", solution: "A set Martin-Löf random relative to $X$.", aliases: [ RAN1, MLR, Martin-Löf randomness, 1-RAN ], formulationOf: wwkl, refs: [ { ref: brattkahendtlasskreuzer2017, role: rm, loc: Section 7 (MLR) } ] }
- { id: "ran2", label: "2\\text{-}\\mathsf{RAN}", name: "Existence of 2-randoms (2-RAN)", definition: "For every $X$ there is a set which is 2-random relative to $X$.", tags: [ "randomness" ], kind: "problem", instance: "A set $X$.", solution: "A set 2-random relative to $X$.", aliases: [ RAN2, 2-random, 2-RAN ], formulationOf: wwkl2, refs: [ { ref: avigaddeanrute2012, role: rm, loc: Section 1 (2-RAN) }, { ref: conidisslaman2013, role: rm } ] }
- { id: "rcolor2", label: "\\mathsf{RCOLOR}_2", name: "Ramsey-type 2-coloring", definition: "For every infinite locally 2-colorable graph $G = (V, E)$ there is an infinite $H \\subseteq V$ such that every finite $V_0 \\subseteq V$ induces a subgraph with a 2-coloring giving color 0 to every vertex of $V_0 \\cap H$.", tags: [ "ramsey", "compactness" ], kind: "problem", form: "rPi12", refs: [ { ref: bienvenupateyshafer2017, role: origin, loc: §5 } ], instance: "An infinite locally 2-colorable graph $G = (V, E)$.", solution: An infinite $H \subseteq V$ such that every finite $V_0 \subseteq V$ induces a subgraph with a 2-coloring giving color 0 to $V_0 \cap H$. }
- { id: "rcolor3", label: "\\mathsf{RCOLOR}_3", name: "Ramsey-type 3-coloring", definition: "For every infinite locally 3-colorable graph $G = (V, E)$ there is an infinite $H \\subseteq V$ such that every finite $V_0 \\subseteq V$ induces a subgraph with a 3-coloring giving color 0 to every vertex of $V_0 \\cap H$.", tags: [ "ramsey", "compactness" ], kind: "problem", refs: [ { ref: bienvenupateyshafer2017, role: origin, loc: §5 } ], instance: "An infinite locally 3-colorable graph $G = (V, E)$.", solution: An infinite $H \subseteq V$ such that every finite $V_0 \subseteq V$ induces a subgraph with a 3-coloring giving color 0 to $V_0 \cap H$. }
- { id: "rrt", label: "\\mathsf{RRT}", name: "Rainbow Ramsey theorem", kind: "problem", tags: [ "ramsey" ], definition: "Every k-bounded function $f : [\\mathbb{N}]^n \\to \\mathbb{N}$ (each color used at most k times) has an infinite rainbow set $H$, i.e. $f$ is injective on $[H]^{n}$ for every exponent $n$.", instance: "A k-bounded function $f : [\\mathbb{N}]^n \\to \\mathbb{N}$.", solution: "An infinite rainbow set.", refs: [ { ref: csimamileti2009, role: rm, loc: Definitions 1.4 and 1.5 } ] }
- { id: "rrt22", label: "\\mathsf{RRT}^{2}_2", name: "Rainbow Ramsey theorem for pairs (2 colors)", kind: "problem", tags: [ "ramsey" ], definition: "Every 2-bounded function $f : [\\mathbb{N}]^{2} \\to \\mathbb{N}$ (each color used at most 2 times) has an infinite rainbow set $H$, i.e. $f$ is injective on $[H]^{2}$.", instance: "A 2-bounded function $f : [\\mathbb{N}]^{2} \\to \\mathbb{N}$.", solution: "An infinite rainbow set.", form: "rPi12", refs: [ { ref: csimamileti2009, role: rm, loc: Definitions 1.4 and 1.5 } ] }
- { id: "rrt32", label: "\\mathsf{RRT}^{3}_2", name: "Rainbow Ramsey theorem for triples (2 colors)", kind: "problem", tags: [ "ramsey" ], definition: "Every 2-bounded function $f : [\\mathbb{N}]^{3} \\to \\mathbb{N}$ (each color used at most 2 times) has an infinite rainbow set $H$, i.e. $f$ is injective on $[H]^{3}$.", instance: "A 2-bounded function $f : [\\mathbb{N}]^{3} \\to \\mathbb{N}$.", solution: "An infinite rainbow set.", refs: [ { ref: csimamileti2009, role: rm, loc: Definitions 1.4 and 1.5 } ] }
- { id: "rrt32-rt22-wkl", conjunction: [ "rrt32", "rt22", "wkl" ], kind: "sentence", tags: [] }
- { id: "rrt42", label: "\\mathsf{RRT}^{4}_2", name: "Rainbow Ramsey theorem for 4-tuples (2 colors)", kind: "problem", tags: [ "ramsey" ], definition: "Every 2-bounded function $f : [\\mathbb{N}]^{4} \\to \\mathbb{N}$ (each color used at most 2 times) has an infinite rainbow set $H$, i.e. $f$ is injective on $[H]^{4}$.", instance: "A 2-bounded function $f : [\\mathbb{N}]^{4} \\to \\mathbb{N}$.", solution: "An infinite rainbow set.", refs: [ { ref: csimamileti2009, role: rm, loc: Definitions 1.4 and 1.5 } ] }
- { id: "rsat", label: "\\mathsf{RSAT}", name: "Ramsey-type satisfiability", definition: "For every finitely satisfiable set $C$ of propositional formulas with infinitely many atoms, there is an infinite set $H$ of atoms that is homogeneous for $C$: some truth value can be given to all atoms of $H$ consistently with every finite subset of $C$.", tags: [ "ramsey", "compactness" ], kind: "problem", refs: [ { ref: bienvenupateyshafer2017, role: origin, loc: Definition 4.3 } ], instance: A finitely satisfiable set $C$ of propositional formulas with infinitely many atoms., solution: An infinite set of atoms homogeneous for $C$. }
- { id: "rt", label: "\\mathsf{RT}", name: "Ramsey's theorem", kind: "problem", tags: [ "ramsey" ], definition: "Every coloring $f : [\\mathbb{N}]^n \\to k$ has an infinite homogeneous set for every exponent $n$ for every $k$.", instance: "A coloring $f : [\\mathbb{N}]^n \\to k$.", solution: "An infinite set $H$ such that $f$ is constant on $[H]^{n}$.", priority: -10, refs: [ { ref: dzhafarovmummert2022, role: rm, loc: "Definition 3.2.5(3)" } ] }
- { id: "rt2", label: "\\mathsf{RT}^{2}_{<\\infty}", name: "Ramsey's theorem for pairs (finitely many colors)", kind: "problem", tags: [ "ramsey" ], definition: "Every coloring $f : [\\mathbb{N}]^{2} \\to k$ has an infinite homogeneous set for every $k$.", instance: "A coloring $f : [\\mathbb{N}]^{2} \\to k$.", solution: "An infinite set $H$ such that $f$ is constant on $[H]^{2}$.", priority: -10, refs: [ { ref: dzhafarovmummert2022, role: rm, loc: "Definition 3.2.5(2)" } ] }
- { id: "rt22-wkl", conjunction: [ "rt22", "wkl" ], kind: "sentence", tags: [], priority: -10 }
- { id: "rt3", label: "\\mathsf{RT}^{3}_{<\\infty}", name: "Ramsey's theorem for triples (finitely many colors)", kind: "problem", tags: [ "ramsey" ], definition: "Every coloring $f : [\\mathbb{N}]^{3} \\to k$ has an infinite homogeneous set for every $k$.", instance: "A coloring $f : [\\mathbb{N}]^{3} \\to k$.", solution: "An infinite set $H$ such that $f$ is constant on $[H]^{3}$.", refs: [ { ref: dzhafarovmummert2022, role: rm, loc: "Definition 3.2.5(2)" } ] }
- { id: "rwkl", label: "\\mathsf{RWKL}", name: "Ramsey-type weak König's lemma", definition: "For every infinite binary tree $T$ there is an infinite set $H$ which is homogeneous for a path through $T$.", tags: [ "ramsey", "compactness" ], kind: "problem", instance: "An infinite binary tree $T$.", solution: "An infinite set $H$ such that some path of $T$ is constant on $H$.", priority: -10, refs: [ { ref: flood2012, role: origin, loc: Statement 2 (RKL) } ] }
- { id: "rwkl2", label: "2\\text{-}\\mathsf{RWKL}", name: "Ramsey-type WKL for Δ⁰₂ trees", aliases: [ 2-RWKL, RWKL2, "RKL(1)" ], definition: "Flood's $\\mathsf{RKL}(1)$: for every infinite set of strings $\\Sigma$ there is an infinite set homogeneous for a path through the tree $T_\\Sigma$ generated by $\\Sigma$ (so for $\\Pi^0_2$-definable trees).", tags: [ "ramsey", "compactness" ], kind: "problem", refs: [ { ref: flood2012, role: origin, loc: Statement 11 } ], instance: An infinite set of strings $\Sigma$., solution: An infinite set homogeneous for a path through the tree $T_\Sigma$ generated by $\Sigma$. }
- { id: "rwklw", label: "\\mathsf{RWKL}_\\omega", name: "Ramsey-type WKL (variant RWKL_ω)", definition: "Flood's $\\mathsf{RKL}(<\\omega)$: the scheme asserting, for each arithmetical formula defining a tree with arbitrarily long strings, that there is an infinite set homogeneous for a path through it.", tags: [ "ramsey", "compactness" ], kind: "sentence", refs: [ { ref: flood2012, role: origin, loc: Statement 23 } ] }
- { id: "rwwkl", label: "\\mathsf{RWWKL}", name: "Ramsey-type weak weak König's lemma", definition: "RWKL restricted to trees of positive measure.", tags: [ "ramsey", "randomness" ], kind: "problem", instance: A binary tree of positive measure., solution: An infinite set homogeneous for a path through the tree., refs: [ { ref: bienvenupateyshafer2017, role: origin, loc: "Definition 3.1" } ] }
- { id: "rwwkl2", label: "2\\text{-}\\mathsf{RWWKL}", name: "Ramsey-type WWKL for Δ⁰₂ trees", aliases: [ 2-RWWKL, RWWKL2 ], definition: "$2\\text{-}\\mathsf{RWWKL}$: for every $X$ and every $X'$-computable subtree of $2^{<\\mathbb{N}}$ with positive measure there is an infinite set homogeneous for it.", tags: [ "ramsey", "randomness" ], kind: "problem", refs: [ { ref: bienvenupateyshafer2017, role: origin, loc: Definition 3.5 } ], instance: "A set $X$ and an $X'$-computable tree $T \\subseteq 2^{<\\mathbb{N}}$ of positive measure.", solution: An infinite set homogeneous for a path through $T$. }
- { id: "sads-sem", conjunction: [ "sads", "sem" ], kind: "sentence", tags: [] }
- { id: "sads-sgp22-wkl", conjunction: [ "sads", "sgp22", "wkl" ], kind: "sentence", tags: [] }
- { id: "sem", label: "\\mathsf{SEM}", name: "Stable Erdős–Moser theorem", definition: "EM restricted to stable tournaments.", tags: [ "ramsey", "stable" ], kind: "problem", instance: An infinite stable tournament., solution: An infinite transitive subtournament., refs: [ { ref: lermansolomontowsner2013, role: origin, loc: "Section 1" }, { ref: bienvenupateyshafer2017, role: rm, loc: "Section 2" } ] }
- { id: "ser22", label: "\\mathsf{SER}^{2}_2", name: "Stable Erdős–Rado theorem for pairs (2 colors)", kind: "problem", tags: [ "ramsey" ], definition: "For every stable coloring $f : [\\mathbb{Q}]^2 \\to 2$ there is either an infinite homogeneous set of color 0 or a homogeneous set of color 1 of order type η.", refs: [ { ref: dzhafarovpatey2017, role: origin, loc: Statement 5.4 } ], instance: "A stable coloring $f : [\\mathbb{Q}]^2 \\to 2$.", solution: An infinite 0-homogeneous set or a 1-homogeneous set of order type $\eta$. }
- { id: "sfs2", label: "\\mathsf{SFS}^{2}", name: "Stable free set theorem for pairs", kind: "problem", tags: [ "ramsey", "stable" ], definition: "Every stable function $f : [\\mathbb{N}]^{2} \\to \\mathbb{N}$ has an infinite free set $H$: for every $s \\in [H]^{2}$, if $f(s) \\in H$ then $f(s) \\in s$.", instance: "A stable function $f : [\\mathbb{N}]^{2} \\to \\mathbb{N}$.", solution: "An infinite free set.", priority: -10, refs: [ { ref: patey2016c, role: rm, loc: "Section 8.5, after Definition 8.5.1" } ] }
- { id: "sfs3", label: "\\mathsf{SFS}^{3}", name: "Stable free set theorem for triples", kind: "problem", tags: [ "ramsey", "stable" ], definition: "Every stable function $f : [\\mathbb{N}]^{3} \\to \\mathbb{N}$ has an infinite free set $H$: for every $s \\in [H]^{3}$, if $f(s) \\in H$ then $f(s) \\in s$.", instance: "A stable function $f : [\\mathbb{N}]^{3} \\to \\mathbb{N}$.", solution: "An infinite free set.", refs: [ { ref: patey2016c, role: rm, loc: "Section 8.5, after Definition 8.5.1" } ] }
- { id: "sgp22", label: "\\mathsf{SGP}^{2}_2", name: "Stable grouping principle for pairs (2 colors)", kind: "problem", tags: [ "ramsey", "stable" ], definition: "For every stable coloring $f : [\\mathbb{N}]^2 \\to 2$ and every largeness notion, there is an infinite sequence of large finite sets $F_0 < F_1 < \\cdots$ and a color $i$ with $f(x, y) = i$ whenever $x \\in F_a$, $y \\in F_b$, $a < b$.", instance: "A stable coloring $f : [\\mathbb{N}]^2 \\to 2$ and a largeness notion.", solution: An infinite sequence of large finite sets $F_0 < F_1 < \cdots$ grouping homogeneously., refs: [ { ref: pateyyokoyama2018, role: origin, loc: "Section 5" } ] }
- { id: "sipt2", label: "\\mathsf{SIPT}^{2}_{<\\infty}", name: "Stable increasing polarized Ramsey theorem for pairs (finitely many colors)", kind: "problem", tags: [ "ramsey", "stable" ], definition: "For every stable coloring $f : [\\mathbb{N}]^{2} \\to k$ for every $k$, there are infinite sets $H_1, \\dots, H_{2}$ such that $f$ is constant on all increasing tuples $x_1 < \\dots < x_{2}$ with $x_i \\in H_i$.", instance: "A stable coloring $f : [\\mathbb{N}]^{2} \\to k$.", solution: "An infinite increasing-homogeneous sequence of sets.", refs: [ { ref: dzhafarovhirst2009, role: origin, loc: Definitions 1.2 and 1.5 } ] }
