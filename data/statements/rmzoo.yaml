- { id: "stt2", label: "\\mathsf{STT}^{2}_{<\\infty}", name: "Stable tree theorem for pairs (finitely many colors)", kind: "problem", tags: [ "ramsey", "stable" ], definition: "For every stable coloring $f$ of the $2$-element chains of $2^{<\\mathbb{N}}$ with k colors for every $k$, there is a subtree $S \\subseteq 2^{<\\mathbb{N}}$ isomorphic to $2^{<\\mathbb{N}}$ on whose chains $f$ is constant.", instance: "A stable coloring of $[2^{<\\mathbb{N}}]^{2}$ with k colors.", solution: "A homogeneous subtree isomorphic to $2^{<\\mathbb{N}}$.", refs: [ { ref: dzhafarovpatey2017, role: rm, loc: "Definition 2.8, Statement 2.9" } ] }
