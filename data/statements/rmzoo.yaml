- { id: "ast", label: "\\mathsf{AST}", name: "Atomic model theorem (subenumerable types)", definition: "Every complete atomic theory whose types are subenumerable has an atomic model. (A set $S$ subenumerates the types of $T$ if every type of $T$ is equivalent to $\\{\\varphi : \\langle i,\\varphi\\rangle \\in S\\}$ for some $i$.)", tags: [ "computability" ], kind: "problem", refs: [ { ref: hirschfeldtshoreslaman2009, role: origin, loc: "§5, statement (AST)" } ], instance: A complete atomic theory $T$ and a set subenumerating its types., solution: An atomic model of $T$. }
