- { id: "siptt2", label: "\\mathsf{SIPTT}^{2}_{<\\infty}", name: "Stable increasing polarized tree theorem for pairs (finitely many colors)", kind: "problem", tags: [ "ramsey", "stable" ], definition: "Polarized version of the tree theorem $\\mathsf{TT}^{2}_{k}$: one asks for a sequence of subtrees isomorphic to $2^{<\\mathbb{N}}$, one per coordinate, and only increasing chains are considered; restricted to stable colorings.", instance: "A coloring of the 2-element chains of $2^{<\\mathbb{N}}$.", solution: "A sequence of 2 subtrees isomorphic to $2^{<\\mathbb{N}}$ which is homogeneous in the polarized sense.", refs: [ { ref: dzhafarovhirstlakins2010, role: origin, loc: "Definition 3.8 (1-stability)" } ] }
