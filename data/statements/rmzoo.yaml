- { id: "d2ip", label: "\\mathsf{D}_2\\mathsf{IP}", name: "2-disjointness intersection principle", definition: "Every nontrivial family of sets has a maximal subfamily with the $\\mathsf{D}_2$ intersection property, i.e. in which any two distinct sets are disjoint. Equivalent to $\\mathsf{ACA}_0$.", tags: [ "computability" ], kind: "problem", refs: [ { ref: dzhafarovmummert2013, role: origin, loc: Definitions 1.2 and 1.3 } ], instance: "A nontrivial family of sets $\\langle A_i : i \\in \\mathbb{N} \\rangle$.", solution: A maximal subfamily in which any two distinct sets are disjoint. }
- { id: "dctp", label: "\\mathsf{DCT}'", name: "Dominated convergence theorem (variant)", definition: "Dominated convergence theorem, version with given limit: for $f, g$ and a sequence $(f_n)$ in $L^1$, if $(f_n)$ is dominated by $g$ and converges pointwise almost everywhere to $f$, then $\\int f_n \\to \\int f$.", tags: [ "randomness" ], kind: "sentence", refs: [ { ref: avigaddeanrute2012, role: rm, loc: "§1, (DCT′)" } ] }
- { id: "dnr0", label: "2\\text{-}\\mathsf{DNR}", name: "Existence of DNC functions relative to the jump (2-DNR)", definition: "For every $X$ there is a function $f$ with $f(e) \\neq \\Phi^{X'}_e(e)$ for every $e$.", tags: [ "computability", "randomness" ], kind: "problem", instance: "A set $X$.", solution: "A function DNC relative to $X'$.", priority: -10, aliases: [ DNR0, 2-DNC, "DNR[0']" ], refs: [ { ref: csimaetal2019, role: rm, loc: "Section 4" } ], caution: "2-DNR is DNC relative to the jump ∅′. It is not DNR₂ (or DNC₂), the problem of 2-valued DNC functions, which is strongly Weihrauch equivalent to [[wkl]] (Corollary 5.3 of [@brattkahendtlasskreuzer2017])." }
