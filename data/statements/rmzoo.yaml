- { id: "gp22", label: "\\mathsf{GP}^{2}_2", name: "Grouping principle for pairs (2 colors)", kind: "problem", tags: [ "ramsey" ], definition: "For every coloring $f : [\\mathbb{N}]^2 \\to 2$ and every largeness notion, there is an infinite sequence of large finite sets $F_0 < F_1 < \\cdots$ and a color $i$ with $f(x, y) = i$ whenever $x \\in F_a$, $y \\in F_b$, $a < b$.", instance: "A coloring $f : [\\mathbb{N}]^2 \\to 2$ and a largeness notion.", solution: An infinite sequence of large finite sets $F_0 < F_1 < \cdots$ grouping homogeneously., refs: [ { ref: pateyyokoyama2018, role: origin, loc: "Definition 5.1" } ] }
- { id: "hyp", label: "\\mathsf{HYP}", name: "Hyperimmunity principle", definition: "For every $X$ there is a function not dominated by any $X$-computable function.", tags: [ "computability" ], kind: "problem", instance: "A set $X$.", solution: "A function which is hyperimmune relative to $X$.", refs: [ { ref: brattkahendtlasskreuzer2017, role: rm, loc: Definition 9.1 } ], caution: "HYP is the hyperimmunity problem here. In reverse mathematics, HYP usually denotes the ω-model of the hyperarithmetic sets (or HYP(X), the sets hyperarithmetic in X)." }
- { id: "ipt", label: "\\mathsf{IPT}", name: "Increasing polarized Ramsey theorem", kind: "problem", tags: [ "ramsey" ], definition: "For every coloring $f : [\\mathbb{N}]^n \\to k$ for every $k$, there are infinite sets $H_1, \\dots, H_{n}$ such that $f$ is constant on all increasing tuples $x_1 < \\dots < x_{n}$ with $x_i \\in H_i$.", instance: "A coloring $f : [\\mathbb{N}]^n \\to k$.", solution: "An infinite increasing-homogeneous sequence of sets.", refs: [ { ref: dzhafarovhirst2009, role: origin, loc: Definitions 1.2 and 1.5 } ] }
