- id: ts23
  label: '\mathsf{TS}^2_3'
  name: Thin set theorem for pairs (3 colors)
  kind: problem
  tags: [ ramsey ]
  aliases: [ TS23, thin set theorem for 3 colors ]
  definition: >
    Every coloring $f : [\mathbb{N}]^2 \to 3$ has an infinite set $H$ that is thin
    for $f$, i.e. $f$ avoids at least one color on $[H]^2$.
  instance: >
    A coloring $f : [\mathbb{N}]^2 \to 3$.
  solution: An infinite set $H$ with $f[[H]^2] \neq 3$.
  refs: [ { ref: liupatey2022, role: rm } ]

