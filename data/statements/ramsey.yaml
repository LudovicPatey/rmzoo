- id: rt1inf
  caution: 'For Weihrauch reducibility it matters whether the number of colors is part of the instance: here the bound k is given, unlike RT¹_ℕ ([[rt1n]]) of Goh, Pauly and Valenti [@gohpaulyvalenti2021]. Check which convention a paper uses.'
  label: '\mathsf{RT}^1_{<\infty}'
  name: Infinite pigeonhole principle (finitely many colors)
  kind: problem
  tags: [ ramsey ]
  aliases: [ RT1, pigeonhole finitely many colors ]
  definition: >
    For every $k$, every coloring $f : \mathbb{N} \to k$ has an infinite homogeneous set.
  instance: >
    A number $k$ and a coloring $f : \mathbb{N} \to k$.
  solution: An infinite set $H$ on which $f$ is constant.
  refs:
    - { ref: hirst1987, role: rm }

