- id: ts13
  label: '\mathsf{TS}^1_3'
  name: Thin set theorem for singletons (3 colors)
  kind: problem
  minor: true
  tags: [ ramsey ]
  aliases: [ TS13 ]
  definition: >
    Every coloring $f : \mathbb{N} \to 3$ has an infinite set $H$ such that $f$ avoids at least one
    color on $H$. Every computable instance has a computable solution; the principle is studied
    for strong computable reducibility, where it lies strictly below $\mathsf{RT}^1_2$.
  instance: 'A coloring $f : \mathbb{N} \to 3$.'
  solution: An infinite set $H$ with $f[H] \neq 3$.
  refs: [ { ref: patey2016c, role: rm, loc: Definition 8.0.2 } ]

# "Long" versions over RCA₀* (Fiori-Carones, Kołodziejczyk, Kowalik 2021, Section 2.1):
# the solution must have cardinality N (be enumerated in increasing order by a map
# with domain N), not merely be unbounded. Over RCA₀ they coincide with the normal
# versions; over RCA₀* some imply IΣ⁰₁ and some are ∀Π⁰₃-conservative.
- id: lrt22
  label: '\ell\text{-}\mathsf{RT}^2_2'
  name: Long Ramsey's theorem for pairs
  kind: sentence
  tags: [ ramsey, induction ]
  aliases: [ ℓ-RT22, long RT22, RT22+ ]
  definition: >
    For every coloring $c : [\mathbb{N}]^2 \to 2$ there exists a set $H \subseteq \mathbb{N}$ of
    cardinality $\mathbb{N}$ (the range of a strictly increasing map with domain $\mathbb{N}$) such that $c$
    is constant on $[H]^2$. Over $\mathsf{RCA}_0$ it is $\mathsf{RT}^2_2$; over $\mathsf{RCA}_0^*$ it implies $\mathrm{I}\Sigma^0_1$.
  refs:
    - { ref: yokoyama2013, role: origin }
    - { ref: fioricaroneskoodziejczykkowalik2021, role: rm, loc: Section 2.1 }
    - { ref: kowalik2024, role: rm, loc: Section 3.1 }

- id: lrt32
  label: '\ell\text{-}\mathsf{RT}^3_2'
  name: Long Ramsey's theorem for triples
  kind: sentence
  tags: [ ramsey, induction ]
  aliases: [ ℓ-RT32, long RT32 ]
  definition: >
    For every coloring $c : [\mathbb{N}]^3 \to 2$ there exists a set $H \subseteq \mathbb{N}$ of
    cardinality $\mathbb{N}$ such that $c$ is constant on $[H]^3$.
  refs:
    - { ref: kowalik2024, role: origin, loc: Section 3.1 }

- id: lcac
  label: '\ell\text{-}\mathsf{CAC}'
  name: Long chain–antichain principle
  kind: sentence
  tags: [ orders, ramsey, induction ]
  aliases: [ ℓ-CAC, long CAC ]
  definition: >
    For every partial order $(\mathbb{N}, \preceq)$ there exists a set $S \subseteq \mathbb{N}$ of cardinality
    $\mathbb{N}$ which is either a chain or an antichain.
  refs:
    - { ref: fioricaroneskoodziejczykkowalik2021, role: origin, loc: Section 2.1 }
    - { ref: kowalik2024, role: rm, loc: Section 3.1 }

- id: ladsset
  label: '\ell\text{-}\mathsf{ADS}_{\mathrm{set}}'
  name: Long ascending or descending sequence (set solutions)
  kind: sentence
  tags: [ orders, ramsey, induction ]
  aliases: [ ℓ-ADSset, long ADS ]
  definition: >
    For every linear order $(\mathbb{N}, \preceq)$ there exists a set $S \subseteq \mathbb{N}$ of cardinality
    $\mathbb{N}$ on which $\preceq$ agrees with $\leq$, or on which $\preceq$ agrees with $\geq$.
  refs:
    - { ref: fioricaroneskoodziejczykkowalik2021, role: origin, loc: Section 2.1 }
    - { ref: kowalik2024, role: rm, loc: Section 3.1 }

- id: ladsseq
  label: '\ell\text{-}\mathsf{ADS}_{\mathrm{seq}}'
  name: Long ascending or descending sequence (sequence solutions)
  kind: sentence
  tags: [ orders, ramsey, induction ]
  aliases: [ ℓ-ADSseq ]
  definition: >
    For every linear order $(\mathbb{N}, \preceq)$ there exists a sequence $(s_i)_{i \in \mathbb{N}}$ which is
    either strictly $\preceq$-increasing or strictly $\preceq$-decreasing.
  refs:
    - { ref: fioricaroneskoodziejczykkowalik2021, role: origin, loc: Section 2.1 }
    - { ref: kowalik2024, role: rm, loc: Section 3.1 }

- id: lcrt22
  label: '\ell\text{-}\mathsf{CRT}^2_2'
  name: Long cohesive Ramsey theorem for pairs
  kind: sentence
  tags: [ ramsey, induction ]
  aliases: [ ℓ-CRT22 ]
  definition: >
    For every coloring $c : [\mathbb{N}]^2 \to 2$ there exists a set $S \subseteq \mathbb{N}$ of cardinality
    $\mathbb{N}$ such that for each $x \in S$ there is $y \in S$ with $c(x, z) = c(x, y)$ for all $z \in S$ with $z \geq y$.
  refs:
    - { ref: fioricaroneskoodziejczykkowalik2021, role: origin, loc: Section 2.1 }
    - { ref: kowalik2024, role: rm, loc: Section 3.1 }

- id: lcoh
  label: '\ell\text{-}\mathsf{COH}'
  name: Long cohesiveness principle
  kind: sentence
  tags: [ cohesive, induction ]
  aliases: [ ℓ-COH, long COH ]
  definition: >
    For every sequence $(R_n)_{n \in \mathbb{N}}$ of subsets of $\mathbb{N}$ there is a set $C$ of cardinality
    $\mathbb{N}$ which is cohesive for $(R_n)_n$.
  refs:
    - { ref: fioricaroneskoodziejczykkowalik2021, role: origin, loc: Section 5 }

- id: lem
  label: '\ell\text{-}\mathsf{EM}'
  name: Long Erdős–Moser theorem
  kind: sentence
  tags: [ ramsey, induction ]
  aliases: [ ℓ-EM, long EM ]
  definition: >
    For every coloring $c : [\mathbb{N}]^2 \to 2$ there is a set of cardinality $\mathbb{N}$ on which $c$ is transitive.
  refs:
    - { ref: fioricaroneskoodziejczykkowalik2021, role: origin, loc: "Section 2.1 and Section 4, after Question 4.12" }

- id: ts
  label: '\mathsf{TS}'
  name: Thin set theorem
  kind: problem
  tags: [ ramsey ]
  aliases: [ thin set theorem ]
  definition: >
    For every $n$, every function $f : [\mathbb{N}]^n \to \mathbb{N}$ has an infinite thin set $H$, i.e. $f[[H]^n] \neq \mathbb{N}$.
  instance: 'A number $n$ and a function $f : [\mathbb{N}]^n \to \mathbb{N}$.'
  solution: 'An infinite set $H$ with $f[[H]^n] \neq \mathbb{N}$.'
  refs:
    - { ref: cholaketal2005, role: rm, loc: Statement 3.1 }
    - { ref: patey2016c, role: rm, loc: Definition 8.0.2 }

- id: sher
  label: '\mathsf{SHER}'
  name: Ramsey's theorem for semi-hereditary colorings
  kind: problem
  tags: [ ramsey ]
  definition: >
    Every coloring $f : [\mathbb{N}]^2 \to 2$ which is semi-hereditary for some color $i$ (for all $x < y < z$,
    $f(x, z) = f(y, z) = i$ implies $f(x, y) = i$) has an infinite homogeneous set. Equivalent to CAC for trees.
  instance: 'A coloring $f : [\mathbb{N}]^2 \to 2$ semi-hereditary for some color.'
  solution: An infinite $f$-homogeneous set.
  refs: [ { ref: cervellegaudelierpatey2022, role: rm, loc: "Definitions 6.1 and 6.2 (introduced by Dorais et al.)" } ]

- id: hem
  label: '\mathsf{HEM}'
  name: Half Erdős–Moser theorem
  kind: problem
  tags: [ ramsey ]
  definition: >
    For every coloring $f : [\mathbb{N}]^2 \to 2$ there is an infinite set which is transitive for at least one color.
    RT²₂ is equivalent to HEM + CAC.
  instance: 'A coloring $f : [\mathbb{N}]^2 \to 2$.'
  solution: An infinite set transitive for one of the colors.
  refs: [ { ref: mimounipatey2025, role: origin, loc: Definition 7.2 } ]
