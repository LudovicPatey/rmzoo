- id: ts
  label: '\mathsf{TS}'
  name: Thin set theorem
  kind: problem
  tags: [ ramsey ]
  aliases: [ thin set theorem ]
  definition: >
    For every $n$, every function $f : [\mathbb{N}]^n \to \mathbb{N}$ has an infinite thin set $H$, i.e. $f[[H]^n] \neq \mathbb{N}$.
  instance: 'A number $n$ and a function $f : [\mathbb{N}]^n \to \mathbb{N}$.'
  solution: 'An infinite set $H$ with $f[[H]^n] \neq \mathbb{N}$.'
  refs:
    - { ref: cholaketal2005, role: rm, loc: Statement 3.1 }
    - { ref: patey2016c, role: rm, loc: Definition 8.0.2 }

- id: sher
  label: '\mathsf{SHER}'
  name: Ramsey's theorem for semi-hereditary colorings
  kind: problem
  tags: [ ramsey ]
  definition: >
    Every coloring $f : [\mathbb{N}]^2 \to 2$ which is semi-hereditary for some color $i$ (for all $x < y < z$,
    $f(x, z) = f(y, z) = i$ implies $f(x, y) = i$) has an infinite homogeneous set. Equivalent to CAC for trees.
  instance: 'A coloring $f : [\mathbb{N}]^2 \to 2$ semi-hereditary for some color.'
  solution: An infinite $f$-homogeneous set.
  refs: [ { ref: cervellegaudelierpatey2022, role: rm, loc: "Definitions 6.1 and 6.2 (introduced by Dorais et al.)" } ]

- id: hem
  label: '\mathsf{HEM}'
  name: Half Erdős–Moser theorem
  kind: problem
  tags: [ ramsey ]
  definition: >
    For every coloring $f : [\mathbb{N}]^2 \to 2$ there is an infinite set which is transitive for at least one color.
    RT²₂ is equivalent to HEM + CAC.
  instance: 'A coloring $f : [\mathbb{N}]^2 \to 2$.'
  solution: An infinite set transitive for one of the colors.
  refs: [ { ref: mimounipatey2025, role: origin, loc: Definition 7.2 } ]

# Erdős–Moser and Ramsey-type principles for finitely many colors (Towsner and
# Yokoyama 2018, Definitions 1.1 to 1.3 and 5.3). A coloring is transitive if
# c(x, y) = c(y, z) implies c(x, z) = c(x, y), fallow if c(x, z) ∈ {c(x, y), c(y, z)}
# (x < y < z).
- id: emfin
  label: '\mathsf{EM}_{<\infty}'
  name: Erdős–Moser theorem for finitely many colors
  kind: problem
  minor: true
  tags: [ ramsey ]
  definition: Every coloring $c$ of pairs with finitely many colors has an infinite set on which it is transitive.
  instance: 'A coloring $c : [\mathbb{N}]^2 \to k$ for some $k$.'
  solution: An infinite set on which $c$ is transitive.
  refs: [ { ref: towsneryokoyama2018, role: origin, loc: Definition 1.1 } ]

- id: femfin
  label: '\mathsf{fEM}_{<\infty}'
  name: Fallow Erdős–Moser theorem for finitely many colors
  kind: problem
  minor: true
  tags: [ ramsey ]
  definition: Every coloring $c$ of pairs with finitely many colors has an infinite set on which it is fallow. Equivalent to solving finitely many instances of EM at once.
  instance: 'A coloring $c : [\mathbb{N}]^2 \to k$ for some $k$.'
  solution: An infinite set on which $c$ is fallow.
  refs: [ { ref: towsneryokoyama2018, role: origin, loc: "Definition 1.2, Lemma 1.4" } ]

- id: frtfin
  label: '\mathsf{fRT}_{<\infty}'
  name: Ramsey's theorem for fallow colorings
  kind: problem
  minor: true
  tags: [ ramsey ]
  definition: Every fallow coloring of pairs with finitely many colors has an infinite homogeneous set.
  instance: 'A fallow coloring $c : [\mathbb{N}]^2 \to k$ for some $k$.'
  solution: An infinite $c$-homogeneous set.
  refs: [ { ref: towsneryokoyama2018, role: origin, loc: Definition 1.2 } ]

- id: trrtfin
  label: '\mathsf{trRT}_{<\infty}'
  name: Ramsey's theorem for transitive colorings, finitely many colors
  kind: problem
  minor: true
  tags: [ ramsey ]
  definition: Every transitive coloring of pairs with finitely many colors has an infinite homogeneous set. With two colors it is TRT²₂, equivalent to ADS.
  instance: 'A transitive coloring $c : [\mathbb{N}]^2 \to k$ for some $k$.'
  solution: An infinite $c$-homogeneous set.
  refs: [ { ref: towsneryokoyama2018, role: origin, loc: Definition 1.1 } ]

- id: eminf
  label: '\mathsf{EM}_{\infty}'
  name: Erdős–Moser theorem for infinitely many colors
  kind: problem
  minor: true
  tags: [ ramsey ]
  definition: Every coloring $c$ of pairs with infinitely many colors has an infinite set on which it is transitive.
  instance: 'A coloring $c : [\mathbb{N}]^2 \to \mathbb{N}$.'
  solution: An infinite set on which $c$ is transitive.
  refs: [ { ref: towsneryokoyama2018, role: origin, loc: Definition 5.3 } ]

- id: lh
  label: '\mathsf{LH}'
  name: Homogeneous subsets of limit-homogeneous sets
  kind: problem
  minor: true
  tags: [ ramsey ]
  definition: >
    Every coloring $c : [\mathbb{N}]^2 \to 2$ with $\lim_y c(x, y) = 1$ for all $x$ has an infinite homogeneous set; that is,
    every infinite limit-homogeneous set has an infinite homogeneous subset. Uniformly computably true, yet equivalent to
    BΣ⁰₂ over RCA₀.
  instance: 'A coloring $c : [\mathbb{N}]^2 \to 2$ with $\lim_y c(x, y) = 1$ for every $x$.'
  solution: An infinite $c$-homogeneous set.
  refs: [ { ref: dzhafarovhirschfeldtreitzes2020, role: origin, loc: Definition 6.1 } ]

# Ramsey-type theorems for colorings of exactly ω-large sets (Carlucci, Mainardi,
# Zdanowski 2024): s is exactly ω-large when |s| = 1 + min s; [ℕ]^{!ω} is the set of them.
- id: rtlarge
  label: '\mathsf{RT}^{!\omega}_2'
  name: Large Ramsey theorem
  kind: problem
  minor: true
  tags: [ ramsey ]
  definition: 'Every coloring $f : [\mathbb{N}]^{!\omega} \to 2$ of the exactly ω-large sets has an infinite homogeneous set.'
  instance: 'A coloring $f : [\mathbb{N}]^{!\omega} \to 2$.'
  solution: An infinite $f$-homogeneous set.
  refs: [ { ref: carluccietal2024, role: rm, loc: Definition 3.1 } ]

- id: fslarge
  label: '\mathsf{FS}^{!\omega}'
  name: Large free set theorem
  kind: problem
  minor: true
  tags: [ ramsey ]
  definition: 'For every $f : [\mathbb{N}]^{!\omega} \to \mathbb{N}$ there is an infinite set $H$ with $f(s) \notin H \setminus s$ for every $s \in [H]^{!\omega}$.'
  instance: 'A function $f : [\mathbb{N}]^{!\omega} \to \mathbb{N}$.'
  solution: An infinite $f$-free set.
  refs: [ { ref: carluccietal2024, role: rm, loc: Section 3 } ]

- id: tslarge
  label: '\mathsf{TS}^{!\omega}'
  name: Large thin set theorem
  kind: problem
  minor: true
  tags: [ ramsey ]
  definition: 'For every $f : [\mathbb{N}]^{!\omega} \to \mathbb{N}$ there is an infinite set $H$ with $f([H]^{!\omega}) \neq \mathbb{N}$.'
  instance: 'A function $f : [\mathbb{N}]^{!\omega} \to \mathbb{N}$.'
  solution: An infinite $f$-thin set.
  refs: [ { ref: carluccietal2024, role: rm, loc: Definition 3.6 } ]

- id: rrtlarge
  label: '\mathsf{RRT}^{!\omega}_2'
  name: Large rainbow Ramsey theorem
  kind: problem
  minor: true
  tags: [ ramsey ]
  definition: 'For every 2-bounded $f : [\mathbb{N}]^{!\omega} \to \mathbb{N}$ there is an infinite set on which $f$ is injective.'
  instance: 'A 2-bounded function $f : [\mathbb{N}]^{!\omega} \to \mathbb{N}$.'
  solution: An infinite $f$-rainbow.
  refs: [ { ref: carluccietal2024, role: rm, loc: Definition 3.9 } ]

- id: rt2-inf-2
  label: '\mathsf{RT}^2_{<\infty,2}'
  name: Ramsey's theorem for pairs with at most 2 colors on the homogeneous set
  kind: problem
  minor: true
  tags: [ ramsey ]
  aliases: [ "RT2<∞,2", "RT^2_{<∞,2}" ]
  definition: >
    For every $k$ and every coloring $c : [\mathbb{N}]^2 \to k$ there is an infinite set $H$ with
    $|c([H]^2)| \leq 2$. The case $n = 2$, $\ell = 2$ of $\mathsf{RT}^n_{<\infty,\ell}$.
  instance: 'A number $k$ and a coloring $c : [\mathbb{N}]^2 \to k$.'
  solution: An infinite set $H$ with $|c([H]^2)| \leq 2$.
  refs:
    - { ref: miyatayokoyama2026, role: rm, loc: "Definition 1 (n = 2, ℓ = 2)" }

