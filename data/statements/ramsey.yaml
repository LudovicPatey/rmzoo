# Ramsey's theorem and principles below RT²₂.

- id: rt12
  label: '\mathsf{RT}^1_2'
  name: Infinite pigeonhole principle (2 colors)
  kind: problem
  tags: [ ramsey ]
  aliases: [ pigeonhole, RT12 ]
  definition: >
    Every coloring $f : \mathbb{N} \to 2$ has an infinite homogeneous set.
  instance: >
    A coloring $f : \mathbb{N} \to 2$.
  solution: An infinite set $H$ on which $f$ is constant.
  refs:
    - { ref: hirst1987, role: rm }
    - { ref: brattkarakotoniaina2017, role: rm }

