# Notions of reduction / provability.
#
#   finerThan: list of reductions this one is (directly) finer than,
#              i.e. a reduction here yields a reduction there.
#   domain:    all       -> compares arbitrary statements
#              problems  -> only compares problems (instance/solution reading)
#   omegaModels: true    -> every first-order (true arithmetical) statement holds
#   conjunction: true    -> "P + Q" behaves as a conjunction
#   conservation: true   -> conservation results are used to derive separations here
#   phrase:    how "A ⇒ B" reads in prose ({a}, {b} are placeholders)
#   algebra:   strong | weak | arithmetic -> which laws of the Weihrauch algebra the
#              engine applies (site/js/engine.js, "algebra of Weihrauch degrees")

- id: rca0star
  name: Provability over RCA₀*
  short: RCA₀*
  tex: '\mathsf{RCA}_0^*'
  domain: all
  conjunction: true
  finerThan: [rca0]
  phrase: 'RCA₀* ⊢ {a} → {b}'
  description: >
    Implication provable over RCA₀*, i.e. RCA₀ with Σ⁰₁-induction replaced by Δ⁰₀-induction and the totality of exponentiation (Simpson–Smith 1986).

- id: rca0
  name: Provability over RCA₀
  short: RCA₀
  tex: '\mathsf{RCA}_0'
  domain: all
  conjunction: true
  finerThan: [omega]
  conservation: true
  higherOrder: true
  phrase: 'RCA₀ ⊢ {a} → {b}'
  shortHigher: 'RCA₀^ω'
  description: >
    Implication provable over the base system RCA₀. For third-order statements (higher-order reverse mathematics)
    the base system is Kohlenbach's RCA₀^ω, which is conservative over RCA₀ for second-order sentences: both readings
    agree on second-order statements, so a single relation covers both.
  refs:
    - { ref: kohlenbach2005, loc: "Section 2 (definition of RCA₀^ω) and Proposition 3.1 (conservativity)" }

- id: omega
  name: ω-model implication
  short: ω
  tex: '\le_\omega'
  domain: all
  conjunction: true
  omegaModels: true
  finerThan: []
  phrase: 'every ω-model of {a} is a model of {b}'
  description: >
    Every ω-model (equivalently every Turing ideal) satisfying the first statement satisfies the second.
  warning: >
    Statements are read inside the model: a problem holds in an ω-model M when M satisfies the sentence "every
    instance has a solution", with "instance" and "solution" as M judges them. For most problems this is the same as
    "every true instance in M has a solution in M", the reading of Weihrauch and computable reductions. It is not the
    same when instances or solutions are defined by a non-arithmetical condition (well-orders, trees with a path,
    uncountable closed sets: statements marked "not ω-absolute"), since an ω-model such as HYP can misjudge them. For
    those statements no ω-model result is derived from a Weihrauch or computable reduction, nor any such separation
    from an ω-model result, and properties such as cone avoidance do not apply.
  refs:
    - ref: hirschfeldtjockusch2016

- id: sw
  name: Strong Weihrauch reduction
  algebra: strong   # laws of the Weihrauch algebra that hold strongly (jump, parallelizations)
  short: sW
  tex: '\le_{\mathrm{sW}}'
  domain: problems
  finerThan: [w, sc]
  phrase: '{b} ≤_sW {a}'
  description: >
    There are Turing functionals Φ, Ψ such that for every instance X of the second problem, Φ(X) is an instance of the first, and for every solution Y of Φ(X), Ψ(Y) is a solution of X (Ψ has no access to X).
  refs:
    - ref: hirschfeldtjockusch2016

- id: w
  name: Weihrauch reduction
  algebra: weak     # all laws of the Weihrauch algebra (also products, compositional products)
  short: W
  tex: '\le_{\mathrm{W}}'
  domain: problems
  finerThan: [c, gw, cw, aw]
  phrase: '{b} ≤_W {a}'
  description: >
    Uniform reduction: Φ maps instances to instances, Ψ maps (original instance, solution) to solutions.
  refs:
    - ref: hirschfeldtjockusch2016

- id: sc
  name: Strong computable reduction
  short: sc
  tex: '\le_{\mathrm{sc}}'
  domain: problems
  finerThan: [c, soc]
  phrase: '{b} ≤_sc {a}'
  description: >
    Every instance X of the second problem computes an instance X̂ of the first such that every solution of X̂ computes a solution of X.
  refs:
    - ref: hirschfeldtjockusch2016

- id: soc
  name: Strong omniscient computable reduction
  short: soc
  tex: '\le_{\mathrm{soc}}'
  domain: problems
  finerThan: []
  phrase: '{b} ≤_soc {a}'
  description: >
    For every instance X of the second problem there is an instance X̂ of the first, computable from X or not,
    such that every solution of X̂ computes a solution of X. A separation at soc is a combinatorial one: no
    instance, however complex, encodes enough information.
  refs:
    - ref: moninpatey2019
      loc: Section 1.1

- id: c
  name: Computable reduction
  short: c
  tex: '\le_{\mathrm{c}}'
  domain: problems
  finerThan: [omega]
  phrase: '{b} ≤_c {a}'
  description: >
    Every instance X of the second problem computes an instance X̂ of the first such that for every solution Ŷ of X̂, X ⊕ Ŷ computes a solution of X.
  warning: >
    Instances and solutions are the true ones. A computable reduction gives an ω-model implication only for problems
    that ω-models judge correctly; for statements marked "not ω-absolute" (see ω-model implication) it gives none.
  refs:
    - ref: hirschfeldtjockusch2016

- id: gw
  name: Generalized Weihrauch reduction
  short: gW
  tex: '\le_{\mathrm{gW}}'
  domain: problems
  finerThan: [omega]
  phrase: '{b} ≤_gW {a}'
  description: >
    Uniform reduction allowing finitely many adaptive uses of the first problem (Hirschfeldt–Jockusch 2016).
  warning: >
    Instances and solutions are the true ones. A generalized Weihrauch reduction gives an ω-model implication only for
    problems that ω-models judge correctly; for statements marked "not ω-absolute" (see ω-model implication) it gives none.
  refs:
    - ref: hirschfeldtjockusch2016

- id: cw
  name: Continuous Weihrauch reduction
  algebra: weak     # the Weihrauch lattice relative to an oracle: all laws of ≤W relativize
  short: cW
  tex: '\le_{\mathrm{cW}}'
  domain: problems
  finerThan: []
  phrase: '{b} ≤_cW {a}'
  description: >
    Weihrauch reduction in which the forward and backward functionals only need to be continuous, equivalently
    Weihrauch reduction relative to some oracle p (≤W^p for some p ∈ ℕ^ℕ). Written ≤cW, ≤W^*, or "≤W with respect to
    some oracle". A separation at cW is a topological one; it holds at W and sW, but says nothing about computable
    reductions or ω-models (an oracle may compute the solutions).
  refs:
    - ref: pauly2010
      loc: Definition 15
    - ref: brattkagherardipauly2021
      loc: "Section 6, after Theorem 6.5 and Theorem 6.11"

- id: aw
  name: Arithmetic Weihrauch reduction
  algebra: arithmetic   # products, (finite) parallelizations and jumps are monotone, P′ ≡aW P; not ⋆ or ⋄
  short: aW
  tex: '\le_{\mathrm{aW}}'
  domain: problems
  finerThan: []
  phrase: '{b} ≤_aW {a}'
  description: >
    Weihrauch reduction in which the forward and backward functionals only need to be arithmetic, i.e. Weihrauch
    reducible to lim⁽ⁿ⁾ for some n (equivalently, computable from a fixed finite Turing jump of their inputs).
    Every arithmetic problem is ≡aW id, so id ≡aW LPO ≡aW lim⁽ⁿ⁾. Written ≤aW, ≤W^a or ≤W^arith; used for the
    problems of hyperarithmetic analysis and around ATR₀.
  refs:
    - ref: marconevalenti2020
      loc: Definition 5.1
    - ref: goh2020b
      loc: "Definition 2.2 and the paragraph after it"

- id: bish
  name: Provability in constructive mathematics
  short: BISH
  tex: '\mathsf{BISH}'
  domain: all
  conjunction: true
  higherOrder: true   # BISH speaks freely of functions on the reals (existence of a discontinuous function…)
  finerThan: []
  phrase: 'BISH ⊢ {a} → {b}'
  description: >
    Implication provable in Bishop-style constructive mathematics (intuitionistic logic, with countable and dependent
    choice), the frame of constructive reverse mathematics. Classical results say nothing here (classical logic proves
    LPO), and nothing proved here is carried to the classical frames: the engine relates BISH to no other reduction.
  refs:
    - { ref: diener2018, loc: "Section 0.4" }

- id: el0
  name: Provability over EL₀ (intuitionistic RCA₀)
  short: EL₀
  tex: '\mathsf{EL}_0'
  domain: all
  conjunction: true
  finerThan: [ rca0, bish ]
  phrase: 'EL₀ ⊢ {a} → {b}'
  description: >
    Implication provable in EL₀, the intuitionistic counterpart of RCA₀ (intuitionistic reverse mathematics in the
    sense of Hirst–Mummert, Dorais, Fujiwara and Kuyper): elementary analysis with function variables, primitive
    recursive terms, quantifier-free induction and QF-AC⁰,⁰, over intuitionistic logic. RCA₀ is EL₀ + LEM, and EL₀ is
    contained in BISH, so an implication over EL₀ holds over RCA₀ and in BISH, and a separation over either holds over
    EL₀. Third-order statements are not compared here.
  refs:
    - { ref: dorais2014, loc: "Section 2 (EL₀; RCA₀ = EL₀ + LEM)" }
    - { ref: kuyper2017, loc: "Definition 2.2 and the paragraph after it" }
