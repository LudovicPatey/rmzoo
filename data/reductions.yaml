# Notions of reduction / provability.
#
#   finerThan: list of reductions this one is (directly) finer than,
#              i.e. a reduction here yields a reduction there.
#   domain:    all       -> compares arbitrary statements
#              problems  -> only compares problems (instance/solution reading)
#   omegaModels: true    -> every first-order (true arithmetical) statement holds
#   conjunction: true    -> "P + Q" behaves as a conjunction
#   conservation: true   -> conservation results are used to derive separations here
#   phrase:    how "A ⇒ B" reads in prose ({a}, {b} are placeholders)

- id: rca0star
  name: Provability over RCA₀*
  short: RCA₀*
  tex: '\mathsf{RCA}_0^*'
  domain: all
  conjunction: true
  finerThan: [rca0]
  phrase: 'RCA₀* ⊢ {a} → {b}'
  description: >
    Implication provable over RCA₀*, i.e. RCA₀ with Σ⁰₁-induction replaced by Δ⁰₀-induction and the totality of exponentiation (Simpson–Smith 1986).

- id: rca0
  name: Provability over RCA₀
  short: RCA₀
  tex: '\mathsf{RCA}_0'
  domain: all
  conjunction: true
  finerThan: [omega]
  conservation: true
  phrase: 'RCA₀ ⊢ {a} → {b}'
  description: Implication provable over the base system RCA₀.

- id: omega
  name: ω-model implication
  short: ω
  tex: '\le_\omega'
  domain: all
  conjunction: true
  omegaModels: true
  finerThan: []
  phrase: 'every ω-model of {a} is a model of {b}'
  description: >
    Every ω-model (equivalently every Turing ideal) satisfying the first statement satisfies the second.
  warning: >
    Statements are read inside the model: a problem holds in an ω-model M when M satisfies the sentence "every
    instance has a solution", with "instance" and "solution" as M judges them. For most problems this is the same as
    "every true instance in M has a solution in M", the reading of Weihrauch and computable reductions. It is not the
    same when instances or solutions are defined by a non-arithmetical condition (well-orders, trees with a path,
    uncountable closed sets: statements marked "not ω-absolute"), since an ω-model such as HYP can misjudge them. For
    those statements no ω-model result is derived from a Weihrauch or computable reduction, nor any such separation
    from an ω-model result, and properties such as cone avoidance do not apply.
  refs:
    - ref: hirschfeldtjockusch2016

- id: sw
  name: Strong Weihrauch reduction
  algebra: strong   # laws of the Weihrauch algebra that hold strongly (jump, parallelizations)
  short: sW
  tex: '\le_{\mathrm{sW}}'
  domain: problems
  finerThan: [w, sc]
  phrase: '{b} ≤_sW {a}'
  description: >
    There are Turing functionals Φ, Ψ such that for every instance X of the second problem, Φ(X) is an instance of the first, and for every solution Y of Φ(X), Ψ(Y) is a solution of X (Ψ has no access to X).
  refs:
    - ref: hirschfeldtjockusch2016

- id: w
  name: Weihrauch reduction
  algebra: weak     # all laws of the Weihrauch algebra (also products, compositional products)
  short: W
  tex: '\le_{\mathrm{W}}'
  domain: problems
  finerThan: [c, gw]
  phrase: '{b} ≤_W {a}'
  description: >
    Uniform reduction: Φ maps instances to instances, Ψ maps (original instance, solution) to solutions.
  refs:
    - ref: hirschfeldtjockusch2016

- id: sc
  name: Strong computable reduction
  short: sc
  tex: '\le_{\mathrm{sc}}'
  domain: problems
  finerThan: [c, soc]
  phrase: '{b} ≤_sc {a}'
  description: >
    Every instance X of the second problem computes an instance X̂ of the first such that every solution of X̂ computes a solution of X.
  refs:
    - ref: hirschfeldtjockusch2016

- id: soc
  name: Strong omniscient computable reduction
  short: soc
  tex: '\le_{\mathrm{soc}}'
  domain: problems
  finerThan: []
  phrase: '{b} ≤_soc {a}'
  description: >
    For every instance X of the second problem there is an instance X̂ of the first, computable from X or not,
    such that every solution of X̂ computes a solution of X. A separation at soc is a combinatorial one: no
    instance, however complex, encodes enough information.
  refs:
    - ref: moninpatey2019
      loc: Section 1.1

- id: c
  name: Computable reduction
  short: c
  tex: '\le_{\mathrm{c}}'
  domain: problems
  finerThan: [omega]
  phrase: '{b} ≤_c {a}'
  description: >
    Every instance X of the second problem computes an instance X̂ of the first such that for every solution Ŷ of X̂, X ⊕ Ŷ computes a solution of X.
  warning: >
    Instances and solutions are the true ones. A computable reduction gives an ω-model implication only for problems
    that ω-models judge correctly; for statements marked "not ω-absolute" (see ω-model implication) it gives none.
  refs:
    - ref: hirschfeldtjockusch2016

- id: gw
  name: Generalized Weihrauch reduction
  short: gW
  tex: '\le_{\mathrm{gW}}'
  domain: problems
  finerThan: [omega]
  phrase: '{b} ≤_gW {a}'
  description: >
    Uniform reduction allowing finitely many adaptive uses of the first problem (Hirschfeldt–Jockusch 2016).
  warning: >
    Instances and solutions are the true ones. A generalized Weihrauch reduction gives an ω-model implication only for
    problems that ω-models judge correctly; for statements marked "not ω-absolute" (see ω-model implication) it gives none.
  refs:
    - ref: hirschfeldtjockusch2016
