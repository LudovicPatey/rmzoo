# Properties used to separate statements.
#
#   closedUnder: reduction under which the property is preserved.
#   direction:   down -> if A has it and A ⇒ B (over closedUnder), B has it.
#                up   -> if B has it and A ⇒ B, A has it.
#   baseImplication: r -> a problem has the property exactly when the bottom of
#                reduction r (e.g. RCA₀ for omega) implies it over r; the engine
#                derives the property from that comparison and conversely.
#   bottomOf: r -> a problem with the property is below every problem over r
#                (computably true: c; first-order: sc), assuming every problem has an
#                instance computable from any set (true of the zoo's problems).
#   domain: problems -> defined through instances and solutions: it only applies
#                to statements that can be formulated as problems (problems, and
#                sentences that are not first-order and not marked problemForm: false).
#   implies:     properties that every statement having this one also has (and a
#                statement failing one of them fails this one).
#   optional:    one of an infinite family (low_n, weakly low_n): a statement page
#                lists it only where its value is known. Add the next member of a
#                family only when a result is about it.
#   group:       computability | proof | weihrauch (the viewer lists the groups
#                separately; data/modes.yaml chooses which groups a mode shows).
#   direction: equiv -> a Weihrauch property: invariant under equivalence over
#                closedUnder (≡W, or ≡sW for strong properties), with no
#                separation derived from it.
#   selfOp:      the property says that the statement is above an operation applied to
#                itself (idempotent: product, P × P ≤W P); the engine reads it from that
#                implication or separation, and a cited value gives it.
#   opHas:       operations whose results always have it (P̂ is parallelizable).
#   opKeeps:     operations whose results have it when their arguments do.
#   lift: {from, to}: a statement with the property implies over `to` everything it
#                implies over `from` (a cylinder: W-reductions to it are sW-reductions).
#   A separation is derived automatically: if A has a "down" property and B
#   fails it, then A does not imply B over closedUnder (and finer reductions).

- id: cone-avoidance
  name: Cone avoidance
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  description: >
    For every set Z and every C ≰_T Z, every Z-computable instance has a solution Y such that C ≰_T Z ⊕ Y.

- id: pa-avoidance
  name: PA avoidance
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  description: >
    For every set Z which is not of PA degree, every Z-computable instance has a solution Y such that Z ⊕ Y is not of PA degree.

- id: low-basis
  name: Low basis
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  implies: [ weakly-low-basis, delta2-basis ]
  description: >
    For every Z, every Z-computable instance has a solution Y such that (Z ⊕ Y)' ≤_T Z'.

# The lowness hierarchy (Le Houérou, Levy Patey and Mimouni 2024, after Definition 1.5):
# low basis → weakly low basis → low₂ basis → weakly low₂ basis → … Members are
# added as results about them appear (ACA₀ fails all of them, see core.yaml).
- id: weakly-low-basis
  name: Weakly low basis
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  optional: true
  implies: [ low2-basis ]
  description: >
    For every Z, every set P of PA degree over Z′ and every Z-computable instance, there is a solution Y
    such that (Y ⊕ Z)′ ≤_T P (Liu–Patey 2026 and Patey–Shafer 2026, Definition 3.2). It implies the low₂
    basis by the low basis theorem relative to Z′.

- id: low2-basis
  name: Low₂ basis
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  optional: true
  implies: [ weakly-low2-basis, delta3-basis ]
  description: >
    For every Z, every Z-computable instance has a solution Y such that (Y ⊕ Z)″ ≤_T Z″.

- id: weakly-low2-basis
  name: Weakly low₂ basis
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  optional: true
  description: >
    For every Z, every set P of PA degree over Z″ and every Z-computable instance, there is a solution Y
    such that (Y ⊕ Z)″ ≤_T P. It implies the low₃ basis.

# Arithmetical bases: every computable instance has a Δ⁰ₙ (Σ⁰ₙ, Π⁰ₙ) solution.
# They are not preservation notions: they cannot be iterated to build ω-models.
# A Δ⁰ₙ basis passes along computable reductions (a solution computable from a
# Δ⁰ₙ set is Δ⁰ₙ), but Σ⁰ₙ and Π⁰ₙ bases pass along no reduction (a set computable
# from a Σ⁰ₙ set need not be Σ⁰ₙ): they have no closedUnder and are only related
# to the other properties. Δ⁰ₙ ⊆ Σ⁰ₙ ∩ Π⁰ₙ and Σ⁰ₙ ∪ Π⁰ₙ ⊆ Δ⁰ₙ₊₁; a lowₙ set is
# Δ⁰ₙ₊₁. Members are added as results about them appear.
- id: delta2-basis
  name: Δ⁰₂ basis
  group: computability
  closedUnder: c
  direction: down
  domain: problems
  optional: true
  implies: [ sigma2-basis, pi2-basis ]
  description: >
    Every computable instance has a Δ⁰₂ solution.

- id: sigma2-basis
  name: Σ⁰₂ basis
  group: computability
  domain: problems
  optional: true
  implies: [ delta3-basis, sigma3-basis ]
  description: >
    Every computable instance has a Σ⁰₂ solution.

- id: pi2-basis
  name: Π⁰₂ basis
  group: computability
  domain: problems
  optional: true
  implies: [ delta3-basis, pi3-basis ]
  description: >
    Every computable instance has a Π⁰₂ solution.

- id: delta3-basis
  name: Δ⁰₃ basis
  group: computability
  closedUnder: c
  direction: down
  domain: problems
  optional: true
  implies: [ sigma3-basis, pi3-basis ]
  description: >
    Every computable instance has a Δ⁰₃ solution.

- id: sigma3-basis
  name: Σ⁰₃ basis
  group: computability
  domain: problems
  optional: true
  implies: [ sigma4-basis ]
  description: >
    Every computable instance has a Σ⁰₃ solution.

- id: pi3-basis
  name: Π⁰₃ basis
  group: computability
  domain: problems
  optional: true
  description: >
    Every computable instance has a Π⁰₃ solution.

- id: sigma4-basis
  name: Σ⁰₄ basis
  group: computability
  domain: problems
  optional: true
  description: >
    Every computable instance has a Σ⁰₄ solution.

- id: computably-true
  name: Computably true
  group: computability
  closedUnder: c
  direction: down
  baseImplication: omega
  # P ≤c Q for every problem Q: an instance X of P computes an instance of Q (every
  # problem of the zoo has computable instances), and X itself computes a solution of X
  bottomOf: c
  domain: problems
  # a solution computable in Z leaves Z ⊕ Y ≡_T Z, so every property defined by
  # "every Z-computable instance has a solution Y such that Z ⊕ Y …" holds
  implies: [ cone-avoidance, pa-avoidance, low-basis, hyperimmunity-preservation, delta02-preservation, arith-preservation, cb-immunity-preservation, dep-hyperimmunity-preservation, hyperimmunity2-preservation ]
  description: >
    Every instance X has a solution computable in X. Equivalently, the problem holds
    in every ω-model (Turing ideal), i.e. RCA₀ implies it over ω-models: so NON, DNR,
    WKL… fail it, and the engine reads it off the ω-model comparison with RCA₀.

# Π¹₁-conservation over RCA₀, RCA₀ + BΣ⁰₂ and RCA₀ + IΣ⁰₂ (T + the statement over T).
# Three independent properties: RCA₀ + P may be Π¹₁-conservative over RCA₀ while
# T + P is not over T (T = BΣ⁰₂ or IΣ⁰₂), and conversely, so none implies another.
# Values are read from the conservation results.
- id: pi11-conservative
  name: Π¹₁-conservative over RCA₀
  group: proof
  closedUnder: rca0
  direction: down
  fromConservation: {base: rca0, class: Pi11}
  description: >
    RCA₀ + the statement proves no Π¹₁ sentence which is not already provable in RCA₀.

- id: pi11-conservative-bsig2
  name: Π¹₁-conservative over RCA₀ + BΣ⁰₂
  group: proof
  closedUnder: rca0
  direction: down
  fromConservation: {base: bsig2, class: Pi11}
  description: >
    RCA₀ + BΣ⁰₂ + the statement proves no Π¹₁ sentence which is not already provable in RCA₀ + BΣ⁰₂.
    Principles weaker than RT²₂ (COH, ADS, CAC, EM…) have it; whether RT²₂ does was a long-standing question.

- id: pi11-conservative-isig2
  name: Π¹₁-conservative over RCA₀ + IΣ⁰₂
  group: proof
  closedUnder: rca0
  direction: down
  fromConservation: {base: isig2, class: Pi11}
  description: >
    RCA₀ + IΣ⁰₂ + the statement proves no Π¹₁ sentence which is not already provable in RCA₀ + IΣ⁰₂
    (Cholak, Jockusch and Slaman for RT²₂).

# Preservation of hyperimmunities (Patey's thesis, Definitions 6.2.1 and 6.2.2):
# countably many → k for every k → 3 → 2 → one, like the levels of a hierarchy; a
# statement page shows only the strongest level it has and the weakest it fails.
- id: hyperimmunity-preservation
  name: Preservation of hyperimmunity (countably many sets)
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  implies: [ hyperimmunities-k-preservation ]
  description: >
    For every set Z and every countable collection A₀, A₁, … of Z-hyperimmune sets, every Z-computable
    instance has a solution Y such that every Aᵢ is (Z ⊕ Y)-hyperimmune (Patey, "Iterative forcing and
    hyperimmunity in reverse mathematics", Definition 4.2; Patey's thesis, Definition 6.2.1). Preserving
    finitely many hyperimmune sets is weaker: RT²₂ preserves one but not two.

- id: hyperimmunities-k-preservation
  name: Preservation of k hyperimmunities for every k
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  optional: true
  implies: [ hyperimmunities-3-preservation ]
  description: >
    For every k ∈ ω, every set Z and Z-hyperimmune sets A₀, …, A_{k−1}, every Z-computable instance has a
    solution Y such that every Aᵢ is (Z ⊕ Y)-hyperimmune (Patey's thesis, Definition 6.2.2, for every k).
    The free set and thin set theorems have it.

- id: hyperimmunities-3-preservation
  name: Preservation of 3 hyperimmunities
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  optional: true
  implies: [ hyperimmunities-2-preservation ]
  description: >
    For every set Z and Z-hyperimmune sets A₀, A₁, A₂, every Z-computable instance has a solution Y such
    that A₀, A₁, A₂ are (Z ⊕ Y)-hyperimmune (Patey's thesis, Definition 6.2.2, k = 3). TS²₄ has it and STS²₃
    fails it.

- id: hyperimmunities-2-preservation
  name: Preservation of 2 hyperimmunities
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  optional: true
  implies: [ hyperimmunities-1-preservation ]
  description: >
    For every set Z and Z-hyperimmune sets A₀, A₁, every Z-computable instance has a solution Y such that
    A₀ and A₁ are (Z ⊕ Y)-hyperimmune (Patey's thesis, Definition 6.2.2, k = 2). TS²₃ has it; SRT²₂, SADS
    and ADS fail it. Not to be confused with the preservation of 2-hyperimmunity of Liu and Patey.

- id: hyperimmunities-1-preservation
  name: Preservation of one hyperimmunity
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  optional: true
  description: >
    For every set Z and Z-hyperimmune set A, every Z-computable instance has a solution Y such that A is
    (Z ⊕ Y)-hyperimmune (Patey's thesis, Definition 6.2.2, k = 1). RT²₂ has it.

- id: delta02-preservation
  name: Preservation of Δ⁰₂ definitions
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  description: >
    For every Z and every properly Δ⁰₂(Z) set A (Δ⁰₂(Z) but not Σ⁰₁(Z)), every Z-computable instance has a solution Y such
    that A is not Σ⁰₁(Z ⊕ Y) (Wang 2016, Definition 2.1 and Proposition 2.2(3)). Not to be confused with keeping a
    non-Δ⁰₂ set non-Δ⁰₂, the property of Cholak, Jockusch and Slaman for Δ⁰₂ instances of the pigeonhole principle.

- id: arith-preservation
  name: Preservation of the arithmetic hierarchy
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  implies: [ delta02-preservation ]
  description: >
    For every Z, every n and every set A which is not Σ⁰ₙ(Z), every Z-computable instance has a solution Y such that A is
    still not Σ⁰ₙ(Z ⊕ Y) (equivalently for Π⁰ₙ; this gives the preservation of properly Δ⁰ₙ₊₁ sets too: Wang 2016,
    Definition 2.1 and Proposition 2.2).

- id: cb-immunity-preservation
  name: Preservation of c.b.-immunity
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  description: >
    For every Z and every set A which is computably bounded immune relative to Z, every Z-computable instance has a solution Y such that A is c.b.-immune relative to Z ⊕ Y (Patey, "Partial orders and immunity").

- id: dep-hyperimmunity-preservation
  name: Preservation of dependent hyperimmunity
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  description: >
    Preservation of dependent hyperimmunity, in the sense of Patey, "Partial orders and immunity in reverse mathematics".

- id: hyperimmunity2-preservation
  name: Preservation of 2-hyperimmunity (Liu–Patey)
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  description: >
    Preservation of 2-hyperimmunity in the sense of Liu and Patey, "The reverse
    mathematics of the thin set and Erdős–Moser theorems": for every set C and
    every C-2-hyperimmune pair, every C-computable instance has a solution G
    relative to which the pair is still 2-hyperimmune.

# ---- Weihrauch properties ---------------------------------------------------------
# Properties of Weihrauch degrees (Brattka, Gherardi and Pauly, "Weihrauch complexity
# in computable analysis", Sections 3, 4 and 6). They are invariant under equivalence
# and not preserved downwards, so they separate nothing by themselves.
- id: first-order
  name: First-order problem
  # computability, not weihrauch: it implies computable truth and serves the ≤sc rule
  group: computability
  domain: problems
  optional: true
  # P ≤sc Q for every problem Q: an instance X of P computes an instance of Q, and every
  # set computes a natural number, hence the solution of X it needs. No reduction keeps
  # the property (it is about the problem, not its degree).
  bottomOf: sc
  implies: [ computably-true ]
  # P ≤c F with F first-order: an instance X of P computes an instance of F, whose
  # solution, a number, gives with X a solution of P. So P is computably true on its
  # true instances, even when F is not ω-absolute (Σ¹₁-C_ℕ), which `implies` does not
  # cover: a problem that is not computably true is not ≤c (hence not ≤W) F
  below: { property: computably-true, over: c }
  # the first-order part ¹P is first-order by its definition (Definition 2.1 of Dzhafarov,
  # Solomon and Yokoyama)
  opHas: [ fop ]
  description: >
    Every solution of every instance is a natural number (Definition 1.3 of Dzhafarov, Solomon and
    Yokoyama): LPO, C_ℕ, lim_ℕ, every first-order part ¹P… In particular it is computably true and
    strongly computably reducible to every problem. A first-order problem Weihrauch reducible to P is
    strongly Weihrauch reducible to ¹P (Theorem 2.2).

- id: cylinder
  name: Cylinder
  group: weihrauch
  closedUnder: sw
  direction: equiv
  domain: problems
  opHas: [ compose, det ]
  opKeeps: [ jump ]
  lift: { from: w, to: sw }
  description: >
    id × P ≤sW P (Definition 3.4 of Brattka, Gherardi and Pauly). Equivalently, every problem Weihrauch
    reducible to P is strongly Weihrauch reducible to it (Proposition 3.5); compositional products are
    cylinders (Proposition 5.4), and so are jumps of cylinders (Proposition 6.14) and deterministic
    parts (Goh, Pauly and Valenti 2021, after Definition 3.1).

- id: strongly-parallelizable
  name: Strongly parallelizable
  group: weihrauch
  closedUnder: sw
  direction: equiv
  domain: problems
  selfOp: par
  opHas: [ par ]
  # P̂ ≤sW Q̂ ≡sW Q when P ≤sW Q
  closure: [ par ]
  implies: [ parallelizable ]
  # a parallelizable cylinder: P̂ ≤W P, hence P̂ ≤sW P (Proposition 3.5)
  jointly: [ [ parallelizable, cylinder ] ]
  description: >
    P̂ ≡sW P (Definition 4.2 of Brattka, Gherardi and Pauly). A parallelizable cylinder is strongly
    parallelizable: P̂ ≤W P gives P̂ ≤sW P (Proposition 3.5).

- id: parallelizable
  name: Parallelizable
  group: weihrauch
  closedUnder: w
  direction: equiv
  domain: problems
  selfOp: par
  opHas: [ par ]
  # P̂ ≤W Q̂ ≡W Q when P ≤W Q (and P × R ≤W Q through idempotence, which it implies)
  closure: [ par ]
  implies: [ idempotent ]
  description: >
    P̂ ≡W P (Definition 4.2 of Brattka, Gherardi and Pauly). A parallelizable problem is idempotent
    (Proposition 4.4).

- id: compose-closed
  name: Closed under compositional product
  group: weihrauch
  closedUnder: w
  direction: equiv
  domain: problems
  selfOp: compose
  opHas: [ diamond ]
  # P⋄ ≤W Q when P ≤W Q: id ≤W Q (every problem of the zoo has a computable instance)
  # and Q ⋆ Q ≤W Q iterated; P ⋆ R ≤W Q ⋆ Q ≤W Q when P, R ≤W Q
  closure: [ diamond, compose ]
  implies: [ idempotent ]
  description: >
    P ⋆ P ≤W P. Then P × P ≤W P ⋆ P ≤W P, so P is idempotent; P⋄ is the least problem above P closed
    under compositional product.

- id: idempotent
  name: Idempotent
  group: weihrauch
  closedUnder: w
  direction: equiv
  domain: problems
  selfOp: product
  opHas: [ fin ]
  # P* ≤W Q when P ≤W Q: id ≤W Q, and Q × Q ≤W Q iterated uniformly gives Pⁿ ≤W Q;
  # P × R ≤W Q × Q ≤W Q when P, R ≤W Q
  closure: [ fin, product ]
  description: >
    P × P ≡W P (Definition 4.2 of Brattka, Gherardi and Pauly).

- id: finitely-tolerant
  name: Finitely tolerant
  group: weihrauch
  closedUnder: w
  direction: equiv
  domain: problems
  opHas: [ jump ]
  description: >
    Weihrauch equivalent to some P :⊆ ℕ^ℕ ⇒ ℕ^ℕ with a computable T such that for inputs p, q that agree
    from position k on, every solution r of q gives a solution T⟨r, k⟩ of p (Definition 4.5 of Brattka,
    Gherardi and Pauly, after Dorais, Dzhafarov, Hirst, Mileti and Shafer). Every jump is finitely
    tolerant (Proposition 6.13).

- id: fractal
  name: Fractal
  group: weihrauch
  closedUnder: w
  direction: equiv
  domain: problems
  opHas: [ jump ]
  implies: [ countably-irreducible ]
  description: >
    Weihrauch equivalent to some F :⊆ ℕ^ℕ ⇒ ℕ^ℕ with F restricted to A ≡W F for every clopen A meeting the
    domain of F (Definition 4.10 of Brattka, Gherardi and Pauly). Fractals are countably irreducible
    (Proposition 4.11); every jump is a strong fractal (Proposition 6.13).

- id: countably-irreducible
  name: Countably irreducible
  group: weihrauch
  closedUnder: w
  direction: equiv
  domain: problems
  implies: [ join-irreducible ]
  description: >
    P ≤W ⊔ᵢ Qᵢ implies P ≤W Qᵢ for some i, for every sequence of problems (Definition 4.9 of Brattka,
    Gherardi and Pauly). It implies join-irreducibility.

- id: join-irreducible
  name: Join-irreducible
  group: weihrauch
  closedUnder: w
  direction: equiv
  domain: problems
  description: >
    P ≤W Q ⊔ R implies P ≤W Q or P ≤W R (Brattka, Gherardi and Pauly, Section 4).

# Choice elimination (Brattka, Gherardi and Pauly, Theorems 7.15 and 7.25): the engine
# drops C_ℕ applied first, or C_{2^ℕ} applied last, from a compositional product above
# a problem with the property (`eliminates`).
- id: total-fractal
  name: Total fractal
  group: weihrauch
  closedUnder: w
  direction: equiv
  domain: problems
  implies: [ fractal ]
  eliminates: { side: right, factor: cn }
  description: >
    A fractal witnessed by a total F :⊆ ℕ^ℕ ⇒ ℕ^ℕ (Definition 4.10 of Brattka, Gherardi and Pauly):
    some total F ≡W P with F restricted to A ≡W F for every nonempty clopen A. C_ℕ applied first
    adds nothing below a total fractal: P ≤W Q ⋆ C_ℕ implies P ≤W Q (Theorem 7.15). C_{2^ℕ},
    PC_{2^ℕ}, CC_{[0,1]} and XC_{[0,1]^{n+1}} are total fractals (Proposition 7.5).

- id: single-valued
  name: Single-valued
  group: weihrauch
  closedUnder: w
  direction: equiv
  domain: problems
  opKeeps: [ product, par ]
  opHas: [ det ]
  eliminates: { side: left, factor: wkl }
  description: >
    Weihrauch equivalent to a single-valued function f :⊆ X → ℕ^ℕ (or into a space computably embedded
    in ℕ^ℕ: ℕ, 2^ℕ, {0, 1}): lim, LPO, UC_ℕ^ℕ; C_ℕ ≡W lim_ℕ. The codomain matters: there are
    single-valued functions into ℝ equivalent to no function into ℕ^ℕ (Goh, Pauly and Valenti 2021,
    Section 3.1), and the deterministic part Det(P) is the strongest single-valued function into ℕ^ℕ
    below P (Theorem 3.2), so a problem with the property and Weihrauch reducible to P is reducible to
    Det(P). C_{2^ℕ} ≡sW WKL applied last adds nothing below it: P ≤W C_{2^ℕ} ⋆ Q implies P ≤W Q
    (Brattka, Gherardi and Pauly, Theorem 7.25, for single-valued maps into computable metric spaces).
    Products and parallelizations of single-valued maps into ℕ^ℕ are single-valued maps into (ℕ^ℕ)² and
    (ℕ^ℕ)^ℕ, homeomorphic to ℕ^ℕ (and both operations are monotone for ≤W). Jumps are not covered by
    the law: they are not monotone for ≤W, so only problems that are themselves single-valued pass the
    property to their jumps (Definition 6.9: the same map on a weaker input).

- id: finite-codomain
  name: Reducible to a problem with finite codomain
  group: weihrauch
  closedUnder: cw
  direction: down
  domain: problems
  opKeeps: [ product, compose ]
  description: >
    P ≤cW f (Weihrauch reducible relative to some oracle) for some problem f with a finite codomain (LLPO,
    LPO, C_k, lim₂ and their jumps). C_ℕ fails it: C_ℕ ≰W^p f for every oracle p and every f with finite
    codomain (Soldà and Valenti 2022, Theorem 2.1). Kept by products (F × G has a finite codomain) and by
    compositional products: if f₀ ≤W F and g₀ ≤W G (via Φ, Ψ for g₀), then f₀ ∘ g₀ ≤W h with h(x) =
    {(i, j) : i ∈ G(Φx), j ∈ F(Φ′(Ψ(x, i)))}, of finite codomain (our argument; it relativizes).

- id: computable-fop
  name: Computable first-order part
  group: weihrauch
  closedUnder: w
  direction: down
  domain: problems
  # Det(P) ≤W the parallelization of ¹P (Goh, Pauly and Valenti 2021, Corollary 3.7)
  implies: [ computable-det ]
  description: >
    Every problem with codomain ℕ Weihrauch reducible to it is computable (its first-order part, in the
    sense of Dzhafarov, Solomon and Yokoyama, is computable). Densely realized problems have it (Brattka
    and Pauly 2018, Proposition 6.3; Brattka, Gherardi and Pauly, Proposition 4.13): NON, NHA, MLR, COH
    (Soldà and Valenti 2022, Section 2). LLPO, a non-computable problem with codomain {0, 1}, fails it,
    and so does every problem above LLPO. It implies a computable deterministic part: Det(P) is
    Weihrauch reducible to the parallelization of ¹P (Goh, Pauly and Valenti 2021, Corollary 3.7).

- id: computable-det
  name: Computable deterministic part
  group: weihrauch
  closedUnder: w
  direction: down
  domain: problems
  description: >
    Every single-valued function with codomain ℕ^ℕ Weihrauch reducible to it is computable: its
    deterministic part Det(P) (Goh, Pauly and Valenti 2021, Definition 3.1) is computable. WKL has it
    (Brattka, de Brecht and Pauly 2012, Corollary 5.2: every single-valued function into ℕ^ℕ below WKL
    is computable), and so does every problem below WKL; so does every problem with a computable
    first-order part (Corollary 3.7 of Goh, Pauly and Valenti: Det(P) ≤W the parallelization of ¹P).
    LPO, a non-computable function into {0, 1}, fails it, and so does every problem above LPO.

- id: weihrauch-computable
  name: Computable (uniformly)
  group: weihrauch
  closedUnder: w
  direction: down
  # P ≤W Q for every pointed problem Q: the forward functional returns a fixed computable
  # instance of Q, the backward functional ignores its solution and computes a solution of P
  # from the input (the engine skips the problems recorded as not pointed)
  bottomOf: w
  domain: problems
  # computably true follows through the implications: such a problem is ≤W BCT₀, which has it
  implies: [ computable-fop, computable-det ]
  description: >
    A single computable functional maps every instance to a solution: the problem is computable in
    the Weihrauch sense. This is stronger than being computably true, where the solution computable
    from an instance need not be found uniformly. Such a problem is Weihrauch reducible to every
    pointed problem (one with a computable instance); a pointed one is Weihrauch equivalent to the
    identity id. BCT₀ and VCT₀ have this property, and so does id_MLR, which is not pointed.

- id: pointed
  name: Pointed (has a computable instance)
  group: weihrauch
  # P ≤c Q with P pointed: a computable instance of P computes an instance of Q. So the
  # property goes up, and its failure down
  closedUnder: c
  direction: up
  domain: problems
  optional: true
  # every problem of the zoo is pointed unless recorded otherwise: the bottom rules
  # (bottomOf) and the laws P ≤W P × Q, P ≤W P ⋆ Q assume it, and the engine skips the
  # problems with `pointed` false (and operations on them)
  description: >
    The problem has a computable instance. The pointed problems are exactly those above the identity id
    in the Weihrauch degrees, and nearly every problem studied is pointed. Problems whose instances are
    ML-random sequences are not (no computable sequence is ML-random): LAY, RD and the identity on MLR
    of Hölzl and Shafer. For them, the usual laws fail: a computable problem is not Weihrauch reducible
    to them, and C_ℕ is not Weihrauch reducible to C_ℕ × id_MLR ≡W LAY.
