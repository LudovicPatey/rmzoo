# Properties used to separate statements.
#
#   closedUnder: reduction under which the property is preserved.
#   direction:   down -> if A has it and A ⇒ B (over closedUnder), B has it.
#                up   -> if B has it and A ⇒ B, A has it.
#   baseImplication: r -> a problem has the property exactly when the bottom of
#                reduction r (e.g. RCA₀ for omega) implies it over r; the engine
#                derives the property from that comparison and conversely.
#   domain: problems -> defined through instances and solutions: it only applies
#                to statements that can be formulated as problems (problems, and
#                sentences that are not first-order and not marked problemForm: false).
#   implies:     properties that every statement having this one also has (and a
#                statement failing one of them fails this one).
#   optional:    one of an infinite family (low_n, weakly low_n): a statement page
#                lists it only where its value is known. Add the next member of a
#                family only when a result is about it.
#   group:       computability | proof | weihrauch (the viewer lists the groups
#                separately; data/modes.yaml chooses which groups a mode shows).
#   direction: equiv -> a Weihrauch property: invariant under equivalence over
#                closedUnder (≡W, or ≡sW for strong properties), with no
#                separation derived from it.
#   selfOp:      the property says that the statement is above an operation applied to
#                itself (idempotent: product, P × P ≤W P); the engine reads it from that
#                implication or separation, and a cited value gives it.
#   opHas:       operations whose results always have it (P̂ is parallelizable).
#   opKeeps:     operations whose results have it when their arguments do.
#   lift: {from, to}: a statement with the property implies over `to` everything it
#                implies over `from` (a cylinder: W-reductions to it are sW-reductions).
#   A separation is derived automatically: if A has a "down" property and B
#   fails it, then A does not imply B over closedUnder (and finer reductions).

- id: cone-avoidance
  name: Cone avoidance
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  description: >
    For every set Z and every C ≰_T Z, every Z-computable instance has a solution Y such that C ≰_T Z ⊕ Y.

- id: pa-avoidance
  name: PA avoidance
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  description: >
    For every set Z which is not of PA degree, every Z-computable instance has a solution Y such that Z ⊕ Y is not of PA degree.

- id: low-basis
  name: Low basis
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  implies: [ weakly-low-basis, delta2-basis ]
  description: >
    For every Z, every Z-computable instance has a solution Y such that (Z ⊕ Y)' ≤_T Z'.

# The lowness hierarchy (Le Houérou, Levy Patey and Mimouni 2024, after Definition 1.5):
# low basis → weakly low basis → low₂ basis → weakly low₂ basis → … Members are
# added as results about them appear (ACA₀ fails all of them, see core.yaml).
- id: weakly-low-basis
  name: Weakly low basis
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  optional: true
  implies: [ low2-basis ]
  description: >
    For every Z, every set P of PA degree over Z′ and every Z-computable instance, there is a solution Y
    such that (Y ⊕ Z)′ ≤_T P (Liu–Patey 2026 and Patey–Shafer 2026, Definition 3.2). It implies the low₂
    basis by the low basis theorem relative to Z′.

- id: low2-basis
  name: Low₂ basis
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  optional: true
  implies: [ weakly-low2-basis, delta3-basis ]
  description: >
    For every Z, every Z-computable instance has a solution Y such that (Y ⊕ Z)″ ≤_T Z″.

- id: weakly-low2-basis
  name: Weakly low₂ basis
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  optional: true
  description: >
    For every Z, every set P of PA degree over Z″ and every Z-computable instance, there is a solution Y
    such that (Y ⊕ Z)″ ≤_T P. It implies the low₃ basis.

# Arithmetical bases: every computable instance has a Δ⁰ₙ (Σ⁰ₙ, Π⁰ₙ) solution.
# They are not preservation notions: they cannot be iterated to build ω-models.
# A Δ⁰ₙ basis passes along computable reductions (a solution computable from a
# Δ⁰ₙ set is Δ⁰ₙ), but Σ⁰ₙ and Π⁰ₙ bases pass along no reduction (a set computable
# from a Σ⁰ₙ set need not be Σ⁰ₙ): they have no closedUnder and are only related
# to the other properties. Δ⁰ₙ ⊆ Σ⁰ₙ ∩ Π⁰ₙ and Σ⁰ₙ ∪ Π⁰ₙ ⊆ Δ⁰ₙ₊₁; a lowₙ set is
# Δ⁰ₙ₊₁. Members are added as results about them appear.
- id: delta2-basis
  name: Δ⁰₂ basis
  group: computability
  closedUnder: c
  direction: down
  domain: problems
  optional: true
  implies: [ sigma2-basis, pi2-basis ]
  description: >
    Every computable instance has a Δ⁰₂ solution.

- id: sigma2-basis
  name: Σ⁰₂ basis
  group: computability
  domain: problems
  optional: true
  implies: [ delta3-basis, sigma3-basis ]
  description: >
    Every computable instance has a Σ⁰₂ solution.

- id: pi2-basis
  name: Π⁰₂ basis
  group: computability
  domain: problems
  optional: true
  implies: [ delta3-basis, pi3-basis ]
  description: >
    Every computable instance has a Π⁰₂ solution.

- id: delta3-basis
  name: Δ⁰₃ basis
  group: computability
  closedUnder: c
  direction: down
  domain: problems
  optional: true
  implies: [ sigma3-basis, pi3-basis ]
  description: >
    Every computable instance has a Δ⁰₃ solution.

- id: sigma3-basis
  name: Σ⁰₃ basis
  group: computability
  domain: problems
  optional: true
  implies: [ sigma4-basis ]
  description: >
    Every computable instance has a Σ⁰₃ solution.

- id: pi3-basis
  name: Π⁰₃ basis
  group: computability
  domain: problems
  optional: true
  description: >
    Every computable instance has a Π⁰₃ solution.

- id: sigma4-basis
  name: Σ⁰₄ basis
  group: computability
  domain: problems
  optional: true
  description: >
    Every computable instance has a Σ⁰₄ solution.

- id: computably-true
  name: Computably true
  group: computability
  closedUnder: c
  direction: down
  baseImplication: omega
  domain: problems
  # a solution computable in Z leaves Z ⊕ Y ≡_T Z, so every property defined by
  # "every Z-computable instance has a solution Y such that Z ⊕ Y …" holds
  implies: [ cone-avoidance, pa-avoidance, low-basis, hyperimmunity-preservation, delta02-preservation, arith-preservation, cb-immunity-preservation, dep-hyperimmunity-preservation, hyperimmunity2-preservation ]
  description: >
    Every instance X has a solution computable in X. Equivalently, the problem holds
    in every ω-model (Turing ideal), i.e. RCA₀ implies it over ω-models: so NON, DNR,
    WKL… fail it, and the engine reads it off the ω-model comparison with RCA₀.

- id: pi11-conservative
  name: Π¹₁-conservative over RCA₀
  group: proof
  closedUnder: rca0
  direction: down
  fromConservation: {base: rca0, class: Pi11}
  description: >
    RCA₀ + the statement proves no Π¹₁ sentence which is not already provable in RCA₀.

- id: hyperimmunity-preservation
  name: Preservation of hyperimmunity
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  description: >
    For every set Z and every countable collection A₀, A₁, … of Z-hyperimmune sets, every Z-computable
    instance has a solution Y such that every Aᵢ is (Z ⊕ Y)-hyperimmune (Patey, "Iterative forcing and
    hyperimmunity in reverse mathematics", Definition 4.2). Preserving a single hyperimmune set is weaker:
    RT²₂ does (Mimouni and Patey 2025, Section 6), but it does not preserve two (Patey, Theorem 6, through SADS).

- id: delta02-preservation
  name: Preservation of Δ⁰₂ definitions
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  description: >
    For every Z and every set A which is not Δ⁰₂(Z), every Z-computable instance has a solution Y such that A is not Δ⁰₂(Z ⊕ Y) (Wang).

- id: arith-preservation
  name: Preservation of the arithmetic hierarchy
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  description: >
    For every Z, every n, and every set A which is not Σ⁰ₙ(Z) (resp. Π⁰ₙ, Δ⁰ₙ), every Z-computable instance has a solution Y such that A is still not Σ⁰ₙ(Z ⊕ Y) (resp. Π⁰ₙ, Δ⁰ₙ).

- id: cb-immunity-preservation
  name: Preservation of c.b.-immunity
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  description: >
    For every Z and every set A which is computably bounded immune relative to Z, every Z-computable instance has a solution Y such that A is c.b.-immune relative to Z ⊕ Y (Patey, "Partial orders and immunity").

- id: dep-hyperimmunity-preservation
  name: Preservation of dependent hyperimmunity
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  description: >
    Preservation of dependent hyperimmunity, in the sense of Patey, "Partial orders and immunity in reverse mathematics".

- id: hyperimmunity2-preservation
  name: Preservation of 2-hyperimmunity
  group: computability
  closedUnder: omega
  direction: down
  domain: problems
  description: >
    Preservation of 2-hyperimmunity in the sense of Liu and Patey, "The reverse
    mathematics of the thin set and Erdős–Moser theorems": for every set C and
    every C-2-hyperimmune pair, every C-computable instance has a solution G
    relative to which the pair is still 2-hyperimmune.

# ---- Weihrauch properties ---------------------------------------------------------
# Properties of Weihrauch degrees (Brattka, Gherardi and Pauly, "Weihrauch complexity
# in computable analysis", Sections 3, 4 and 6). They are invariant under equivalence
# and not preserved downwards, so they separate nothing by themselves.
- id: cylinder
  name: Cylinder
  group: weihrauch
  closedUnder: sw
  direction: equiv
  domain: problems
  opHas: [ compose ]
  opKeeps: [ jump ]
  lift: { from: w, to: sw }
  description: >
    id × P ≤sW P (Definition 3.4 of Brattka, Gherardi and Pauly). Equivalently, every problem Weihrauch
    reducible to P is strongly Weihrauch reducible to it (Proposition 3.5); compositional products are
    cylinders (Proposition 5.4), and so are jumps of cylinders (Proposition 6.14).

- id: strongly-parallelizable
  name: Strongly parallelizable
  group: weihrauch
  closedUnder: sw
  direction: equiv
  domain: problems
  selfOp: par
  opHas: [ par ]
  implies: [ parallelizable ]
  description: >
    P̂ ≡sW P (Definition 4.2 of Brattka, Gherardi and Pauly).

- id: parallelizable
  name: Parallelizable
  group: weihrauch
  closedUnder: w
  direction: equiv
  domain: problems
  selfOp: par
  opHas: [ par ]
  implies: [ idempotent ]
  description: >
    P̂ ≡W P (Definition 4.2 of Brattka, Gherardi and Pauly). A parallelizable problem is idempotent
    (Proposition 4.4).

- id: compose-closed
  name: Closed under compositional product
  group: weihrauch
  closedUnder: w
  direction: equiv
  domain: problems
  selfOp: compose
  opHas: [ diamond ]
  implies: [ idempotent ]
  description: >
    P ⋆ P ≤W P. Then P × P ≤W P ⋆ P ≤W P, so P is idempotent; P⋄ is the least problem above P closed
    under compositional product.

- id: idempotent
  name: Idempotent
  group: weihrauch
  closedUnder: w
  direction: equiv
  domain: problems
  selfOp: product
  opHas: [ fin ]
  description: >
    P × P ≡W P (Definition 4.2 of Brattka, Gherardi and Pauly).

- id: finitely-tolerant
  name: Finitely tolerant
  group: weihrauch
  closedUnder: w
  direction: equiv
  domain: problems
  opHas: [ jump ]
  description: >
    Weihrauch equivalent to some P :⊆ ℕ^ℕ ⇒ ℕ^ℕ with a computable T such that for inputs p, q that agree
    from position k on, every solution r of q gives a solution T⟨r, k⟩ of p (Definition 4.5 of Brattka,
    Gherardi and Pauly, after Dorais, Dzhafarov, Hirst, Mileti and Shafer). Every jump is finitely
    tolerant (Proposition 6.13).

- id: fractal
  name: Fractal
  group: weihrauch
  closedUnder: w
  direction: equiv
  domain: problems
  opHas: [ jump ]
  implies: [ countably-irreducible ]
  description: >
    Weihrauch equivalent to some F :⊆ ℕ^ℕ ⇒ ℕ^ℕ with F restricted to A ≡W F for every clopen A meeting the
    domain of F (Definition 4.10 of Brattka, Gherardi and Pauly). Fractals are countably irreducible
    (Proposition 4.11); every jump is a strong fractal (Proposition 6.13).

- id: countably-irreducible
  name: Countably irreducible
  group: weihrauch
  closedUnder: w
  direction: equiv
  domain: problems
  implies: [ join-irreducible ]
  description: >
    P ≤W ⊔ᵢ Qᵢ implies P ≤W Qᵢ for some i, for every sequence of problems (Definition 4.9 of Brattka,
    Gherardi and Pauly). It implies join-irreducibility.

- id: join-irreducible
  name: Join-irreducible
  group: weihrauch
  closedUnder: w
  direction: equiv
  domain: problems
  description: >
    P ≤W Q ⊔ R implies P ≤W Q or P ≤W R (Brattka, Gherardi and Pauly, Section 4).
