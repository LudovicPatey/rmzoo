# Frameworks of the viewer (docs/DESIGN.md, "Bases"): presets of the diagram of bases
# (data/bases.yaml). Choosing one selects its bases; the reader can then add or remove
# bases. Fields: scripts/lib/schema.mjs (mode).

- id: rm
  name: Reverse mathematics
  short: Reverse math.
  description: Provability over RCA₀ and implication over ω-models, with conservation results and the computability-theoretic properties that separate statements over ω-models.
  bases: [ rca0, omega ]
  default: rca0

- id: hrm
  name: Higher-order reverse mathematics
  short: Higher-order RM
  description: Third-order statements (about functionals and arbitrary functions on the reals) compared over RCA₀^ω, Kohlenbach's higher-order base system, which is conservative over RCA₀ for second-order sentences.
  bases: [ rca0omega ]
  default: rca0

- id: crm
  name: Constructive reverse mathematics
  short: Constructive RM
  description: Implications provable in Bishop-style constructive mathematics (BISH) and in EL₀, the intuitionistic counterpart of RCA₀, between omniscience principles, continuity and fan principles, and theorems of analysis.
  bases: [ bish, el0 ]
  default: bish

- id: wrm
  name: Weak reverse mathematics
  short: Weak RM
  description: Provability over RCA₀*, where only Δ⁰₁-induction is available and IΣ⁰₁ becomes a statement like the others.
  bases: [ rca0star ]
  default: rca0star

- id: computable
  name: Computable reducibility
  short: Computable
  description: Computable, strongly computable and ω-model reducibility between problems, with the computability-theoretic properties (cone avoidance, basis theorems, preservation properties).
  bases: [ c, sc, soc, omega ]
  default: c

- id: weihrauch
  name: Weihrauch complexity
  short: Weihrauch
  description: Strong, plain, generalized, continuous and arithmetic Weihrauch reducibility between problems, the operations of the Weihrauch lattice and the properties of Weihrauch degrees (cylinders, idempotency, parallelizability…).
  bases: [ sw, w, gw, cw, aw ]
  default: w
