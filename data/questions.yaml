# Open questions explicitly stated in the literature.
#
# Each entry is one question (possibly with several parts), in our own words:
#   id         short slug
#   question   the question ($…$ for math); with parts, an optional lead-in
#   parts      several sub-questions, numbered in the viewer: a list of
#              {question, formal, status, answer, resolvedBy}, each settled on its
#              own (formal or status as below; with neither, its status is not
#              recorded and it is left out of the count). The question is resolved
#              when every part is, partially answered when some are. With parts,
#              formal and status go in the parts, not at the top. Split a question
#              when it asks several things; a sentence that restates the previous
#              one ("Equivalently, …", "In particular, …") stays with it.
#   asked      where it was stated: [{ref, loc}] — every paper that asked it
#   statements statements of the zoo it is about
#   formal     optional: the question as comparisons of the zoo, a list of
#              {from, to, over} meaning "does `from` imply `to` over `over`?"
#              (over: a reduction id). The status of a formal question is
#              derived from the database: resolved when every part is settled,
#              partially resolved when some are; the solving papers are the
#              citations of the proofs. The build fails if a manual `status`
#              disagrees with the database.
#   status     open | partial | resolved — required when there is no `formal`
#   answer     short answer, when resolved
#   resolvedBy [{ref, loc}] — the papers that answered it; required for a
#              resolved non-formal question. For a formal question it is
#              optional: without it, the viewer lists the papers cited by the
#              database's proofs that appeared after the question was asked.
#   kind       question (default) | conjecture
#   context    a few sentences of background; [@key] cites a reference

- id: rt22-wkl
  parts:
    - question: 'Does $\mathsf{RT}^2_2$ imply $\mathsf{WKL}_0$ over $\mathsf{RCA}_0$?'
      formal: [{from: rt22, to: wkl, over: rca0}]
    - question: 'Does $\mathsf{RT}^2_{<\infty}$?'
      formal: [{from: rt2, to: wkl, over: rca0}]
  asked:
    - {ref: seetapunslaman1995, loc: Question 4.2}
    - {ref: cholakjockuschslaman2001, loc: Question 13.5}
    - {ref: mileti2004, loc: Question 7.2.1}
    - {ref: montalban2011, loc: Question 1}
    - {ref: birs2008, loc: Problem 5.4}
  statements: [rt22, rt2, wkl]
  resolvedBy:
    - {ref: liu2012}
  context: >-
    Seetapun [@seetapunslaman1995] showed that RT²₂ admits cone avoidance, so
    RT²₂ does not imply ACA₀. Whether it implies the much weaker WKL₀ — equivalently, whether every
    instance can be solved without computing a PA degree — remained open until Liu
    [@liu2012] proved PA avoidance for RT²₂. Since ω-models of RT²₂ are models of
    RT²_{<∞}, the second part follows.

- id: srt22-rt22
  parts:
    - question: 'Does $\mathsf{SRT}^2_2$ imply $\mathsf{RT}^2_2$ (equivalently, $\mathsf{COH}$)?'
      formal: [{from: srt22, to: rt22, over: rca0}, {from: srt22, to: coh, over: rca0}, {from: srt22, to: rt22, over: omega}, {from: srt22, to: rt22, over: gw}, {from: isig2-srt22, to: rt22, over: rca0}]
    - question: 'Does $\mathsf{SRT}^2_{<\infty}$ imply $\mathsf{RT}^2_{<\infty}$ (equivalently, $\mathsf{COH}$)?'
      formal: [{from: srt2, to: rt2, over: rca0}]
  asked:
    - {ref: cholakjockuschslaman2001, loc: Question 13.6}
    - {ref: mileti2004, loc: Question 7.2.3}
    - {ref: chongliyang2014, loc: Question 4.16}
    - {ref: patey2015c, loc: Question 2.3}
    - {ref: hirschfeldtjockusch2016, loc: Questions 5.1 and 5.2}
    - {ref: patey2016c, loc: Question 18.1}
    - {ref: chongslamanyang2017, loc: Question 5.3}
    - {ref: montalban2011, loc: Question 3}
    - {ref: birs2008, loc: Problem 5.5}
  statements: [srt22, rt22, coh, srt2, rt2, isig2]
  resolvedBy:
    - {ref: chongslamanyang2014}
    - {ref: moninpatey2021}
  context: >-
    Cholak, Jockusch and Slaman [@cholakjockuschslaman2001] decomposed RT²₂ into
    its stable part SRT²₂ and its cohesive part COH, and asked whether the stable
    part alone suffices. This became one of the central questions of the field.
    Chong, Slaman and Yang [@chongslamanyang2014] gave a negative answer using a
    non-standard model in which every set is low; the question for ω-models — that
    is, for computability theory proper — was answered negatively by Monin and
    Patey [@moninpatey2021].

- id: rt22-isig2
  parts:
    - question: 'Does $\mathsf{RT}^2_2$ imply $\mathsf{I}\Sigma^0_2$?'
      formal: [{from: rt22, to: isig2, over: rca0}]
    - question: 'Does $\mathsf{RT}^2_{<\infty}$ imply $\mathsf{I}\Sigma^0_3$?'
      formal: [{from: rt2, to: isig3, over: rca0}]
  asked:
    - {ref: cholakjockuschslaman2001, loc: Question 13.7}
    - {ref: birs2008, loc: Problem 5.7}
  statements: [rt22, isig2, rt2, isig3]
  resolvedBy:
    - {ref: chongslamanyang2017}
    - {ref: slamanyokoyama2018}
  context: >-
    RT²₂ implies BΣ⁰₂ [@hirst1987] and is Π¹₁-conservative over RCA₀ + IΣ⁰₂
    [@cholakjockuschslaman2001], so its first-order part lies between BΣ⁰₂ and
    IΣ⁰₂. Chong, Slaman and Yang [@chongslamanyang2017] showed that it does not
    reach IΣ⁰₂; Slaman and Yokoyama [@slamanyokoyama2018] answered the question for
    arbitrarily many colors.

- id: rt22-pi02-conservation
  parts:
    - question: 'Is $\mathsf{RCA}_0 + \mathsf{RT}^2_2$ $\Pi^0_2$-conservative over $\mathsf{RCA}_0$? In particular, does it prove the totality of the Ackermann function, or the consistency of $\mathsf{I}\Sigma_1$?'
      status: resolved
    - question: 'Does it prove that $\omega^\omega$ is well-ordered?'
      status: resolved
  asked:
    - {ref: cholakjockuschslaman2001, loc: Question 13.2}
    - {ref: montalban2011, loc: Question 2}
    - {ref: seetapunslaman1995, loc: Questions 4.3 and 4.4}
  statements: [rt22]
  answer: Yes. RT²₂ (even with WKL₀) is ∀Π⁰₃-conservative over RCA₀, so it proves no new Π⁰₂ sentence; nor does it prove that ω^ω is well-ordered.
  resolvedBy:
    - {ref: pateyyokoyama2018}
    - {ref: koodziejczykyokoyama2018, loc: Theorem 3.3}
  context: >-
    This asks whether RT²₂ is "finitistically reducible": whether the Π⁰₂
    consequences of RT²₂, which correspond to provably total functions, are already
    those of IΣ⁰₁ (primitive recursive functions). Patey and Yokoyama
    [@pateyyokoyama2018] answered positively by a model-theoretic argument based on
    a new notion of largeness of finite sets.

- id: delta02-low-subset
  question: Does every $\Delta^0_2$ set have an infinite low subset in it or in its complement? Equivalently, does every computable stable coloring of pairs have an infinite low homogeneous set?
  asked:
    - {ref: cholakjockuschslaman2001, loc: Question 13.9}
  statements: [srt22, d22]
  status: resolved
  answer: No — there is a Δ⁰₂ set with no infinite low subset in either it or its complement.
  resolvedBy:
    - {ref: downeyetal2001}
  context: >-
    A relativizable positive answer would have separated SRT²₂ from RT²₂, since RT²₂
    has computable instances without low₂ solutions [@jockusch1972]. The answer is
    negative [@downeyetal2001], which is why the separation of SRT²₂ from RT²₂
    needed other ideas: Chong, Slaman and Yang [@chongslamanyang2014] built a
    non-standard model in which every set is low.

- id: rt22-pa-avoidance
  question: For every 2-coloring $C$ of $[\mathbb{N}]^2$ which is not of PA degree, is there an infinite homogeneous set $H$ such that $C \oplus H$ is not of PA degree?
  asked:
    - {ref: cholakjockuschslaman2001, loc: Question 13.12}
  statements: [rt22, wkl]
  status: resolved
  answer: Yes — RT²₂ admits PA avoidance.
  resolvedBy:
    - {ref: liu2012}
  context: >-
    A relativizable positive answer gives an ω-model of RT²₂ with no PA degree, hence
    separates RT²₂ from WKL₀ (see the question on RT²₂ and WKL₀). Liu
    [@liu2012] proved it with a new forcing notion whose conditions are Mathias
    conditions with a Π⁰₁ class of reservoirs.

- id: cac-rt22
  question: Does the chain/antichain principle $\mathsf{CAC}$ imply $\mathsf{RT}^2_2$?
  asked:
    - {ref: cholakjockuschslaman2001, loc: Question 13.8}
    - {ref: mileti2004, loc: Question 7.2.4}
  statements: [cac, rt22]
  formal:
    - {from: cac, to: rt22, over: rca0}
  resolvedBy:
    - {ref: hirschfeldtshore2007}
  context: >-
    CAC follows easily from RT²₂ by coloring pairs according to comparability.
    Hirschfeldt and Shore [@hirschfeldtshore2007] showed that CAC is much weaker:
    it has an ω-model with no DNR function, while RT²₂ implies DNR.

- id: fs2-rt22
  parts:
    - question: 'Does the free set theorem $\mathsf{FS}^2$, or the thin set theorem $\mathsf{TS}^2$, imply $\mathsf{RT}^2_2$?'
      formal: [{from: ts2, to: rt22, over: rca0}, {from: fs2, to: rt22, over: rca0}]
    - question: 'Does $\mathsf{FS}^2 + \mathsf{WKL}_0$?'
      formal: [{from: fs2-wkl, to: rt22, over: rca0}]
    - question: 'Does $\mathsf{FS}^2$ imply $\mathsf{B}\Sigma^0_2$?'
      formal: [{from: fs2, to: bsig2, over: rca0}]
  asked:
    - {ref: cholaketal2005, loc: Question 7.1}
    - {ref: montalban2011, loc: Question 6}
  statements: [fs2, rt22, wkl, bsig2]
  context: >-
    The free set and thin set theorems [@cholaketal2005] are consequences of
    Ramsey's theorem in which the homogeneity requirement is weakened. They are
    natural candidates for principles strictly between RCA₀ and RT²₂.

- id: fs2-cac-rt22
  parts:
    - question: 'Does $\mathsf{FS}^2 + \mathsf{CAC}$ imply $\mathsf{RT}^2_2$?'
      formal: [{from: cac-fs2, to: rt22, over: rca0}]
    - question: 'Does $\mathsf{FS}^2 + \mathsf{COH}$?'
      formal: [{from: coh-fs2, to: rt22, over: rca0}]
  asked:
    - {ref: cholaketal2005, loc: Question 7.4}
  statements: [fs2, cac, coh, rt22]
  context: >-
    Combining a free set principle with a principle handling the "unstable" part
    of colorings is a natural attempt to recover RT²₂, by analogy with
    RT²₂ ⇔ SRT²₂ + COH [@cholakjockuschslaman2001].

- id: fs-aca
  question: Do the free set or thin set theorems for exponent $k \ge 3$, or for all exponents, imply $\mathsf{ACA}_0$?
  asked:
    - {ref: cholaketal2005, loc: Question 7.6}
  statements: [fs3, ts3, fs, aca]
  formal:
    - {from: fs3, to: aca, over: rca0}
    - {from: ts3, to: aca, over: rca0}
    - {from: fs, to: aca, over: rca0}
  resolvedBy:
    - {ref: wang2014b}
  context: >-
    Ramsey's theorem for triples implies ACA₀ [@jockusch1972], unlike RT²₂.
    Whether the weaker free set and thin set theorems behave like Ramsey's theorem
    for pairs at every exponent was settled by Wang [@wang2014b], who showed that
    they admit strong cone avoidance at every exponent.

- id: sads-scac
  question: Does $\mathsf{SADS}$ imply $\mathsf{SCAC}$?
  asked:
    - {ref: hirschfeldtshore2007, loc: Question 6.2}
    - {ref: montalban2011, loc: Question 4}
    - {ref: birs2008, loc: Problem 3.7}
  statements: [sads, scac]
  formal:
    - {from: sads, to: scac, over: rca0}
  context: >-
    Hirschfeldt and Shore [@hirschfeldtshore2007] introduced the stable versions
    of ADS and CAC and showed that SCAC implies SADS.

- id: cads-coh
  question: Does $\mathsf{CRT}^2_2$, or even $\mathsf{CADS}$, imply $\mathsf{COH}$?
  asked:
    - {ref: hirschfeldtshore2007, loc: Question 6.4}
    - {ref: lermansolomontowsner2013, loc: Question 5.1}
    - {ref: dzhafarovmummert2022, loc: Question 9.2.26}
    - {ref: montalban2011, loc: Question 4}
    - {ref: birs2008, loc: Problem 3.8}
  statements: [crt22, cads, coh]
  formal:
    - {from: crt22, to: coh, over: rca0}
    - {from: cads, to: coh, over: rca0}
    - {from: cads, to: coh, over: omega}
  context: >-
    COH implies both CADS and the cohesive Ramsey theorem CRT²₂
    [@hirschfeldtshore2007]. Over ω-models, and even for Weihrauch reducibility,
    CADS is equivalent to COH [@fioricaronesshafersolda2022], and CADS implies
    COH over RCA₀ + BΣ⁰₂ [@dzhafarovmummert2022]; so a negative answer over RCA₀
    would have to use non-standard models.

- id: cads-crt22
  question: Does $\mathsf{CADS}$ imply $\mathsf{CRT}^2_2$?
  asked:
    - {ref: lermansolomontowsner2013, loc: Question 5.1}
  statements: [cads, crt22]
  formal:
    - {from: cads, to: crt22, over: rca0}
  context: >-
    A companion of the question whether CADS implies COH: CRT²₂ lies between COH
    and CADS [@hirschfeldtshore2007].

- id: sads-bsig2
  question: Does $\mathsf{SADS}$, or even $\mathsf{PART}$, imply $\mathsf{B}\Sigma^0_2$?
  asked:
    - {ref: hirschfeldtshore2007, loc: Question 6.5}
    - {ref: birs2008, loc: Problems 3.9 and 3.10}
  statements: [sads, part, bsig2]
  formal:
    - {from: sads, to: bsig2, over: rca0}
    - {from: part, to: bsig2, over: rca0}
  resolvedBy:
    - {ref: chonglemppyang2010}
  context: >-
    SCAC implies BΣ⁰₂ [@hirschfeldtshore2007], and the question asks how far down
    this goes. Chong, Lempp and Yang [@chonglemppyang2010] showed that PART, and
    hence SADS, implies BΣ⁰₂.

- id: weak-principles-conservation
  question: Are the principles weaker than $\mathsf{ACA}_0$ studied by Hirschfeldt and Shore (other than those following from $\mathsf{WKL}_0$ or $\mathsf{COH}$) $\Pi^1_1$-conservative, or at least arithmetically conservative, over $\mathsf{B}\Sigma^0_2$?
  asked:
    - {ref: hirschfeldtshore2007, loc: Question 6.7}
  statements: [ads, cac, sads, scac, bsig2]
  status: partial
  answer: COH, ADS, CAC and their stable versions are Π¹₁-conservative over RCA₀ + BΣ⁰₂.
  resolvedBy:
    - {ref: chongslamanyang2012}
  context: >-
    Proving conservation over BΣ⁰₂ is harder than over IΣ⁰₂, since the usual forcing
    arguments use Σ⁰₂-induction. Chong, Slaman and Yang [@chongslamanyang2012]
    developed techniques for models of BΣ⁰₂ and showed conservation for the main
    principles weaker than RT²₂.

- id: rrt-aca
  question: Is there an exponent $n$ such that the rainbow Ramsey theorem $\mathsf{RRT}^n_2$ implies $\mathsf{ACA}_0$?
  asked:
    - {ref: csimamileti2009, loc: Question 5.15}
    - {ref: wang2013, loc: Conjecture 5.1}
  statements: [rrt, aca]
  formal:
    - {from: rrt, to: aca, over: rca0}
  resolvedBy:
    - {ref: wang2014b}
  context: >-
    Ramsey's theorem RTⁿ₂ implies ACA₀ for every n ≥ 3, but the rainbow Ramsey
    theorem is much weaker: Csima and Mileti [@csimamileti2009] showed RRT²₂
    follows from 2-randomness. Wang [@wang2013] showed that RRT³₂ does not imply
    ACA₀, and later that no exponent does [@wang2014b].

- id: ipt22-rt22
  parts:
    - question: 'Does $\mathsf{IPT}^2_2$ (or $\mathsf{IPT}^2_2 + \mathsf{B}\Sigma^0_2$) imply $\mathsf{RT}^2_2$?'
      formal: [{from: ipt22, to: rt22, over: rca0}, {from: bsig2-ipt22, to: rt22, over: rca0}]
    - question: 'Does $\mathsf{IPT}^2_2$ imply $\mathsf{B}\Sigma^0_2$?'
      formal: [{from: ipt22, to: bsig2, over: rca0}]
    - question: 'Is $\mathsf{IPT}^2_2$ implied by $\mathsf{SRT}^2_2$ over ω-models?'
      formal: [{from: srt22, to: ipt22, over: omega}]
    - question: 'For arbitrarily many colors, does $\mathsf{SRT}^2_{<\infty}$ imply $\mathsf{IPT}^2_{<\infty}$, and does $\mathsf{IPT}^2_{<\infty}$ imply $\mathsf{RT}^2_{<\infty}$?'
      formal: [{from: srt2, to: ipt2, over: rca0}, {from: ipt2, to: rt2, over: rca0}]
  asked:
    - {ref: dzhafarovhirst2009, loc: Question 5.1}
    - {ref: dzhafarovmummert2022, loc: Questions 9.3.6 and 9.3.12}
    - {ref: montalban2011, loc: Question 8}
    - {ref: birs2008, loc: Problems 4.6 and 4.7}
  statements: [ipt22, bsig2, rt22, srt22]
  context: >-
    The increasing polarized Ramsey theorem IPT²₂ [@dzhafarovhirst2009] lies
    between SRT²₂ and RT²₂. An equivalence between IPT²₂ + BΣ⁰₂ and RT²₂ would
    follow from SRT²₂ ⇒ RT²₂, so separating them is at least as hard as the
    SRT²₂ vs. RT²₂ question.

- id: sipt22-srt22
  question: Does $\mathsf{SIPT}^2_2$ or $\mathsf{SPT}^2_2$ imply $\mathsf{SRT}^2_2$ (equivalently, $\mathsf{B}\Sigma^0_2$)?
  asked:
    - {ref: dzhafarovhirst2009, loc: Question 5.2}
  statements: [sipt22, spt22, srt22, bsig2]
  formal:
    - {from: sipt22, to: srt22, over: rca0}
    - {from: spt22, to: srt22, over: rca0}
  resolvedBy:
    - {ref: chonglemppyang2010}
  context: >-
    Dzhafarov and Hirst [@dzhafarovhirst2009] showed that the stable polarized
    principles together with BΣ⁰₂ imply SRT²₂. Chong, Lempp and Yang
    [@chonglemppyang2010] showed that they imply BΣ⁰₂ themselves.

- id: coh-amt
  parts:
    - question: 'Does $\mathsf{COH}$ (or $\mathsf{CADS}$) imply the atomic model theorem $\mathsf{AMT}$?'
      formal: [{from: coh, to: amt, over: rca0}, {from: cads, to: amt, over: rca0}]
    - question: 'Does $\mathsf{CADS}$ imply $\mathsf{OPT}$?'
      formal: [{from: cads, to: opt, over: rca0}]
  asked:
    - {ref: hirschfeldtshoreslaman2009, loc: Questions 7.1 and 7.2}
    - {ref: patey2017b, loc: Question 1.5}
  statements: [coh, cads, amt, opt]
  context: >-
    Hirschfeldt, Shore and Slaman [@hirschfeldtshoreslaman2009] placed AMT below
    SADS and OPT (omitting partial types) below AMT. COH and CADS are the natural
    "unstable" principles to compare with them.

- id: amt-d2ip
  parts:
    - question: 'Does $\mathsf{AMT}$ imply $\overline{\mathsf{D}}_2\mathsf{IP}$?'
      formal: [{from: amt, to: nd2ip, over: rca0}]
    - question: 'Does $\mathsf{OPT}$?'
      formal: [{from: opt, to: nd2ip, over: rca0}]
    - question: 'Does $\overline{\mathsf{D}}_2\mathsf{IP}$ imply $\mathsf{FIP}$?'
      formal: [{from: nd2ip, to: fip, over: rca0}]
  asked:
    - {ref: dzhafarovmummert2010, loc: Questions 5.1 and 5.2}
    - {ref: dzhafarovmummert2013, loc: Question 4.6}
    - {ref: cholakdowneyigusa2017, loc: Question 1}
  statements: [amt, opt, nd2ip, fip]
  context: >-
    Dzhafarov and Mummert [@dzhafarovmummert2013] studied intersection principles
    for families of sets. The principles D_nIP asking for a maximal subfamily with
    the D_n intersection property are equivalent to ACA₀; their weak versions
    D̄_nIP (written D_nIP in [@dzhafarovmummert2010] and nIP in
    [@cholakdowneyigusa2017]) form a hierarchy below the finite intersection
    principle FIP, close to the atomic model theorem. AMT implies D̄₂IP over
    RCA₀ + IΣ⁰₂.

- id: asram-sram
  parts:
    - question: 'Does $\mathsf{ASRAM}$ imply $\mathsf{SRAM}$?'
      formal: [{from: asram, to: sram, over: rca0}]
    - question: 'Does $\mathsf{SRT}^2_2$ imply $\mathsf{ASRAM}$, or conversely?'
      formal: [{from: srt22, to: asram, over: rca0}, {from: asram, to: srt22, over: rca0}]
    - question: 'Does $\mathsf{ASRT}^2_2$ imply $\mathsf{WWKL}_0$?'
      formal: [{from: asrt22, to: wwkl, over: rca0}]
  asked:
    - {ref: dzhafarov2011, loc: Question 5.9}
  statements: [asram, sram, srt22, asrt22, wwkl]
  context: >-
    Dzhafarov [@dzhafarov2011] introduced the "almost" versions of stable Ramsey
    principles, inspired by the reverse mathematics of the sorites paradox.

- id: ucnn-cnn
  kind: conjecture
  question: Unique choice on Baire space is Weihrauch-equivalent to closed choice on Baire space, $\mathsf{UC}_{\mathbb{N}^\mathbb{N}} \equiv_W \mathsf{C}_{\mathbb{N}^\mathbb{N}}$.
  asked:
    - {ref: brattkadebrechtpauly2012, loc: Conjecture 6.3}
  statements: [ucnn, cnn]
  formal:
    - {from: ucnn, to: cnn, over: w}
  context: >-
    C_ℕ^ℕ and UC_ℕ^ℕ are the Weihrauch counterparts of ATR₀-like principles
    [@brattkadebrechtpauly2012]. The conjecture was refuted: unique choice is
    strictly weaker than closed choice on Baire space.

- id: dnr-rwkl
  question: Does $\mathsf{DNR}$ imply the Ramsey-type weak König's lemma $\mathsf{RWKL}$?
  asked:
    - {ref: flood2012, loc: Question 9}
  statements: [dnr, rwkl]
  formal:
    - {from: dnr, to: rwkl, over: rca0}
  resolvedBy:
    - {ref: floodtowsner2016}
  context: >-
    Flood [@flood2012] introduced RWKL, which asks for an infinite set homogeneous
    for a path of a binary tree, and showed that it is implied by SRT²₂ and implies
    DNR.

- id: d22-p22
  question: Does $\mathsf{D}^2_2$ imply $\mathsf{P}^2_2$?
  asked:
    - {ref: flood2012, loc: Question 19}
  statements: [d22, p22]
  formal:
    - {from: d22, to: p22, over: rca0}
  context: >-
    A question from Flood's study of Ramsey-type versions of König's lemma
    [@flood2012].

- id: tt1-isig2
  question: Does $\mathsf{RCA}_0 + \mathsf{TT}^1$ prove $\mathsf{I}\Sigma^0_2$?
  asked:
    - {ref: chongliyang2014, loc: Question 4.19}
    - {ref: birs2008, loc: Problem 4.1}
    - {ref: montalban2011, loc: after Question 7}
  statements: [tt1, isig2]
  formal:
    - {from: tt1, to: isig2, over: rca0}
  context: >-
    The tree theorem for singletons TT¹ (every finite coloring of the full binary
    tree has a monochromatic subtree isomorphic to it) is a tree analogue of the
    infinite pigeonhole principle, which is equivalent to BΣ⁰₂ [@hirst1987]. Its
    first-order strength was a natural question since the obvious proofs use more
    induction.

- id: rt22-bsig2-conservation
  question: Is $\mathsf{SRT}^2_2$ or $\mathsf{RT}^2_2$ $\Pi^1_1$-conservative over $\mathsf{RCA}_0 + \mathsf{B}\Sigma^0_2$?
  asked:
    - {ref: chongliyang2014, loc: Question 4.20}
    - {ref: chongslamanyang2017, loc: Question 5.1}
    - {ref: pateyyokoyama2018, loc: Question 9.1}
    - {ref: houeroupateyyokoyama2024, loc: Questions 1.3 and 5.1}
    - {ref: lehoueroupateyyokoyama2024, loc: Question 1.1}
    - {ref: birs2008, loc: Problems 3.11 and 5.8}
  statements: [srt22, rt22, bsig2]
  status: resolved
  answer: Yes for both. RCA₀ + RT²₂ is Π¹₁-conservative over RCA₀ + BΣ⁰₂ (Hwang 2026, an unrefereed preprint), hence so is SRT²₂, which follows from RT²₂. Earlier, RT²₂ + WKL₀ was shown ∀Π⁰₄-conservative over RCA₀ + BΣ⁰₂.
  resolvedBy:
    - {ref: hwang2026, loc: Theorem 1.1}
    - {ref: lehoueroupateyyokoyama2024, loc: Theorem 1.4}
  context: >-
    RT²₂ implies BΣ⁰₂ and is Π¹₁-conservative over RCA₀ + IΣ⁰₂
    [@cholakjockuschslaman2001], so the question is whether BΣ⁰₂ is exactly its
    first-order part. Le Houérou, Levy Patey and Yokoyama
    [@lehoueroupateyyokoyama2024] proved conservation for ∀Π⁰₄ sentences, which
    covers BΣ⁰₂ itself and the consistency statements usually considered.

- id: ts2-rrt22
  question: Does the thin set theorem $\mathsf{TS}^2$ imply $\mathsf{RRT}^2_2$?
  asked:
    - {ref: kang2014, loc: Question 2.8}
  statements: [ts2, rrt22]
  formal:
    - {from: ts2, to: rrt22, over: rca0}
  context: >-
    Both are consequences of RT²₂ obtained by weakening homogeneity
    [@cholaketal2005] [@csimamileti2009].

- id: rcolor2-dnr
  parts:
    - question: 'Does the Ramsey-type 2-coloring principle $\mathsf{RCOLOR}_2$ imply $\mathsf{DNR}$?'
      formal: [{from: rcolor2, to: dnr, over: rca0}]
    - question: 'Does it imply $\mathsf{RWKL}$?'
      formal: [{from: rcolor2, to: rwkl, over: rca0}]
  asked:
    - {ref: patey2014, loc: Question 5.2}
    - {ref: patey2015c, loc: Question 3.6}
    - {ref: patey2016c, loc: Question 18.11}
    - {ref: bienvenupateyshafer2017, loc: Questions 5.15 and 5.16}
  statements: [rcolor2, dnr, rwkl]
  context: >-
    Ramsey-type versions of graph coloring ask for an infinite set of vertices
    that can be monochromatic in some coloring. For k ≥ 3 colors they are all
    equivalent to RWKL [@bienvenupateyshafer2017], which implies DNR; the case of
    two colors behaves differently.

- id: delta02-pa-jump
  question: Is there a $\Delta^0_2$ set such that every infinite subset of it or of its complement has a jump of PA degree relative to $\emptyset'$?
  asked:
    - {ref: patey2015c, loc: Question 2.6}
    - {ref: patey2016c, loc: Question 18.4}
  statements: [d22, coh]
  status: resolved
  answer: No — every Δ⁰₂ set has an infinite subset in it or its complement whose jump is not PA over ∅′.
  resolvedBy:
    - {ref: moninpatey2021}
  context: >-
    A set computes solutions to all computable instances of COH exactly when its
    jump is PA over ∅′ [@jockuschstephan1993]. A positive answer would therefore
    have shown that SRT²₂ implies COH in ω-models; the negative answer of Monin and
    Patey [@moninpatey2021] is the core of their separation of SRT²₂ from RT²₂ in
    ω-models.

- id: em-coh
  parts:
    - question: 'Does the Erdős–Moser theorem $\mathsf{EM}$ imply $\mathsf{COH}$?'
      formal: [{from: em, to: coh, over: rca0}, {from: em, to: coh, over: omega}]
    - question: 'Does it imply $\mathsf{1}\text{-}\mathsf{GEN}$?'
      formal: [{from: em, to: gen1, over: rca0}]
  asked:
    - {ref: patey2015c, loc: Questions 4.3 and 4.5}
    - {ref: patey2016c, loc: Question 18.14}
  statements: [em, coh, gen1]
  context: >-
    EM and ADS together are equivalent to RT²₂ [@bovykinweiermann2017], and ADS
    implies COH. Since COH is the "unstable" part of RT²₂, whether EM alone
    already captures it is a natural question.

- id: coh-srt2-strong
  parts:
    - question: 'Is $\mathsf{COH}$ generalized uniformly reducible to $\mathsf{SRT}^2_{<\infty}$?'
      formal: [{from: srt2, to: coh, over: gw}]
    - question: 'Is $\mathsf{COH}$ strongly computably reducible to $\mathsf{SRT}^2_k$ for $k > 2$, or to $\mathsf{SRT}^2_{<\infty}$?'
      formal: [{from: srt23, to: coh, over: sc}, {from: srt2, to: coh, over: sc}]
  asked:
    - {ref: dzhafarov2016, loc: Questions 6.1 and 6.3}
  statements: [coh, srt2, srt23]
  context: >-
    Dzhafarov [@dzhafarov2016] showed that COH is not strongly computably
    reducible to SRT²₂, a first step toward separating the two principles; these
    questions ask how far that separation extends.

- id: wwkl-rt-sc
  question: Is $\mathsf{WWKL}$ strongly computably reducible to $\mathsf{RT}^n_k$ for $n \ge 3$, or to $\mathsf{RT}$?
  asked:
    - {ref: hirschfeldtjockusch2016, loc: Question 5.7}
  statements: [wwkl, rt, rt32]
  formal:
    - {from: rt32, to: wwkl, over: sc}
    - {from: rt, to: wwkl, over: sc}
  context: >-
    Over ω-models, RTⁿₖ for n ≥ 3 is equivalent to ACA₀ and so implies WWKL. Strong
    computable reducibility forbids using the instance itself, and Hirschfeldt and
    Jockusch [@hirschfeldtjockusch2016] asked whether this matters.

- id: ts2-fs2
  parts:
    - question: 'Does $\mathsf{TS}^2$ imply $\mathsf{FS}^2$?'
      formal: [{from: ts2, to: fs2, over: rca0}]
    - question: 'Do $\mathsf{FS}^2$ or $\mathsf{TS}^2$ imply $\mathsf{EM}$?'
      formal: [{from: fs2, to: em, over: rca0}, {from: ts2, to: em, over: rca0}]
  asked:
    - {ref: patey2016, loc: Questions 5.1 and 5.3}
  statements: [ts2, fs2, em]
  context: >-
    FS² implies TS² [@cholaketal2005]. Since RT²₂ ⇔ EM + ADS
    [@bovykinweiermann2017], comparing the free and thin set theorems with EM is a
    way to understand which part of RT²₂ they capture.

- id: tt22-aca
  parts:
    - question: 'Does the tree theorem for pairs $\mathsf{TT}^2_2$ imply $\mathsf{ACA}_0$?'
      formal: [{from: tt22, to: aca, over: rca0}]
    - question: 'Does it admit cone avoidance?'
      status: resolved
      answer: 'Yes.'
      resolvedBy: [{ref: dzhafarovpatey2017, loc: Theorem 4.1}]
  asked:
    - {ref: patey2016b, loc: Questions 5.1 and 5.2}
    - {ref: patey2016c, loc: Question 14.2}
  statements: [tt22, aca]
  resolvedBy:
    - {ref: dzhafarovpatey2017}
  context: >-
    TT²₂ strengthens RT²₂ by coloring pairs of comparable nodes of the binary tree.
    Seetapun's cone avoidance argument for RT²₂ [@seetapunslaman1995] does not
    adapt directly because of the disjoint extension commitments of the tree
    structure.

- id: srrt22-coh
  question: Does $\mathsf{SRRT}^2_2 + \mathsf{COH}$ imply $\mathsf{RRT}^2_2$?
  asked:
    - {ref: patey2016c, loc: Question 9.1}
  statements: [srrt22, coh, rrt22]
  formal:
    - {from: coh-srrt22, to: rrt22, over: rca0}
  context: >-
    The analogue for the rainbow Ramsey theorem of the decomposition
    RT²₂ ⇔ SRT²₂ + COH [@cholakjockuschslaman2001].

- id: coh-em-arith
  kind: conjecture
  question: Both $\mathsf{COH}$ and $\mathsf{EM}$ admit preservation of the arithmetic hierarchy.
  asked:
    - {ref: wang2016, loc: Conjecture 5.3}
  statements: [coh, em]
  status: resolved
  answer: Proved.
  resolvedBy:
    - {ref: patey2015d, loc: Theorems 2.2 and 3.2}
  context: >-
    Wang [@wang2016] introduced preservation of the arithmetic hierarchy to
    separate principles by their definability strength, and showed that WKL and
    RRT²₂ have it. Patey [@patey2015d] proved the conjecture for COH
    and EM.

- id: rwwkl2-bsig2
  question: Does $\mathsf{2}\text{-}\mathsf{RWWKL}$ imply $\mathsf{B}\Sigma^0_2$?
  asked:
    - {ref: bienvenupateyshafer2017, loc: Question 3.9}
  statements: [rwwkl2, bsig2]
  formal:
    - {from: rwwkl2, to: bsig2, over: rca0}
  context: >-
    The Ramsey-type weak weak König's lemma relative to ∅′ is a consequence of
    2-WWKL, which implies BΣ⁰₂ [@avigaddeanrute2012].

- id: ivt-rt22
  question: Is the intermediate value theorem Weihrauch reducible to $\mathsf{RT}^2_2$?
  asked:
    - {ref: brattkarakotoniaina2017, loc: Question 5.21}
  statements: [ivt, rt22]
  formal:
    - {from: rt22, to: ivt, over: w}
  context: >-
    In the Weihrauch lattice, Ramsey's theorem for pairs cannot be reduced to
    PA, MLR or COH for reasons of Borel measurability
    [@brattkarakotoniaina2017], but which problems of analysis lie below it is less
    clear. IVT is a natural candidate: it is below WKL and computably true.

- id: tt22-er22
  parts:
    - question: 'How do the tree theorem $\mathsf{TT}^2_2$ and the Erdős–Rado theorem for the rationals $\mathsf{ER}^2_2$ compare?'
      formal: [{from: tt22, to: er22, over: rca0}, {from: er22, to: tt22, over: rca0}]
    - question: 'Does $\mathsf{ER}^2_2$ imply $\mathsf{ACA}_0$?'
      formal: [{from: er22, to: aca, over: rca0}]
    - question: 'Does $\mathsf{RT}^2_2$ imply $\mathsf{ER}^2_2$?'
      formal: [{from: rt22, to: er22, over: rca0}]
      answer: 'No: RCA₀ + WKL₀ + RT²₂ does not even prove the stable version SER²₂ (Dzhafarov and Patey, Theorem 5.5).'
  asked:
    - {ref: dzhafarovpatey2017, loc: Questions 6.1 and 6.2}
    - {ref: frittaionpatey2017, loc: "Questions 5.2, 5.3 and 5.4"}
    - {ref: patey2016c, loc: Questions 14.1–14.3}
  statements: [tt22, er22, aca, rt22]
  context: >-
    Both strengthen RT²₂ by adding structure to the homogeneous set: a copy of the
    full binary tree for TT²₂, a dense subset of the rationals for
    ER²₂ (written η → (ℵ₀, η)² in some papers). Seetapun's argument fails for both
    because of "disjoint extension commitments" [@frittaionpatey2017]; Dzhafarov and
    Patey [@dzhafarovpatey2017] overcame it for TT²₂, while ER²₂ only has half of
    this difficulty yet remains unsettled.

- id: er1-isig2
  question: Does the Erdős–Rado theorem for singletons $\mathsf{ER}^1$ imply $\mathsf{I}\Sigma^0_2$?
  asked:
    - {ref: frittaionpatey2017, loc: Question 5.5}
  statements: [er1, isig2]
  formal:
    - {from: er1, to: isig2, over: rca0}
  context: >-
    ER¹ (every finite coloring of the rationals has a dense monochromatic subset on
    some interval) and the tree theorem TT¹ have the same state of the art: both
    are provable in RCA₀ + IΣ⁰₂ and strictly stronger than BΣ⁰₂
    [@frittaionpatey2017].

- id: tt22-wkl
  parts:
    - question: 'Does $\mathsf{TT}^2_2$ imply $\mathsf{WKL}_0$?'
      formal: [{from: tt22, to: wkl, over: rca0}]
    - question: 'Does the stable tree theorem $\mathsf{STT}^2_2$ imply the cohesive one $\mathsf{CTT}^2_2$, or $\mathsf{COH}$, at least over ω-models?'
      formal: [{from: stt22, to: ctt22, over: omega}, {from: stt22, to: coh, over: omega}]
    - question: 'Does $\mathsf{SRT}^2_2$ imply $\mathsf{CTT}^2_2$ in ω-models?'
      formal: [{from: srt22, to: ctt22, over: omega}]
  asked:
    - {ref: dzhafarovpatey2017, loc: Questions 6.3 and 6.4}
    - {ref: chongetal2019, loc: Questions 5.2 and 5.3}
  statements: [tt22, wkl, stt22, ctt22, coh, srt22]
  context: >-
    The tree theorem decomposes, like RT²₂, into stable and cohesive parts. These
    are tree analogues of the SRT²₂ vs. COH question; since SRT²₂ does not imply
    COH in ω-models [@moninpatey2021], the analogous question for trees is
    expected to have the same answer.

- id: vw-aca
  parts:
    - question: 'Does the variable word theorem $\mathsf{VW}(2,2)$, or its ordered version $\mathsf{OVW}(2,2)$, imply $\mathsf{ACA}_0$?'
      formal: [{from: ovw0, to: aca, over: rca0}]
    - question: 'Are these principles provable in $\mathsf{ACA}_0$?'
      formal: [{from: aca, to: ovw0, over: rca0}]
  asked:
    - {ref: liumoninpatey2017, loc: Question 4.9}
    - {ref: millersolomon2004, loc: Problems 1 and 2}
  statements: [ovw0, aca]
  context: >-
    Variable word theorems come from the Hales–Jewett theorem. Miller and Solomon
    [@millersolomon2004] showed that they are not provable in WKL₀, and noted that
    the classical proof of Carlson and Simpson goes beyond ACA₀. Liu and Patey
    [@liupatey2026] proved OVW in ACA₀ and showed that it does not imply ACA₀.

- id: gp22-bsig2-conservation
  question: Is the grouping principle $\mathsf{GP}^2_2$ $\Pi^1_1$-conservative over $\mathsf{RCA}_0 + \mathsf{B}\Sigma^0_2$?
  asked:
    - {ref: pateyyokoyama2018, loc: Question 9.3}
  statements: [gp22, bsig2]
  status: resolved
  answer: Yes. Even WKL₀ + GP²₂ is Π¹₁-conservative over RCA₀ + BΣ⁰₂ (Le Houérou, Levy Patey and Yokoyama).
  resolvedBy:
    - {ref: lehoueroupateyyokoyama2024, loc: Theorem 4.2}
  context: >-
    Patey and Yokoyama [@pateyyokoyama2018] introduced the grouping principle to
    obtain density bounds for the Erdős–Moser theorem in their conservation proof
    for RT²₂. Le Houérou, Levy Patey and Yokoyama [@lehoueroupateyyokoyama2024]
    later showed GP²₂ + WKL₀ Π¹₁-conservative over RCA₀ + BΣ⁰₂.

- id: em-gp22
  question: Does the Erdős–Moser theorem $\mathsf{EM}$ imply the grouping principle $\mathsf{GP}^2_2$ over $\mathsf{RCA}_0$?
  asked:
    - {ref: pateyyokoyama2018, loc: Question 9.4}
  statements: [em, gp22]
  formal:
    - {from: em, to: gp22, over: rca0}
  context: >-
    The grouping principle was used to establish a density bound for the Erdős–Moser
    theorem [@pateyyokoyama2018]. The stable grouping principle does not imply the
    stable Erdős–Moser theorem, since the former admits low solutions and the latter
    does not.

- id: rrt22-ht-eq22
  question: Does $\mathsf{RRT}^2_2$ imply Hindman's theorem for sums of exactly two elements $\mathsf{HT}^{=2}_2$?
  asked:
    - {ref: csimaetal2019, loc: Question 5.2}
  statements: [rrt22, ht-eq22]
  formal:
    - {from: rrt22, to: ht-eq22, over: rca0}
  context: >-
    Csima, Dzhafarov, Hirschfeldt, Jockusch, Solomon and Westrick
    [@csimaetal2019] showed that HT^{=2}_2 is computably much weaker than full
    Hindman's theorem but still not computably true; the rainbow Ramsey theorem is
    a natural comparison point.

- id: cousin-baire1
  question: Where does Cousin's lemma for Baire class 1 functions fall in the reverse mathematics hierarchy?
  asked:
    - {ref: barrett2020, loc: Question 8.2}
  statements: [cousin-b1]
  status: resolved
  answer: It is equivalent to ACA₀ over RCA₀.
  resolvedBy:
    - {ref: barrettdowneygreenberg2021, loc: Theorem 5.5}
  context: >-
    Cousin's lemma (every gauge on [0,1] has a fine tagged partition) is
    equivalent to Π¹₁-CA₀ for arbitrary functions coded suitably, and Barrett
    [@barrett2020] gave a heuristic suggesting the same for Baire class 1 gauges.
    The answer turned out to be much lower: ACA₀ [@barrettdowneygreenberg2021].

- id: rt22-isig1-rcastar
  question: Over $\mathsf{RCA}_0^*$, does $\mathsf{RT}^2_2 + \mathsf{I}\Sigma^0_1$ imply $\mathsf{B}\Sigma^0_2$?
  asked:
    - {ref: koodziejczykkowalikyokoyama2020, loc: Question 4}
    - {ref: koodziejczykyokoyama2021, loc: Question 2}
  statements: [rt22, isig1, bsig2]
  formal:
    - {from: isig1-rt22, to: bsig2, over: rca0star}
  context: >-
    Over RCA₀, RT²₂ implies BΣ⁰₂ [@hirst1987]. Kołodziejczyk, Kowalik and
    Yokoyama [@koodziejczykkowalikyokoyama2020] studied Ramsey's theorem when only
    Δ⁰₁-induction is assumed, where RT²₂ alone does not even imply IΣ⁰₁; adding
    IΣ⁰₁ back is the natural intermediate case.

- id: rt22-pt22-c
  question: Is $\mathsf{RT}^2_2$ computably reducible to the polarized Ramsey theorem $\mathsf{PT}^2_2$?
  asked:
    - {ref: dzhafarovmummert2022, loc: Question 9.3.5}
  statements: [rt22, pt22]
  formal:
    - {from: pt22, to: rt22, over: c}
  context: >-
    PT²₂ is equivalent to RT²₂ over RCA₀ [@dzhafarovhirst2009], but the proof of
    RT²₂ from PT²₂ uses the principle more than once, so the question is whether
    a single application suffices.

- id: hindman-aca
  parts:
    - question: 'Is Hindman''s theorem $\mathsf{HT}$ provable in $\mathsf{ACA}_0$?'
      formal: [{from: aca, to: ht, over: rca0}]
    - question: 'Does it imply $\mathsf{ACA}_0^+$?'
      formal: [{from: ht, to: aca-plus, over: rca0}]
    - question: 'Is there a computable instance of $\mathsf{HT}$ all of whose solutions compute $\emptyset''''$?'
  asked:
    - {ref: blasshirstsimpson1987}
    - {ref: dzhafarovmummert2022, loc: Questions 9.9.16–9.9.18}
    - {ref: simpson1999open}
    - {ref: birs2008, loc: Problem 4.2}
    - {ref: montalban2011, loc: Question 9}
    - {ref: bompardliupatey2022, loc: Question 6.1}
  statements: [ht, aca, aca-plus]
  context: >-
    Blass, Hirst and Simpson [@blasshirstsimpson1987] showed that Hindman's
    theorem is provable in ACA₀⁺ and implies ACA₀, and this gap has remained one
    of the most famous open problems of reverse mathematics. Every computable
    instance has a solution computable from ∅^{(ω+1)}, while some computable
    instance has no Δ⁰₂ solution [@blasshirstsimpson1987], improved to no Π⁰₃
    solution by Liao [@liao2026]. A proof in ACA₀ would require solutions of bounded
    arithmetical complexity [@dzhafarovmummert2022].

- id: rrt22-tac
  question: Does $\mathsf{RRT}^2_2$ imply $\mathsf{TAC}$?
  asked:
    - {ref: dzhafarovmummert2022, loc: Question 11.6.12}
  statements: [rrt22, ctac]
  formal:
    - {from: rrt22, to: ctac, over: rca0}
  context: >-
    TAC, Conidis's tree antichain theorem (every infinite completely branching c.e.
    binary tree has an infinite antichain) [@dzhafarovmummert2022], follows from CAC
    and from 2-RAN; RRT²₂ and TAC are both principles strictly below ACA₀ that do not
    follow from WKL₀. Not to be confused with CAC for trees, which is TAC + BΣ⁰₂
    [@cervellegaudelierpatey2022].

- id: gen1-fip-w
  question: Is $\mathsf{1}\text{-}\mathsf{GEN}$ Weihrauch reducible to the finite intersection principle $\mathsf{FIP}$?
  asked:
    - {ref: dzhafarovmummert2022, loc: Question 9.10.25}
  statements: [gen1, fip]
  formal:
    - {from: fip, to: gen1, over: w}
  context: >-
    FIP is equivalent to 1-GEN over RCA₀ [@dzhafarovmummert2022]; the question asks
    whether the equivalence is uniform.

- id: coh-isig1-rcastar
  question: Over $\mathsf{RCA}_0^*$, does $\mathsf{COH}$ imply $\mathsf{I}\Sigma^0_1$?
  asked:
    - {ref: fioricaroneskoodziejczykkowalik2021, loc: Question 5.8}
  statements: [coh, isig1]
  formal:
    - {from: coh, to: isig1, over: rca0star}
  resolvedBy:
    - {ref: sun2025}
  context: >-
    Over RCA₀*, several consequences of RT²₂ such as RT²₂ itself, CAC and ADS do not
    imply IΣ⁰₁ [@fioricaroneskoodziejczykkowalik2021]. COH is the natural next
    candidate, since its usual proof iterates a construction along ℕ.

- id: ads-crt22-rcastar
  question: Over $\mathsf{RCA}_0^*$, does $\mathsf{ADS}$ or $\mathsf{CAC}$ imply $\mathsf{CRT}^2_2$?
  asked:
    - {ref: kowalik2024, loc: Question 2.15}
  statements: [ads, cac, crt22]
  formal:
    - {from: ads, to: crt22, over: rca0star}
    - {from: cac, to: crt22, over: rca0star}
  resolvedBy:
    - {ref: kolodziejczyksun2026}
  context: >-
    Over RCA₀, ADS and CAC imply COH, hence CRT²₂, and BΣ⁰₂. Over RCA₀*, where only
    Δ⁰₁-induction is available, the usual proofs break down, and Kowalik
    [@kowalik2024] asked whether the implications survive.

- id: lcrt22-crt22-rcastar
  parts:
    - question: 'Over $\mathsf{RCA}_0^*$, is $\ell\text{-}\mathsf{CRT}^2_2$ equivalent to $\mathsf{CRT}^2_2$?'
      formal: [{from: crt22, to: lcrt22, over: rca0star}]
    - question: 'Does it follow from $\mathsf{RT}^2_2$?'
      formal: [{from: rt22, to: lcrt22, over: rca0star}]
  asked:
    - {ref: fioricaroneskoodziejczykkowalik2021, loc: Question 4.12}
    - {ref: kowalik2024, loc: Question 3.10}
  statements: [lcrt22, crt22, rt22]
  context: >-
    The long version of a Ramseyan principle asks for a solution of cardinality ℕ
    rather than an unbounded one. Over RCA₀* some long principles (ℓ-RT²₂, ℓ-CAC,
    ℓ-ADS with set solutions) imply IΣ⁰₁, while ℓ-ADS with sequence solutions is
    equivalent to ADS; ℓ-CRT²₂ is equivalent to CRT²₂ over WKL₀*
    [@fioricaroneskoodziejczykkowalik2021]. Both parts would follow from a proof of
    the growing grouping principle GGP²₂ in RCA₀* + ¬IΣ⁰₁.

- id: ovw-bsig2-conservation
  question: Is $\mathsf{RCA}_0 + \mathsf{OVW}^0$ $\Pi^1_1$-conservative over $\mathsf{RCA}_0 + \mathsf{B}\Sigma^0_2$?
  asked:
    - {ref: lehoueroupatey2024, loc: Question 5.3}
  statements: [ovw0, bsig2]
  status: resolved
  answer: Yes.
  resolvedBy:
    - {ref: patey2026}
  context: >-
    Le Houérou and Patey [@lehoueroupatey2024] proved that the ordered variable
    word theorem, together with WKL₀, is ∀Π⁰₄-conservative over RCA₀ + BΣ⁰₂, by
    the largeness techniques developed for RT²₂. Patey [@patey2026] obtained full
    Π¹₁-conservation by formalizing a weakly low basis theorem for OVW.

- id: brt22-wkl-cac
  parts:
    - question: 'Does $\mathsf{WKL}_0 + \mathsf{B}\Sigma^0_2$ prove the bounded Ramsey theorem $\mathsf{BRT}^2_2$?'
      formal: [{from: bsig2-wkl, to: brt22, over: rca0}]
    - question: 'Does $\mathsf{CAC}$?'
      formal: [{from: cac, to: brt22, over: rca0}]
  asked:
    - {ref: lehoueroupatey2025, loc: Questions 5.2 and 5.3}
  statements: [brt22, wkl, bsig2, cac]
  context: >-
    BRT²₂ follows from RT²₂, from EM [@lehoueroupatey2025] and from IΣ⁰₂, but not
    from BΣ⁰₂ alone nor from ADS. These questions ask whether compactness, or the
    chain/antichain principle, suffices.

- id: tt22-bsig2-conservation
  question: Is $\mathsf{RCA}_0 + \mathsf{TT}^2_2$ $\Pi^1_1$-conservative over $\mathsf{RCA}_0 + \mathsf{B}\Sigma^0_2$?
  asked:
    - {ref: patey2026, loc: Question 4.2}
  statements: [tt22, bsig2]
  status: partial
  answer: TT²₂ + WKL₀ is ∀Π⁰₄-conservative over RCA₀ + BΣ⁰₂; full Π¹₁-conservation is open.
  resolvedBy:
    - {ref: lehoueroupatey2026, loc: Corollary 6.14}
  context: >-
    The analogue for the tree theorem of the long-standing question whether RT²₂
    is Π¹₁-conservative over RCA₀ + BΣ⁰₂.

- id: rrt22-fip
  parts:
    - question: 'Does $\mathsf{RRT}^2_2$ imply the finite intersection principle $\mathsf{FIP}$, over $\mathsf{RCA}_0$ or over ω-models?'
      formal: [{from: rrt22, to: fip, over: rca0}, {from: rrt22, to: fip, over: omega}]
    - question: 'Does $\mathsf{COH}$ imply $\mathsf{FIP}$, over $\mathsf{RCA}_0$ or over ω-models?'
      formal: [{from: coh, to: fip, over: rca0}, {from: coh, to: fip, over: omega}]
  asked:
    - {ref: dooley2025, loc: Question 3.3}
  statements: [rrt22, coh, fip]
  context: >-
    FIP is equivalent to 1-GEN over RCA₀ [@dzhafarovmummert2022], so the question
    asks whether these principles produce sets that are generic enough.

- id: ads-cac
  question: Does $\mathsf{ADS}$ imply $\mathsf{CAC}$?
  asked:
    - {ref: hirschfeldtshore2007, loc: Question 6.1}
    - {ref: birs2008, loc: Problem 3.6}
    - {ref: montalban2011, loc: Question 4}
  statements: [ads, cac]
  formal:
    - {from: ads, to: cac, over: rca0}
  resolvedBy:
    - {ref: lermansolomontowsner2013}
  context: >-
    Hirschfeldt and Shore [@hirschfeldtshore2007] showed that CAC implies ADS and
    that both are strictly weaker than RT²₂. Lerman, Solomon and Towsner
    [@lermansolomontowsner2013] separated them with an ω-model built by an
    iterated forcing construction, a method that became a standard tool for
    separating Ramsey-type principles.

- id: em-rt22
  question: Is the Erdős–Moser theorem $\mathsf{EM}$ strictly weaker than $\mathsf{RT}^2_2$?
  asked:
    - {ref: birs2008, loc: Problem 16.10}
    - {ref: montalban2011, loc: Question 5}
  statements: [em, rt22]
  formal:
    - {from: em, to: rt22, over: rca0}
  resolvedBy:
    - {ref: lermansolomontowsner2013}
  context: >-
    RT²₂ implies EM, and EM together with ADS (or CAC) implies RT²₂
    [@bovykinweiermann2017]. Lerman, Solomon and Towsner
    [@lermansolomontowsner2013] showed that EM does not even imply SRT²₂.

- id: tt22-rt2
  parts:
    - question: 'Is the tree theorem $\mathsf{TT}^2_2$ strictly stronger than $\mathsf{RT}^2_2$?'
      formal: [{from: rt22, to: tt22, over: rca0}]
    - question: 'Does $\mathsf{TT}^2_2$ prove $\mathsf{TT}^2_{<\infty}$, or $\mathsf{RT}^2_{<\infty}$?'
      formal: [{from: tt22, to: tt2, over: rca0}, {from: tt22, to: rt2, over: rca0}]
  asked:
    - {ref: birs2008, loc: Problems 4.4 and 4.5}
    - {ref: montalban2011, loc: Question 7}
  statements: [tt22, rt22, tt2, rt2]
  context: >-
    For singletons, the tree theorem is strictly stronger than the pigeonhole
    principle (Corduan, Groszek and Mileti). For pairs, a positive answer to the
    second question would make TT²₂ strictly stronger than RT²₂, since RT²₂ does
    not prove RT²_{<∞} [@cholakjockuschslaman2001].

- id: srt22-wwkl
  question: Does $\mathsf{SRT}^2_2$ imply $\mathsf{WKL}_0$, or at least $\mathsf{WWKL}_0$?
  asked:
    - {ref: birs2008, loc: Problem 7.13}
    - {ref: birs2008, loc: Problem 5.6}
  statements: [srt22, wkl, wwkl]
  formal:
    - {from: srt22, to: wkl, over: rca0}
    - {from: srt22, to: wwkl, over: rca0}
  resolvedBy:
    - {ref: liu2012}
    - {ref: liu2015}
  context: >-
    Kjos-Hanssen raised the question in the Banff problem list as "a major problem
    in reverse mathematics", together with questions about subsets of random sets.
    Liu answered both parts negatively, even for RT²₂: RT²₂ admits PA avoidance
    [@liu2012] and avoids all closed sets of measure zero [@liu2015].

- id: gdreg-wwkl-rrt22
  question: Does $\mathsf{G}_\delta\text{-}\mathsf{REG}$ together with $\mathsf{WWKL}_0$ imply $\mathsf{RRT}^2_2$?
  asked:
    - {ref: birs2008, loc: Problem 7.15}
  statements: [gdreg, wwkl, rrt22]
  formal:
    - {from: gdreg-wwkl, to: rrt22, over: rca0}
  context: >-
    Csima and Mileti [@csimamileti2009] showed that 2-randomness implies RRT²₂; the
    question asks whether weaker measure-theoretic principles suffice.

- id: strong-tietze
  kind: conjecture
  question: The strong Tietze extension theorem (for functions with moduli of uniform continuity) is equivalent to $\mathsf{WKL}_0$ over $\mathsf{RCA}_0$.
  asked:
    - {ref: giustosimpson2000}
    - {ref: montalban2011, loc: Question 16}
  statements: [tietze, wkl]
  formal:
    - {from: tietze, to: wkl, over: rca0}
    - {from: wkl, to: tietze, over: rca0}
  resolvedBy:
    - {ref: shafer2016}
  context: >-
    Giusto and Simpson [@giustosimpson2000] studied located sets in reverse
    mathematics and conjectured the equivalence; Shafer [@shafer2016] proved it for
    several versions of the theorem.

- id: nash-williams-finite-range
  question: How strong is the statement that if $\alpha$ is well-ordered and $Q$ is a wqo, then the $\alpha$-sequences over $Q$ with finite range form a wqo?
  asked:
    - {ref: montalban2011, loc: Question 23}
  statements: [nwt-fin, atr]
  formal:
    - {from: atr, to: nwt-fin, over: rca0}
    - {from: nwt-fin, to: atr, over: rca0}
  answer: It is equivalent to ATR₀ over RCA₀.
  resolvedBy:
    - {ref: pakhomovsolda2024}
  context: >-
    This is Nash-Williams' generalization of Higman's lemma to transfinite
    sequences with finite range. Montalbán expected the answer to come from an
    analysis of the maximal order types of the wqos involved. Pakhomov and Soldà
    [@pakhomovsolda2024] proved it in ATR₀, giving the equivalence.

- id: nash-williams-bqo
  question: >-
    Is Nash-Williams' theorem — if $Q$ is a bqo, then so is the set of
    transfinite sequences over $Q$ — equivalent to $\mathsf{ATR}_0$?
  asked:
    - {ref: marcone1994, loc: Conjecture 5.3}
    - {ref: simpson1999open}
    - {ref: montalban2011, loc: Question 24}
    - {ref: marcone2017, loc: Question 6.24}
    - {ref: marcone2005, loc: Conjecture 2.25}
  statements: [nwt, atr]
  formal:
    - {from: atr, to: nwt, over: rca0}
  answer: Yes. Pakhomov and Soldà proved the generalized Higman theorem in ATR₀, hence Nash-Williams' theorem, which is equivalent to it over ATR₀.
  resolvedBy:
    - {ref: pakhomovsolda2025, loc: Corollary 6.6 and Section 1}
  context: >-
    Marcone [@marcone1994] showed that the theorem is provable in Π¹₁-CA₀ but not
    equivalent to it, and Shore's work [@shore1993] shows that it implies ATR₀.
    Over ATR₀ it is equivalent to the generalized Higman theorem (if Q is a bqo, so
    is Q^{<ω}). The finite-range version for wqos is now known to be equivalent to
    ATR₀ [@pakhomovsolda2024]. Pakhomov and Soldà [@pakhomovsolda2025] then proved
    the generalized Higman theorem in ATR₀, through a transfinite hierarchy of ideal
    orders, which settles the bqo version too.

- id: fraisse-atr
  parts:
    - question: 'Is Fraïssé''s conjecture (countable linear orders are well-quasi-ordered under embeddability) equivalent to $\mathsf{ATR}_0$?'
      formal: [{from: atr, to: fra, over: rca0}]
    - question: 'Is it even provable in $\Pi^1_1\text{-}\mathsf{CA}_0$?'
      formal: [{from: pi11ca, to: fra, over: rca0}]
      answer: 'Yes, even in a weaker pseudo-Π¹₁-comprehension principle.'
  asked:
    - {ref: simpson1999open}
    - {ref: birs2008, loc: Problem 11.1}
    - {ref: montalban2011, loc: Question 21}
    - {ref: marcone2005, loc: Conjecture 2.31}
  statements: [fra, atr, pi11ca]
  resolvedBy:
    - {ref: montalban2017}
    - {ref: freund2024b}
  context: >-
    Shore [@shore1993] showed that Fraïssé's conjecture implies ATR₀, and in fact
    that its restriction to well-orders is equivalent to ATR₀. Laver's proof uses
    bqo theory far beyond ATR₀. A negative answer would give a new robust subsystem
    of second-order arithmetic, since the conjecture is equivalent to many
    statements about the structure of linear orders under embeddability.

- id: three-bqo
  parts:
    - question: 'Is there a system weaker than $\mathsf{ATR}_0$ that proves that the antichain $\mathbf{3}$ with three elements is a bqo?'
    - question: 'Does "$\mathbf{3}$ is a bqo" imply $\mathsf{ATR}_0$?'
      formal: [{from: bqo3, to: atr, over: rca0}]
  asked:
    - {ref: birs2008, loc: Problem 10.8}
    - {ref: montalban2011, loc: Question 25}
    - {ref: marcone2005, loc: Problem 3.3}
  statements: [bqo3, aca-plus, atr]
  context: >-
    RCA₀ proves that 2 is a bqo, and for every n ≥ 3 that if n is a bqo then so is
    n+1; but the only known proof that 3 is a bqo uses the clopen Ramsey theorem,
    equivalent to ATR₀. Freund [@freund2022b] made the first progress from below:
    "3 is a bqo" implies ACA₀⁺, and its Δ⁰₂ version implies ATR₀.

- id: auslander-ellis
  question: Is the Auslander–Ellis theorem of topological dynamics equivalent to $\mathsf{ACA}_0$?
  asked:
    - {ref: simpson1999open}
    - {ref: montalban2011, loc: Question 18}
    - {ref: dzhafarovmummert2022, loc: Question 10.6.17}
  statements: [aet, aca, aca-plus]
  formal:
    - {from: aca, to: aet, over: rca0}
  context: >-
    Blass, Hirst and Simpson [@blasshirstsimpson1987] proved the theorem in ACA₀⁺,
    in the same paper as Hindman's theorem, and Simpson conjectured both to be
    equivalent to ACA₀. Kreuzer [@kreuzer2013] related it to minimal idempotent
    ultrafilters. The gap between ACA₀ and ACA₀⁺ remains open, as for Hindman's
    theorem.

- id: gasarch-hirst
  kind: conjecture
  question: For all $2 \le k \le m$, the statement "every locally $k$-colorable graph is $m$-colorable" is equivalent to $\mathsf{WKL}_0$ over $\mathsf{RCA}_0$.
  asked:
    - {ref: gasarchhirst1994, loc: Conjecture 4}
  statements: [wkl]
  status: resolved
  answer: Proved.
  resolvedBy:
    - {ref: schmerl2000}
  context: >-
    A graph is locally k-colorable when each finite subgraph is k-colorable. By
    compactness it is then k-colorable, and Gasarch and Hirst
    [@gasarchhirst1994] showed that this is equivalent to WKL₀ for m = k. Their
    conjecture says that even the weak conclusion of m-colorability, for m much
    larger than k, already requires WKL₀. Schmerl [@schmerl2000] proved it.

- id: wcwo-ucnn
  question: Is the problem of comparing well-orders by embeddings (WCWO) Weihrauch equivalent to unique choice on Baire space $\mathsf{UC}_{\mathbb{N}^\mathbb{N}}$?
  asked:
    - {ref: kiharamarconepauly2020, loc: Question 5.8}
  statements: [ucnn]
  status: resolved
  answer: Yes.
  resolvedBy:
    - {ref: goh2020b}
  context: >-
    Kihara, Marcone and Pauly [@kiharamarconepauly2020] looked for a Weihrauch
    counterpart of ATR₀ among the problems equivalent to it in reverse
    mathematics. Weak comparability of well-orders was one candidate; Goh
    [@goh2020b] showed that it is equivalent to UC_ℕ^ℕ, the problem of computing a
    path through a tree with exactly one path.

- id: coh-oc-rt1
  question: Is $\mathsf{COH}$ omnisciently computably reducible to $\mathsf{RT}^1$, or to $\mathsf{D}^2_2$ or $\mathsf{D}^2_{<\infty}$?
  asked:
    - {ref: cholaketal2020, loc: Question 2.3}
    - {ref: dzhafarovpatey2021, loc: Question 1.7}
    - {ref: dzhafarovmummert2022, loc: Question 8.8.13}
  statements: [coh, d22, d2, rt1inf]
  status: open
  context: >-
    COH ≤_oc D²₂ means that for every COH instance there is a D²₂ instance all of
    whose solutions compute a solution to the COH instance, with no computability
    restriction on the D²₂ instance. Dzhafarov and Mummert
    [@dzhafarovmummert2022] call it "the distillation of the SRT²₂ vs. COH problem
    to its most combinatorial form". Monin and Patey [@moninpatey2021] separated
    SRT²₂ from COH in ω-models, which rules out computable reductions but not
    omniscient ones.

- id: rt32-rt42-rcastar
  parts:
    - question: 'Over $\mathsf{RCA}_0^*$, does $\mathsf{RT}^3_2$ imply $\mathsf{RT}^4_2$?'
      formal: [{from: rt32, to: rt42, over: rca0star}]
    - question: 'More generally, does $\mathsf{RT}^n_2$ imply $\mathsf{RT}^{n+1}_2$ for some or all $n \ge 3$?'
  asked:
    - {ref: koodziejczykkowalikyokoyama2020, loc: Question 1}
    - {ref: kowalik2024, loc: Question 2.14}
  statements: [rt32, rt42]
  context: >-
    Over RCA₀, RTⁿ₂ is equivalent to ACA₀ for every n ≥ 3 [@jockusch1972]. Over
    RCA₀*, where Σ⁰₁-induction may fail, Kołodziejczyk, Kowalik and Yokoyama
    [@koodziejczykkowalikyokoyama2020] studied what remains of this collapse when
    only Δ⁰₁-induction is available, and the question whether the hierarchy still
    collapses at exponent 3 remained open.

- id: crt22-rcastar-conservation
  parts:
    - question: 'Is $\mathsf{WKL}_0^* + \mathsf{CRT}^2_2$ $\forall\Pi^0_4$-conservative over $\mathsf{RCA}_0^*$?'
      status: open
    - question: 'Does $\mathsf{CRT}^2_2$ imply that the cut $\mathrm{I}^0_1$ is closed under exponentiation?'
      status: resolved
      answer: 'Yes: CRT²₂ implies that I⁰₁ is closed under exponentiation over RCA₀*.'
    - question: 'Is $\mathsf{RCA}_0^* + \mathsf{CRT}^2_2$ polynomially simulated by $\mathsf{RCA}_0^*$ for $\forall\Pi_3$ sentences?'
      status: resolved
      answer: 'No: CRT²₂ has non-elementary proof speedup over RCA₀* for Π₁ sentences.'
  asked:
    - {ref: fioricaroneskoodziejczykkowalik2021, loc: Questions 3.15 and 3.18}
    - {ref: kowalik2024, loc: Questions 2.18 and 4.38}
    - {ref: kowalik2025, loc: Question 4.15}
  statements: [crt22]
  resolvedBy:
    - {ref: kolodziejczyksun2026}
  context: >-
    Over RCA₀*, the cohesive Ramsey theorem CRT²₂ behaves very differently from RT²₂
    and CAC [@fioricaroneskoodziejczykkowalik2021]. Kowalik [@kowalik2025] showed
    that WKL₀* + CAC is polynomially simulated by RCA₀* for ∀Π⁰₃ sentences, in
    contrast with RT²₂. Kołodziejczyk and Sun [@kolodziejczyksun2026] showed that
    CRT²₂ makes the cut I⁰₁ exponentially closed, which gives a large speedup and
    shows that CRT²₂ is not provable from CAC over RCA₀*.

- id: brt22-bsig2-conservation
  question: Is $\mathsf{RCA}_0 + \mathsf{BRT}^2_2$ $\Pi^1_1$-conservative over $\mathsf{RCA}_0 + \mathsf{B}\Sigma^0_2$?
  asked:
    - {ref: lehoueroupatey2025, loc: Question 5.1}
  statements: [brt22, bsig2]
  status: resolved
  answer: Yes. BRT²₂ follows from RT²₂, which is Π¹₁-conservative over RCA₀ + BΣ⁰₂ (Hwang 2026, an unrefereed preprint).
  resolvedBy:
    - {ref: hwang2026, loc: Theorem 1.1}
  context: >-
    BRT²₂ follows from RT²₂ [@lehoueroupatey2025], so a negative answer would show
    that RT²₂ is not Π¹₁-conservative over RCA₀ + BΣ⁰₂ — the long-standing question
    on the first-order part of Ramsey's theorem for pairs.

- id: hindman-aca-conservation
  question: Is $\mathsf{RCA}_0 + \mathsf{HT}$ $\forall\Pi^0_3$-conservative over $\mathsf{ACA}_0$?
  asked:
    - {ref: lehoueroupatey2026, loc: Question 7.3}
  statements: [ht, aca]
  status: open
  context: >-
    Whether Hindman's theorem is provable in ACA₀ is open (see the question on
    Hindman's theorem). Le Houérou and Patey [@lehoueroupatey2026] suggest a
    weaker, first-order version of the question that the largeness techniques used
    for Ramsey's theorem might reach.

- id: ts23-em
  parts:
    - question: 'Does the thin set theorem for pairs and three colors $\mathsf{TS}^2_3$ imply $\mathsf{EM}$?'
      formal: [{from: ts23, to: em, over: rca0}]
    - question: 'Does it imply $\mathsf{FS}^2$?'
      formal: [{from: ts23, to: fs2, over: rca0}]
  asked:
    - {ref: patey2016, loc: Question 5.2}
    - {ref: liupatey2022, loc: Question 2.18}
    - {ref: dzhafarovmummert2022, loc: Question 9.8.20}
  statements: [ts23, ts24, em, fs2]
  context: >-
    TS²₂ is RT²₂, which implies EM, while Liu and Patey [@liupatey2022] showed that
    TS²₄ does not even imply the stable Erdős–Moser theorem, by preservation of
    2-hyperimmunity. Three colors is the only case left. More generally, Cholak and
    Patey determined for which numbers of colors the thin set theorems admit cone
    avoidance [@dzhafarovmummert2022].

- id: rt14-ads-w
  question: Is $\mathsf{RT}^1_4$ Weihrauch reducible to $\mathsf{ADS}$?
  asked:
    - {ref: solda2021, loc: Question 2.2.12}
    - {ref: fioricaronesshafersolda2022, loc: Question 5.3}
  statements: [rt14, rt13, rt15, ads]
  formal:
    - {from: ads, to: rt14, over: w}
  context: >-
    Over RCA₀, ADS implies RT¹_{<∞} since it implies BΣ⁰₂. In the Weihrauch
    degrees, Fiori-Carones, Shafer and Soldà [@fioricaronesshafersolda2022] showed
    that RT¹₃ is strongly Weihrauch reducible to ADC (and so to ADS) but RT¹₅ is not
    Weihrauch reducible to ADS: four colors is the remaining case.

- id: ght-atr
  kind: conjecture
  question: The generalized Higman theorem (if $Q$ is a bqo then so is $Q^{<\omega}$) is provable in $\mathsf{ATR}_0$.
  asked:
    - {ref: marcone1994, loc: Conjecture 5.6}
  statements: [ght, atr, nwt]
  formal:
    - {from: atr, to: ght, over: rca0}
  answer: Yes, proved by Pakhomov and Soldà.
  resolvedBy:
    - {ref: pakhomovsolda2025, loc: Corollary 6.6}
  context: >-
    Marcone [@marcone1994] proved GHT in Π¹₁-CA₀ and conjectured that ATR₀ suffices,
    as a step towards his conjecture that Nash-Williams' theorem is provable in
    ATR₀: over ATR₀, the two statements are closely tied. Montalbán
    [@montalban2011] recalls that they are equivalent over ATR₀. Pakhomov and Soldà
    [@pakhomovsolda2025] proved the conjecture, with a new proof that characterizes
    the transfinite iterated ideals of $Q^{<\omega}$.

- id: mtt2-wkl
  question: Over $\mathsf{RCA}_0$, does Milliken's tree theorem for height 2, $\mathsf{MTT}^2$, imply $\mathsf{WKL}_0$?
  asked:
    - {ref: dzhafarovmummert2022, loc: Question 9.7.11}
  statements: [mtt2, wkl, mtt]
  formal:
    - {from: mtt2, to: wkl, over: rca0}
  context: >-
    For heights n ≥ 3, Milliken's tree theorem is equivalent to ACA₀, and the full
    theorem to ACA₀′ [@dauriacetal2024]. Height 2 is the analogue of Ramsey's
    theorem for pairs, which does not imply WKL₀ [@liu2012]; the tree structure
    makes the usual separation techniques harder to apply.

- id: hindman-delta04
  question: Is there a computable coloring of $\mathbb{N}$ with no $\Delta^0_4$ solution for Hindman's theorem?
  asked:
    - {ref: liao2026, loc: Question 1}
  statements: [ht]
  status: open
  context: >-
    Blass, Hirst and Simpson [@blasshirstsimpson1987] built a computable coloring with
    no Δ⁰₂ solution, and Liao [@liao2026] one with no Π⁰₃ solution. A negative answer
    for some level n — every computable instance having a Δ⁰ₙ solution — is what a
    proof of Hindman's theorem in ACA₀ would require; a positive answer for every
    level would bring Hindman's theorem closer to ACA₀⁺.

- id: mle-atr
  question: Does the maximal linear extension theorem for well partial orders imply $\mathsf{ATR}_0$ over $\mathsf{RCA}_0$?
  asked:
    - {ref: birs2008, loc: Problem 10.3}
  statements: [mle, atr]
  formal:
    - {from: mle, to: atr, over: rca0}
  resolvedBy:
    - {ref: marconeshore2010}
  context: >-
    De Jongh and Parikh showed that every well partial order has a linear extension
    of maximal order type; the proof goes through in ATR₀. Montalbán studied the
    computability of such extensions. Marcone and Shore [@marconeshore2010] proved
    that the theorem is equivalent to ATR₀, as is the maximal chain theorem for well
    partial orders.

- id: tt1-bsig2-conservation
  parts:
    - question: 'Is $\mathsf{TT}^1$ $\Pi^1_1$-conservative over $\mathsf{RCA}_0 + \mathsf{B}\Sigma^0_2$?'
      status: resolved
    - question: 'Is $\mathsf{RCA}_0 + \mathsf{TT}^1$ a $\Pi^0_3$-conservative extension of $\mathsf{I}\Sigma^0_1$?'
      status: resolved
  asked:
    - {ref: chongetal2020, loc: "§5, problem 1"}
  statements: [tt1, bsig2]
  answer: Yes, TT¹ is Π¹₁-conservative over RCA₀ + BΣ⁰₂ (hence Π⁰₃-conservative over IΣ⁰₁, like BΣ⁰₂ itself).
  resolvedBy:
    - {ref: patey2026, loc: Corollary 1.4}
  context: >-
    TT¹ is strictly stronger than BΣ⁰₂ (Corduan, Groszek and Mileti) and provable from
    IΣ⁰₂, and Chong, Li, Wang and Yang [@chongetal2020] showed that it does not imply
    IΣ⁰₂ in some models; the question was what its exact first-order part is.

- id: rt22-tt1
  question: Does $\mathsf{RT}^2_2$ imply the tree theorem for singletons $\mathsf{TT}^1$ over $\mathsf{RCA}_0$?
  asked:
    - {ref: chongetal2020, loc: "§5, problem 3"}
  statements: [rt22, tt1]
  formal:
    - {from: rt22, to: tt1, over: rca0}
  context: >-
    In models of IΣ⁰₂ every instance of TT¹ has a solution computable from it, so the
    question only concerns models where Σ⁰₂-induction fails. Chong, Li, Wang and Yang
    [@chongetal2020] conjectured a negative answer.

- id: tt22-isig2
  question: Does the tree theorem for pairs $\mathsf{TT}^2_2$ imply $\mathsf{I}\Sigma^0_2$?
  asked:
    - {ref: chongetal2020, loc: "§5, problem 4"}
  statements: [tt22, isig2]
  formal:
    - {from: tt22, to: isig2, over: rca0}
  resolvedBy:
    - {ref: lehoueroupatey2026}
  context: >-
    The analogue for trees of the result of Chong, Slaman and Yang that RT²₂ does not
    imply IΣ⁰₂ [@chongslamanyang2017]. Le Houérou and Patey [@lehoueroupatey2026]
    answered it by proving that a Carlson–Simpson lemma implying TT²₂ is
    ∀Π⁰₄-conservative over RCA₀ + BΣ⁰₂.

- id: extomega-aca
  parts:
    - question: 'Does $\mathsf{EXT}(\omega^*)$ (every countable well-founded partial order has a well-ordered linear extension) imply $\mathsf{ACA}_0$ over $\mathsf{RCA}_0$?'
      formal: [{from: extomega, to: aca, over: rca0}]
    - question: 'What is its relationship with $\mathsf{RT}^2_2$?'
      formal: [{from: extomega, to: rt22, over: rca0}, {from: rt22, to: extomega, over: rca0}]
  asked:
    - {ref: hirschfeldt2015, loc: Open Question 10.11}
    - {ref: montalban2011, loc: Question 20}
    - {ref: hirschfeldt2017, loc: Open Question 2.5}
  statements: [extomega, aca, rt22]
  context: >-
    Downey, Hirschfeldt, Lempp and Solomon showed that EXT(ω*) is provable in ACA₀ and strictly
    stronger than WKL₀. Kierstead and Rosenstein showed that every well-founded computable partial
    order has a well-ordered computable linear extension, but Rosenstein and Statman built a computably
    well-founded one with no computably well-founded computable linear extension.

- id: sigma11-cn-par-cnn
  question: Is the parallelization of $\Sigma^1_1\text{-}\mathsf{C}_{\mathbb{N}}$ strictly Weihrauch below $\mathsf{C}_{\mathbb{N}^\mathbb{N}}$?
  asked:
    - {ref: kiharamarconepauly2020, loc: Question 4.10}
  statements: [sigma11-cn, cnn]
  formal:
    - {from: sigma11-cn.par, to: cnn, over: w}
  resolvedBy:
    - {ref: dauriackihara2021, loc: Theorem 3.34}
    - {ref: gohpaulyvalenti2021, loc: proof of Proposition 2.4}
  context: >-
    Kihara, Marcone and Pauly showed that $\Sigma^1_1$-WKL lies strictly below the parallelization of
    $\Sigma^1_1$ choice on ℕ, which is below $\mathsf{C}_{\mathbb{N}^\mathbb{N}}$. Anglès d'Auriac and Kihara
    separated $\Sigma^1_1$ countable choice from $\Sigma^1_1$ dependent choice, which gives the strict reduction.

- id: wirt-aca
  question: Does the weak infinite ray theorem $\mathsf{WIRT}$ imply $\mathsf{ACA}_0$ over $\mathsf{RCA}_0$?
  asked:
    - {ref: goh2019b, loc: "Section 7.1, after Proposition 7.9"}
    - {ref: barnesgohshore2023, loc: "Section 8, before Theorem 8.9"}
  statements: [wirt, aca]
  formal:
    - {from: wirt, to: aca, over: rca0}
  context: >-
    $\mathsf{ACA}_0$ proves WIRT (Theorem 7.5) and $\mathsf{RCA}_0$ does not, even for highly recursive graphs
    (Proposition 7.8), while the nonuniform version of WIRT is equivalent to $\mathsf{ACA}_0$ (Proposition 7.13).

- id: hyp-wgen-strong
  question: Is the hyperimmunity problem $\mathsf{HYP}$ strongly Weihrauch equivalent to the weak 1-genericity problem $1\text{-}\mathsf{WGEN}$?
  asked:
    - {ref: brattkahendtlasskreuzer2017, loc: Question 9.6}
  statements: [hyp, wgen1]
  formal:
    - {from: hyp, to: wgen1, over: sw}
  context: >-
    Brattka, Hendtlass and Kreuzer proved $\mathsf{HYP} \leq_{\mathrm{sW}} 1\text{-}\mathsf{WGEN}$ (Proposition 9.3)
    and $1\text{-}\mathsf{WGEN} \leq_{\mathrm{W}} \mathsf{HYP}$ (Proposition 9.4), so the two are Weihrauch equivalent.

- id: eminf-aca
  question: Does the Erdős–Moser theorem for infinitely many colors $\mathsf{EM}_\infty$ imply $\mathsf{ACA}_0$?
  asked:
    - {ref: towsneryokoyama2018, loc: Question 5.5}
  statements: [eminf, aca]
  formal:
    - {from: eminf, to: aca, over: rca0}
  context: >-
    ACA₀ proves EM_∞ through Ramsey's theorem for triples (Lemma 5.4 of [@towsneryokoyama2018]); for finitely many
    colors, fEM_{<∞} is Π¹₁-conservative over IΣ⁰₂ and so far from ACA₀.

- id: bounded-dnr-wwkl
  question: Does $\exists k \forall f\, \mathsf{DNR}(k, f)$, or $\forall f \exists k\, \mathsf{DNR}(k, f)$, imply $\mathsf{WWKL}$ over $\mathsf{RCA}_0$?
  asked:
    - {ref: doraishirstshafer2014, loc: Question 4.11}
  statements: [udnrb, dnrb, wwkl]
  formal:
    - {from: udnrb, to: wwkl, over: rca0}
    - {from: dnrb, to: wwkl, over: rca0}
  context: >-
    For each fixed k ≥ 2, ∀f DNR(k, f) is equivalent to WKL₀. With IΣ⁰₂ the bounded versions also imply WKL₀
    (Theorem 2.7 of [@doraishirstshafer2014]); with only BΣ⁰₂ they do not (Theorems 4.9 and 4.10).

- id: sigma11ac-abw-rca0
  question: Does $\Sigma^1_1\text{-}\mathsf{AC}_0$ imply $\mathsf{ABW}_0$ over $\mathsf{RCA}_0$, without $\mathsf{I}\Sigma^1_1$?
  asked:
    - {ref: conidis2012, loc: Question 1.10}
  statements: [sigma11ac, abw]
  formal:
    - {from: sigma11ac, to: abw, over: rca0}
  context: >-
    Friedman asserted the implication over RCA (full induction); Conidis proved it over RCA₀ + IΣ¹₁ (Theorem 2.1 of
    [@conidis2012]), and asked whether the implications of that theorem hold over RCA₀ — the other open one being
    ABW₀ → weak-Σ¹₁-AC₀. ABW₀ implies ACA₀ over RCA₀ + IΣ¹₁ (Lemma 2.2).

- id: bounded-dnr-col
  parts:
    - question: 'Are $\exists k \forall f\, \mathsf{DNR}(k, f)$ and $\forall \ell \exists k \forall G\, \mathsf{COL}(\ell, k, G)$ equivalent over $\mathsf{RCA}_0$?'
      formal: [{from: udnrb, to: ucol, over: rca0}, {from: ucol, to: udnrb, over: rca0}]
    - question: 'Are $\forall f \exists k\, \mathsf{DNR}(k, f)$ and $\forall \ell \forall G \exists k\, \mathsf{COL}(\ell, k, G)$?'
      formal: [{from: dnrb, to: col, over: rca0}, {from: col, to: dnrb, over: rca0}]
  asked:
    - {ref: doraishirstshafer2014, loc: Question 5.9}
  statements: [udnrb, ucol, dnrb, col]
  context: >-
    The paper also asks the same over RCA₀ + BΣ⁰₂. With BΣ⁰₂, neither coloring principle implies WKL (Theorem 5.7) and
    the non-uniform one does not imply ∃k∀f DNR(k, f) (Theorem 5.8), as for the bounded DNR principles.

- id: col-ucol
  question: Does $\forall \ell \forall G \exists k\, \mathsf{COL}(\ell, k, G)$ imply $\forall \ell \exists k \forall G\, \mathsf{COL}(\ell, k, G)$ over $\mathsf{RCA}_0$?
  asked:
    - {ref: doraishirstshafer2014, loc: Question 5.11}
  statements: [col, ucol]
  formal:
    - {from: col, to: ucol, over: rca0}
  context: >-
    The authors expect the non-uniform version to be strictly weaker over RCA₀ + BΣ⁰₂, as for the bounded DNR
    principles, but their techniques do not adapt to graph colorings.

- id: inf2b-strength
  question: What is the reverse mathematical strength of $\mathsf{INF}^{2B}_0$ (every infinite dimensional 2-based vector space has an infinite dimensional proper subspace)?
  asked:
    - {ref: conidis2014, loc: "Section 1, after the list of systems"}
  statements: [inf2b, wkl]
  formal:
    - {from: inf2b, to: wkl, over: rca0}
  context: >-
    WKL₀ proves it (Theorem 8.1), while the variants for 2-based spaces with infinite/coinfinite or
    infinite/cofinite dimensional subspaces are equivalent to ACA₀ (Theorems 1.5 and 1.6).

- id: mcsf-strength
  parts:
    - question: 'Does $\mathsf{MCSF}$ imply $\Pi^1_2\text{-}\mathsf{CA}_0$ over $\mathsf{RCA}_0$?'
      formal: [{from: mcsf, to: pi12ca, over: rca0}]
    - question: 'Does $\mathsf{MCSF}$ imply $\Delta^1_2\text{-}\mathsf{CA}_0$? (By Theorem 5.18 one may assume $\Pi^1_1\text{-}\mathsf{CA}_0$.) A positive answer would show that $\mathsf{MRSF}$ does not imply $\mathsf{MCSF}$.'
      status: open
  asked:
    - {ref: shore2026, loc: "Questions 7.1 and 7.2"}
  statements: [mcsf, mrsf, pi12ca, pi11ca]

- id: mrsf-pi11ca
  question: 'Does $\Pi^1_1\text{-}\mathsf{CA}_0$ imply $\mathsf{MRSF}$ (and so is equivalent to it)?'
  formal: [{from: pi11ca, to: mrsf, over: rca0}]
  asked:
    - {ref: shore2026, loc: Question 7.3}
  statements: [mrsf, pi11ca]
  context: 'Each of MRSF and MCSF implies $\Pi^1_1\text{-}\mathsf{CA}_0$ over $\mathsf{RCA}_0$ (Theorem 5.18 of [@shore2026]), and MRSF does not imply $\Delta^1_2\text{-}\mathsf{CA}_0$.'
