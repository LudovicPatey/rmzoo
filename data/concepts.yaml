# Concepts used in the definitions of statements (docs/DESIGN.md, "Concepts"). The
# build attaches a concept to every statement whose definition, instance or solution
# mentions one of its `match` patterns (case-insensitive regular expressions, matched
# on word boundaries), except the statements listed in `skip` (where the word has
# another meaning). Each definition follows its source, cited with its number.
# Fields: scripts/lib/schema.mjs (concept).

- id: coloring
  term: Coloring
  match: [ 'colou?rings?' ]
  definition: >
    For a set $X$ and $n, k \geq 1$, $[X]^n$ is the set of subsets of $X$ with exactly $n$ elements, and a
    $k$-coloring of $[X]^n$ is a map $c : [X]^n \to k$ (a finite coloring when $k$ is left unspecified).
  refs: [ { ref: dzhafarovmummert2022, loc: "Definition 3.2.4(1-2)" } ]

- id: homogeneous
  term: Homogeneous set
  match: [ 'homogeneous' ]
  skip: [ rsat, rsat2b, ht ]
  definition: >
    A set $Y \subseteq X$ is homogeneous for $c : [X]^n \to k$ if $c$ is constant on $[Y]^n$; if this constant
    value is $i$, $Y$ is homogeneous with color $i$.
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 3.2.4(3) } ]

- id: stable-coloring
  term: Stable coloring
  match: [ 'stable colou?rings?', 'stable functions?', 'stable \$f' ]
  definition: >
    A coloring $c : [X]^2 \to k$ is stable if for every $x$ there is a color $i$, the limit color of $x$, such that
    $c(x, y) = i$ for all but finitely many $y$.
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 8.4.1(3) } ]

- id: limit-homogeneous
  term: Limit homogeneous set
  match: [ 'limit homogeneous', 'limit-homogeneous' ]
  definition: >
    A set $L$ is limit homogeneous for $c : [X]^2 \to k$ if there is a color $i$ such that for every $x \in L$,
    $c(x, y) = i$ for all but finitely many $y \in L$.
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 8.4.1(2) } ]

- id: p-homogeneous
  term: p-homogeneous tuple
  match: [ 'p-homogeneous', 'polarized' ]
  definition: >
    A tuple $(H_0, \dots, H_{n-1})$ of sets is p-homogeneous for $c : [\omega]^n \to k$ if $c$ is constant on all
    $n$-element sets $\{x_0, \dots, x_{n-1}\}$ with $x_i \in H_i$, and increasing p-homogeneous if this holds when
    moreover $x_0 < \dots < x_{n-1}$.
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 9.3.1 } ]

- id: tree
  term: Tree and path
  match: [ 'trees?', 'paths?', 'well-founded trees?', 'ill-founded trees?' ]
  definition: >
    A tree is a set $T \subseteq X^{<\omega}$ of finite sequences closed under initial segments. An (infinite) path
    through $T$ is a function $f : \omega \to X$ all of whose initial segments are in $T$; $[T]$ is the set of paths,
    and $T$ is well founded if it has no path. $T$ is finitely branching if every node has finitely many immediate
    extensions, and $b$-bounded if $\alpha(i) < b(i)$ for all $\alpha \in T$ and $i < |\alpha|$.
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 2.8.1 } ]

- id: positive-measure
  term: Tree of positive measure
  match: [ 'positive measure' ]
  definition: >
    A binary tree $T$ has positive measure if $\lim_n |\{\sigma \in 2^n : \sigma \in T\}| / 2^n > 0$, that is, if the
    set of its paths has positive Lebesgue measure.
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 9.11.1 } ]

- id: cohesive
  term: Cohesive set
  match: [ 'cohesive', 'cohesiveness' ]
  definition: >
    For a sequence of sets $R_0, R_1, \dots$, an infinite set $S$ is cohesive (for the sequence) if for every $i$,
    $S \subseteq^* R_i$ or $S \subseteq^* \overline{R_i}$, where $\subseteq^*$ is inclusion up to finitely many elements.
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 4.1.6 } ]

- id: dnc
  term: Diagonally noncomputable function
  match: [ 'DNC', 'DNR', 'diagonally non-?computable' ]
  definition: >
    A function $f : \omega \to \omega$ is diagonally noncomputable (DNC) if $f(e) \neq \Phi_e(e)$ whenever $\Phi_e(e)$
    is defined; relative to $X$, with $\Phi^X_e$ in place of $\Phi_e$.
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 2.8.13 } ]

- id: pa-degree
  term: PA degree
  match: [ 'PA degrees?', 'of PA degree' ]
  definition: >
    A set $f$ has PA degree relative to $g$, written $f \gg g$, if every nonempty $\Pi^{0,g}_1$ class has an
    $f$-computable member (equivalently, every infinite $g$-computable binary tree has an $f$-computable path).
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 2.8.24 } ]

- id: hyperimmune
  term: Hyperimmune set
  match: [ 'hyperimmune', 'hyperimmunity' ]
  definition: >
    A set $S$ is hyperimmune if no computable function dominates its principal function $p_S$ (the function listing
    its elements in increasing order).
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 2.8.19 } ]

- id: chain-antichain
  term: Chain and antichain
  match: [ 'antichains?' ]
  definition: >
    In a partial order $(P, \leq_P)$, a set $S$ is a chain if any two of its elements are comparable, and an antichain
    if any two distinct elements are incomparable.
  refs: [ { ref: dzhafarovmummert2022, loc: "Section 9.2, before Definition 9.2.1" } ]

- id: ascending-descending
  term: Ascending and descending sequences
  match: [ 'ascending', 'descending sequences?' ]
  definition: >
    In a linear order $(L, \leq_L)$, a set $S$ is an ascending sequence if $x \leq y$ implies $x \leq_L y$ for $x, y \in S$,
    and a descending sequence if $x \leq y$ implies $y \leq_L x$: a suborder of type $\omega$, resp. $\omega^*$.
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 9.2.2 } ]

- id: transitive
  term: Transitive coloring
  match: [ 'transitive', 'tournaments?' ]
  definition: >
    A coloring $c : [\omega]^2 \to k$ is transitive if for every color $i$, $c(x, y) = c(y, z) = i$ implies
    $c(x, z) = i$. A 2-coloring of pairs is a tournament (who beats whom), and a transitive set
    is one on which the tournament is a linear order.
  refs: [ { ref: dzhafarovmummert2022, loc: "Definition 9.2.6(2), Section 9.5" } ]

- id: thin-free
  term: Thin and free sets
  match: [ 'thin', 'free sets?', 'free for' ]
  definition: >
    For a coloring $c : [X]^n \to Y$, a set $Z$ is thin for $c$ if $c$ restricted to $[Z]^n$ is not surjective, and free
    for $c$ if whenever $\vec{x} \in [Z]^n$ and $c(\vec{x}) \in Z$, then $c(\vec{x}) \in \vec{x}$.
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 9.8.1 } ]

- id: rainbow
  term: Rainbow
  match: [ 'rainbows?', '2-bounded', 'k-bounded' ]
  definition: >
    A coloring $c : [\omega]^n \to \omega$ is $k$-bounded if each color is used at most $k$ times. A rainbow for $c$ is a
    set $R$ such that $c$ is injective on $[R]^n$.
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 9.4.1 } ]

- id: random
  term: Martin-Löf randomness
  match: [ 'Martin-Löf', '1-random', '2-random', 'randoms?' ]
  definition: >
    A Martin-Löf test is a uniformly $\Sigma^0_1$ sequence of classes $U_n \subseteq 2^\omega$ with $\mu(U_n) \leq 2^{-n}$;
    a set is 1-random (Martin-Löf random) if it is not in $\bigcap_n U_n$ for any test, and $n$-random if it is
    1-random relative to $\emptyset^{(n-1)}$.
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 9.4.5 } ]


- id: jump
  term: Turing jump
  match: [ 'jumps?', "X'", "X′" ]
  definition: >
    The Turing jump of $g$ is the halting problem relative to $g$: $g' = \{e : \Phi^g_e(e)\downarrow\}$.
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 2.5.3 } ]

- id: delta02
  term: Δ⁰₂ and limits
  match: [ 'Δ⁰₂', '\\Delta\^0_2', '\\lim_s', 'limit' ]
  skip: [ lim ]
  definition: >
    $\lim_y f(x, y) = z$ means that $f(x, y) = z$ for all sufficiently large $y$. By Shoenfield's limit lemma, a set is
    $\Delta^0_2$ exactly when it is $\lim_y f(x, y)$ for a computable $f : \omega^2 \to 2$ whose limits all exist.
  refs: [ { ref: dzhafarovmummert2022, loc: "Definition 2.6.4, Theorem 2.6.5" } ]

- id: omega-model
  term: ω-model and Turing ideal
  match: [ 'ω-models?', '\\omega\\text\{-models?\}', 'Turing ideals?' ]
  definition: >
    A Turing ideal is a nonempty collection of sets closed downward under $\leq_T$ and under $\oplus$ (the
    ω-models of computability theory). As structures of second-order arithmetic, ω-models are those whose
    first-order part is the standard natural numbers and whose sets form a Turing ideal.
  refs: [ { ref: dzhafarovmummert2022, loc: "Definitions 4.6.1 and 5.1.6" } ]

- id: well-ordering
  term: Well ordering
  match: [ 'well-orders?', 'well-orderings?', 'well orderings?', 'well-ordered', 'well ordered', 'well-founded (partial|linear) orders?', 'ill-founded (partial|linear) orders?' ]
  definition: >
    A partial order is well founded if it has no infinite descending sequence $x_0 >_P x_1 >_P \cdots$; a well
    ordering is a well-founded linear order. In second-order arithmetic, a countable well ordering codes a
    countable ordinal, its order type.
  refs:
    - { ref: dzhafarovmummert2022, loc: Example 3.1.4 }
    - { ref: simpson2009, loc: Definition I.6.1 }

- id: wqo
  term: Well quasi-order
  match: [ 'well-quasi-orders?', 'well quasi-?orders?', 'well quasiorder(ing|ed)s?', 'wqos?', 'well partial orders?' ]
  definition: >
    A quasi-order (reflexive and transitive relation) is a well quasi-order if it is well founded and has no
    infinite antichain; equivalently, for every sequence $(a_n)_n$ there are $m < n$ with $a_m \leq a_n$.
  refs: [ { ref: simpson2009, loc: "Definition X.3.17, Remark X.3.18" } ]

- id: bad-sequence
  term: Bad sequence
  match: [ 'bad sequences?' ]
  definition: >
    A sequence $(x_i)_i$ in a quasi-order $P$ is bad if $x_i \not\leq_P x_j$ for all $i < j$; a quasi-order is a
    well quasi-order exactly when it has no infinite bad sequence.
  refs:
    - { ref: gohpaulyvalenti2021, loc: Definition 4.4 }
    - { ref: simpson2009, loc: "Remark X.3.18(2)" }

- id: matching
  term: Matching and vertex covering
  match: [ 'matchings?', 'vertex cover(ing)?s?', 'König covers?', 'König coverings?' ]
  definition: >
    In a bipartite graph $G = (X, Y, E)$, a matching is a set of pairwise disjoint edges and a vertex covering is a set
    of vertices meeting every edge. A König covering is a pair $(C, M)$ of a covering and a matching with $C$
    consisting of exactly one vertex from each edge of $M$.
  refs: [ { ref: simpson2009, loc: "Definitions X.3.8 and X.3.10" } ]

- id: negative-information
  term: Closed sets by negative information
  match: [ 'negative information', 'closed sets?', 'closed subsets?' ]
  skip: [ weak-star-closure ]
  definition: >
    A closed subset $A$ of a computable metric space $X$ is represented by negative information: a name of $A$ is a
    list of basic open balls whose union is $X \setminus A$. For $X = \mathbb{N}^\mathbb{N}$ the computably named sets
    are the $\Pi^0_1$ classes, and closed choice $\mathsf{C}_X$ takes its inputs in this form.
  refs: [ { ref: brattkagherardipauly2021, loc: "Definition 2.8, Definition 7.1" } ]

- id: jump-hierarchy
  term: Jump hierarchy
  match: [ 'jump hierarch(y|ies)', 'pseudohierarch(y|ies)' ]
  definition: >
    For a linear order $L$ with first element $0_L$ and a set $A$, a jump hierarchy on $L$ starting with $A$ is a
    sequence $\langle X_a \rangle_{a \in L}$ with $X_{0_L} = A$ and $X_b = (\bigoplus_{a <_L b} X_a)'$ for $b >_L 0_L$.
    Jump hierarchies on ill-founded orders were first studied by Harrison and are often called pseudohierarchies.
  refs: [ { ref: goh2019b, loc: Definition 2.2 } ]

- id: induction-scheme
  term: Induction scheme
  match: [ 'induction schemes?', '\$?\\Sigma\^0_[0-9n]\$? induction', 'Σ⁰₁ induction', 'Δ⁰₀ induction' ]
  definition: >
    For a class $\Gamma$ of formulas of second-order arithmetic, the $\Gamma$ induction scheme $\mathsf{I}\Gamma$
    consists of the universal closures of
    $(\varphi(0) \wedge \forall x\, [\varphi(x) \to \varphi(x+1)]) \to \forall x\, \varphi(x)$ for all $\varphi \in \Gamma$
    (set parameters allowed).
  refs: [ { ref: dzhafarovmummert2022, loc: "Definition 5.3.5(2), recalled in Section 6.1" } ]

- id: collection-scheme
  term: Collection (bounding) scheme
  match: [ 'collection (\(bounding\) )?schemes?', 'bounding schemes?' ]
  definition: >
    For a class $\Gamma$ of formulas, the $\Gamma$ bounding (or collection) scheme $\mathsf{B}\Gamma$ consists of the
    sentences $\forall z\, [\forall x < z\, \exists y\, \varphi(x, y) \to \exists w\, \forall x < z\, \exists y < w\, \varphi(x, y)]$
    for $\varphi \in \Gamma$: a bounded universal quantifier can be moved past an existential one.
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 6.1.1 } ]

- id: atomic-theory
  term: Atomic theory, atomic model
  match: [ 'atomic theor(y|ies)', 'atomic models?' ]
  definition: >
    A formula $\varphi$ is an atom of a theory $T$ if for every formula $\psi$ in the same free variables exactly one of
    $T \vdash \varphi \to \psi$ and $T \vdash \varphi \to \neg\psi$ holds; $T$ is atomic if for every $\psi$ consistent
    with $T$ there is an atom $\varphi$ with $T \vdash \varphi \to \psi$. A type of $T$ is principal if some formula
    consistent with $T$ implies all its members, and a model of $T$ is atomic if the only types it realizes are principal.
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 9.10.2 } ]

- id: stable-order
  term: Stable partial and linear orders
  match: [ 'stable partial orders?', 'stable linear orders?' ]
  definition: >
    In an infinite partial order $P$, an element $x$ is small if $x \leq_P y$ for almost all $y$, large if $y \leq_P x$
    for almost all $y$, and isolated if $x$ is incomparable with almost all $y$. $P$ is weakly stable if every element
    is small, large or isolated; stable if either every element is small or isolated, or every element is large or
    isolated. An infinite linear order is stable if every element is small or large (it has order type
    $\omega + \omega^*$).
  refs: [ { ref: dzhafarovmummert2022, loc: "Definitions 9.2.9 and 9.2.10" } ]

- id: intersection-property
  term: Intersection properties of families
  match: [ 'intersection property' ]
  skip: [ d2ip, nd2ip ]
  definition: >
    A family $\vec X = \langle X_i : i \in \omega \rangle$ is nontrivial if some $X_i$ is nonempty; $\vec Y$ is a
    subfamily of $\vec X$ if every $Y_i$ is some $X_j$. $\vec Y$ has the $n$ intersection property if every $n$ of its
    members have nonempty intersection, and the finite intersection property if every nonempty finite set of its members
    has nonempty intersection. A subfamily with one of these properties is maximal if every subfamily with the same
    property containing it is contained in it.
  refs: [ { ref: dzhafarovmummert2022, loc: Definition 9.10.17 } ]

- id: cohen-generic
  term: Cohen genericity
  match: [ '(Cohen )?[0-9n]-generic' ]
  skip: [ wgen1 ]
  definition: >
    A set $G$ is Cohen $n$-generic if for every $\Sigma^0_n$-definable set $W$ of finite binary strings, $G$ meets or
    avoids $W$: some initial segment of $G$ is in $W$, or some initial segment of $G$ has no extension in $W$
    (relativized to $X$: $W$ is $\Sigma^0_n$ in $X$).
  refs: [ { ref: dzhafarovmummert2022, loc: "Definition 7.4.3 and Proposition 7.5.11" } ]
