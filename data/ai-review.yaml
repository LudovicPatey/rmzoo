    facts: PMTT^2_{k,2} admits strong cone avoidance (Theorem 4.27). (∀k)PMTT^3_{k,2} admits cone avoidance and does not imply ACA0 (Theorem 4.28, Corollary 4.29). It implies (∀k)JDT^2_{k,4} (Theorem 5.43).
